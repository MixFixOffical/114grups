<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Экран организатора — Изи квиз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #6c2bd9; --purple-dark: #3b0f8c; --purple-soft: #ece6fb;
      --yellow: #ffd23f; --orange: #ff7a1a; --green: #5cc26b; --green-dark: #46a955; --red: #e0473a;
      --white: #ffffff; --text-light: rgba(255,255,255,.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      font-family: "Manrope", system-ui, sans-serif; color: var(--white);
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 50%, #9b3fe8 100%);
      min-height: 100vh; overflow-x: hidden; position: relative;
    }
    .bg-shapes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .shape { position: absolute; border-radius: 50%; opacity: .5; filter: blur(2px); animation: float 14s ease-in-out infinite; }
    .shape.s1 { width: 340px; height: 340px; background: radial-gradient(circle at 30% 30%, var(--orange), #ff4d6d); top: -80px; left: -60px; }
    .shape.s2 { width: 240px; height: 240px; background: radial-gradient(circle at 30% 30%, var(--yellow), var(--orange)); top: 30%; right: -70px; animation-delay: -4s; }
    .shape.s3 { width: 180px; height: 180px; background: radial-gradient(circle at 30% 30%, #c084fc, var(--purple)); bottom: 5%; left: 15%; animation-delay: -2s; }
    @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(40px,-30px) scale(1.06); } 66% { transform: translate(-30px,25px) scale(.95); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(1.8); } 40% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,210,63,.7); } 50% { box-shadow: 0 0 0 14px rgba(255,210,63,0); } }

    header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px clamp(20px,5vw,60px); }
    .logo { display: flex; align-items: center; gap: 10px; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 22px; color: var(--white); text-decoration: none; }
    .logo-mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--yellow), var(--orange)); display: grid; place-items: center; color: var(--purple-dark); font-size: 22px; transform: rotate(-6deg); }
    .btn-outline { font-family: inherit; font-weight: 700; font-size: 15px; color: var(--white); background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.5); border-radius: 999px; padding: 10px 20px; text-decoration: none; backdrop-filter: blur(6px); }
    .btn-outline:hover { background: rgba(255,255,255,.22); }

    main { position: relative; z-index: 5; max-width: 1040px; margin: 0 auto; padding: 16px 20px 80px; }
    .card { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(12px); border-radius: 24px; padding: 32px; text-align: center; animation: fadeUp .5s ease both; margin-bottom: 20px; }
    .card h1 { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(24px,4vw,34px); margin-bottom: 6px; }
    .quiz-title { color: var(--text-light); font-size: 17px; margin-bottom: 22px; }
    .qr-card.qr-side { margin-bottom: 18px; padding: 18px; }
    .qr-side .section-title { font-size: 14px; }
    .qr-side .qr-wrap { padding: 10px; margin: 0 0 10px; }
    .qr-side #qrBox { min-width: 0; min-height: 0; }
    .qr-side .qr-url { font-size: 13px; }
    .qr-wrap { display: inline-block; background: var(--white); padding: 16px; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,.25); margin: 6px 0 16px; }
    #qrBox { min-width: 220px; min-height: 220px; }
    #qrBox img, #qrBox canvas { display: block; margin: 0 auto; }
    .qr-url { display: block; margin-top: 6px; font-weight: 700; word-break: break-all; color: var(--white); font-size: 15px; }

    .code-big { display: inline-block; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(34px,7vw,56px); letter-spacing: 8px; background: var(--white); color: var(--purple-dark); padding: 18px 30px; border-radius: 20px; margin-bottom: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
    .code-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .status { display: inline-block; font-weight: 800; font-size: 14px; padding: 8px 18px; border-radius: 999px; margin: 6px 0 22px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); }
    .status.waiting::before { content: "● "; color: var(--yellow); }
    .status.running { background: var(--green); border-color: var(--green); }
    .status.running::before { content: "● "; }
    .status.finished::before { content: "■ "; }

    .section-title { font-weight: 800; font-size: 16px; margin: 0 0 12px; }
    .players { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 44px; margin-bottom: 26px; }
    .player { background: var(--white); color: var(--purple-dark); font-weight: 700; padding: 10px 16px; border-radius: 999px; animation: fadeUp .4s ease both; }
    .player.excl { background: #ffe9e6; color: #9b2c20; }
    .players-empty { color: var(--text-light); font-size: 15px; padding-top: 8px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .hint { color: var(--text-light); font-size: 15px; line-height: 1.5; margin-top: 12px; }

    .error { color: #ffe0a3; font-weight: 700; font-size: 15px; line-height: 1.5; margin-top: 10px; }

    .btn-primary { font-family: inherit; font-weight: 800; font-size: 17px; color: var(--purple-dark); background: linear-gradient(135deg, var(--yellow), var(--orange)); border: none; border-radius: 16px; padding: 16px 30px; cursor: pointer; box-shadow: 0 10px 30px rgba(255,122,26,.45); animation: pulse 2s ease-in-out infinite; transition: transform .2s ease; }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: .6; cursor: wait; animation: none; transform: none; }
    .btn-ghost { font-family: inherit; font-weight: 700; font-size: 16px; color: var(--white); background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.5); border-radius: 16px; padding: 14px 22px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-ghost:hover { background: rgba(255,255,255,.22); }
    .btn-danger { font-family: inherit; font-weight: 800; font-size: 16px; color: var(--white); background: var(--red); border: none; border-radius: 16px; padding: 15px 26px; cursor: pointer; box-shadow: 0 8px 22px rgba(224,71,58,.4); }
    .btn-danger:disabled { opacity: .6; cursor: wait; }
    .btn-soft { font-family: inherit; font-weight: 700; font-size: 13px; color: var(--purple); background: var(--purple-soft); border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
    .btn-soft:hover { background: #ddd3f8; }
    .btn-ok { font-family: inherit; font-weight: 800; font-size: 14px; color: var(--purple-dark); background: var(--green); border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer; }
    .btn-no { font-family: inherit; font-weight: 700; font-size: 14px; color: var(--white); background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.5); border-radius: 12px; padding: 8px 14px; cursor: pointer; }

    .run-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; text-align: left; }
    .q-progress { font-weight: 800; font-size: 14px; color: var(--text-light); margin-bottom: 12px; }
    .timer-track { height: 12px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
    .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); border-radius: 999px; }
    .timer-label { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 26px; margin-bottom: 16px; }
    .q-text { background: var(--white); color: var(--purple-dark); border-radius: 20px; padding: 22px 20px; margin-bottom: 14px; font-weight: 800; font-size: clamp(18px,2.4vw,22px); line-height: 1.35; box-shadow: 0 12px 30px rgba(20,0,60,.25); }
    .q-img-host { display: block; max-width: 100%; max-height: 260px; object-fit: contain; margin: 0 0 14px; border-radius: 16px; background: #fff; }
    .opt-list { display: grid; gap: 10px; }
    .opt-item { background: rgba(255,255,255,.14); border-radius: 14px; padding: 12px 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
    .opt-item.right { background: #e9f8ee; color: var(--purple-dark); }
    .lt { width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; background: linear-gradient(135deg, var(--yellow), var(--orange)); display: grid; place-items: center; font-weight: 900; color: var(--purple-dark); }
    .blk-label { font-size: 13px; font-weight: 700; color: var(--text-light); margin: 10px 0 6px; }
    .code-view { font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.45; background: #1e1640; color: #e9e3ff; border-radius: 14px; padding: 12px 14px; white-space: pre-wrap; overflow-x: auto; margin: 0; }
    .blk-order { display: flex; flex-wrap: wrap; gap: 8px; }
    .blk-chip { font-family: Consolas, "Courier New", monospace; font-size: 14px; font-weight: 700; background: var(--white); color: var(--purple-dark); border-radius: 10px; padding: 6px 10px; white-space: pre; }
    .blk-chip.extra { background: rgba(255,255,255,.25); color: var(--white); }
    .side .stat { background: rgba(255,255,255,.14); border-radius: 18px; padding: 18px; text-align: center; margin-bottom: 18px; }
    .stat-num { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 44px; color: var(--yellow); }
    .side .section-title { text-align: left; }
    .lb-row { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.14); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
    .lb-rank { font-family: "Unbounded", sans-serif; font-weight: 900; width: 28px; }
    .lb-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-weight: 900; color: var(--yellow); }

    .count-wrap { display: grid; place-items: center; min-height: 320px; }
    .count-num { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(90px,22vw,160px); line-height: 1; color: var(--yellow); text-shadow: 0 8px 30px rgba(255,122,26,.5); min-height: 1.1em; }
    .count-num.pop { animation: pop .9s ease both; }
    .count-num.start { font-size: clamp(56px,14vw,96px); color: var(--white); }

    .list-card { text-align: left; }
    .list-card .section-title { text-align: left; }
    .rq-row { background: rgba(255,255,255,.14); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
    .rq-reason { font-size: 14px; color: var(--text-light); margin: 6px 0 10px; line-height: 1.45; }
    .rq-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .ex-row { background: rgba(224,71,58,.22); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; line-height: 1.5; font-weight: 600; }
    .res-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: rgba(255,255,255,.14); border-radius: 14px; padding: 12px 16px; margin-bottom: 8px; }
    .res-main { flex: 1; min-width: 180px; font-weight: 700; }
    .res-stats { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--text-light); }
    .res-stats b { color: var(--yellow); }
    .tag { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; background: var(--yellow); color: var(--purple-dark); margin-left: 6px; }
    .tag.bad { background: #ffe9e6; color: #9b2c20; }

    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(20,0,60,.65); display: grid; place-items: center; padding: 16px; overflow: auto; }
    .modal-card { background: #fff; color: var(--purple-dark); border-radius: 20px; padding: 22px; width: 100%; max-width: 760px; max-height: 90vh; overflow: auto; }
    .modal-card h2 { font-family: "Unbounded", sans-serif; font-size: 20px; margin-bottom: 4px; }
    .modal-card .sub { color: #6f6790; font-size: 14px; margin-bottom: 14px; }
    .modal-card .section-title { color: var(--purple-dark); margin-top: 18px; }
    .modal-card .muted { color: #6f6790; }
    .ans-row { background: #f5f3fb; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .ans-q { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
    .ans-val { font-family: Consolas, "Courier New", monospace; font-size: 14px; background: #fff; border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; overflow-x: auto; margin: 0 0 6px; }
    .ans-ok { color: var(--green-dark); font-weight: 700; font-size: 13px; }
    .ans-bad { color: var(--red); font-weight: 700; font-size: 13px; }
    .hist-row { background: #f5f3fb; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .btn-dark { font-family: inherit; font-weight: 800; font-size: 15px; color: #fff; background: var(--purple); border: none; border-radius: 14px; padding: 12px 20px; cursor: pointer; }
    .btn-dark:hover { background: var(--purple-dark); }
    .btn-dark.btn-light { background: #e9e6f5; color: var(--purple-dark); }
    #posterCanvas { display: block; width: 100%; height: auto; border-radius: 12px; }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--yellow); color: var(--purple-dark); font-weight: 700; padding: 14px 22px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .35s ease; z-index: 60; max-width: calc(100% - 40px); text-align: center; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 800px) { .run-grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) {
      .card { padding: 22px; }
      .btn-primary, .btn-danger, .btn-ghost { width: 100%; }
      .logo { font-size: 17px; }
      .logo-mark { width: 34px; height: 34px; font-size: 18px; }
      .btn-outline { padding: 9px 14px; font-size: 13px; }
      .res-row { flex-direction: column; align-items: stretch; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

  <div class="bg-shapes" aria-hidden="true">

      <div class="section-title">Запросы на перездачу</div>

    <section class="card list-card" id="excludedCard" hidden>
      <div class="section-title">Исключённые игроки</div>
      <div id="excludedList"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, collection, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { gradeFor, maxScoreOf, makeCertNumber } from "./cert.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
    authDomain: "sokrat-7c938.firebaseapp.com",
    projectId: "sokrat-7c938",
    storageBucket: "sokrat-7c938.firebasestorage.app",
    messagingSenderId: "19858604945",
    appId: "1:19858604945:web:8ec6dc1a81dba35c481030",
    measurementId: "G-B3SDDN1T50"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const $ = (id) => document.getElementById(id);
  const code = new URLSearchParams(location.search).get('code');
  const LETTERS = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];

  let user = null;
  let quiz = null;
  let keyItems = null;      // ключ ответов: items[i] для вопроса i
  let fullQ = [];           // вопросы вместе с ключом (только у ведущего)
  let game = null;
  let order = [];
  let round = 0;
  let renderedKey = '';

  // Данные текущего запуска
  let players = [];
  let answers = [];          // { id, q, player, answer, correct?, points? }
  let answersByKey = new Map();
  let scores = {};
  let inflight = new Set();  // ответы, которые сейчас проверяются
  let retakes = [];
  let excludedList = [];

  let unsubGame = null;
  let unsubRound = [];
  let unsubRetakes = null;
  let unsubExcluded = null;
  let retakesReady = false;
  let excludedReady = false;
  let roundReady = false;

  let countdownToken = null;
  let countdownActive = false;
  let firstGame = true;
  let driverPos = null;
  let driverTimer = null;
  let tickTimer = null;
  let hostEndAt = 0;
  let hostTotalMs = 1;

  /* ---------- Утилиты ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (ts) => ts.toDate().toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  const tsMs = (ts) => (ts?.toMillis?.() ?? Date.now());
  const todayStr = () => new Date().toLocaleDateString('ru-RU');
  const joinUrl = () => new URL('index.html?code=' + encodeURIComponent(code), location.href).href;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  let toastTimer;
  function showToast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function showError(text) {
    $('content').innerHTML = `
      <h1>Не получилось</h1>
      <p class="error">${esc(text)}</p>
      <div style="margin-top:24px"><a class="btn-ghost" href="cabinet.html">В личный кабинет</a></div>`;
  }

  function shuffle(a) {
    const r = [...a];
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function makeOrder(q) {
    const idx = q.questions.map((_, i) => i);
    return q.shuffleQuestions ? shuffle(idx) : idx;
  }

  function scheduleHtml() {
    const parts = [];
    if (quiz.startsAt) parts.push(`открытие: ${fmt(quiz.startsAt)}`);
    if (quiz.endsAt) parts.push(`закрытие: ${fmt(quiz.endsAt)}`);
    return parts.length ? `<p class="hint">Расписание: ${parts.join(' · ')}</p>` : '';
  }

  // Проверка ответа (та же логика, что у участника в демо)
  function sameCode(a, b) {
    const n = (s) => String(s).split('\n').map((l) => l.trim()).join('\n').trim();
    return n(a) === n(b);
  }
  const normText = (s) => String(s).trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');

  function isCorrect(q, value) {
    if (value === undefined || value === null) return false;
    if (q.type === 'choice') return value === q.correct;
    if (q.type === 'open') return q.answers.some((a) => normText(a) === normText(value));
    if (q.type === 'code') return sameCode(value, q.answer);
    if (q.type === 'blocks') {
      return Array.isArray(value) && value.length === q.answer.length
        && value.every((v, i) => String(v).trim() === String(q.answer[i]).trim());
    }
    return false;
  }

  function correctPayload(q) {
    if (q.type === 'choice') return { text: q.options[q.correct], idx: q.correct };
    if (q.type === 'open') return { text: q.answers[0] || '', idx: null };
    if (q.type === 'code') return { text: q.answer, idx: null };
    return { text: q.answer.join('\n'), idx: null };
  }

  /* ---------- Старт ---------- */
  onAuthStateChanged(auth, (u) => {
    if (!u) { window.location.replace('index.html'); return; }
    user = u;
    init();
  });

  async function init() {
    if (!code) return showError('Не указан код квиза.');
    try {
      const qs = await getDoc(doc(db, 'quizzes', code));
      if (!qs.exists() || qs.data().ownerUid !== user.uid) {
        return showError('Квиз не найден или у вас нет прав на его запуск.');
      }
      quiz = { timeLimit: 20, questions: [], ...qs.data() };
      quiz.timeLimit = quiz.timeLimit || 20;

      const ks = await getDoc(doc(db, 'quizzes', code, 'private', 'key'));
      keyItems = ks.exists() ? ks.data().items : null;
      const legacy = quiz.questions.some((q) => q.correct !== undefined || q.answer !== undefined || q.answers !== undefined);
      if (!keyItems && !legacy) {
        return showError('Не найден ключ ответов. Откройте квиз в конструкторе и сохраните его заново.');
      }
      fullQ = quiz.questions.map((p, i) => ({ ...p, ...(keyItems?.[i] || {}) }));

      const gs = await getDoc(doc(db, 'games', code));
      if (!gs.exists()) return showError('Экран ожидания ещё не создан. Запустите его из личного кабинета.');
      if (gs.data().hostUid !== user.uid) return showError('Эту игру ведёт другой пользователь.');

      renderQr();
      watchRetakes();
      watchExcluded();
      unsubGame = onSnapshot(doc(db, 'games', code), (snap) => {
        if (snap.exists()) onGame(snap.data());
      });
    } catch (err) {
      console.error(err);
      showError('Не удалось загрузить игру. Проверьте интернет и обновите страницу.');
    }
  }

  function onGame(g) {
    game = g;
    const r = g.round || 1;
    if (!roundReady || r !== round) subscribeRound(r);
    order = g.order || order;

    // При первом открытии страницы отсчёт не повторяем
    if (firstGame) {
      firstGame = false;
      countdownToken = g.startToken ?? null;
    }

    if (g.status === 'running' && g.startToken != null && g.startToken !== countdownToken) {
      countdownToken = g.startToken;
      clearDriver();
      countdownActive = true;
      runHostCountdown(() => {
        countdownActive = false;
        if (game) driver(game);
        render();
      });
      return;
    }

    if (countdownActive) return;
    driver(g);
    render();
  }

  /* ---------- Данные запуска ---------- */
  function subscribeRound(r) {
    unsubRound.forEach((f) => f());
    unsubRound = [];
    round = r;
    roundReady = true;
    players = [];
    answers = [];
    answersByKey = new Map();
    scores = {};

    unsubRound.push(onSnapshot(collection(db, 'games', code, 'rounds', String(r), 'players'), (snap) => {
      players = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    }));
    unsubRound.push(onSnapshot(collection(db, 'games', code, 'rounds', String(r), 'answers'), (snap) => {
      answers = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      answersByKey = new Map(answers.map((a) => [`${a.q}_${a.player}`, a]));
      recomputeScores();
      render();
      gradePending();
    }));
  }

  function recomputeScores() {
    scores = {};
    answers.forEach((a) => {
      if (typeof a.points === 'number') scores[a.player] = (scores[a.player] || 0) + a.points;
    });
  }

  // Проверка ответов: ведущий записывает correct и points
  function gradePending() {
    answers.forEach((a) => {
      if (a.correct === undefined && !inflight.has(a.id)) gradeOne(a);
    });
  }

  async function gradeOne(a) {
    const q = fullQ[order[a.q]];
    if (!q || inflight.has(a.id)) return;
    inflight.add(a.id);
    try {
      const ok = isCorrect(q, a.answer);
      const pts = ok ? (q.points ?? 1) : 0;
      await updateDoc(doc(db, 'games', code, 'rounds', String(round), 'answers', a.id), {
        correct: ok, points: pts, checkedAt: serverTimestamp()
      });
      a.correct = ok;
      a.points = pts;
      recomputeScores();
      render();
    } catch (err) {
      console.error(err);
    } finally {
      inflight.delete(a.id);
    }
  }

  async function waitIdle() {
    while (inflight.size) await sleep(100);
  }

  function ranking() {
    return players
      .map((p) => ({
        id: p.id,
        name: p.name || '—',
        group: p.group || '',
        key: p.key || '',
        attempt: p.attempt || 1,
        exits: p.exits || 0,
        excluded: !!p.excluded,
        certNo: p.certNo || null,
        score: scores[p.id] || 0
      }))
      .sort((a, b) => b.score - a.score);
  }

  function activePlayers() {
    return players.filter((p) => !p.excluded);
  }

  /* ---------- Отрисовка ---------- */
  function render() {
    if (!game || countdownActive) return;

    if (game.status === 'running') {
      const key = [round, game.current, game.startToken].join('|');
      if (key !== renderedKey) {
        renderedKey = key;
        renderRunning();
      }
      updateCounters();
    } else {
      renderedKey = '';
      renderWaitingOrFinished();
    }

    renderBoard();
    renderResults();
    renderRetakes();
    renderExcluded();
  }

  function renderWaitingOrFinished() {
    const fin = game.status === 'finished';
    const chips = players.length
      ? players.map((p) => `<span class="player ${p.excluded ? 'excl' : ''}">${esc(p.name)}${p.group ? ' · ' + esc(p.group) : ''}</span>`).join('')
      : '<span class="players-empty">Пока никто не подключился. Передайте игрокам код.</span>';

    $('content').innerHTML = `
      <h1>${fin ? 'Тест завершён' : 'Экран ожидания'}</h1>
      <div class="quiz-title">${esc(quiz.title)}</div>
      ${scheduleHtml()}
      <div class="code-row"><div class="code-big">${esc(code)}</div><button class="btn-ghost" id="qrPosterBtn">QR</button></div>
      <p class="qr-url">Или откройте ссылку: ${esc(joinUrl())}</p>
      <div><span class="status ${fin ? 'finished' : 'waiting'}">${fin ? 'Игра завершена' : 'Ждём игроков'}</span></div>
      <div class="section-title">Игроки (${activePlayers().length})</div>
      <div class="players">${chips}</div>
      <div class="row">
        ${fin
          ? '<button class="btn-primary" id="restartBtn">Запустить заново</button>'
          : '<button class="btn-primary" id="startBtn">Начать тест</button>'}
        <button class="btn-ghost" id="demoBtn">Демо просмотр</button>
      </div>
      ${fin ? '<div class="section-title" style="margin-top:26px">Рейтинг</div><div id="lb"></div>' : ''}`;

    attach();
    placeQr(false);
  }

  function renderRunning() {
    const pos = game.current ?? -1;
    const total = order.length;

    if (pos < 0 || pos >= total) {
      $('content').innerHTML = `
        <h1>Вопросы закончились</h1>
        <p class="hint">Все вопросы пройдены. Проверьте ответы и завершите тест: по нему выдадутся сертификаты.</p>
        <div class="row">
          <button class="btn-danger" id="finishBtn">Завершить тест</button>
          <button class="btn-ghost" id="demoBtn">Демо просмотр</button>
        </div>
        <div class="section-title" style="margin-top:26px">Рейтинг</div>
        <div id="lb"></div>`;
      attach();
      placeQr(false);
      return;
    }

    const q = fullQ[order[pos]];
    $('content').innerHTML = `
      <div class="run-grid">
        <div>
          <div class="q-progress">Вопрос ${pos + 1} из ${total} · баллов: ${q.points ?? 1}</div>
          <div class="timer-track"><div class="timer-bar" id="hBar"></div></div>
          <div class="timer-label" id="hLabel"></div>
          ${q.image && q.image.id ? `<img class="q-img-host" data-image-id="${esc(q.image.id)}" alt="" hidden />` : ''}
          <div class="q-text">${esc(q.text)}</div>
          ${questionPreview(q)}
          <p class="hint">Вы ведущий, поэтому не отвечаете. Чтобы пройти тест как участник, откройте «Демо просмотр».</p>
          <div class="row" style="justify-content:flex-start">
            ${quiz.manualMode ? '<button class="btn-primary" id="nextBtn">Следующий вопрос</button>' : ''}
            <button class="btn-ghost" id="demoBtn">Демо просмотр</button>
            <button class="btn-danger" id="finishBtn">Завершить тест</button>
          </div>
        </div>
        <aside class="side">
          <div id="qrSlot"></div>
          <div class="stat">
            <div class="stat-num" id="answeredNum">0</div>
            <div>ответили из <span id="totalNum">0</span></div>
          </div>
          <div class="section-title">Рейтинг</div>
          <div id="lb"></div>
        </aside>
      </div>`;

    attach();
    placeQr(true);
    hydrateImages();
  }

  function questionPreview(q) {
    if (q.type === 'choice') {
      return `<div class="opt-list">${q.options.map((o, j) => `
        <div class="opt-item ${j === q.correct ? 'right' : ''}"><span class="lt">${LETTERS[j] || j + 1}</span>${esc(o)}</div>`).join('')}</div>`;
    }
    if (q.type === 'open') {
      return `<div class="hint">Засчитываются ответы: ${q.answers.map((a) => esc(a)).join(', ')}</div>`;
    }
    if (q.type === 'code') {
      return `${q.hasBug ? `<div class="blk-label">Код для исправления</div><pre class="code-view">${esc(q.starter)}</pre>` : ''}
        <div class="blk-label">Правильный код</div><pre class="code-view">${esc(q.answer)}</pre>`;
    }
    return `<div class="blk-label">Правильный порядок блоков</div>
      <div class="blk-order">${q.answer.map((b, j) => `<span class="blk-chip"><b>${j + 1}</b> ${esc(b)}</span>`).join('')}</div>
      ${q.extra && q.extra.length ? `<div class="blk-label">Лишние блоки</div><div class="blk-order">${q.extra.map((b) => `<span class="blk-chip extra">${esc(b)}</span>`).join('')}</div>` : ''}`;
  }

  function updateCounters() {
    const pos = game.current ?? -1;
    const activeIds = new Set(activePlayers().map((p) => p.id));
    const answered = answers.filter((a) => a.q === pos && activeIds.has(a.player)).length;
    const a = $('answeredNum');
    if (a) a.textContent = answered;
    const t = $('totalNum');
    if (t) t.textContent = activePlayers().length;
  }

  function attach() {
    $('startBtn')?.addEventListener('click', startGame);
    $('restartBtn')?.addEventListener('click', restartGame);
    $('nextBtn')?.addEventListener('click', () => advance(game.current));
    $('finishBtn')?.addEventListener('click', finishGame);
    $('demoBtn')?.addEventListener('click', openDemo);
  }

  function renderBoard() {
    const el = $('lb');
    if (!el) return;
    const list = ranking();
    el.innerHTML = list.length
      ? list.map((p, i) => `
          <div class="lb-row">
            <span class="lb-rank">${i + 1}</span>
            <span class="lb-name">${esc(p.name)}${p.excluded ? ' · исключён' : ''}</span>
            <span class="lb-score">${p.score}</span>
          </div>`).join('')
      : '<div class="players-empty">Пока нет игроков</div>';
  }

  /* ---------- Итоги игроков ---------- */
  function renderResults() {
    $('resultsCard').hidden = players.length === 0;
    if (players.length === 0) return;
    const total = order.length;
    $('resultsList').innerHTML = ranking().map((p) => {
      const answered = answers.filter((a) => a.player === p.id).length;
      const grade = quiz.gradeMode && !p.excluded ? gradeFor(p.score, quiz.grades) : null;
      return `
        <div class="res-row">
          <div class="res-main">
            <span class="res-name">${esc(p.name)}</span>
            ${p.group ? `<span class="muted"> · ${esc(p.group)}</span>` : ''}
            ${p.attempt > 1 ? `<span class="muted"> · попытка ${p.attempt}</span>` : ''}
            ${p.excluded ? '<span class="tag bad">исключён</span>' : ''}
          </div>
          <div class="res-stats">
            <span><b>${p.score}</b> балл.</span>
            ${grade != null ? `<span class="tag">оценка ${grade}</span>` : ''}
            <span>ответов ${answered}/${total}</span>
            <span>выходов ${p.exits}</span>
          </div>
          <button class="btn-soft" data-detail="${esc(p.id)}">Подробнее</button>
        </div>`;
    }).join('');
  }

  $('resultsList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-detail]');
    if (b) openDetail(b.dataset.detail);
  });

  function answerText(q, v) {
    if (v === undefined || v === null) return null;
    if (q.type === 'choice') return q.options[v] ?? '—';
    if (Array.isArray(v)) return v.join('\n');
    return String(v);
  }

  function openDetail(id) {
    const p = players.find((x) => x.id === id);
    if (!p) return;
    const info = ranking().find((x) => x.id === id);

    $('detailTitle').textContent = p.name || '—';
    $('detailSub').textContent = `${p.group ? 'группа ' + p.group + ' · ' : ''}попытка ${p.attempt || 1} · ${quiz.title}`;

    const rows = order.map((qi, pos) => {
      const q = fullQ[qi];
      const a = answersByKey.get(`${pos}_${id}`);
      const text = a ? answerText(q, a.answer) : null;
      const verdict = !a
        ? '<div class="muted">Нет ответа</div>'
        : a.correct === undefined
          ? '<div class="muted">Проверяется…</div>'
          : (a.correct ? `<div class="ans-ok">✓ верно · ${a.points || 0} балл(ов)</div>` : '<div class="ans-bad">✗ неверно · 0 баллов</div>');
      return `
        <div class="ans-row">
          <div class="ans-q">${pos + 1}. ${esc(q.text)}</div>
          ${text !== null ? `<pre class="ans-val">${esc(text)}</pre>` : ''}
          ${verdict}
        </div>`;
    }).join('') || '<div class="muted">Вопросы этого запуска не найдены</div>';

    $('detailBody').innerHTML = `
      <div class="muted" style="margin-bottom:6px">Баллов за запуск: <b>${info.score}</b>${info.excluded ? ' · исключён: два выхода со страницы' : ''}</div>
      <div class="section-title">Ответы</div>
      ${rows}
      <div class="section-title">Квизы этого игрока</div>
      <div id="histBox"><div class="muted">Загружаем…</div></div>`;

    $('detailModal').hidden = false;
    loadHistory(p.key);
  }

  // Сертификаты игрока по всем вашим квизам
  async function loadHistory(key) {
    const box = $('histBox');
    if (!box) return;
    try {
      const snap = await getDocs(query(
        collection(db, 'certificates'),
        where('ownerUid', '==', user.uid),
        where('personKey', '==', key)
      ));
      const items = snap.docs.map((d) => d.data()).sort((a, b) => tsMs(a.createdAt) - tsMs(b.createdAt));
      box.innerHTML = items.length
        ? items.map((c) => `
            <div class="hist-row">
              <b>${esc(c.quizTitle)}</b>
              <span class="muted"> · ${esc(c.date)} · попытка ${esc(c.attempt || 1)} · ${esc(c.score)} баллов${c.grade != null ? ' · оценка ' + esc(c.grade) : ''}</span>
            </div>`).join('')
        : '<div class="muted">Других сертификатов по этому игроку пока нет</div>';
    } catch (err) {
      console.error(err);
      if ($('histBox')) $('histBox').innerHTML = '<div class="muted">Не удалось загрузить историю</div>';
    }
  }

  $('detailClose').addEventListener('click', () => { $('detailModal').hidden = true; });
  $('detailModal').addEventListener('click', (e) => { if (e.target === $('detailModal')) $('detailModal').hidden = true; });

  /* ---------- Запросы на перездачу ---------- */
  function watchRetakes() {
    unsubRetakes = onSnapshot(collection(db, 'games', code, 'retakeRequests'), (snap) => {
      if (retakesReady) {
        snap.docChanges().forEach((ch) => {
          const d = ch.doc.data();
          if (ch.type === 'added' && d.status === 'pending') showToast(`Новый запрос на перездачу: ${d.name || ''}`);
        });
      }
      retakesReady = true;
      retakes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderRetakes();
    });
  }

  function renderRetakes() {
    const pending = retakes.filter((r) => r.status === 'pending' && (r.round ?? round) === round);
    $('retakeCard').hidden = pending.length === 0;
    $('retakeList').innerHTML = pending.map((r) => `
      <div class="rq-row">
        <div><b>${esc(r.name)}</b>${r.group ? ` · ${esc(r.group)}` : ''} · попытка ${esc(r.attempt || 1)}${r.grade != null ? ` · оценка ${esc(r.grade)}` : ''}</div>
        <div class="rq-reason">Причина: ${esc(r.reason || '—')}</div>
        <div class="rq-actions">
          <button class="btn-ok" data-approve="${esc(r.id)}">Разрешить</button>
          <button class="btn-no" data-reject="${esc(r.id)}">Отклонить</button>
        </div>
      </div>`).join('');
  }

  $('retakeList').addEventListener('click', async (e) => {
    const ok = e.target.closest('[data-approve]');
    const no = e.target.closest('[data-reject]');
    if (!ok && !no) return;
    const id = ok ? ok.dataset.approve : no.dataset.reject;
    const r = retakes.find((x) => x.id === id);
    if (!r) return;
    try {
      await updateDoc(doc(db, 'games', code, 'retakeRequests', id), ok
        ? { status: 'approved', allowedAttempt: (r.attempt || 1) + 1, decidedAt: serverTimestamp() }
        : { status: 'rejected', decidedAt: serverTimestamp() });
      showToast(ok ? 'Перездача разрешена. Участник может войти снова' : 'Запрос отклонён');
    } catch (err) {
      console.error(err);
      showToast('Не удалось обновить запрос');
    }
  });

  /* ---------- Исключённые ---------- */
  function watchExcluded() {
    unsubExcluded = onSnapshot(collection(db, 'games', code, 'excluded'), (snap) => {
      if (excludedReady) {
        snap.docChanges().forEach((ch) => {
          if (ch.type === 'added') showToast(`Исключён из-за нарушений: ${ch.doc.data().name || ''}`);
        });
      }
      excludedReady = true;
      excludedList = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderExcluded();
    });
  }

  function renderExcluded() {
    $('excludedCard').hidden = excludedList.length === 0;
    $('excludedList').innerHTML = excludedList
      .slice()
      .sort((a, b) => tsMs(b.excludedAt) - tsMs(a.excludedAt))
      .map((x) => `
        <div class="ex-row">
          ${esc(x.name)}${x.group ? `, группа ${esc(x.group)}` : ''}, квиз «${esc(x.quizTitle)}» — был исключён из-за нарушений правил квиза
          <div class="muted" style="font-weight:400;margin-top:4px">Запуск ${esc(x.round || 1)} · выходов со страницы: ${esc(x.exits || 0)}</div>
        </div>`).join('');
  }

  /* ---------- QR ---------- */
  function placeQr(inSide) {
    const card = $('qrCard');
    card.hidden = false;
    if (inSide && $('qrSlot')) {
      $('qrSlot').appendChild(card);
      card.classList.add('qr-side');
    } else {
      $('content').before(card);
      card.classList.remove('qr-side');
    }
  }

  function renderQr() {
    const box = $('qrBox');
    box.innerHTML = '';
    if (typeof QRCode === 'undefined') {
      box.innerHTML = '<p class="hint">QR не загрузился. Передайте игрокам код вручную.</p>';
      return;
    }
    new QRCode(box, {
      text: joinUrl(), width: 220, height: 220,
      colorDark: '#3b0f8c', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
    });
  }

  /* ---------- Обратный отсчёт ---------- */
  function runHostCountdown(cb) {
    placeQr(false);
    $('content').innerHTML = '<div class="count-wrap"><div class="count-num" id="hCount"></div></div>';
    const el = $('hCount');
    const seq = ['5', '4', '3', '2', '1', 'Старт!'];
    let i = 0;
    const set = (text) => {
      el.textContent = text;
      el.classList.toggle('start', text === 'Старт!');
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    };
    set(seq[0]);
    const t = setInterval(() => {
      i++;
      if (i >= seq.length) {
        clearInterval(t);
        setTimeout(cb, 800);
        return;
      }
      set(seq[i]);
    }, 1000);
  }

  /* ---------- Таймер ведущего и переход между вопросами ---------- */
  function clearDriver() {
    clearTimeout(driverTimer);
    driverTimer = null;
    driverPos = null;
  }

  function startTick() {
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      const bar = $('hBar');
      const label = $('hLabel');
      if (!bar || !label) return;
      const left = Math.max(0, hostEndAt - Date.now());
      bar.style.width = (left / hostTotalMs * 100) + '%';
      label.textContent = Math.ceil(left / 1000);
    }, 200);
  }

  function driver(g) {
    if (g.status !== 'running') {
      clearDriver();
      clearInterval(tickTimer);
      return;
    }
    if (g.current === driverPos) return;

    clearDriver();
    driverPos = g.current;
    const pos = g.current;
    if (pos < 0 || pos >= order.length) return;

    const q = fullQ[order[pos]];
    const sec = q.timeLimit || quiz.timeLimit;
    hostTotalMs = sec * 1000;
    hostEndAt = Date.now() + hostTotalMs;
    startTick();

    if (quiz.manualMode) return;
    const pause = quiz.showAnswers ? 3500 : 2000;
    driverTimer = setTimeout(() => advance(pos), hostTotalMs + pause);
  }

  // Правильный ответ для участников пишем только при включённом показе ответов
  async function writeQresult(pos) {
    if (!quiz.showAnswers || !fullQ[order[pos]]) return;
    await setDoc(doc(db, 'games', code, 'rounds', String(round), 'qresults', String(pos)), {
      q: pos, ...correctPayload(fullQ[order[pos]])
    });
  }

  async function advance(pos) {
    if (!game || game.status !== 'running' || game.current !== pos) return;
    try {
      await writeQresult(pos);
      await updateDoc(doc(db, 'games', code), { current: pos + 1, questionStartedAt: serverTimestamp() });
    } catch (err) {
      console.error(err);
      showToast('Не удалось переключить вопрос');
    }
  }

  /* ---------- Фото вопросов ---------- */
  const imageCache = {};
  async function loadImageData(id) {
    if (imageCache[id]) return imageCache[id];
    const snap = await getDoc(doc(db, 'quizImages', id));
    const data = snap.exists() ? snap.data().data : null;
    if (data) imageCache[id] = data;
    return data;
  }

  function hydrateImages() {
    document.querySelectorAll('img[data-image-id]').forEach((img) => {
      loadImageData(img.dataset.imageId).then((src) => {
        if (src) { img.src = src; img.hidden = false; }
      });
    });
  }

  /* ---------- Сертификаты (выдаёт ведущий) ---------- */
  async function saveCertificate(fields) {
    for (let i = 0; i < 5; i++) {
      const certNo = makeCertNumber();
      const ref = doc(db, 'certificates', certNo);
      const snap = await getDoc(ref);
      if (snap.exists()) continue;
      await setDoc(ref, { ...fields, certNo, createdAt: serverTimestamp() });
      return certNo;
    }
    throw new Error('Не удалось создать номер сертификата');
  }

  async function issueCertificates() {
    const list = ranking().filter((p) => !p.excluded);
    const total = list.length;
    for (let i = 0; i < list.length; i++) {
      const p = list[i];
      if (p.certNo) continue;
      const grade = quiz.gradeMode ? gradeFor(p.score, quiz.grades) : null;
      const certNo = await saveCertificate({
        quizCode: code,
        quizTitle: quiz.title,
        ownerUid: user.uid,
        nickname: p.name,
        group: p.group || null,
        personKey: p.key,
        attempt: p.attempt,
        score: p.score,
        maxScore: maxScoreOf(quiz),
        grade,
        gradeMode: !!quiz.gradeMode,
        place: i + 1,
        total,
        date: todayStr(),
        round
      });
      await updateDoc(doc(db, 'games', code, 'rounds', String(round), 'players', p.id), { certNo, grade });
    }
  }

  /* ---------- Действия ведущего ---------- */
  async function startGame() {
    const now = Date.now();
    if (quiz.startsAt && now < quiz.startsAt.toMillis()) {
      showToast(`Квиз откроется ${fmt(quiz.startsAt)}`);
      return;
    }
    if (quiz.endsAt && now > quiz.endsAt.toMillis()) {
      showToast('Срок проведения квиза уже истёк');
      return;
    }
    const newOrder = makeOrder(quiz);
    if (!newOrder.length) {
      showToast('Добавьте хотя бы один вопрос в квиз');
      return;
    }

    const token = Date.now();
    countdownToken = token;
    countdownActive = true;
    clearDriver();
    runHostCountdown(() => {
      countdownActive = false;
      if (game) driver(game);
      render();
    });

    try {
      await updateDoc(doc(db, 'games', code), {
        status: 'running',
        startToken: token,
        order: newOrder,
        current: 0,
        questionStartedAt: serverTimestamp()
      });
    } catch (err) {
      console.error(err);
      showToast('Не удалось запустить тест');
    }
  }

  async function restartGame() {
    try {
      await updateDoc(doc(db, 'games', code), {
        status: 'waiting',
        round: (game.round || 1) + 1,
        current: -1,
        order: [],
        startedAt: null
      });
    } catch (err) {
      console.error(err);
      showToast('Не удалось запустить тест заново');
    }
  }

  // Завершение: проверяем всё, записываем статус и выдаём сертификаты
  async function finishGame() {
    if (!confirm('Завершить тест? Игроки перестанут отвечать, сертификаты будут выданы.')) return;
    clearDriver();
    const btn = $('finishBtn');
    if (btn) btn.disabled = true;
    try {
      answers.filter((a) => a.correct === undefined && a.q < order.length).forEach((a) => gradeOne(a));
      await waitIdle();
      if (game.status === 'running' && typeof game.current === 'number' && game.current >= 0 && game.current < order.length) {
        await writeQresult(game.current);
      }
      await updateDoc(doc(db, 'games', code), { status: 'finished', finishedAt: serverTimestamp() });
      await issueCertificates();
      showToast('Тест завершён, сертификаты выданы');
    } catch (err) {
      console.error(err);
      showToast('Ошибка при завершении. Нажмите «Завершить тест» ещё раз');
    }
  }

  function openDemo() {
    window.location.href = 'quize.html?code=' + encodeURIComponent(code) + '&demo=1';
  }

  /* ---------- Плакат с QR ---------- */
  const PW = 1754; // A4 альбомный, 150 dpi
  const PH = 1240;

  function makeQrSource() {
    return new Promise((resolve) => {
      const holder = document.createElement('div');
      new QRCode(holder, {
        text: joinUrl(), width: 560, height: 560,
        colorDark: '#3b0f8c', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
      });
      const canvas = holder.querySelector('canvas');
      if (canvas) return resolve(canvas);
      const img = holder.querySelector('img');
      if (img.complete && img.naturalWidth) return resolve(img);
      img.onload = () => resolve(img);
    });
  }

  function fitSize(ctx, text, weight, family, maxW, start) {
    let size = start;
    while (size > 24) {
      ctx.font = `${weight} ${size}px ${family}`;
      if (ctx.measureText(text).width <= maxW) break;
      size -= 2;
    }
    return size;
  }

  function wrapLines(ctx, text, maxW) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach((w) => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  async function drawPoster(canvas) {
    await Promise.all([
      document.fonts.load('900 60px Unbounded'),
      document.fonts.load('700 40px Manrope'),
      document.fonts.load('400 40px Manrope')
    ]).catch(() => {});
    const qr = await makeQrSource();

    canvas.width = PW;
    canvas.height = PH;
    const ctx = canvas.getContext('2d');
    const HEAD = 'Unbounded, Manrope, sans-serif';
    const BODY = 'Manrope, sans-serif';
    const cx = PW / 2;

    const g = ctx.createLinearGradient(0, 0, PW, PH);
    g.addColorStop(0, '#3b0f8c');
    g.addColorStop(0.5, '#6c2bd9');
    g.addColorStop(1, '#9b3fe8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, PW, PH);
    ctx.save();
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(PW - 120, 60, 340, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.2; ctx.fillStyle = '#ff7a1a';
    ctx.beginPath(); ctx.arc(100, PH - 80, 240, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.lineWidth = 6; ctx.strokeStyle = '#ffd23f';
    roundRect(ctx, 52, 52, PW - 104, PH - 104, 44); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#ffd23f';
    ctx.font = `900 110px ${HEAD}`;
    ctx.fillText('ИЗИ КВИЗ', cx, 180);
    ctx.fillStyle = '#ffffff';
    const ts = fitSize(ctx, quiz.title, '900', HEAD, PW - 240, 84);
    ctx.font = `900 ${ts}px ${HEAD}`;
    ctx.fillText(quiz.title, cx, 280);

    const qx = 160, qy = 330, qw = 680;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    roundRect(ctx, qx, qy, qw, qw, 36); ctx.fill();
    ctx.restore();
    ctx.drawImage(qr, qx + 60, qy + 60, qw - 120, qw - 120);

    const pillH = 96, pillY = qy + qw + 36;
    const lcx = qx + qw / 2;
    ctx.fillStyle = '#ffd23f';
    roundRect(ctx, lcx - 170, pillY, 340, pillH, 28); ctx.fill();
    ctx.fillStyle = '#3b0f8c';
    ctx.font = `900 64px ${HEAD}`;
    ctx.fillText(code, lcx, pillY + 67);
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.85;
    ctx.font = `600 26px ${BODY}`;
    ctx.fillText('код квиза', lcx, pillY + pillH + 40);
    ctx.globalAlpha = 1;

    const rx = 940, rw = 654;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd23f';
    ctx.font = `900 56px ${HEAD}`;
    ctx.fillText('Как играть', rx, 370);

    const steps = [
      'Наведите камеру телефона на QR-код',
      'Введите ' + (quiz.requireName ? 'ФИО' : 'никнейм') + (quiz.requireGroup ? ' и группу' : '') + ', под которыми вас увидит организатор',
      'Дождитесь отсчёта 5-4-3-2-1 и старта',
      'Отвечайте, пока не закончилось время на вопрос',
      'В конце увидите рейтинг' + (quiz.gradeMode ? ' и свою оценку, а также сможете скачать сертификат' : ''),
      'Не покидайте страницу во время теста: второй выход исключит вас из квиза'
    ];
    let y = 430;
    steps.forEach((text, i) => {
      ctx.font = `600 32px ${BODY}`;
      const lines = wrapLines(ctx, text, rw - 84);
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(rx + 22, y - 10, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b0f8c';
      ctx.font = `900 26px ${HEAD}`;
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), rx + 22, y - 1);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.font = `600 32px ${BODY}`;
      lines.forEach((ln, k) => ctx.fillText(ln, rx + 66, y + k * 44));
      y += lines.length * 44 + 30;
    });
    ctx.textAlign = 'center';
    return canvas;
  }

  async function openPoster() {
    $('posterModal').hidden = false;
    try {
      await drawPoster($('posterCanvas'));
    } catch (err) {
      console.error(err);
      $('posterModal').hidden = true;
      showToast('Не удалось собрать плакат');
    }
  }

  $('content').addEventListener('click', (e) => {
    if (e.target.closest('#qrPosterBtn')) openPoster();
  });
  $('posterClose').addEventListener('click', () => { $('posterModal').hidden = true; });
  $('posterModal').addEventListener('click', (e) => { if (e.target === $('posterModal')) $('posterModal').hidden = true; });

  $('posterPng').addEventListener('click', () => {
    $('posterCanvas').toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `izi-kviz-${code}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });

  $('posterPdf').addEventListener('click', () => {
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      pdf.addImage($('posterCanvas').toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210);
      pdf.save(`izi-kviz-${code}.pdf`);
    } catch (err) {
      console.error(err);
      showToast('Не удалось создать PDF. Проверьте интернет');
    }
  });

  window.addEventListener('beforeunload', () => {
    if (unsubGame) unsubGame();
    if (unsubRetakes) unsubRetakes();
    if (unsubExcluded) unsubExcluded();
    unsubRound.forEach((f) => f());
    clearInterval(tickTimer);
    clearDriver();
  });
</script>
