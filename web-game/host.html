<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Экран организатора — Изи квиз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #6c2bd9;
      --purple-dark: #3b0f8c;
      --yellow: #ffd23f;
      --orange: #ff7a1a;
      --green: #5cc26b;
      --white: #ffffff;
      --text-light: rgba(255, 255, 255, 0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--white);
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 50%, #9b3fe8 100%);
      min-height: 100vh; overflow-x: hidden; position: relative;
    }

    .bg-shapes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .shape { position: absolute; border-radius: 50%; opacity: 0.5; filter: blur(2px); animation: float 14s ease-in-out infinite; }
    .shape.s1 { width: 340px; height: 340px; background: radial-gradient(circle at 30% 30%, var(--orange), #ff4d6d); top: -80px; left: -60px; }
    .shape.s2 { width: 240px; height: 240px; background: radial-gradient(circle at 30% 30%, var(--yellow), var(--orange)); top: 30%; right: -70px; animation-delay: -4s; }
    .shape.s3 { width: 180px; height: 180px; background: radial-gradient(circle at 30% 30%, #c084fc, var(--purple)); bottom: 5%; left: 15%; animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.06); }
      66% { transform: translate(-30px, 25px) scale(0.95); }
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.7); }
      50% { box-shadow: 0 0 0 14px rgba(255, 210, 63, 0); }
    }

    header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px clamp(20px, 5vw, 60px); }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 22px;
      color: var(--white); text-decoration: none;
    }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: grid; place-items: center; color: var(--purple-dark); font-size: 22px; transform: rotate(-6deg);
    }
    .btn-outline {
      font-family: inherit; font-weight: 700; font-size: 15px; color: var(--white);
      background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px; padding: 10px 20px; text-decoration: none; backdrop-filter: blur(6px);
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.22); }

    main { position: relative; z-index: 5; max-width: 1040px; margin: 0 auto; padding: 16px 20px 80px; }

    .card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 24px; padding: 32px; text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .card h1 { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(24px, 4vw, 34px); margin-bottom: 6px; }
    .quiz-title { color: var(--text-light); font-size: 17px; margin-bottom: 22px; }
    .qr-card { margin-bottom: 20px; }
    .qr-card.qr-side { margin-bottom: 18px; padding: 18px; }
    .qr-side .section-title { font-size: 14px; }
    .qr-side .qr-wrap { padding: 10px; margin: 0 0 10px; }
    .qr-side #qrBox { min-width: 0; min-height: 0; }
    .qr-side .qr-url { font-size: 13px; }
    .qr-wrap { display: inline-block; background: var(--white); padding: 16px; border-radius: 20px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); margin: 6px 0 16px; }
    #qrBox { min-width: 220px; min-height: 220px; }
    #qrBox img, #qrBox canvas { display: block; margin: 0 auto; }
    .qr-url { display: block; margin-top: 6px; font-weight: 700; word-break: break-all; color: var(--white); font-size: 15px; }

    .code-big {
      display: inline-block; font-family: "Unbounded", sans-serif; font-weight: 900;
      font-size: clamp(34px, 7vw, 56px); letter-spacing: 8px;
      background: var(--white); color: var(--purple-dark);
      padding: 18px 30px; border-radius: 20px; margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .status {
      display: inline-block; font-weight: 800; font-size: 14px; padding: 8px 18px;
      border-radius: 999px; margin: 6px 0 22px; background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .status.waiting::before { content: "● "; color: var(--yellow); }
    .status.running { background: var(--green); border-color: var(--green); }
    .status.running::before { content: "● "; }
    .status.finished::before { content: "■ "; }

    .section-title { font-weight: 800; font-size: 16px; margin: 0 0 12px; }

    .players { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 44px; margin-bottom: 26px; }
    .player { background: var(--white); color: var(--purple-dark); font-weight: 700; padding: 10px 16px; border-radius: 999px; animation: fadeUp 0.4s ease both; }
    .players-empty { color: var(--text-light); font-size: 15px; padding-top: 8px; }

    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

    .btn-primary {
      font-family: inherit; font-weight: 800; font-size: 17px; color: var(--purple-dark);
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      border: none; border-radius: 16px; padding: 16px 30px; cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 122, 26, 0.45); animation: pulse 2s ease-in-out infinite;
      transition: transform 0.2s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; animation: none; transform: none; }
    .btn-ghost {
      font-family: inherit; font-weight: 700; font-size: 16px; color: var(--white);
      background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px; padding: 14px 22px; cursor: pointer;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.22); }
    .btn-danger {
      font-family: inherit; font-weight: 800; font-size: 16px; color: var(--white);
      background: #e0473a; border: none; border-radius: 16px; padding: 15px 26px;
      cursor: pointer; box-shadow: 0 8px 22px rgba(224, 71, 58, 0.4);
    }

    .hint { color: var(--text-light); font-size: 15px; line-height: 1.5; margin-top: 12px; }

    /* ---------- Режим игры ---------- */
    .run-grid { display: grid; grid-template-columns: 1fr 280px; gap: 20px; text-align: left; }
    .q-progress { font-weight: 800; font-size: 14px; color: var(--text-light); margin-bottom: 12px; }
    .timer-track { height: 12px; background: rgba(255, 255, 255, 0.2); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
    .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); border-radius: 999px; }
    .timer-label { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 26px; margin-bottom: 16px; }
    .q-text {
      background: var(--white); color: var(--purple-dark); border-radius: 20px;
      padding: 22px 20px; margin-bottom: 14px; font-weight: 800; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.35;
      box-shadow: 0 12px 30px rgba(20, 0, 60, 0.25);
    }
    .q-img-host {
      display: block; max-width: 100%; max-height: 260px; object-fit: contain;
      margin: 0 0 14px; border-radius: 16px; background: #fff;
    }
    .opt-list { display: grid; gap: 10px; }
    .opt-item {
      background: rgba(255, 255, 255, 0.14); border-radius: 14px; padding: 12px 14px;
      font-weight: 700; display: flex; gap: 10px; align-items: center;
    }
    .opt-item.right { background: #e9f8ee; color: var(--purple-dark); }
    .lt {
      width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: grid; place-items: center; font-weight: 900; color: var(--purple-dark);
    }
    .side .stat {
      background: rgba(255, 255, 255, 0.14); border-radius: 18px; padding: 18px; text-align: center; margin-bottom: 18px;
    }
    .stat-num { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 44px; color: var(--yellow); }
    .lb-row {
      display: flex; gap: 10px; align-items: center;
      background: rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
    }
    .lb-rank { font-family: "Unbounded", sans-serif; font-weight: 900; width: 28px; }
    .lb-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-weight: 900; color: var(--yellow); }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: var(--yellow); color: var(--purple-dark); font-weight: 700;
      padding: 14px 22px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.35s ease; z-index: 60; max-width: calc(100% - 40px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .count-wrap { display: grid; place-items: center; min-height: 320px; }
    .count-num {
      font-family: "Unbounded", sans-serif; font-weight: 900;
      font-size: clamp(90px, 22vw, 160px); line-height: 1; color: var(--yellow);
      text-shadow: 0 8px 30px rgba(255, 122, 26, 0.5); min-height: 1.1em;
    }
    .count-num.pop { animation: pop 0.9s ease both; }
    .count-num.start { font-size: clamp(56px, 14vw, 96px); color: var(--white); }
    @keyframes pop { 0% { opacity: 0; transform: scale(1.8); } 40% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }

    .error { color: #ffe0a3; font-weight: 700; font-size: 15px; line-height: 1.5; margin-top: 10px; }

    /* ---------- Перездачи и оценки ---------- */
    .retake-card { margin-top: 20px; text-align: left; }
    .rq-row {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
    }
    .rq-name { flex: 1; min-width: 150px; font-weight: 700; }
    .btn-ok {
      font-family: inherit; font-weight: 800; font-size: 14px; color: var(--purple-dark);
      background: var(--green); border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer;
    }
    .btn-no {
      font-family: inherit; font-weight: 700; font-size: 14px; color: var(--white);
      background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; padding: 8px 14px; cursor: pointer;
    }
    .lb-grade {
      font-weight: 800; font-size: 13px; background: var(--yellow); color: var(--purple-dark);
      border-radius: 999px; padding: 4px 10px; white-space: nowrap;
    }

    @media (max-width: 800px) {
      .run-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .card { padding: 22px; }
      .btn-primary, .btn-danger, .btn-ghost { width: 100%; }
      .logo { font-size: 17px; }
      .logo-mark { width: 34px; height: 34px; font-size: 18px; }
      .btn-outline { padding: 9px 14px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg-shapes" aria-hidden="true">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
  </div>

  <header>
    <a href="index.html" class="logo"><span class="logo-mark">?</span>Изи квиз</a>
    <a href="cabinet.html" class="btn-outline">Личный кабинет</a>
  </header>

  <main>
    <section class="card qr-card" id="qrCard">
      <div class="section-title">Игроки сканируют QR-код</div>
      <div class="qr-wrap"><div id="qrBox"></div></div>
    </section>

    <section class="card" id="content">
      <h1>Экран организатора</h1>
      <p class="hint">Загружаем…</p>
    </section>

    <section class="card retake-card" id="retakeCard" hidden>
      <div class="section-title">Запросы на перездачу</div>
      <div id="retakeList"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { gradeFor } from "./cert.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
    authDomain: "sokrat-7c938.firebaseapp.com",
    projectId: "sokrat-7c938",
    storageBucket: "sokrat-7c938.firebasestorage.app",
    messagingSenderId: "19858604945",
    appId: "1:19858604945:web:8ec6dc1a81dba35c481030",
    measurementId: "G-B3SDDN1T50"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const $ = (id) => document.getElementById(id);
  const code = new URLSearchParams(location.search).get('code');
  const LETTERS = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];

  let user = null;
  let quiz = null;
  let game = null;
  let players = [];
  let currentRound = null;

  let unsubGame = null;
  let unsubPlayers = null;
  let driverPos = null;
  let driverTimer = null;
  let hostEndAt = 0;
  let hostTotalMs = 1;
  let tickTimer = null;
  let pollTimer = null;
  let firstSnapshot = true;
  let countdownToken = null;
  let countdownActive = false;
  let unsubRetakes = null;

  // Дата из Timestamp для показа человеку
  const fmt = (ts) => ts.toDate().toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let toastTimer;
  function showToast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function showError(text) {
    $('content').innerHTML = `
      <h1>Не получилось</h1>
      <p class="error">${esc(text)}</p>
      <div style="margin-top:24px"><a class="btn-outline" href="cabinet.html">В личный кабинет</a></div>`;
  }

  const joinUrl = () => new URL('index.html?code=' + encodeURIComponent(code), location.href).href;

  function shuffle(a) {
    const r = [...a];
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function makeOrder(q) {
    const idx = q.questions.map((_, i) => i);
    return q.shuffleQuestions ? shuffle(idx) : idx;
  }

  /* ---------- Старт ---------- */
  onAuthStateChanged(auth, (u) => {
    if (!u) {
      window.location.replace('index.html');
      return;
    }
    user = u;
    init();
  });

  async function init() {
    if (!code) return showError('Не указан код квиза.');
    try {
      const qs = await getDoc(doc(db, 'quizzes', code));
      if (!qs.exists() || qs.data().ownerUid !== user.uid) {
        return showError('Квиз не найден или у вас нет прав на его запуск.');
      }
      quiz = { timeLimit: 20, questions: [], ...qs.data() };
      quiz.timeLimit = quiz.timeLimit || 20;

      const gs = await getDoc(doc(db, 'games', code));
      if (!gs.exists()) return showError('Экран ожидания ещё не создан. Запустите его из личного кабинета.');
      if (gs.data().hostUid !== user.uid) return showError('Эту игру ведёт другой пользователь.');

      unsubGame = onSnapshot(doc(db, 'games', code), (snap) => {
        if (snap.exists()) onGame(snap.data());
      });
      renderQr();
      watchRetakes();
    } catch (err) {
      console.error(err);
      showError('Не удалось загрузить игру. Проверьте интернет и обновите страницу.');
    }
  }

  function onGame(g) {
    game = g;
    const r = g.round || 1;
    if (r !== currentRound) {
      currentRound = r;
      watchPlayers(r);
    }

    // При первом открытии страницы отсчёт не повторяем (например, после перезагрузки)
    if (firstSnapshot) {
      firstSnapshot = false;
      countdownToken = g.startToken ?? null;
    }

    // Новый старт игры: сначала отсчёт 5-4-3-2-1-Старт, как у игроков
    if (g.status === 'running' && g.startToken != null && g.startToken !== countdownToken) {
      countdownToken = g.startToken;
      clearDriver();
      countdownActive = true;
      runHostCountdown(() => {
        countdownActive = false;
        driver(game);
        render();
      });
      return;
    }

    if (countdownActive) return;
    driver(g);
    render();
  }

  function runHostCountdown(cb) {
    placeQr(false);
    stopPoll();
    $('content').innerHTML = '<div class="count-wrap"><div class="count-num" id="hCount"></div></div>';
    const el = $('hCount');
    const seq = ['5', '4', '3', '2', '1', 'Старт!'];
    let i = 0;

    const set = (text) => {
      el.textContent = text;
      el.classList.toggle('start', text === 'Старт!');
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    };

    set(seq[0]);
    const t = setInterval(() => {
      i++;
      if (i >= seq.length) {
        clearInterval(t);
        setTimeout(cb, 800);
        return;
      }
      set(seq[i]);
    }, 1000);
  }

  function watchPlayers(r) {
    if (unsubPlayers) unsubPlayers();
    players = [];
    unsubPlayers = onSnapshot(collection(db, 'games', code, 'rounds', String(r), 'players'), (snap) => {
      players = snap.docs.map((d) => d.data());
      render();
    });
  }

  /* ---------- QR ---------- */
  // QR всегда виден: над экраном ожидания или в боковой колонке во время игры
  function placeQr(inSide) {
    const card = $('qrCard');
    card.hidden = false;
    if (inSide && $('qrSlot')) {
      $('qrSlot').appendChild(card);
      card.classList.add('qr-side');
    } else {
      $('content').before(card);
      card.classList.remove('qr-side');
    }
  }

  function renderQr() {
    const box = $('qrBox');
    box.innerHTML = '';
    if (typeof QRCode === 'undefined') {
      box.innerHTML = '<p class="hint">QR не загрузился. Передайте игрокам код вручную.</p>';
      return;
    }
    new QRCode(box, {
      text: joinUrl(),
      width: 220,
      height: 220,
      colorDark: '#3b0f8c',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  function scheduleHtml() {
    const parts = [];
    if (quiz.startsAt) parts.push(`открытие: ${fmt(quiz.startsAt)}`);
    if (quiz.endsAt) parts.push(`закрытие: ${fmt(quiz.endsAt)}`);
    return parts.length ? `<p class="hint">Расписание: ${parts.join(' · ')}</p>` : '';
  }

  /* ---------- Отрисовка ---------- */
  function render() {
    if (!game || countdownActive) return;
    if (game.status === 'running') renderRunning();
    else renderWaitingOrFinished();
  }

  function renderWaitingOrFinished() {
    stopPoll();
    const fin = game.status === 'finished';
    const playersHtml = players.length
      ? players.map((p) => `<span class="player">${esc(p.name)}</span>`).join('')
      : '<span class="players-empty">Пока никто не подключился. Передайте игрокам код.</span>';

    $('content').innerHTML = `
      <h1>${fin ? 'Тест завершён' : 'Экран ожидания'}</h1>
      <div class="quiz-title">${esc(quiz.title)}</div>
      ${scheduleHtml()}
      <div class="code-big">${esc(code)}</div>
      <p class="qr-url">Или откройте ссылку: ${esc(joinUrl())}</p>
      <div><span class="status ${fin ? 'finished' : 'waiting'}">${fin ? 'Игра завершена' : 'Ждём игроков'}</span></div>
      <div class="section-title">Игроки (${players.length})</div>
      <div class="players">${playersHtml}</div>
      <div class="row">
        ${fin
          ? '<button class="btn-primary" id="restartBtn">Запустить заново</button>'
          : '<button class="btn-primary" id="startBtn">Начать тест</button>'}
        <button class="btn-ghost" id="demoBtn">Демо просмотр</button>
      </div>
      ${fin ? '<div class="section-title" style="margin-top:26px">Итоги</div><div id="lb"></div>' : ''}`;

    attach();
    placeQr(false);
    if (fin) {
      // Итоги: показываем всех подключившихся игроков и обновляем, пока не начали заново
      stopPoll();
      loadBoard('lb');
      pollTimer = setInterval(() => loadBoard('lb'), 4000);
    }
  }

  function renderRunning() {
    const pos = game.current ?? -1;
    const order = game.order || [];
    const total = order.length;

    if (pos < 0 || pos >= total) {
      $('content').innerHTML = `
        <h1>Вопросы закончились</h1>
        <p class="hint">Все вопросы пройдены. Можно завершить тест.</p>
        <div class="row"><button class="btn-danger" id="finishBtn">Завершить тест</button><button class="btn-ghost" id="demoBtn">Демо просмотр</button></div>
        <div class="section-title" style="margin-top:26px">Рейтинг</div>
        <div id="lb"></div>`;
      attach();
      placeQr(false);
      stopPoll();
      loadBoard('lb');
      pollTimer = setInterval(() => loadBoard('lb'), 4000);
      return;
    }

    const q = quiz.questions[order[pos]];
    const optsHtml = q.type === 'choice'
      ? `<div class="opt-list">${q.options.map((o, j) => `
          <div class="opt-item"><span class="lt">${LETTERS[j] || j + 1}</span>${esc(o)}</div>`).join('')}</div>`
      : '<div class="hint">Ответ вводят игроки.</div>';

    $('content').innerHTML = `
      <div class="run-grid">
        <div>
          <div class="q-progress">Вопрос ${pos + 1} из ${total} · баллов: ${q.points ?? 1}</div>
          <div class="timer-track"><div class="timer-bar" id="hBar"></div></div>
          <div class="timer-label" id="hLabel"></div>
          ${q.image && q.image.id ? `<img class="q-img-host" data-image-id="${esc(q.image.id)}" alt="" hidden />` : ''}
          <div class="q-text">${esc(q.text)}</div>
          ${optsHtml}
          <p class="hint">Вы ведущий, поэтому не отвечаете. Чтобы пройти тест как участник, откройте «Демо просмотр».</p>
          <div class="row">
            ${quiz.manualMode ? '<button class="btn-primary" id="nextBtn">Следующий вопрос</button>' : ''}
            <button class="btn-ghost" id="demoBtn">Демо просмотр</button>
            <button class="btn-danger" id="finishBtn">Завершить тест</button>
          </div>
        </div>
        <aside class="side">
          <div id="qrSlot"></div>
          <div class="stat">
            <div class="stat-num" id="answeredNum">0</div>
            <div>ответили из <span id="totalNum">${players.length}</span></div>
          </div>
          <div class="section-title">Рейтинг</div>
          <div id="lb"></div>
        </aside>
      </div>`;

    attach();
    placeQr(true);
    hydrateImages();
    startPoll(pos);
  }

  function attach() {
    $('startBtn')?.addEventListener('click', startGame);
    $('restartBtn')?.addEventListener('click', restartGame);
    $('nextBtn')?.addEventListener('click', () => advance(game.current));
    $('finishBtn')?.addEventListener('click', finishGame);
    $('demoBtn')?.addEventListener('click', openDemo);
  }

  /* ---------- Опрос ответов и рейтинга ---------- */
  async function loadScores() {
    const base = ['games', code, 'rounds', String(currentRound)];
    const [answersSnap, playersSnap] = await Promise.all([
      getDocs(collection(db, ...base, 'answers')),
      getDocs(collection(db, ...base, 'players'))
    ]);
    const scores = {};
    answersSnap.forEach((d) => {
      const a = d.data();
      scores[a.player] = (scores[a.player] || 0) + (a.points || 0);
    });
    return playersSnap.docs
      .map((d) => ({ id: d.id, name: d.data().name, score: scores[d.id] || 0, ended: !!d.data().ended }))
      .sort((a, b) => b.score - a.score);
  }

  async function loadBoard(id) {
    const el = $(id);
    if (!el) return;
    try {
      const list = await loadScores();
      if (!$(id)) return;
      el.innerHTML = list.length
        ? list.map((p, i) => `
            <div class="lb-row">
              <span class="lb-rank">${i + 1}</span>
              <span class="lb-name">${esc(p.name)}${p.ended ? ' · вышел' : ''}</span>
              <span class="lb-score">${p.score}</span>${quiz.gradeMode ? `<span class="lb-grade">оценка ${gradeFor(p.score, quiz.grades)}</span>` : ''}
            </div>`).join('')
        : '<div class="players-empty">Пока нет игроков</div>';
    } catch (err) {
      console.error(err);
    }
  }

  /* ---------- Фото вопросов (из коллекции quizImages) ---------- */
  const imageCache = {};
  async function loadImageData(id) {
    if (imageCache[id]) return imageCache[id];
    const snap = await getDoc(doc(db, 'quizImages', id));
    const data = snap.exists() ? snap.data().data : null;
    if (data) imageCache[id] = data;
    return data;
  }

  function hydrateImages() {
    document.querySelectorAll('img[data-image-id]').forEach((img) => {
      loadImageData(img.dataset.imageId).then((src) => {
        if (src) {
          img.src = src;
          img.hidden = false;
        }
      });
    });
  }

  function startPoll(pos) {
    stopPoll();
    const tick = async () => {
      try {
        const answers = await getDocs(query(
          collection(db, 'games', code, 'rounds', String(currentRound), 'answers'),
          where('q', '==', pos)
        ));
        if ($('answeredNum')) $('answeredNum').textContent = answers.size;
        if ($('totalNum')) $('totalNum').textContent = players.length;
        await loadBoard('lb');
      } catch (err) {
        console.error(err);
      }
    };
    tick();
    pollTimer = setInterval(tick, 2000);
  }

  function stopPoll() {
    clearInterval(pollTimer);
    pollTimer = null;
  }

  /* ---------- Таймер ведущего и переход между вопросами ---------- */
  function clearDriver() {
    clearTimeout(driverTimer);
    driverTimer = null;
    driverPos = null;
  }

  // Ведущий двигает игру: по таймеру (авто) или по кнопке (ручной режим)
  function driver(g) {
    if (g.status !== 'running') {
      clearDriver();
      clearInterval(tickTimer);
      return;
    }
    if (g.current === driverPos) return;

    clearDriver();
    driverPos = g.current;

    const order = g.order || [];
    const pos = g.current;
    if (pos < 0 || pos >= order.length) return;

    const q = quiz.questions[order[pos]];
    const sec = q.timeLimit || quiz.timeLimit;
    hostTotalMs = sec * 1000;
    hostEndAt = Date.now() + hostTotalMs;
    startTick();

    if (quiz.manualMode) return;

    const pause = quiz.showAnswers ? 3500 : 2000;
    driverTimer = setTimeout(() => advance(pos), hostTotalMs + pause);
  }

  function startTick() {
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      const bar = $('hBar');
      const label = $('hLabel');
      if (!bar || !label) return;
      const left = Math.max(0, hostEndAt - Date.now());
      bar.style.width = (left / hostTotalMs * 100) + '%';
      label.textContent = Math.ceil(left / 1000);
    }, 200);
  }

  async function advance(pos) {
    if (!game || game.status !== 'running' || game.current !== pos) return;
    try {
      await updateDoc(doc(db, 'games', code), {
        current: pos + 1,
        questionStartedAt: serverTimestamp()
      });
    } catch (err) {
      console.error(err);
      showToast('Не удалось переключить вопрос');
    }
  }

  /* ---------- Запросы на перездачу ---------- */
  // Участник, который уже прошёл тест, просит повторный вход. Разрешить можно только текущему запросу.
  function watchRetakes() {
    if (unsubRetakes) return;
    unsubRetakes = onSnapshot(collection(db, 'games', code, 'retakeRequests'), (snap) => {
      const pending = snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .filter((r) => r.status === 'pending' && (r.round ?? currentRound) === currentRound);
      $('retakeCard').hidden = pending.length === 0;
      $('retakeList').innerHTML = pending.map((r) => `
        <div class="rq-row">
          <span class="rq-name">${esc(r.name)} · попытка ${esc(r.attempt || 1)}${r.grade != null ? ` · оценка ${esc(r.grade)}` : ''}</span>
          <button class="btn-ok" data-approve="${esc(r.id)}" data-att="${Number(r.attempt) || 1}">Разрешить</button>
          <button class="btn-no" data-reject="${esc(r.id)}">Отклонить</button>
        </div>`).join('');
    });
  }

  $('retakeList').addEventListener('click', async (e) => {
    const ok = e.target.closest('[data-approve]');
    const no = e.target.closest('[data-reject]');
    try {
      if (ok) {
        await updateDoc(doc(db, 'games', code, 'retakeRequests', ok.dataset.approve), {
          status: 'approved',
          allowedAttempt: Number(ok.dataset.att) + 1
        });
        showToast('Перездача разрешена. Участник может войти снова');
      } else if (no) {
        await updateDoc(doc(db, 'games', code, 'retakeRequests', no.dataset.reject), { status: 'rejected' });
      }
    } catch (err) {
      console.error(err);
      showToast('Не удалось обновить запрос');
    }
  });

  /* ---------- Действия ведущего ---------- */
  async function startGame() {
    const now = Date.now();
    if (quiz.startsAt && now < quiz.startsAt.toMillis()) {
      showToast(`Квиз откроется ${fmt(quiz.startsAt)}`);
      return;
    }
    if (quiz.endsAt && now > quiz.endsAt.toMillis()) {
      showToast('Срок проведения квиза уже истёк');
      return;
    }
    const order = makeOrder(quiz);
    if (!order.length) {
      showToast('Добавьте хотя бы один вопрос в квиз');
      return;
    }
    // Отсчёт запускаем сразу по нажатию, не дожидаясь ответа базы
    const token = Date.now();
    countdownToken = token;
    countdownActive = true;
    clearDriver();
    runHostCountdown(() => {
      countdownActive = false;
      driver(game);
      render();
    });

    try {
      await updateDoc(doc(db, 'games', code), {
        status: 'running',
        startToken: token,
        order,
        current: 0,
        questionStartedAt: serverTimestamp()
      });
    } catch (err) {
      console.error(err);
      showToast('Не удалось запустить тест');
    }
  }

  async function restartGame() {
    try {
      await updateDoc(doc(db, 'games', code), {
        status: 'waiting',
        round: (game.round || 1) + 1,
        current: -1,
        order: [],
        startedAt: null
      });
    } catch (err) {
      console.error(err);
      showToast('Не удалось запустить тест заново');
    }
  }

  async function finishGame() {
    if (!confirm('Завершить тест? Игроки перестанут отвечать.')) return;
    clearDriver();
    try {
      await updateDoc(doc(db, 'games', code), { status: 'finished', finishedAt: serverTimestamp() });
    } catch (err) {
      console.error(err);
      showToast('Не удалось завершить тест');
    }
  }

  function openDemo() {
    window.location.href = 'quize.html?code=' + encodeURIComponent(code) + '&demo=1';
  }

  window.addEventListener('beforeunload', () => {
    if (unsubGame) unsubGame();
    if (unsubPlayers) unsubPlayers();
    stopPoll();
    clearDriver();
  });
</script>
</body>
</html>
