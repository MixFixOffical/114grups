<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1100">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="Управление студентами и учебными группами">
<title>Студенты — Куратор-журнал</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --blue-light:#eff6ff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --bg:#f5f7fb;
    --white:#ffffff;
    --green:#16a34a;
    --red:#dc2626;
    --orange:#ea580c;
    --shadow:0 10px 35px rgba(15,23,42,.07);
}

html,
body{
    min-width:1100px;
    min-height:100%;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at top left,#eff6ff 0,#f5f7fb 35%,#f5f7fb 100%);
    color:var(--text);
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.loading-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background:#f8fafc;
    transition:.35s ease;
}

.loading-screen.hidden{
    opacity:0;
    pointer-events:none;
}

.loader{
    width:46px;
    height:46px;
    border:4px solid #dbeafe;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.loading-text{
    color:var(--muted);
    font-size:14px;
    font-weight:600;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.header{
    height:82px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(226,232,240,.8);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 34px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
    cursor:pointer;
    user-select:none;
}

.brand-logo{
    width:46px;
    height:46px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:800;
    font-size:15px;
    background:linear-gradient(135deg,#2563eb,#60a5fa);
    box-shadow:0 8px 22px rgba(37,99,235,.25);
}

.brand-title{
    font-size:17px;
    font-weight:800;
    letter-spacing:-.2px;
}

.brand-sub{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.role-badge{
    display:none;
    align-items:center;
    gap:6px;
    padding:8px 12px;
    background:#eff6ff;
    color:#1d4ed8;
    border:1px solid #dbeafe;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
}

.clock{
    text-align:right;
    min-width:115px;
}

.clock-date{
    color:var(--muted);
    font-size:11px;
}

.clock-time{
    font-size:16px;
    font-weight:800;
    margin-top:2px;
    letter-spacing:.5px;
}

.home-btn{
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    padding:10px 16px;
    border-radius:11px;
    font-weight:700;
    transition:.2s;
}

.home-btn:hover{
    border-color:#bfdbfe;
    color:var(--blue);
    background:#f8fbff;
    transform:translateY(-1px);
}

.container{
    width:1100px;
    margin:0 auto;
    padding:30px 0 60px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.page-title{
    font-size:30px;
    font-weight:850;
    letter-spacing:-.8px;
}

.page-subtitle{
    margin-top:6px;
    color:var(--muted);
    font-size:14px;
}

.primary-btn{
    border:0;
    color:white;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    padding:13px 18px;
    border-radius:12px;
    font-weight:750;
    box-shadow:0 8px 20px rgba(37,99,235,.2);
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(37,99,235,.28);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:rgba(255,255,255,.92);
    border:1px solid var(--border);
    border-radius:17px;
    padding:19px;
    box-shadow:var(--shadow);
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.stat-value{
    font-size:28px;
    font-weight:850;
    margin-top:7px;
    letter-spacing:-.6px;
}

.stat.blue .stat-value{
    color:var(--blue);
}

.stat.green .stat-value{
    color:var(--green);
}

.stat.orange .stat-value{
    color:var(--orange);
}

.panel{
    background:rgba(255,255,255,.94);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
    overflow:hidden;
}

.selector{
    padding:20px;
    display:flex;
    align-items:center;
    gap:18px;
}

.selector-label{
    font-size:13px;
    font-weight:800;
    min-width:125px;
}

.select-wrap{
    flex:1;
}

.select{
    width:100%;
    border:1px solid var(--border);
    border-radius:11px;
    padding:12px 14px;
    background:white;
    color:var(--text);
    outline:none;
    transition:.2s;
}

.select:focus,
.input:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 4px rgba(37,99,235,.08);
}

.group-info{
    display:none;
    border-top:1px solid var(--border);
    background:#f8fbff;
    padding:17px 20px;
}

.group-info.show{
    display:flex;
}

.group-info-main{
    flex:1;
}

.group-info-title{
    font-size:16px;
    font-weight:800;
}

.group-info-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.group-info-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.secondary-btn,
.small-primary,
.edit,
.remove,
.danger-btn{
    border-radius:10px;
    padding:9px 12px;
    font-size:12px;
    font-weight:750;
    transition:.2s;
}

.secondary-btn{
    background:white;
    border:1px solid var(--border);
    color:var(--text);
}

.secondary-btn:hover{
    border-color:#bfdbfe;
    color:var(--blue);
}

.small-primary{
    background:#eff6ff;
    border:1px solid #dbeafe;
    color:#1d4ed8;
}

.small-primary:hover{
    background:#dbeafe;
}

.panel-head{
    padding:20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.panel-title{
    font-size:18px;
    font-weight:850;
}

.panel-count{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.panel-tools{
    display:flex;
    align-items:center;
    gap:9px;
}

.input{
    border:1px solid var(--border);
    background:white;
    border-radius:10px;
    padding:10px 13px;
    outline:none;
    transition:.2s;
}

.search{
    width:245px;
}

.list{
    min-height:120px;
}

.student{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    border-bottom:1px solid #eef2f7;
    transition:.18s;
}

.student:last-child{
    border-bottom:0;
}

.student:hover{
    background:#fafcff;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:13px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#dbeafe,#eff6ff);
    color:#1d4ed8;
    font-size:13px;
    font-weight:850;
}

.student-main{
    flex:1;
    min-width:0;
}

.student-name{
    font-weight:800;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.student-meta{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.student-right{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:nowrap;
}

.student-status{
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:750;
    white-space:nowrap;
}

.student-status.active{
    color:#15803d;
    background:#f0fdf4;
    border:1px solid #bbf7d0;
}

.student-status.inactive{
    color:#b91c1c;
    background:#fef2f2;
    border:1px solid #fecaca;
}

.student-status.unknown{
    color:#64748b;
    background:#f8fafc;
    border:1px solid #e2e8f0;
}

.star-badge{
    padding:6px 9px;
    border-radius:8px;
    color:#92400e;
    background:#fffbeb;
    border:1px solid #fde68a;
    font-size:11px;
    font-weight:750;
}

.edit{
    background:white;
    color:#2563eb;
    border:1px solid #bfdbfe;
}

.edit:hover{
    background:#eff6ff;
}

.remove{
    background:white;
    color:#ea580c;
    border:1px solid #fed7aa;
}

.remove:hover{
    background:#fff7ed;
}

.delete{
    background:white;
    color:#dc2626;
    border:1px solid #fecaca;
    border-radius:10px;
    padding:9px 12px;
    font-size:12px;
    font-weight:750;
    transition:.2s;
}

.delete:hover{
    background:#fef2f2;
    border-color:#fca5a5;
}

.empty{
    padding:55px 20px;
    text-align:center;
}

.empty-icon{
    font-size:40px;
    opacity:.7;
}

.empty-title{
    font-size:16px;
    font-weight:800;
    margin-top:10px;
}

.empty-text{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.modal{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(15,23,42,.42);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:520px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:20px;
    box-shadow:0 30px 80px rgba(15,23,42,.25);
    animation:modalIn .2s ease;
}

.modal-card.large{
    width:650px;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(12px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-head{
    padding:21px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-title{
    font-size:18px;
    font-weight:850;
}

.close{
    width:34px;
    height:34px;
    border:0;
    background:#f1f5f9;
    border-radius:9px;
    color:#64748b;
    font-size:20px;
}

.close:hover{
    background:#e2e8f0;
}

.modal-body{
    padding:22px;
}

.form-group{
    margin-bottom:16px;
}

.form-label{
    display:block;
    font-size:12px;
    font-weight:800;
    margin-bottom:7px;
}

.form-input,
.form-select{
    width:100%;
    border:1px solid var(--border);
    border-radius:11px;
    padding:12px 13px;
    outline:none;
    background:white;
}

.form-input:focus,
.form-select:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 4px rgba(37,99,235,.08);
}

.modal-footer{
    padding:16px 22px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:9px;
}

.cancel-btn{
    background:white;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 15px;
    font-weight:700;
}

.save-btn{
    background:var(--blue);
    color:white;
    border:0;
    border-radius:10px;
    padding:10px 17px;
    font-weight:750;
}

.save-btn:hover{
    background:var(--blue-dark);
}

.candidates{
    max-height:380px;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:12px;
}

.candidate{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-bottom:1px solid #eef2f7;
}

.candidate:last-child{
    border-bottom:0;
}

.candidate:hover{
    background:#fafcff;
}

.candidate-check{
    width:18px;
    height:18px;
    accent-color:var(--blue);
}

.candidate-name{
    font-size:13px;
    font-weight:700;
}

.candidate-group{
    color:var(--muted);
    font-size:11px;
    margin-left:auto;
}

.no-candidates{
    padding:30px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.toast-container{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:10000;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:9px;
}

.toast{
    min-width:280px;
    max-width:430px;
    padding:13px 15px;
    border-radius:12px;
    background:#172033;
    color:white;
    box-shadow:0 15px 35px rgba(15,23,42,.2);
    font-size:13px;
    font-weight:650;
    animation:toastIn .25s ease;
}

.toast.error{
    background:#b91c1c;
}

.toast.success{
    background:#166534;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateX(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.error-screen{
    text-align:center;
    padding:50px;
}

.error-screen h2{
    margin-bottom:8px;
}

.error-screen p{
    color:var(--muted);
    margin-bottom:20px;
}
</style>
</head>

<body>

<div id="loadingScreen" class="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">Проверка доступа...</div>
</div>

<header class="header">

    <div class="brand" onclick="goHome()" title="На главную">

        <div class="brand-logo">
            КЖ
        </div>

        <div>
            <div class="brand-title">
                Куратор-журнал
            </div>

            <div class="brand-sub">
                Управление студентами
            </div>
        </div>

    </div>

    <div class="header-right">

        <span id="roleBadge" class="role-badge"></span>

        <div class="clock">
            <div id="currentDate" class="clock-date">
                --
            </div>

            <div id="currentTime" class="clock-time">
                --:--:--
            </div>
        </div>

        <button
            class="home-btn"
            onclick="goHome()"
        >
            ← Главная
        </button>

    </div>

</header>

<main class="container">

    <div class="page-head">

        <div>
            <div class="page-title">
                Студенты
            </div>

            <div class="page-subtitle">
                Управление студентами и учебными группами
            </div>
        </div>

        <button
            class="primary-btn"
            onclick="openAddStudent()"
        >
            ＋ Добавить студента
        </button>

    </div>


    <section class="stats">

        <div class="stat blue">
            <div class="stat-label">
                Всего студентов
            </div>

            <div
                id="totalStudents"
                class="stat-value"
            >
                0
            </div>
        </div>

        <div class="stat green">
            <div class="stat-label">
                Активные
            </div>

            <div
                id="activeStudents"
                class="stat-value"
            >
                0
            </div>
        </div>

        <div class="stat orange">
            <div class="stat-label">
                Учебные группы
            </div>

            <div
                id="totalGroups"
                class="stat-value"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Без группы
            </div>

            <div
                id="withoutGroup"
                class="stat-value"
            >
                0
            </div>
        </div>

    </section>


    <section class="panel">

        <div class="selector">

            <div class="selector-label">
                Учебная группа
            </div>

            <div class="select-wrap">

                <select
                    id="groupSelect"
                    class="select"
                    onchange="selectGroup(this.value)"
                >
                    <option value="">
                        Все студенты
                    </option>
                </select>

            </div>

        </div>

        <div
            id="groupInfo"
            class="group-info"
        ></div>

    </section>


    <section class="panel students-panel">

        <div class="panel-head">

            <div>

                <div
                    id="listTitle"
                    class="panel-title"
                >
                    Все студенты
                </div>

                <div
                    id="listCount"
                    class="panel-count"
                >
                    Загрузка...
                </div>

            </div>

            <div class="panel-tools">

                <input
                    id="studentSearch"
                    class="input search"
                    placeholder="Поиск по ФИО..."
                    oninput="renderStudents()"
                >

                <button
                    id="assignBtn"
                    class="small-primary"
                    onclick="openAssignModal()"
                    style="display:none"
                >
                    ＋ Добавить в группу
                </button>

            </div>

        </div>

        <div
            id="studentsList"
            class="list"
        >
            <div class="empty">
                <div class="loader" style="margin:auto"></div>
            </div>
        </div>

    </section>

</main>


<!-- ДОБАВЛЕНИЕ СТУДЕНТА -->

<div
    id="addModal"
    class="modal"
    onclick="backdropClose(event,'addModal')"
>

    <div class="modal-card">

        <div class="modal-head">

            <div class="modal-title">
                Добавить студента
            </div>

            <button
                class="close"
                onclick="closeModal('addModal')"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label class="form-label">
                    ФИО студента
                </label>

                <input
                    id="addName"
                    class="form-input"
                    type="text"
                    placeholder="Иванов Иван Иванович"
                >

            </div>

            <div class="form-group">

                <label class="form-label">
                    Учебная группа
                </label>

                <select
                    id="addGroup"
                    class="form-select"
                >
                    <option value="">
                        Без группы
                    </option>
                </select>

            </div>

            <div class="form-group">

                <label class="form-label">
                    Статус
                </label>

                <select
                    id="addStatus"
                    class="form-select"
                >
                    <option value="active">
                        Активный
                    </option>

                    <option value="inactive">
                        Неактивный
                    </option>
                </select>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="cancel-btn"
                onclick="closeModal('addModal')"
            >
                Отмена
            </button>

            <button
                class="save-btn"
                onclick="createStudent()"
            >
                Добавить
            </button>

        </div>

    </div>

</div>


<!-- РЕДАКТИРОВАНИЕ -->

<div
    id="editModal"
    class="modal"
    onclick="backdropClose(event,'editModal')"
>

    <div class="modal-card">

        <div class="modal-head">

            <div class="modal-title">
                Изменить данные студента
            </div>

            <button
                class="close"
                onclick="closeModal('editModal')"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <input
                id="editId"
                type="hidden"
            >

            <div class="form-group">

                <label class="form-label">
                    ФИО студента
                </label>

                <input
                    id="editName"
                    class="form-input"
                    type="text"
                >

            </div>

            <div class="form-group">

                <label class="form-label">
                    Учебная группа
                </label>

                <select
                    id="editGroup"
                    class="form-select"
                >
                    <option value="">
                        Без группы
                    </option>
                </select>

            </div>

            <div class="form-group">

                <label class="form-label">
                    Статус
                </label>

                <select
                    id="editStatus"
                    class="form-select"
                >
                    <option value="active">
                        Активный
                    </option>

                    <option value="inactive">
                        Неактивный
                    </option>
                </select>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="cancel-btn"

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getFirestore,

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",

    authDomain:
        "othets-1aa03.firebaseapp.com",

    projectId:
        "othets-1aa03",

    storageBucket:
        "othets-1aa03.firebasestorage.app",

    messagingSenderId:
        "528392191591",

    appId:
        "1:528392191591:web:1e97790e6f9f0a6e175ec2",

    measurementId:
        "G-F50WVZRXZJ"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


let students = [];

let groups = [];

let users = [];

let selectedGroupId = "";

let selectedIds = new Set();

    document.getElementById(id);


/* =========================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================= */

function nameOf(x){

    return (
        x?.fullName ||
        x?.name ||
        x?.fio ||
        x?.displayName ||
        x?.email ||
        "Без имени"
    );

}


function initials(name){

    return String(name)
        .split(/\s+/)
        .filter(Boolean)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase() || "?";

}


function esc(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


function groupById(id){

    return groups.find(
        g => g.id === id
    );

}


function studentGroupName(student){

    return (
        groupById(student.groupId)?.name ||
        "Без группы"
    );

}


function normalizeRole(role){

    if(!role){
        return "";
    }

    return String(role)
        .trim()
        .toLowerCase();

}


function plural(
    number,
    one,
    few,
    many
){

    const n = Math.abs(number) % 100;

    const n1 = n % 10;

    if(n >= 11 && n <= 19){
        return many;
    }

    if(n1 === 1){
        return one;
    }

    if(n1 >= 2 && n1 <= 4){
        return few;
    }

    return many;
}


/* =========================
   НАВИГАЦИЯ ПО РОЛИ
========================= */

window.goHome = () => {

    if(currentRole === "admin"){

        location.href =
            "adminhome.html";

        return;
    }


    if(currentRole === "student"){

        location.href =
            "home.html";

        return;
    }


    location.href =
        "home.html";

};


/* =========================
   АВТОРИЗАЦИЯ
========================= */

function startAuthCheck(){

    onAuthStateChanged(
        auth,
        async user => {

            currentUser = user;


            if(!user){

                location.href =
                    "login.html";

                return;
            }


            try{

                const userSnap =
                    await getDocs(
                        collection(
                            db,
                            "users"
                        )
                    );


                users =
                    userSnap.docs.map(
                        d => ({
                            id:d.id,
                            ...d.data()
                        })
                    );


                let profile =
                    users.find(
                        u => u.id === user.uid
                    );


                if(!profile){

                    profile =
                        users.find(
                            u =>
                                u.uid === user.uid ||
                                u.userId === user.uid ||
                                u.email === user.email
                        );

                }


                currentRole =
                    normalizeRole(
                        profile?.role ||
                        user?.role ||
                        ""
                    );


                /*
                 * STUDENT
                 * → home.html
                 */

                if(
                    currentRole ===
                    "student"
                ){

                    location.href =
                        "home.html";

                    return;
                }


                /*
                 * ADMIN
                 * → остаётся на students.html
                 */

                if(
                    currentRole ===
                    "admin"
                ){

                    $("roleBadge").textContent =
                        "Администратор";

                    $("roleBadge").style.display =
                        "inline-flex";


                    $("loadingScreen")
                        .classList
                        .add("hidden");


                    await loadData();

                    return;
                }


                /*
                 * Неизвестная роль
                 */

                $("loadingScreen").innerHTML = `

                    <div class="error-screen">

                        <h2>
                            Доступ запрещён
                        </h2>

                        <p>
                            Для вашей учётной записи не назначена
                            корректная роль.
                        </p>

                        <button
                            class="primary-btn"
                            onclick="location.href='login.html'"
                        >
                            Вернуться ко входу
                        </button>

                    </div>

                `;


            }catch(error){

                console.error(
                    "Ошибка проверки роли:",
                    error
                );


                $("loadingScreen").innerHTML = `

                    <div class="error-screen">

                        <h2>
                            Ошибка загрузки
                        </h2>

                        <p>
                            ${esc(error.message)}
                        </p>

                        <button
                            class="primary-btn"
                            onclick="location.reload()"
                        >
                            Повторить
                        </button>

                    </div>

                `;

            }

        }
    );

}


/* =========================
   ЧАСЫ
========================= */

function clock(){

    const now =
        new Date();


    $("currentDate").textContent =
        now.toLocaleDateString(
            "ru-RU",
            {
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );


    $("currentTime").textContent =
        now.toLocaleTimeString(
            "ru-RU",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

}


clock();

setInterval(
    clock,
    1000
);


/* =========================
   TOAST
========================= */

function toast(
    message,
    type = "success"
){

    const container =
        $("toastContainer");


    const item =
        document.createElement("div");


    item.className =
        `toast ${type}`;


    item.textContent =
        message;


    container.appendChild(
        item
    );


    setTimeout(
        () => {

            item.style.opacity =
                "0";

            item.style.transform =
                "translateX(20px)";

            setTimeout(
                () => item.remove(),
                250
            );

        },
        3200
    );

}


/* =========================
   MODAL
========================= */

function openModal(id){

    $(id)
        .classList
        .add("show");

}


window.closeModal = id => {

    $(id)
        .classList
        .remove("show");

};


window.backdropClose = (
    event,
    id
) => {

    if(
        event.target.id === id
    ){

        closeModal(id);

    }

};


/* =========================
   ЗАГРУЗКА ДАННЫХ
========================= */

async function loadData(){

    try{

        const [
            studentsSnap,
            groupsSnap
        ] = await Promise.all([

            getDocs(
                collection(
                    db,
                    "students"
                )
            ),

            getDocs(
                collection(
                    db,
                    "groups"
                )
            )

        ]);


        students =
            studentsSnap.docs.map(
                d => ({
                    id:d.id,
                    ...d.data()
                })
            );


        groups =
            groupsSnap.docs.map(
                d => ({
                    id:d.id,
                    ...d.data()
                })
            );


        students.sort(
            (a,b) =>
                nameOf(a)
                    .localeCompare(
                        nameOf(b),
                        "ru"
                    )
        );


        groups.sort(
            (a,b) =>
                String(a.name || "")
                    .localeCompare(
                        String(b.name || ""),
                        "ru"
                    )
        );


        fillGroupSelects();

        renderAll();


    }catch(error){

        console.error(
            "Ошибка загрузки:",
            error
        );


        $("studentsList").innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <div class="empty-title">
                    Не удалось загрузить студентов
                </div>

                <div class="empty-text">
                    ${esc(error.message)}
                </div>

            </div>

        `;


        toast(
            "Ошибка загрузки данных",
            "error"
        );

    }

}


/* =========================
   SELECT ГРУПП
========================= */

function fillGroupSelects(){

    const groupSelect =
        $("groupSelect");


    const addGroup =
        $("addGroup");


    const editGroup =
        $("editGroup");


    const currentValue =
        groupSelect.value;

            Без группы

    `;

            );

                "beforeend",
                `
                    <option value="${esc(group.id)}">

                    </option>
                `
            );


            editGroup.insertAdjacentHTML(
                "beforeend",
                `
                    <option value="${esc(group.id)}">

                    </option>
                `
            );

        }
    );


    if(
        groups.some(
            g => g.id === currentValue
        )
    ){

        groupSelect.value =
            currentValue;

    }

}


/* =========================
   ВЫБОР ГРУППЫ
========================= */

window.selectGroup = id => {

    selectedGroupId =
        id || "";

    selectedIds.clear();

    renderAll();

};


/* =========================
   ОБЩИЙ РЕНДЕР
========================= */

function renderAll(){

    renderStats();

    renderGroupInfo();

    renderStudents();


    $("assignBtn").style.display =
        selectedGroupId
            ? "block"
            : "none";

}


/* =========================
   СТАТИСТИКА
========================= */

function renderStats(){

    const total =
        students.length;


    const active =
        students.filter(
            s =>
                !s.status ||
                s.status === "active"
        ).length;


    const withoutGroup =
        students.filter(
            s => !s.groupId
        ).length;


    $("totalStudents")
        .textContent =
        total;


    $("activeStudents")
        .textContent =
        active;


    $("totalGroups")
        .textContent =
        groups.length;


    $("withoutGroup")
        .textContent =
        withoutGroup;

}


/* =========================
   ИНФОРМАЦИЯ О ГРУППЕ
========================= */

function renderGroupInfo(){

    const box =
        $("groupInfo");


    if(!selectedGroupId){

        box.classList.remove(
            "show"
        );

        box.innerHTML =
            "";

        return;
    }


    const group =
        groupById(
            selectedGroupId
        );


    if(!group){

        box.classList.remove(
            "show"
        );

        return;
    }


    const groupStudents =
        students.filter(
            s =>
                s.groupId ===
                selectedGroupId
        );


    const starosta =
        group.starostaName ||
        students.find(
            s =>
                s.id ===
                group.starostaId
        )?.name ||
        "Не назначен";


    box.innerHTML = `

        <div class="group-info-main">

            <div class="group-info-title">
                ${esc(group.name || "Группа")}
            </div>

            <div class="group-info-meta">

                ${groupStudents.length}
                ${plural(
                    groupStudents.length,
                    "студент",
                    "студента",
                    "студентов"
                )}

                · Староста:
                ${esc(starosta)}

            </div>

        </div>

        <div class="group-info-actions">

            <button
                class="secondary-btn"
                onclick="editGroup()"
            >
                ⚙ Настроить группу
            </button>

        </div>

    `;


    box.classList.add(
        "show"
    );

}


/* =========================
   СПИСОК СТУДЕНТОВ
========================= */

function renderStudents(){

    const list =
        $("studentsList");


    const search =
        String(
            $("studentSearch").value ||
            ""
        )
        .trim()
        .toLowerCase();


    let filtered =
        [...students];


    if(selectedGroupId){

        filtered =
            filtered.filter(
                s =>
                    s.groupId ===
                    selectedGroupId
            );

    }


    if(search){

        filtered =
            filtered.filter(
                s => {

                    const text = [

                        nameOf(s),

                        s.name,

                        s.fullName,

                        s.fio,

                        studentGroupName(s)

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    return text.includes(
                        search
                    );

                }
            );

    }


    const title =
        selectedGroupId
            ? (
                groupById(
                    selectedGroupId
                )?.name ||
                "Группа"
            )
            : "Все студенты";


    $("listTitle")
        .textContent =
        title;


    $("listCount")
        .textContent =
        `${filtered.length} ${plural(
            filtered.length,
            "студент",
            "студента",
            "студентов"
        )}`;


    if(!filtered.length){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🧑‍🎓
                </div>

                <div class="empty-title">
                    Студенты не найдены
                </div>

                <div class="empty-text">
                    Попробуйте изменить параметры поиска
                </div>

            </div>

        `;

        return;
    }


    list.innerHTML =
        filtered.map(
            student => {

                const name =
                    nameOf(student);


                const groupName =
                    studentGroupName(
                        student
                    );


                const status =
                    student.status ||
                    "active";


                const isActive =
                    status !==
                    "inactive";


                const group =
                    groupById(
                        student.groupId
                    );


                const isStarosta =
                    group &&
                    group.starostaId ===
                    student.id;


                return `

                    <div class="student">

                        <div class="avatar">
                            ${esc(
                                initials(name)
                            )}
                        </div>


                        <div class="student-main">

                            <div class="student-name">
                                ${esc(name)}
                            </div>

                            <div class="student-meta">
                                ${esc(groupName)}
                            </div>

                        </div>


                        <div class="student-right">

                            ${
                                isStarosta
                                    ? `
                                        <span class="star-badge">
                                            ★ Староста
                                        </span>
                                      `
                                    : ""
                            }


                            <span
                                class="
                                    student-status
                                    ${
                                        isActive
                                            ? "active"
                                            : "inactive"
                                    }
                                "
                            >
                                ${
                                    isActive
                                        ? "Активный"
                                        : "Неактивный"
                                }
                            </span>


                            <button
                                class="edit"
                                onclick="openEditStudent('${student.id}')"
                            >
                                ✏️ Изменить
                            </button>


                            <button
                                class="delete"
                                onclick="deleteStudent('${student.id}')"
                            >
                                🗑 Удалить
                            </button>


                            ${
                                selectedGroupId
                                    ? `
                                        <button
                                            class="remove"
                                            onclick="removeFromGroup('${student.id}')"
                                        >
                                            Убрать из группы
                                        </button>
                                      `
                                    : ""
                            }

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =========================
   ДОБАВИТЬ СТУДЕНТА
========================= */

window.openAddStudent = () => {

    $("addName").value =
        "";


    $("addStatus").value =

        selectedGroupId || "";


    openModal(
        "addModal"
    );


    setTimeout(
        () =>
            $("addName").focus(),
        100
    );

};


/* =========================
   СОЗДАНИЕ СТУДЕНТА
========================= */

window.createStudent =
    async () => {

        const name =
            $("addName")
                .value
                .trim();


        const groupId =
            $("addGroup").value ||
            null;


        const status =
            $("addStatus").value ||
            "active";


        if(!name){

            toast(
                "Введите ФИО студента",
                "error"
            );

            $("addName").focus();

            return;
        }


        try{

            const now =
                new Date()
                    .toISOString();


            const data = {

                name:name,

                fullName:name,

                groupId:groupId,

                status:status,

                createdAt:now,

                updatedAt:
                    serverTimestamp()

            };


            const ref =
                await addDoc(
                    collection(
                        db,
                        "students"
                    ),
                    data
                );


            students.push({

                id:ref.id,

                ...data,

                updatedAt:
                    new Date()

            });


            students.sort(
                (a,b) =>
                    nameOf(a)
                        .localeCompare(
                            nameOf(b),
                            "ru"
                        )
            );


            closeModal(
                "addModal"
            );


            renderAll();


            toast(
                `Студент «${name}» добавлен`
            );


        }catch(error){

            console.error(
                "Ошибка добавления:",
                error
            );


            toast(
                "Не удалось добавить студента: " +
                error.message,
                "error"
            );

        }

    };


/* =========================
   РЕДАКТИРОВАНИЕ
========================= */

window.openEditStudent =
    id => {

        const student =
            students.find(
                s => s.id === id
            );


        if(!student){

            toast(
                "Студент не найден",
                "error"
            );

            return;
        }


        $("editId").value =
            id;


        $("editName").value =
            nameOf(student);


        $("editGroup").value =
            student.groupId || "";


        $("editStatus").value =
            student.status ||
            "active";


        openModal(
            "editModal"
        );

    };


/* =========================
   СОХРАНЕНИЕ ИЗМЕНЕНИЙ
========================= */

window.saveStudent =
    async () => {

        const id =
            $("editId").value;


        const name =
            $("editName")
                .value
                .trim();


        const groupId =
            $("editGroup").value ||
            null;


        const status =
            $("editStatus").value ||
            "active";


        if(!name){

            toast(
                "Введите ФИО студента",
                "error"
            );

            return;
        }


        const student =
            students.find(
                s => s.id === id
            );


        if(!student){

            toast(
                "Студент не найден",
                "error"
            );

            return;
        }


        try{

            const oldGroupId =
                student.groupId ||
                null;


            const updates = {

                name:name,

                fullName:name,

                groupId:groupId,

                status:status,

                updatedAt:
                    serverTimestamp()

            };


            await updateDoc(
                doc(
                    db,
                    "students",
                    id
                ),
                updates
            );


            /*
             * Если студент был старостой
             * старой группы и его перенесли
             * в другую группу — убираем его
             * как старосту.
             */

            if(
                oldGroupId &&
                oldGroupId !== groupId
            ){

                const oldGroup =
                    groupById(
                        oldGroupId
                    );


                if(
                    oldGroup &&
                    oldGroup.starostaId === id
                ){

                    await updateDoc(
                        doc(
                            db,
                            "groups",
                            oldGroup.id
                        ),
                        {

                            starostaId:null,

                            starostaName:null,

                            updatedAt:
                                serverTimestamp()

                        }
                    );


                    oldGroup.starostaId =
                        null;

                    oldGroup.starostaName =
                        null;

                }

            }


            Object.assign(
                student,
                updates,
                {
                    updatedAt:
                        new Date()
                }
            );


            closeModal(
                "editModal"
            );


            renderAll();


            toast(
                `Данные студента «${name}» сохранены`
            );


        }catch(error){

            console.error(
                "Ошибка сохранения:",
                error
            );


            toast(
                "Не удалось сохранить изменения: " +
                error.message,
                "error"
            );

        }

    };


/* =========================
   УДАЛЕНИЕ СТУДЕНТА
========================= */

window.deleteStudent =
    async id => {

        const student =
            students.find(
                s => s.id === id
            );


        if(!student){

            toast(
                "Студент не найден",
                "error"
            );

            return;
        }


        const studentName =
            nameOf(student);


        const confirmed =
            confirm(
                `Удалить студента «${studentName}»?\n\n` +
                `Запись студента будет удалена из базы данных.\n` +
                `История посещаемости не удаляется автоматически.`
            );


        if(!confirmed){

            return;
        }


        try{

            /*
             * Удаляем документ студента
             */

            await deleteDoc(
                doc(
                    db,
                    "students",
                    id
                )
            );


            /*
             * Если студент был старостой,
             * очищаем старосту в группе.
             */

            const studentGroup =
                groupById(
                    student.groupId
                );


            if(
                studentGroup &&
                studentGroup.starostaId === id
            ){

                await updateDoc(
                    doc(
                        db,
                        "groups",
                        studentGroup.id
                    ),
                    {

                        starostaId:null,

                        starostaName:null,

                        updatedAt:
                            serverTimestamp()

                    }
                );


                studentGroup.starostaId =
                    null;

                studentGroup.starostaName =
                    null;

            }


            /*
             * Удаляем из локального массива
             */

            students =
                students.filter(
                    s => s.id !== id
                );


            /*
             * Убираем из выбранных
             */

            selectedIds.delete(
                id
            );


            /*
             * Обновляем интерфейс
             */

            renderAll();


            toast(
                `Студент «${studentName}» удалён`
            );


        }catch(error){

            console.error(
                "Ошибка удаления студента:",
                error
            );


            toast(
                "Не удалось удалить студента: " +
                error.message,
                "error"
            );

        }

    };


/* =========================
   ДОБАВЛЕНИЕ В ГРУППУ
========================= */

window.openAssignModal =
    () => {

        if(!selectedGroupId){

            toast(
                "Сначала выберите группу",
                "error"
            );

            return;
        }


        selectedIds.clear();


        renderCandidates();


        openModal(
            "assignModal"
        );

    };


/* =========================
   КАНДИДАТЫ
========================= */

window.renderCandidates =
    () => {

        const container =
            $("candidateList");


        const candidates =
            students.filter(
                s =>
                    s.groupId !==
                    selectedGroupId
            );


        if(!candidates.length){

            container.innerHTML = `

                <div class="no-candidates">
                    Нет студентов, которых можно добавить
                    в эту группу.
                </div>

            `;

            return;
        }


        container.innerHTML =
            candidates.map(
                student => {

                    const checked =
                        selectedIds.has(
                            student.id
                        );


                    return `

                        <label class="candidate">

                            <input
                                class="candidate-check"
                                type="checkbox"
                                ${
                                    checked
                                        ? "checked"
                                        : ""
                                }
                                onchange="
                                    toggleCandidate(
                                        '${student.id}',
                                        this.checked
                                    )
                                "
                            >

                            <div>

                                <div class="candidate-name">
                                    ${esc(
                                        nameOf(student)
                                    )}
                                </div>

                            </div>

                            <div class="candidate-group">
                                ${esc(
                                    studentGroupName(
                                        student
                                    )
                                )}
                            </div>

                        </label>

                    `;

                }
            )
            .join("");

    };


/* =========================
   ВЫБОР КАНДИДАТА
========================= */

window.toggleCandidate =
    (id, checked) => {

        if(checked){

            selectedIds.add(
                id
            );

        }else{

            selectedIds.delete(
                id
            );

        }

    };


/* =========================
   НАЗНАЧИТЬ В ГРУППУ
========================= */

window.assignSelected =
    async () => {

        if(!selectedGroupId){

            toast(
                "Группа не выбрана",
                "error"
            );

            return;
        }


        if(!selectedIds.size){

            toast(
                "Выберите хотя бы одного студента",
                "error"
            );

            return;
        }


        try{

            const promises =
                [];


            for(
                const id
                of selectedIds
            ){

                promises.push(

                    updateDoc(
                        doc(
                            db,
                            "students",
                            id
                        ),
                        {

                            groupId:
                                selectedGroupId,

                            updatedAt:
                                serverTimestamp()

                        }
                    )

                );

            }


            await Promise.all(
                promises
            );


            students.forEach(
                student => {

                    if(
                        selectedIds.has(
                            student.id
                        )
                    ){

                        student.groupId =
                            selectedGroupId;

                    }

                }
            );


            const count =
                selectedIds.size;


            selectedIds.clear();


            closeModal(
                "assignModal"
            );


            renderAll();


            toast(
                `${count} ${plural(
                    count,
                    "студент",
                    "студента",
                    "студентов"
                )} добавлено в группу`
            );


        }catch(error){

            console.error(
                "Ошибка добавления в группу:",
                error
            );


            toast(
                "Не удалось добавить студентов: " +
                error.message,
                "error"
            );

        }

    };


/* =========================
   УБРАТЬ ИЗ ГРУППЫ
========================= */

window.removeFromGroup =
    async id => {

        const student =
            students.find(
                s => s.id === id
            );


        if(!student){

            toast(
                "Студент не найден",
                "error"
            );

            return;
        }


        const name =
            nameOf(student);


        const confirmed =
            confirm(
                `Убрать «${name}» из группы?`
            );


        if(!confirmed){

            return;
        }


        try{

            const group =
                groupById(
                    student.groupId
                );


            /*
             * Если студент староста,
             * очищаем старосту.
             */

            if(
                group &&
                group.starostaId === id
            ){

                await updateDoc(
                    doc(
                        db,
                        "groups",
                        group.id
                    ),
                    {

                        starostaId:null,

                        starostaName:null,

                        updatedAt:
                            serverTimestamp()

                    }
                );


                group.starostaId =
                    null;

                group.starostaName =
                    null;

            }


            /*
             * Обновляем студента
             */

            await updateDoc(
                doc(
                    db,
                    "students",
                    id
                ),
                {

                    groupId:null,

                    updatedAt:
                        serverTimestamp()

                }
            );


            student.groupId =
                null;


            renderAll();


            toast(
                `«${name}» убран из группы`
            );


        }catch(error){

            console.error(
                "Ошибка удаления из группы:",
                error
            );


            toast(
                "Не удалось убрать студента из группы: " +
                error.message,
                "error"
            );

        }

    };


/* =========================
   НАСТРОЙКА ГРУППЫ
========================= */

window.editGroup =
    () => {

        if(!selectedGroupId){

            return;
        }


        location.href =
            `groups.html?edit=${encodeURIComponent(
                selectedGroupId
            )}`;

    };


/* =========================
   ESC — ЗАКРЫТИЕ MODAL
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            document
                .querySelectorAll(
                    ".modal.show"
                )
                .forEach(
                    modal =>
                        modal.classList.remove(
                            "show"
                        )
                );

        }

    }
);


/* =========================
   ЗАПУСК
========================= */

startAuthCheck();

</script>

</body>
</html>
