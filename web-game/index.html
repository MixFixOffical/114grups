<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cowboy Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      background: #5f4be8;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ===== Шапка ===== */
    header {
      height: 61px;
      background: #3b2aa8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.01em;
      position: relative;
    }
    .logo::before {
      content: "";
      position: absolute;
      top: -12px;
      right: 2px;
      width: 12px;
      height: 6px;
      border-left: 3px solid #6ccf4a;
      border-bottom: 3px solid #6ccf4a;
      transform: rotate(-45deg);
    }
    .header-right { display: flex; align-items: center; gap: 24px; }
    .btn-outline {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 10px 40px;
      border-radius: 30px;
      cursor: pointer;
    }
    .burger { width: 26px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
    .burger span { height: 3px; background: #fff; border-radius: 2px; }

    /* ===== Основная часть ===== */
    main {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px 24px;
      text-align: center;
    }

    /* Жёлтая фигура в левом верхнем углу */
    .yellow {
      position: absolute;
      top: 0;
      left: 0;
      width: 524px;
      height: 340px;
      background: #ffc540;
      clip-path: polygon(0 0, 94.5% 0, 100% 50%, 0 100%);
      pointer-events: none;
    }

    .main-logo {
      position: relative;
      z-index: 1;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 40px;
    }
    .main-logo::before {
      content: "";
      position: absolute;
      top: -20px;
      right: 8px;
      width: 22px;
      height: 11px;
      border-left: 5px solid #6ccf4a;
      border-bottom: 5px solid #6ccf4a;
      transform: rotate(-45deg);
    }

    h1 {
      position: relative;
      z-index: 1;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 26px;
    }

    .field {
      position: relative;
      z-index: 1;
      width: 200px;
      height: 48px;
      border: none;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #1d1f3a;
      text-align: center;
      outline: none;
      margin-bottom: 24px;
    }
    .field::placeholder { color: #9a9ad0; }
    .field:focus { box-shadow: 0 0 0 3px rgba(108, 207, 74, 0.6); }

    .btn-green {
      position: relative;
      z-index: 1;
      width: 200px;
      height: 48px;
      border: none;
      border-radius: 24px;
      background: #66bb5c;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-green:hover { background: #5aab4f; }
    .btn-green:disabled { opacity: .7; cursor: wait; }

    .message {
      position: relative;
      z-index: 1;
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 700;
    }
    .message.error { color: #ffc540; }
    .message.success { color: #9ef0c4; }

    /* ===== Подвал ===== */
    footer {
      padding: 32px 16px 40px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }
    footer a {
      color: #fff;
      font-weight: 800;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .btn-outline { padding: 8px 24px; }
      .yellow { width: 360px; height: 240px; }
      .main-logo { font-size: 34px; }
      h1 { font-size: 17px; }
      footer { font-size: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Cowboy Quiz</div>
    <div class="header-right">
      <button class="btn-outline" type="button">Выйти</button>
      <div class="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </div>
    </div>
  </header>

  <main>
    <div class="yellow" aria-hidden="true"></div>

    <div class="main-logo">Cowboy Quiz</div>

    <h1 id="title">Введите код для участия в игре</h1>

    <form id="codeForm" novalidate>
      <input class="field" id="codeInput" type="text" inputmode="numeric" maxlength="4" placeholder="квиз код" autocomplete="one-time-code">
      <br>
      <button class="btn-green" id="submitBtn" type="submit">Подключиться</button>
    </form>

    <form id="nameForm" novalidate hidden>
      <input class="field" id="nameInput" type="text" maxlength="20" placeholder="Твой никнейм" autocomplete="nickname">
      <br>
      <button class="btn-green" id="nameBtn" type="submit">Вступить в игру</button>
    </form>

    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>

  <footer>
    Создай свой квиз бесплатно на
    <a href="https://kurator-jurnal.pages.dev/web-game/">Вход в игру</a>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, setDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
      authDomain: "sokrat-7c938.firebaseapp.com",
      projectId: "sokrat-7c938",
      storageBucket: "sokrat-7c938.firebasestorage.app",
      messagingSenderId: "19858604945",
      appId: "1:19858604945:web:244b77bbe5afb849481030",
      measurementId: "G-K06CVPVD15"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CONFIG = { CODE_LENGTH: 4, ADMIN_CODE: "2702", ADMIN_PAGE: "adminhome.html", GAMES: "games" };

    const $ = (id) => document.getElementById(id);
    const codeForm = $("codeForm");
    const nameForm = $("nameForm");
    const codeInput = $("codeInput");
    const nameInput = $("nameInput");
    const submitBtn = $("submitBtn");
    const nameBtn = $("nameBtn");
    const message = $("message");

    let pendingCode = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + (type || "");
    }
    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }
    function setLoading(btn, isLoading, text) {
      btn.disabled = isLoading;
      btn.textContent = isLoading ? "Проверяем…" : text;
    }

    // ===== Шаг 1: код игры =====
    codeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      const code = codeInput.value.replace(/\D/g, "");

      if (code.length < CONFIG.CODE_LENGTH) return showMessage("Введи код игры", "error");
      if (code === CONFIG.ADMIN_CODE) { location.href = CONFIG.ADMIN_PAGE; return; }

      setLoading(submitBtn, true, "Подключиться");
      try {
        const snap = await getDoc(doc(db, CONFIG.GAMES, code));
        if (!snap.exists()) return showMessage("Игра с таким кодом не найдена", "error");

        const status = snap.data().status;
        if (status === "finished" || status === "cancelled") return showMessage("Игра уже завершена", "error");
        if (status === "running") return showMessage("Игра уже идёт", "error");

        pendingCode = code;
        codeForm.hidden = true;
        nameForm.hidden = false;
        $("title").textContent = "Как тебя зовут?";
        clearMessage();
        nameInput.focus();
      } catch (err) {
        console.error(err);
        showMessage("Нет связи с базой, попробуй ещё раз", "error");
      } finally {
        setLoading(submitBtn, false, "Подключиться");
      }
    });

    // ===== Шаг 2: никнейм =====
    nameForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      const name = nameInput.value.trim().replace(/\s+/g, " ");
      if (!name) return showMessage("Введи никнейм", "error");

      setLoading(nameBtn, true, "Вступить в игру");
      try {
        const players = await getDocs(collection(db, CONFIG.GAMES, pendingCode, "players"));
        const taken = players.docs.some((d) => (d.data().name || "").toLowerCase() === name.toLowerCase());
        if (taken) return showMessage("Такой никнейм уже занят", "error");

        const pid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        await setDoc(doc(db, CONFIG.GAMES, pendingCode, "players", pid), {
          name,
          joinedAt: Date.now(),
        });

        sessionStorage.setItem("player", JSON.stringify({ code: pendingCode, pid, name }));
        showMessage("Ты в игре! Поехали!", "success");
        setTimeout(() => { location.href = "game.html"; }, 1000);
      } catch (err) {
        console.error(err);
        showMessage("Не удалось войти, попробуй ещё раз", "error");
        setLoading(nameBtn, false, "Вступить в игру");
      }
    });

    codeInput.focus();
  </script>
</body>
</html>
