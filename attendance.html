<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>Посещаемость</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-width: 1100px;
            zoom: 90%;
        }

        :root {
            --primary: #2454e8;
            --primary-dark: #17348f;
            --primary-light: #eef2ff;
            --teal: #0d9488;
            --teal-light: #ecfdf9;
            --violet: #7c3aed;
            --violet-light: #f4f0ff;
            --amber: #d97706;
            --amber-light: #fef8ec;
            --red: #dc2626;
            --red-light: #fef2f2;
            --slate: #64748b;
            --slate-light: #f1f5f9;

            --text: #0f1729;
            --text-secondary: #5b6478;
            --text-light: #9aa3b5;

            --border: rgba(220, 226, 238, 0.9);

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 1px rgba(15, 23, 42, .03);
            --shadow-md: 0 10px 24px -8px rgba(15, 23, 42, .10), 0 2px 6px rgba(15, 23, 42, .05);
            --shadow-lg: 0 26px 50px -16px rgba(15, 23, 42, .18), 0 8px 18px -10px rgba(15, 23, 42, .09);

            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background:
                radial-gradient(circle at 6% 0%, rgba(36, 84, 232, .06), transparent 40%),
                radial-gradient(circle at 96% 10%, rgba(124, 58, 237, .04), transparent 38%),
                linear-gradient(160deg, #f9fafc 0%, #f4f6fb 45%, #eef1f9 100%);
            background-attachment: fixed;
            color: var(--text);
            overflow-x: auto;
        }

        h1, h2, .title, .week-title, .student-name, .popup-title {
            font-family: "Plus Jakarta Sans", "Inter", sans-serif;
        }

        button {
            font-family: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            border-radius: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
            }
        }

        svg.icon-inline {
            width: 1em;
            height: 1em;
            vertical-align: -0.14em;
            margin-right: 2px;
        }

        /* =====================================
           AUTH GUARD OVERLAY
        ===================================== */

        #authGuardOverlay {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;

            background: linear-gradient(160deg, #f9fafc 0%, #f4f6fb 45%, #eef1f9 100%);
        }

        #authGuardOverlay .auth-spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            animation: authSpin .8s linear infinite;
        }

        #authGuardOverlay .auth-guard-text {
            font-family: "Inter", sans-serif;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        @keyframes authSpin {
            to { transform: rotate(360deg); }
        }

        body.auth-pending > header,
        body.auth-pending > .container {
            display: none !important;
        }

        /* =====================================
           HEADER
        ===================================== */

        header {
            background: linear-gradient(100deg, #131f3d 0%, #1c3577 55%, #2454e8 100%);
            color: white;
            padding: 16px 28px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            width: 100%;
            min-width: 1100px;

            position: sticky;
            top: 0;
            z-index: 50;

            box-shadow: 0 12px 30px -12px rgba(36, 84, 232, .38);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .2);
        }

        .header-logo svg {
            width: 22px;
            height: 22px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.3px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, .78);
        }

        .clock {
            text-align: right;
            flex-shrink: 0;
        }

        .time {
            font-size: 21px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .date {
            font-size: 13px;
            margin-top: 3px;
            color: rgba(255, 255, 255, .78);
        }

        /* =====================================
           CONTAINER
        ===================================== */

        .container {
            width: 1500px;
            min-width: 1500px;

            margin: 24px auto 40px;
            padding: 0 20px;
        }

        /* =====================================
           WEEK PANEL
        ===================================== */

        .week-panel {
            background: rgba(255, 255, 255, .96);
            border: 1px solid var(--border);
            border-radius: 14px;

            padding: 20px 22px;

            box-shadow: var(--shadow-sm);

            margin-bottom: 20px;

            min-width: 1100px;
        }

        .week-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.3px;

            margin-bottom: 16px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .week-title svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        .week-controls {
            display: flex;
            align-items: center;

            gap: 10px;

            flex-wrap: nowrap;

            min-width: 1100px;
        }

        .week-controls button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            border: 1px solid transparent;

            padding: 10px 16px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 13.5px;
            font-weight: 600;

            transition:
                transform .2s var(--ease),
                background .2s ease,
                box-shadow .2s ease;

            white-space: nowrap;

            flex-shrink: 0;
        }

        .week-controls button svg {
            width: 16px;
            height: 16px;
        }

        .week-controls button:hover {
            transform: translateY(-1px);
        }

        .week-controls button:active {
            transform: translateY(0) scale(.97);
        }

        .previous,
        .next {
            background: var(--slate-light);
            color: var(--text);
            border-color: var(--border);
        }

        .previous:hover,
        .next:hover {
            background: #e6eaf2;
        }

        .current {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 18px -6px rgba(36, 84, 232, .45);
        }

        .current:hover {
            background: var(--primary-dark);
        }

        .list-button {
            background: var(--violet-light);
            color: var(--violet);
        }

        .list-button:hover {
            background: #e9e0ff;
        }

        .print-button {
            background: var(--teal-light);
            color: var(--teal);
        }

        .print-button:hover {
            background: #d9f5ef;
        }

        .back {
            margin-left: auto;
            background: var(--slate-light);
            color: var(--text-secondary);
        }

        .back:hover {
            background: #e6eaf2;
            color: var(--text);
        }

        /* =====================================
           WEEK LIST
        ===================================== */

        .week-list {
            display: none;

            margin-top: 15px;

            background: #f7f8fc;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 8px;

            max-height: 320px;

            overflow-y: auto;
        }

        .week-list.show {
            display: block;
            animation: rise .25s var(--ease) both;
        }

        .week-option {
            width: 100%;

            border: none;

            background: white;

            padding: 12px 15px;

            margin-bottom: 5px;

            border-radius: 11px;

            cursor: pointer;

            text-align: left;

            font-size: 14.5px;
            font-weight: 500;

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .week-option:hover {
            background: var(--primary-light);
        }

        .week-option.selected {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .week-option.current-week {
            border-left: 4px solid var(--teal);
        }

        .week-range {
            margin-top: 14px;

            color: var(--text-secondary);

            font-size: 14.5px;
            font-weight: 500;
        }

        /* =====================================
           GROUP SWITCHER / CURATOR SIGNATURE
        ===================================== */

        .group-panel {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;

            padding-bottom: 16px;
            margin-bottom: 16px;

            border-bottom: 1px solid var(--border);
        }

        .group-field {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .group-field-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .group-select {
            height: 40px;
            padding: 0 12px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--slate-light);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .group-select:focus {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .group-static {
            height: 40px;
            display: inline-flex;
            align-items: center;
            padding: 0 14px;
            border-radius: 11px;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 14px;
            font-weight: 700;
        }

        .curator-name-input {
            height: 40px;
            width: 230px;
            padding: 0 12px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
        }

        .curator-name-input:disabled {
            background: var(--slate-light);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .curator-name-input:focus {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .group-panel .empty-groups {
            color: var(--red);
            font-size: 13.5px;
            font-weight: 600;
        }

        /* =====================================
           TABLE
        ===================================== */

        .table-container {
            background: white;

            border: 1px solid var(--border);
            border-radius: 14px;

            box-shadow: var(--shadow-sm);

            overflow-x: auto;
            overflow-y: visible;

            width: 100%;
        }

        table {
            border-collapse: collapse;

            width: 100%;

            min-width: 1000px;

            font-size: 14.5px;
        }

        th {
            background: #1c3577;

            color: white;

            padding: 11px 10px;

            border: 1px solid rgba(255, 255, 255, .12);

            font-weight: 600;

            text-align: center;

            white-space: nowrap;
        }

        th.student-column {
            text-align: left;
            padding-left: 18px;

            min-width: 270px;

            width: 270px;

            position: sticky;

            left: 0;

            z-index: 10;
        }

        td {
            border: 1px solid #e7ebf2;

            text-align: center;

            padding: 7px;

            transition: background .15s ease;
        }

        td.student-cell {
            background: white;

            text-align: left;
            padding-left: 18px;

            position: sticky;

            left: 0;

            z-index: 5;

            min-width: 270px;

            width: 270px;

            box-shadow: 2px 0 6px -2px rgba(15, 23, 42, .06);
        }

        tbody tr:hover td.student-cell {
            background: #fafbff;
        }

        tbody tr:hover td:not(.student-cell):not(.present):not(.absent) {
            background: #fafbff;
        }

        .student-wrapper {
            display: flex;

            align-items: center;

            gap: 10px;

            white-space: nowrap;
        }

        .student-number {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: var(--primary-light);
            color: var(--primary);

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 13px;

            flex-shrink: 0;
        }

        .student-name {
            font-size: 14.5px;
            font-weight: 600;

            white-space: nowrap;
        }

        /* =====================================
           DAYS
        ===================================== */

        .day-header {
            min-width: 100px;
        }

        .day-name {
            font-weight: 700;
        }

        .day-date {
            font-size: 11.5px;

            margin-top: 3px;

            opacity: .85;
            font-weight: 400;
        }

        /* =====================================
           LESSON CELLS
        ===================================== */

        .lesson-cell {
            min-width: 55px;

            height: 45px;

            cursor: pointer;

            transition:
                transform .12s ease,
                box-shadow .12s ease;
        }

        .lesson-cell:hover {
            background: var(--primary-light);
            box-shadow: inset 0 0 0 1.5px rgba(36, 84, 232, .3);
        }

        .present {
            color: #0a7a3d;

            background: #eafbf1;

            font-size: 18px;

            font-weight: 700;
        }

        .absent {
            color: #c0272d;

            background: #fdedee;

            font-size: 17px;

            font-weight: 700;
        }

        .empty-mark {
            color: var(--text-light);
        }

        /* =====================================
           REPORT COLUMNS
        ===================================== */

        th.report-col {
            min-width: 68px;
        }

        th.report-note-col,
        td.report-note-col {
            min-width: 180px;
            max-width: 260px;
        }

        td.report-col {
            font-weight: 700;
            font-size: 14px;
        }

        td.report-total {
            background: var(--slate-light);
            color: var(--text);
        }

        td.report-uv {
            background: var(--teal-light);
            color: var(--teal);
        }

        td.report-neuv {
            background: var(--red-light);
            color: var(--red);
        }

        td.report-note-col {
            font-weight: 400;
            font-size: 13px;
            text-align: left;
            padding-left: 10px;
            color: var(--text-secondary);
            white-space: normal;
        }

        tr.total-row td {
            background: var(--primary-light);
            font-weight: 700;
        }

        tr.total-row td.student-cell {
            color: var(--primary-dark);
        }

        tr.total-row td.report-uv {
            background: var(--teal-light);
            color: var(--teal);
        }

        tr.total-row td.report-neuv {
            background: var(--red-light);
            color: var(--red);
        }

        /* =====================================
           POPUP
        ===================================== */

        .info-popup {
            position: fixed;

            display: none;

            background: white;

            padding: 16px;

            border-radius: 12px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow-lg);

            width: 290px;

            z-index: 1000;

            animation: rise .2s var(--ease) both;
        }

        .popup-title {
            font-weight: 700;

            font-size: 16.5px;

            margin-bottom: 11px;
        }

        .popup-row {
            margin-bottom: 7px;

            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .popup-reason {
            background: var(--slate-light);

            padding: 10px 11px;

            border-radius: 11px;

            margin-top: 10px;

            font-size: 13.5px;
            line-height: 1.5;
        }

        .popup-reason strong {
            color: var(--text);
        }

        /* =====================================
           EMPTY
        ===================================== */

        .empty {
            text-align: center;

            padding: 55px;

            color: var(--text-secondary);

            font-size: 15.5px;
        }

        /* =====================================
           STATUS
        ===================================== */

        .status {
            position: fixed;

            right: 20px;
            bottom: 20px;

            background: #101a30;

            color: white;

            padding: 12px 18px;

            border-radius: 10px;

            font-size: 13.5px;
            font-weight: 600;

            box-shadow: var(--shadow-lg);

            display: none;

            z-index: 3000;
        }

        .status.show {
            display: block;
            animation: rise .25s var(--ease) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================
           MOBILE VIEW
        ===================================== */

        .mobile-only { display: none; }

        @media (max-width: 860px) {

            html, body {
                min-width: 0;
                zoom: 100%;
                overflow-x: hidden;
            }

            header {
                min-width: 0;
                padding: 12px 16px;
            }

            .header-logo { width: 36px; height: 36px; }
            .header-logo svg { width: 19px; height: 19px; }
            .title { font-size: 17px; }
            .subtitle { font-size: 11.5px; }
            .clock { display: none; }

            .container {
                width: 100%;
                min-width: 0;
                margin: 0 auto 24px;
                padding: 0;
            }

            .week-panel,
            .table-container,
            .print-header {
                display: none !important;
            }

            .mobile-only { display: block; }

            /* ---- top bar ---- */

            .mobile-topbar {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 14px;
                background: white;
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                z-index: 40;
            }

            .mobile-group-select {
                flex: 1;
                height: 38px;
                padding: 0 10px;
                border-radius: 9px;
                border: 1px solid var(--border);
                background: var(--slate-light);
                color: var(--text);
                font-size: 13.5px;
                font-weight: 700;
            }

            .mobile-group-static {
                flex: 1;
                font-size: 14.5px;
                font-weight: 700;
                color: var(--text);
            }

            .mobile-icon-btn {
                width: 38px;
                height: 38px;
                flex-shrink: 0;
                border: 1px solid var(--border);
                background: var(--slate-light);
                border-radius: 9px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-secondary);
                cursor: pointer;
            }

            .mobile-icon-btn svg { width: 18px; height: 18px; }

            /* ---- week nav ---- */

            .mobile-week-nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 10px 14px;
                background: white;
                border-bottom: 1px solid var(--border);
            }

            .mobile-week-range {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-secondary);
                text-align: center;
                flex: 1;
            }

            /* ---- day tabs ---- */

            .mobile-day-tabs {
                display: flex;
                gap: 6px;
                padding: 10px 14px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                background: white;
                border-bottom: 1px solid var(--border);
            }

            .mobile-day-tabs::-webkit-scrollbar { display: none; }

            .mobile-day-tab {
                flex-shrink: 0;
                min-width: 52px;
                border: 1px solid var(--border);
                background: var(--slate-light);
                border-radius: 10px;
                padding: 7px 4px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                cursor: pointer;
            }

            .mobile-day-tab .mdt-name {
                font-size: 12px;
                font-weight: 700;
                color: var(--text-secondary);
                text-transform: uppercase;
            }

            .mobile-day-tab .mdt-date {
                font-size: 10.5px;
                color: var(--text-light);
            }

            .mobile-day-tab.active {
                background: var(--primary);
                border-color: var(--primary);
            }

            .mobile-day-tab.active .mdt-name,
            .mobile-day-tab.active .mdt-date {
                color: white;
            }

            /* ---- lesson chips ---- */

            .mobile-lesson-chips {
                display: flex;
                gap: 7px;
                padding: 10px 14px;
                overflow-x: auto;
                background: #f7f8fc;
            }

            .mobile-lesson-chips::-webkit-scrollbar { display: none; }

            .mobile-lesson-chip {
                flex-shrink: 0;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                border: 1px solid var(--border);
                background: white;
                color: var(--text);
                font-weight: 700;
                font-size: 13.5px;
                cursor: pointer;
            }

            .mobile-lesson-chip.active {
                background: var(--primary);
                border-color: var(--primary);
                color: white;
            }

            .mobile-no-lessons {
                padding: 4px 2px;
                color: var(--text-light);
                font-size: 13px;
            }

            /* ---- student list ---- */

            .mobile-student-list {
                padding: 6px 14px 90px;
            }

            .mobile-student-row {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 11px 4px;
                border-bottom: 1px solid #eef1f7;
            }

            .mobile-student-name {
                flex: 1;
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
            }

            .mobile-attendance-buttons {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }

            .mob-btn {
                width: 38px;
                height: 38px;
                border-radius: 10px;
                border: 1.5px solid var(--border);
                background: white;
                color: var(--text-light);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
            }

            .mob-btn:active { transform: scale(.92); }

            .mob-btn svg { width: 18px; height: 18px; }

            .mob-btn.mob-present.active {
                background: var(--teal);
                border-color: var(--teal);
                color: white;
            }

            .mob-btn.mob-absent.active {

        "Понедельник",
        "Вторник",
        "Среда",
        "Четверг",
        "Пятница",
        "Суббота"

    ];

    // =========================================
    // CLOCK
    // =========================================

    function updateClock() {

        const now = new Date();

        document.getElementById("currentTime").textContent =
            now.toLocaleTimeString("ru-RU", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });

        document.getElementById("currentDate").textContent =
            now.toLocaleDateString("ru-RU", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            });
    }

    updateClock();
    setInterval(updateClock, 1000);


    // =========================================
    // DATE FORMAT
    // =========================================

    function formatDate(date) {

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    function normalizeDate(value) {

        if (!value) return "";

        if (typeof value === "object" && typeof value.toDate === "function") {
            return formatDate(value.toDate());
        }

        if (value instanceof Date) {
            return formatDate(value);
        }

        const string = String(value).trim();

        if (/^\d{4}-\d{2}-\d{2}$/.test(string)) {
            return string;
        }

        const ruMatch = string.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);

        if (ruMatch) {
            return `${ruMatch[3]}-${ruMatch[2]}-${ruMatch[1]}`;
        }

        return "";
    }


    function formatDateRu(dateString) {

        const normalized = normalizeDate(dateString);

        if (!normalized) return "—";

        const date = new Date(normalized + "T00:00:00");

        return date.toLocaleDateString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }


    function getMonday(date) {

        const result = new Date(date);
        result.setHours(0, 0, 0, 0);

        let day = result.getDay();
        if (day === 0) day = 7;

        result.setDate(result.getDate() - day + 1);

        return result;
    }


    // =========================================
    // RBAC / ГРУППЫ
    // =========================================

    function toShortFio(fullName) {

        const parts = String(fullName || "")
            .trim()
            .split(/\s+/)
            .filter(Boolean);

        if (parts.length === 0) return "";

        const surname =
            parts[0].charAt(0).toUpperCase() +
            parts[0].slice(1).toLowerCase();

        const initials = parts
            .slice(1, 3)
            .map(w => w.charAt(0).toUpperCase());

        return initials.length
            ? `${surname} ${initials.join(".")}`
            : surname;
    }


    function getCurrentGroup() {
        return userGroups.find(g => g.id === currentGroupId) || null;
    }


    function groupsFromSnapshot(snapshot) {
        return snapshot.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));
    }


    async function loadUserAndGroups() {

        currentUid = auth.currentUser ? auth.currentUser.uid : null;

        if (!currentUid) {
            userRole = null;
            userGroups = [];
            currentGroupId = null;
            return;
        }

        const userSnap = await getDoc(doc(db, "users", currentUid));

        const userData = userSnap.exists() ? userSnap.data() : {};

        userRole = userData.role || "starosta";

        let groupsMap = new Map();

        if (userRole === "admin") {

            const snapshot = await getDocs(collection(db, "groups"));

            groupsFromSnapshot(snapshot)
                .filter(g => g.active !== false)
                .forEach(g => groupsMap.set(g.id, g));

        }
        else if (userRole === "curator") {

            const snapshot = await getDocs(
                query(
                    collection(db, "groups"),
                    where("curatorId", "==", currentUid)
                )
            );

            groupsFromSnapshot(snapshot)
                .filter(g => g.active !== false)
                .forEach(g => groupsMap.set(g.id, g));

        }
        else {

            const [snapA, snapB] = await Promise.all([
                getDocs(
                    query(
                        collection(db, "groups"),
                        where("starostaId", "==", currentUid)
                    )
                ),
                getDocs(
                    query(
                        collection(db, "groups"),
                        where("leaderId", "==", currentUid)
                    )
                )
            ]);

            [...groupsFromSnapshot(snapA), ...groupsFromSnapshot(snapB)]
                .filter(g => g.active !== false)
                .forEach(g => groupsMap.set(g.id, g));
        }

        userGroups = Array.from(groupsMap.values())
            .sort((a, b) =>
                String(a.name || "").localeCompare(String(b.name || ""), "ru")
            );

        const remembered = sessionStorage.getItem("selectedGroupId");

        if (remembered && userGroups.some(g => g.id === remembered)) {
            currentGroupId = remembered;
        }
        else {
            currentGroupId =
                userGroups.length > 0 ? userGroups[0].id : null;
        }
    }


    function renderGroupSwitcher() {

        const slot = document.getElementById("groupSwitcherSlot");
        const mobileSlot = document.getElementById("mobileGroupSlot");
        const curatorInput = document.getElementById("curatorPrintName");

        if (userGroups.length === 0) {

            slot.innerHTML =
                '<span class="empty-groups">Нет доступных групп</span>';

            if (mobileSlot) {
                mobileSlot.innerHTML =
                    '<span class="mobile-group-static">Нет групп</span>';
            }

            curatorInput.value = "";
            curatorInput.disabled = true;
            return;
        }

        const showDropdown =
            userRole === "admin" ||
            userGroups.length > 1;

        if (showDropdown) {

            const optionsHtml = userGroups
                .map(g =>
                    `<option value="${escapeHtml(g.id)}">${escapeHtml(g.name || g.id)}</option>`
                )
                .join("");

            slot.innerHTML =
                `<select class="group-select" id="groupSelect" onchange="switchGroup(this.value)">${optionsHtml}</select>`;

            document.getElementById("groupSelect").value = currentGroupId;

            if (mobileSlot) {

                mobileSlot.innerHTML =

    // =========================================
    // LOAD SETTINGS
    // =========================================

    async function loadSettings() {

        settings = {
            schedule: {},
            disciplines: {},
            bells: {},
            semester1: {},
            semester2: {}
        };

        if (!currentGroupId) return;

        try {

                doc(db, "groupSettings", currentGroupId)
            );

                const data = snapshot.data() || {};

                settings = {
                    schedule: data.schedule || {},

                    bells: data.bells || {},
                    semester1: data.semester1 || {},
                    semester2: data.semester2 || {}
                };

                console.log("📥 groupSettings загружены:", currentGroupId, settings);

            }
            else {
                console.warn("⚠ groupSettings не найдены для", currentGroupId);
            }

        }
        catch (error) {
            console.error("Ошибка загрузки настроек:", error);
            showStatus("Не удалось загрузить настройки");
        }
    }


    // =========================================
    // LOAD STUDENTS
    // =========================================

    async function loadStudents() {

        try {

            students = [];

            if (!currentGroupId) return;

            const group = getCurrentGroup();

            const explicitIds =
                group && Array.isArray(group.studentIds)
                    ? group.studentIds.map(String)
                    : [];


            let byGroupId = [];

            try {

                const snapshot = await getDocs(
                    query(
                        collection(db, "students"),
                        where("groupId", "==", currentGroupId)
                    )
                );

                byGroupId = snapshot.docs.map(d => ({
                    id: d.id,
                    ...d.data()
                }));

            }
            catch (e) {
                console.warn("Фильтр students по groupId не сработал:", e);
                byGroupId = [];
            }


            let byExplicit = [];

            if (explicitIds.length > 0) {

                const fullSnap = await getDocs(collection(db, "students"));

                byExplicit = fullSnap.docs
                    .filter(d => explicitIds.includes(String(d.id)))
                    .map(d => ({
                        id: d.id,
                        ...d.data()
                    }));
            }


            const map = new Map();

            [...byGroupId, ...byExplicit].forEach(s => map.set(s.id, s));

            students = Array.from(map.values());

            students.sort((a, b) =>
                String(a.name || "").localeCompare(String(b.name || ""), "ru")
            );

            console.log(
                "📥 Студентов загружено:",
                students.length,
                "| по groupId:", byGroupId.length,
                "| по studentIds группы:", byExplicit.length
            );

        }
        catch (error) {

            console.error("Ошибка студентов:", error);
            showStatus("Ошибка загрузки студентов");

        }
    }


    function getStudentName(studentId) {

        const student = students.find(
            item => String(item.id) === String(studentId)
        );

        return student ? (student.name || "Без имени") : "Неизвестный студент";
    }


    // =========================================
    // NORMALIZE STATUS
    // =========================================

    function normalizeStatus(status) {

        if (status === null || status === undefined) return "";

        const value = String(status).trim().toLowerCase();

        if (
            value === "present" ||
            value === "присутствовал" ||
            value === "присутствует" ||
            value === "присутствие" ||
            value === "п" ||
            value === "✓"
        ) {
            return "present";
        }

        if (
            value === "absent" ||
            value === "отсутствовал" ||
            value === "отсутствует" ||
            value === "отсутствие" ||
            value === "н"
        ) {
            return "absent";
        }

        return "";
    }


    // =========================================
    // LOAD ATTENDANCE
    // =========================================

    async function loadAttendance() {

        try {

            attendance = {};

            if (!currentGroupId) return;

            if (students.length === 0) {
                console.warn("⚠ Нет студентов — attendance не загружаем");
                return;
            }

            const studentIdsSet = new Set(students.map(s => String(s.id)));

            console.log(
                "🔎 Ищем attendance для студентов:",
                studentIdsSet.size
            );


            const snapshot = await getDocs(collection(db, "attendance"));

            console.log(
                "📦 Всего документов attendance:",
                snapshot.docs.length
            );

            let matched = 0;

            snapshot.forEach(attendanceDoc => {

                const data = attendanceDoc.data();

                if (!data.date || !data.studentId) return;

                const studentId = String(data.studentId);

                if (!studentIdsSet.has(studentId)) return;

                matched++;

                const date = normalizeDate(data.date);
                if (!date) return;

                const studentName =
                    data.studentName || getStudentName(studentId);

                const lessons = data.lessons || {};

                Object.entries(lessons).forEach(([lessonNumber, lessonData]) => {

                    if (!lessonData) return;

                    const status = normalizeStatus(lessonData.status);
                    if (!status) return;

                    const reason =
                        lessonData.reason ||
                        lessonData.comment ||
                        lessonData.description ||
                        "";

                    const absentType = String(lessonData.absentType || "")
                        .trim()
                        .toLowerCase();

                    const key = `${date}_${studentId}_${lessonNumber}`;

                    attendance[key] = {
                        id: attendanceDoc.id,
                        documentId: attendanceDoc.id,
                        date: date,
                        studentId: studentId,
                        studentName: studentName,
                        lesson: String(lessonNumber),
                        status: status,
                        absentType: absentType,
                        reason: String(reason),
                        semester: data.semester || "",
                        attestation: data.attestation || "",
                        updatedAt: data.updatedAt || ""
                    };
                });
            });

            console.log(
                "✅ Совпало документов attendance:",
                matched,
                "| ключей собрано:",
                Object.keys(attendance).length
            );

        }
        catch (error) {
            console.error("Ошибка загрузки посещаемости:", error);
            showStatus("Ошибка загрузки посещаемости");
        }
    }


    // =========================================
    // GET LESSON COUNT
    // =========================================

    function getLessonCount(dayIndex) {

        const schedule = settings.schedule || {};
        const day = days[dayIndex];
        const value = schedule[day];

        if (value === undefined || value === null) return 0;

        if (Array.isArray(value)) return value.length;

        if (typeof value === "object") {
            if (Array.isArray(value.lessons)) return value.lessons.length;
            if (typeof value.count !== "undefined") return Number(value.count) || 0;
        }

        return Number(value) || 0;
    }


    // =========================================

    function getWeekDates() {

        const result = [];

        for (let i = 0; i < 6; i++) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + i);
            result.push(date);
        }

        return result;
    }

    // =========================================
    // RENDER TABLE
    // =========================================

    function renderTable() {

        const wrapper = document.getElementById("tableWrapper");

        if (students.length === 0) {

            wrapper.innerHTML = `
                <div class="empty">
                    Студентов пока нет.
                    <br><br>
                    Добавьте студентов в разделе «Студенты»
                    или проверьте, что группа выбрана правильно.
                </div>
            `;

            const printSheet = document.getElementById("printSheet");
            if (printSheet) printSheet.innerHTML = "";

            return;
        }


        const weekDates = getWeekDates();


        let html = `
            <table>
                <thead>
                    <tr>
                        <th class="student-column" rowspan="2">
                            Список обучающихся
                        </th>
        `;


        weekDates.forEach((date, index) => {

            const count = getLessonCount(index);

            html += `
                <th class="day-header" colspan="${Math.max(count, 1)}">
                    <div class="day-name">${days[index]}</div>
                    <div class="day-date">${formatDateRu(formatDate(date))}</div>
                </th>
            `;
        });


        html += `
                    <th class="day-header report-col" rowspan="2">
                        <div class="day-name">Все Н, ч</div>
                    </th>
                    <th class="day-header report-col report-uv" rowspan="2">
                        <div class="day-name">УВ Н, ч</div>
                    </th>
                    <th class="day-header report-col report-neuv" rowspan="2">
                        <div class="day-name">Неув Н, ч</div>
                    </th>
                    <th class="day-header report-col report-note-col" rowspan="2">
                        <div class="day-name">Примечание</div>
                    </th>
                    </tr>
                    <tr>
        `;


        weekDates.forEach((date, dayIndex) => {

            const count = getLessonCount(dayIndex);

            if (count === 0) {
                html += `<th>—</th>`;
                return;
            }

            for (let lesson = 1; lesson <= count; lesson++) {
                html += `<th>${lesson}</th>`;
            }
        });


        html += `
                    </tr>
                </thead>
                <tbody>
        `;


        let groupAll = 0;
        let groupUv = 0;
        let groupNeuv = 0;


        students.forEach((student, studentIndex) => {

            let studentAll = 0;
            let studentUv = 0;
            let studentNeuv = 0;
            const studentReasons = [];


            html += `
                <tr>
                    <td class="student-cell">
                        <div class="student-wrapper">
                            <div class="student-number">${studentIndex + 1}</div>
                            <div class="student-name">${escapeHtml(student.name || "Без имени")}</div>
                        </div>
                    </td>
            `;


            weekDates.forEach((date, dayIndex) => {

                const dateString = formatDate(date);
                const lessonCount = getLessonCount(dayIndex);

                if (lessonCount === 0) {
                    html += `<td class="lesson-cell empty-mark">—</td>`;
                    return;
                }

                for (let lesson = 1; lesson <= lessonCount; lesson++) {

                    const key = `${dateString}_${student.id}_${lesson}`;
                    const record = attendance[key];

                    let mark = "—";
                    let className = "empty-mark";

                    if (record && record.status === "present") {
                        mark = "✓";
                        className = "present";
                    }

                    if (record && record.status === "absent") {

                        mark = "Н";
                        className = "absent";

                        studentAll += HOURS_PER_LESSON;

                        const reasonText = String(record.reason || "").trim();
                        const absentType = record.absentType || "";

                        const isExcused =
                            absentType === "uv" ||
                            absentType === "bolezn" ||
                            (!absentType && Boolean(reasonText));

                        if (isExcused) {

                            studentUv += HOURS_PER_LESSON;

                            if (reasonText && !studentReasons.includes(reasonText)) {
                                studentReasons.push(reasonText);
                            }

                        }
                        else {
                            studentNeuv += HOURS_PER_LESSON;
                        }
                    }


                    html += `
                        <td class="lesson-cell ${className}" data-record-key="${escapeHtml(key)}">
                            ${mark}
                        </td>
                    `;
                }
            });


            groupAll += studentAll;
            groupUv += studentUv;
            groupNeuv += studentNeuv;


            html += `
                    <td class="report-col report-total">${studentAll}</td>
                    <td class="report-col report-uv">${studentUv}</td>
                    <td class="report-col report-neuv">${studentNeuv}</td>
                    <td class="report-col report-note-col ${studentReasons.length ? "" : "empty-mark"}">
                        ${studentReasons.length ? escapeHtml(studentReasons.join("; ")) : "—"}
                    </td>
                </tr>
            `;
        });


        html += `
                <tr class="total-row">
                    <td class="student-cell"><strong>Итого по группе</strong></td>
        `;


        weekDates.forEach((date, dayIndex) => {

            const count = getLessonCount(dayIndex);
            const slots = Math.max(count, 1);

            for (let i = 0; i < slots; i++) {
                html += `<td class="empty-mark">—</td>`;
            }
        });


        html += `
                    <td class="report-col report-total">${groupAll}</td>
                    <td class="report-col report-uv">${groupUv}</td>
                    <td class="report-col report-neuv">${groupNeuv}</td>
                    <td class="report-col report-note-col empty-mark">—</td>
                </tr>
                </tbody>
            </table>
        `;


        wrapper.innerHTML = html;


        wrapper.querySelectorAll(".lesson-cell").forEach(cell => {
            cell.addEventListener("click", event => {
                showRecordInfo(event, cell);
            });
        });

    }

    async function toggleMobileStatus(studentId, studentName, dateString, lessonNumber, tappedStatus) {

        const key = `${dateString}_${studentId}_${lessonNumber}`;
        const existing = attendance[key];

        const newStatus = (existing && existing.status === tappedStatus)
            ? null
            : tappedStatus;

        try {

            await writeAttendanceStatus(studentId, studentName, dateString, lessonNumber, newStatus);

            if (newStatus === null) {
                delete attendance[key];
            }
            else {
                attendance[key] = {
                    id: existing ? existing.id : "",
                    documentId: existing ? existing.documentId : "",
                    date: dateString,
                    studentId: String(studentId),
                    studentName: studentName,
                    lesson: String(lessonNumber),
                    status: newStatus,
                    absentType: newStatus === "absent" ? "neuv" : "",
                    reason: "",
                    semester: existing ? existing.semester : "",
                    attestation: existing ? existing.attestation : "",
                    updatedAt: new Date().toISOString()
                };
            }

            renderMobileStudentList();
            renderTable();

            showStatus(
                newStatus === null
                    ? "Отметка удалена"
                    : (newStatus === "present" ? "Отмечено: присутствовал" : "Отмечено: отсутствовал")
            );

        }
        catch (error) {
            console.error("Ошибка сохранения отметки:", error);
            showStatus("Не удалось сохранить отметку");
        }
    }


    async function writeAttendanceStatus(studentId, studentName, dateString, lessonNumber, newStatus) {

        const existingSnap = await getDocs(
            query(
                collection(db, "attendance"),
                where("date", "==", dateString),
                where("studentId", "==", String(studentId))
            )
        );

        const lessonField = `lessons.${lessonNumber}`;

        if (!existingSnap.empty) {

            const docRef = doc(db, "attendance", existingSnap.docs[0].id);

            if (newStatus === null) {
                await updateDoc(docRef, {
                    [lessonField]: deleteField(),
                    updatedAt: new Date().toISOString()
                });
            }
            else {
                await updateDoc(docRef, {
                    [lessonField]: {
                        status: newStatus === "present" ? "присутствовал" : "отсутствовал",
                        reason: "",
                        absentType: newStatus === "absent" ? "neuv" : ""
                    },
                    updatedAt: new Date().toISOString()
                });
            }

            return;
        }

        if (newStatus === null) return;

        await addDoc(collection(db, "attendance"), {
            date: dateString,
            studentId: String(studentId),
            studentName: studentName,
            lessons: {
                [lessonNumber]: {
                    status: newStatus === "present" ? "присутствовал" : "отсутствовал",
                    reason: "",
                    absentType: newStatus === "absent" ? "neuv" : ""
                }
            },
            updatedAt: new Date().toISOString()
        });
    }

    // =========================================
    // SHOW RECORD
    // =========================================

    function showRecordInfo(event, cell) {

        const key = cell.dataset.recordKey;
        const record = attendance[key];

        if (!record) {
            hidePopup();
            return;
        }

        const popup = document.getElementById("infoPopup");

        const popupTitleEl = document.getElementById("popupTitle");
        if (record.status === "absent") {
            popupTitleEl.textContent = "Отсутствие";
            popupTitleEl.style.color = "var(--red)";
        }
        else {
            popupTitleEl.textContent = "Присутствие";
            popupTitleEl.style.color = "var(--teal)";
        }

        document.getElementById("popupStudent").textContent =
            "ФИО: " + record.studentName;

        document.getElementById("popupDate").textContent =
            "Дата: " + formatDateRu(record.date);

        document.getElementById("popupLesson").textContent =
            "Пара: " + record.lesson;

        document.getElementById("popupReason").textContent =
            record.reason ||
            (record.status === "absent"
                ? "Причина не указана"
                : "Студент присутствовал");

        popup.style.display = "block";

        const rect = cell.getBoundingClientRect();

        let left = rect.left;
        let top = rect.bottom + 5;

        if (left + 290 > window.innerWidth) left = window.innerWidth - 300;
        if (top + 190 > window.innerHeight) top = rect.top - 195;
        if (left < 5) left = 5;
        if (top < 5) top = 5;

        popup.style.left = left + "px";
        popup.style.top = top + "px";

        event.stopPropagation();
    }


    function hidePopup() {
        document.getElementById("infoPopup").style.display = "none";
    }


    document.addEventListener("click", event => {

        const popup = document.getElementById("infoPopup");

        if (!popup.contains(event.target)) {
            hidePopup();
        }
    });


    // =========================================
    // WEEK NAVIGATION
    // =========================================

    window.previousWeek = function () {
        weekStart.setDate(weekStart.getDate() - 7);
        updateWeekRange();
        renderTable();
        renderWeekList();
        renderMobileAll();
    };


    window.nextWeek = function () {
        weekStart.setDate(weekStart.getDate() + 7);
        updateWeekRange();
        renderTable();
        renderWeekList();
        renderMobileAll();
    };


    window.currentWeek = function () {
        weekStart = getMonday(new Date());
        updateWeekRange();
        renderTable();
        renderWeekList();
        renderMobileAll();
    };


    window.toggleWeekList = function () {

        const list = document.getElementById("weekList");

        list.classList.toggle("show");

        if (list.classList.contains("show")) {
            renderWeekList();
        }
    };


    function renderWeekList() {

        const list = document.getElementById("weekList");

        list.innerHTML = "";

        const currentMonday = getMonday(new Date());

        for (let i = -20; i <= 20; i++) {

            const monday = new Date(currentMonday);
            monday.setDate(monday.getDate() + i * 7);

            const saturday = new Date(monday);
            saturday.setDate(saturday.getDate() + 5);

            const mondayText = formatDateRu(formatDate(monday));
            const saturdayText = formatDateRu(formatDate(saturday));

            const button = document.createElement("button");

            button.className = "week-option";

            if (formatDate(monday) === formatDate(weekStart)) {
                button.classList.add("selected");
            }

            if (i === 0) button.classList.add("current-week");

            button.textContent = i === 0
                ? `Текущая неделя — ${mondayText} — ${saturdayText}`
                : `${mondayText} — ${saturdayText}`;

            button.addEventListener("click", () => selectWeek(monday));

            list.appendChild(button);
        }
    }


    function selectWeek(date) {

        weekStart = getMonday(date);

        updateWeekRange();
        renderTable();
        renderMobileAll();

        document.getElementById("weekList").classList.remove("show");

        renderWeekList();
    }


    // =========================================
    // PRINT
    // =========================================

    function formatShortDate(date, withYear) {

        const dd = String(date.getDate()).padStart(2, "0");
        const mm = String(date.getMonth() + 1).padStart(2, "0");

        if (!withYear) return `${dd}.${mm}`;

        const yy = String(date.getFullYear()).slice(-2);
        return `${dd}.${mm}.${yy}`;
    }


    // =========================================
    // BUILD PRINT SHEET
    // =========================================

    function buildPrintSheet(scaleFactor) {

        const sheet = document.getElementById("printSheet");
        if (!sheet) return;

        const group = getCurrentGroup();

        const printGroupNameEl = document.getElementById("printGroupName");
        if (printGroupNameEl) {
            printGroupNameEl.textContent = group ? (group.name || group.id) : "—";
        }

        const curatorInputEl = document.getElementById("curatorPrintName");

        const table = document.querySelector("#tableWrapper table");

        if (!table || students.length === 0) {
            sheet.innerHTML = "";
            return;
        }

        const weekDates = getWeekDates();
        const lessonCounts = weekDates.map((date, index) => getLessonCount(index));

        const rows = Array.from(
            table.querySelectorAll("tbody tr:not(.total-row)")
        );

        const s = scaleFactor || 1.0;

        const baseRowHeight  = 7.5;
        const baseHeadHeight = 7.0;
        const baseSignHeight = 14;

        const rowHeight  = baseRowHeight  * s;
        const headHeight = baseHeadHeight * s;
        const signHeight = baseSignHeight * s;

        const fontBody  = (11  * s).toFixed(2);
        const fontName  = (11  * s).toFixed(2);
        const fontNum   = (12  * s).toFixed(2);
        const fontSmall = (10  * s).toFixed(2);
        const fontNote  = (9   * s).toFixed(2);
        const fontHead  = (10  * s).toFixed(2);
        const fontLineH = (14.5 * s).toFixed(2);

        let cols =
            '<col style="width:10.92mm">' +
            '<col style="width:59.07mm">';

        lessonCounts.forEach(count => {
            if (count === 0) {
                cols += '<col style="width:21mm">';
            } else {
                cols += "<col>".repeat(count);
            }
        });

        cols +=
            '<col style="width:10.65mm">' +
            '<col style="width:6.83mm">' +
            '<col style="width:10.04mm">' +
            '<col style="width:24.02mm">';

        let head1 = '<th rowspan="2"></th><th rowspan="2">Ф.И.О.</th>';
        let head2 = "";

        weekDates.forEach((date, index) => {
            const count = lessonCounts[index];
            head1 +=
                `<th colspan="${Math.max(count, 1)}">` +
                `${days[index]}<br>${formatShortDate(date, false)}</th>`;

            if (count === 0) {
                head2 += "<th>—</th>";
            } else {
                for (let lesson = 1; lesson <= count; lesson++) {
                    head2 += `<th>${lesson}</th>`;
                }
            }
        });

        head1 +=
            '<th class="sm">Всего</th>' +
            "<th>Ув</th>" +
            '<th class="sm">Неув</th>' +
            "<th>Примечания</th>";

        head2 += "<th></th><th></th><th></th><th></th>";

        let body = "";

        rows.forEach((row, rowIndex) => {

            const nameElement = row.querySelector(".student-name");
            const name = nameElement ? nameElement.textContent.trim() : "";

            let cells = "";
            row.querySelectorAll(".lesson-cell").forEach(cell => {
                const mark = cell.classList.contains("absent") ? "Н" : "";
                cells += `<td class="c-l">${mark}</td>`;
            });

            const readCell = selector => {
                const cell = row.querySelector(selector);
                return cell ? cell.textContent.trim() : "";
            };

            const noteCell = row.querySelector("td.report-note-col");
            const note = (noteCell && !noteCell.classList.contains("empty-mark"))
                ? noteCell.textContent.trim()
                : "";

            body +=
                `<tr style="height:${rowHeight}mm">` +
                `<td class="c-num" style="height:${rowHeight}mm">${rowIndex + 1}.</td>` +
                `<td class="c-name">${escapeHtml(name)}</td>` +
                cells +
                `<td class="c-t">${escapeHtml(readCell("td.report-total"))}</td>` +
                `<td class="c-t">${escapeHtml(readCell("td.report-uv"))}</td>` +
                `<td class="c-t">${escapeHtml(readCell("td.report-neuv"))}</td>` +
                `<td class="c-note">${escapeHtml(note)}</td>` +
                `</tr>`;
        });

        const totalCols =
            2 + lessonCounts.reduce((s, c) => s + Math.max(c, 1), 0) + 4;

        const curatorName = (curatorInputEl && curatorInputEl.value.trim())
            ? curatorInputEl.value.trim()
            : "________________";

        const signatureRow = `
            <tr style="height:${signHeight}mm">
                <td colspan="${totalCols}" class="c-signature">
                    Классный руководитель&nbsp;&nbsp;&nbsp;&nbsp;______________&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="pf-name">${escapeHtml(curatorName)}</span>
                </td>
            </tr>
        `;

        const oldStyle = document.getElementById("ptDynamicStyle");
        if (oldStyle) oldStyle.remove();

        sheet.innerHTML =
            `<table class="pt">` +
                `<colgroup>${cols}</colgroup>` +
                `<thead>
                    <tr style="height:${headHeight}mm">${head1}</tr>
                    <tr style="height:${headHeight}mm">${head2}</tr>
                </thead>` +
                `<tbody>${body}${signatureRow}</tbody>` +
            `</table>`;

        const styleTag = document.createElement("style");
        styleTag.id = "ptDynamicStyle";
        styleTag.textContent = `
            #printSheet table.pt { font-size: ${fontBody}pt; }
            #printSheet table.pt thead th { font-size: ${fontHead}pt; }
            #printSheet table.pt thead th.sm { font-size: ${fontSmall}pt; }
            #printSheet table.pt td.c-num { font-size: ${fontNum}pt; }
            #printSheet table.pt td.c-name { font-size: ${fontName}pt; line-height: ${fontLineH}pt; }
            #printSheet table.pt td.c-l { font-size: ${fontSmall}pt; }
            #printSheet table.pt td.c-t { font-size: ${fontSmall}pt; }
            #printSheet table.pt td.c-note { font-size: ${fontNote}pt; }
            #printSheet table.pt td.c-signature { font-size: ${fontBody}pt; }
        `;
        document.head.appendChild(styleTag);
    }


    // =========================================
    // PRINT REPORT — РАСЧЁТ МАСШТАБА ЗАРАНЕЕ
    // =========================================

    function printReport() {

        const dates = getWeekDates();

        const rangeText =
            `с ${formatShortDate(dates[0], true)}` +
            ` - ${formatShortDate(dates[5], true)}гг`;

        document.getElementById("printHeaderRange").textContent = rangeText;

        // ============================================================
        // Доступная высота таблицы (A4 landscape 210мм):
        //   210 - 10 (верх) - 5 (низ) - 8 (заголовок) - 9 (запас) = 178мм
        //
        // Расход при scale=1.0:
        //   - шапка таблицы (2 строки)  ≈ 14мм
        //   - строка подписи            ≈ 14мм
        //   - N строк студентов × 7.5мм
        // ============================================================

        const AVAILABLE_MM = 178;
        const HEAD_MM  = 14;
        const SIGN_MM  = 14;
        const ROW_MM   = 7.5;

        const studentCount = students.length;
        const neededMm = HEAD_MM + SIGN_MM + studentCount * ROW_MM;

        let scale = 1.0;

        if (neededMm > AVAILABLE_MM) {
            scale = AVAILABLE_MM / neededMm;
        }

        if (scale < 0.55) scale = 0.55;

        console.log(
            "🖨 Студентов:", studentCount,
            "| нужно:", neededMm.toFixed(1), "мм",
            "| доступно:", AVAILABLE_MM, "мм",
            "| масштаб:", scale.toFixed(3)
        );

        buildPrintSheet(scale);

        setTimeout(() => {
            window.print();
        }, 150);
    }


    window.printReport = printReport;


    // =========================================
    // MAIN MENU
    // =========================================

    window.goBack = async function () {

        try {

            const user = auth.currentUser;

            if (!user) {
                window.location.href = "login.html";
                return;
            }

            const userDoc = await getDoc(doc(db, "users", user.uid));

            if (userDoc.exists() && userDoc.data().role === "admin") {
                window.location.href = "adminhome.html";
                return;
            }

            window.location.href = "home.html";

        }
        catch (error) {

            console.error("Ошибка определения роли:", error);
            window.location.href = "home.html";
        }
    };


    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHtml(text) {

        const div = document.createElement("div");
        div.textContent = String(text ?? "");
        return div.innerHTML;
    }


    // =========================================
    // STATUS
    // =========================================

    function showStatus(message) {

        const status = document.getElementById("status");

        status.textContent = message;
        status.classList.add("show");

        setTimeout(() => {
            status.classList.remove("show");
        }, 2500);
    }


    // =========================================
    // START
    // =========================================

    async function start() {

        try {

            weekStart = getMonday(new Date());

            const todayIndex = new Date().getDay();
            mobileDayIndex = (todayIndex >= 1 && todayIndex <= 6) ? todayIndex - 1 : 0;

            await loadUserAndGroups();

            renderGroupSwitcher();

            if (!currentGroupId) {

                document.getElementById("tableWrapper").innerHTML = `
                    <div class="empty">
                        Вам не назначена ни одна группа.
                        <br><br>
                        Обратитесь к администратору для назначения
                        группы (куратор / староста).
                    </div>
                `;

                const mobileList = document.getElementById("mobileStudentList");
                if (mobileList) {
                    mobileList.innerHTML = `
                        <div class="empty">
                            Вам не назначена ни одна группа.
                        </div>
                    `;
                }

                return;
            }

            await loadSettings();
            await loadStudents();
            await loadAttendance();

            updateWeekRange();
            renderTable();
            renderWeekList();
            renderMobileAll();

            const today = formatDate(new Date());
            const info = getAttestationInfo(today);

            if (info) {
                document.getElementById("semesterInfo").textContent =
                    `${info.semester} семестр • Аттестация №${info.attestation}`;
            }
            else {
                document.getElementById("semesterInfo").textContent =
                    "Семестр / аттестация не определены";
            }

        }
        catch (error) {

            console.error("Ошибка запуска:", error);

            document.getElementById("tableWrapper").innerHTML = `
                <div class="empty">
                    Ошибка загрузки данных.
                    <br><br>
                    Откройте консоль браузера (F12 → Console) для подробностей.
                </div>
            `;
        }
    }


    // =========================================
    // ATTESTATION
    // =========================================

    function getAttestationInfo(dateString) {

        const date = new Date(dateString + "T00:00:00");

        const periods = [
            { semester: 1, attestation: 1, period: settings.semester1?.attestation1 },
            { semester: 1, attestation: 2, period: settings.semester1?.attestation2 },
            { semester: 2, attestation: 1, period: settings.semester2?.attestation1 },
            { semester: 2, attestation: 2, period: settings.semester2?.attestation2 }
        ];

        for (const item of periods) {

            if (!item.period?.start || !item.period?.end) continue;

            const start = new Date(item.period.start + "T00:00:00");
            const end = new Date(item.period.end + "T23:59:59");

            if (date >= start && date <= end) {
                return item;
            }
        }

        return null;
    }


    // =========================================
    // AUTH STATE
    // =========================================

    onAuthStateChanged(auth, user => {

        if (!user) {
            console.warn("Пользователь не авторизован. Перенаправление на login.html");
            window.location.href = "login.html";
            return;
        }

        console.log("Авторизован:", user.uid);

        document.body.classList.remove("auth-pending");

        const overlay = document.getElementById("authGuardOverlay");
        if (overlay) overlay.remove();

        start();
    });

</script>
