<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет соединения — Посещаемость</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        background:radial-gradient(circle at 50% 50%,#ffffff 0%,#f5f8ff 55%,#eef4ff 100%);
        color:#0f1729;
    }
    .card{
        max-width:420px;
        width:100%;
        padding:36px 28px;
        background:#fff;
        border-radius:22px;
        box-shadow:0 24px 60px -20px rgba(15,23,42,.22);
        text-align:center;
    }
    .icon{
        width:64px;height:64px;
        display:flex;align-items:center;justify-content:center;
        margin:0 auto 20px;
        border-radius:20px;
        background:linear-gradient(135deg,#fef2f2 0%,#fee2e2 100%);
        color:#dc2626;
    }
    .icon svg{width:30px;height:30px}
    h1{font-size:22px;margin-bottom:10px;letter-spacing:-.5px}
    p{color:#5b6478;font-size:14px;line-height:1.6;margin-bottom:22px}
    button{
        width:100%;
        padding:13px 22px;
        border:none;border-radius:12px;
        font-family:inherit;font-size:14px;font-weight:700;
        background:linear-gradient(135deg,#3b82f6,#2454e8);
        color:#fff;cursor:pointer;
        box-shadow:0 10px 22px -8px rgba(36,84,232,.55);
        transition:transform .2s ease,box-shadow .2s ease;
    }
    button:hover{transform:translateY(-1px);box-shadow:0 14px 30px -8px rgba(36,84,232,.65)}
    button:active{transform:scale(.97)}
</style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22"/>
                <path d="M16.7 11.7A11 11 0 0 0 5 6.3"/>
                <path d="M5 12.5a11 11 0 0 1 4-1.4"/>
                <path d="M10.7 16.1a6 6 0 0 1 3.8.8"/>
                <path d="M8.5 16a11 11 0 0 0-3 1.2"/>
                <path d="M12 20h.01"/>
            </svg>
        </div>
        <h1>Нет соединения</h1>
        <p>Проверьте подключение к интернету и попробуйте снова. Система посещаемости требует подключения для работы с данными.</p>
        <button onclick="window.location.reload()">Обновить страницу</button>
    </div>
</body>
</html>
