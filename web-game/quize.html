<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Игра — Изи квиз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #6c2bd9;
      --purple-dark: #3b0f8c;
      --yellow: #ffd23f;
      --orange: #ff7a1a;
      --green: #5cc26b;
      --white: #ffffff;
      --text-light: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--white);
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 50%, #9b3fe8 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ---------- Анимированный фон ---------- */
    .bg-shapes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .shape {
      position: absolute; border-radius: 50%; opacity: 0.5; filter: blur(2px);
      animation: float 14s ease-in-out infinite;
    }
    .shape.s1 { width: 340px; height: 340px; background: radial-gradient(circle at 30% 30%, var(--orange), #ff4d6d); top: -80px; left: -60px; }
    .shape.s2 { width: 240px; height: 240px; background: radial-gradient(circle at 30% 30%, var(--yellow), var(--orange)); top: 30%; right: -70px; animation-delay: -4s; }
    .shape.s3 { width: 180px; height: 180px; background: radial-gradient(circle at 30% 30%, #c084fc, var(--purple)); bottom: 5%; left: 15%; animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.06); }
      66% { transform: translate(-30px, 25px) scale(0.95); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      0% { opacity: 0; transform: scale(1.8); }
      40% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.7); }
      50% { box-shadow: 0 0 0 14px rgba(255, 210, 63, 0); }
    }

    /* ---------- Шапка ---------- */
    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px clamp(20px, 5vw, 60px);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 22px;
      color: var(--white); text-decoration: none;
    }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: grid; place-items: center; color: var(--purple-dark); font-size: 22px;
      transform: rotate(-6deg);
    }

    main {
      position: relative; z-index: 5;
      max-width: 640px; margin: 0 auto; padding: 10px 20px 60px;
    }

    /* ---------- Экраны ---------- */
    .screen {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .screen h1 {
      font-family: "Unbounded", sans-serif; font-weight: 900;
      font-size: clamp(24px, 4vw, 32px); line-height: 1.15; margin-bottom: 8px;
    }
    .lead { color: var(--text-light); font-size: 16px; line-height: 1.5; margin-bottom: 22px; }
    .quiz-title { color: var(--yellow); font-weight: 800; font-size: 18px; margin-bottom: 6px; }

    input {
      font-family: inherit; font-size: 18px; color: var(--purple-dark);
      background: var(--white); border: 3px solid transparent; border-radius: 14px;
      padding: 14px 16px; outline: none; width: 100%;
      transition: border-color 0.2s ease;
    }
    input:focus { border-color: var(--yellow); }
    input::placeholder { color: #9a8bc4; }

    .btn-primary {
      font-family: inherit; font-weight: 800; font-size: 17px; color: var(--purple-dark);
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      border: none; border-radius: 16px; padding: 16px 30px; cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 122, 26, 0.45);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .btn-primary.small { padding: 14px 20px; font-size: 16px; }

    .error { color: #ffe0a3; font-weight: 700; font-size: 15px; min-height: 20px; margin-top: 12px; }

    .field { margin-bottom: 14px; text-align: left; }

    /* ---------- Ожидание ---------- */
    .waiting-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--yellow); margin: 18px auto 0;
      animation: pulse 1.8s ease-in-out infinite;
    }

    /* ---------- Обратный отсчёт ---------- */
    .count-num {
      font-family: "Unbounded", sans-serif; font-weight: 900;
      font-size: clamp(90px, 22vw, 160px); line-height: 1;
      color: var(--yellow);
      text-shadow: 0 8px 30px rgba(255, 122, 26, 0.5);
      min-height: 1.1em;
    }
    .count-num.pop { animation: pop 0.9s ease both; }
    .count-num.start { font-size: clamp(56px, 14vw, 96px); color: var(--white); }

    /* ---------- Вопрос ---------- */
    .q-progress { font-weight: 800; font-size: 14px; color: var(--text-light); margin-bottom: 14px; }

    .timer-track {
      height: 12px; background: rgba(255, 255, 255, 0.2);
      border-radius: 999px; overflow: hidden; margin-bottom: 8px;
    }
    .timer-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, var(--yellow), var(--orange));
      border-radius: 999px;
    }
    .timer-label {
      font-family: "Unbounded", sans-serif; font-weight: 900;
      font-size: 28px; margin-bottom: 18px;
    }

    .q-text {
      background: var(--white); color: var(--purple-dark);
      border-radius: 20px; padding: 24px 20px; margin-bottom: 20px;
      font-weight: 800; font-size: clamp(19px, 3vw, 24px); line-height: 1.35;
      box-shadow: 0 12px 30px rgba(20, 0, 60, 0.25);
    }

    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt {
      font-family: inherit; font-weight: 700; font-size: 16px; text-align: left;
      color: var(--purple-dark); background: var(--white);
      border: 3px solid transparent; border-radius: 16px; padding: 16px;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 6px 18px rgba(20, 0, 60, 0.2);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--yellow); }
    .opt:disabled { cursor: default; opacity: 0.7; }
    .opt.chosen { border-color: var(--green); opacity: 1; }
    .opt.correct { border-color: var(--green); background: #e9f8ee; opacity: 1; }
    .opt.wrong { border-color: #e0473a; background: #ffe9e6; opacity: 1; }
    .opt-letter {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: grid; place-items: center; font-weight: 900; color: var(--purple-dark);
    }

    .open-row { display: flex; gap: 10px; }
    .open-row input { color: var(--purple-dark); }
    .open-row .btn-primary { white-space: nowrap; }
    .open-row input:disabled { opacity: 0.6; }

    .q-status {
      margin-top: 18px; font-weight: 800; font-size: 17px; color: var(--yellow);
      min-height: 24px;
    }

    @media (max-width: 560px) {
      .screen { padding: 22px; }
      .answers { grid-template-columns: 1fr; }
      .btn-primary { width: 100%; }
      .open-row { flex-direction: column; }
      .logo { font-size: 17px; }
      .logo-mark { width: 34px; height: 34px; font-size: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg-shapes" aria-hidden="true">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
  </div>

  <header>
    <a href="index.html" class="logo"><span class="logo-mark">?</span>Изи квиз</a>
  </header>

  <main>
    <!-- Ввод никнейма -->
    <section class="screen" id="joinScreen" hidden>
      <h1>Войти в игру</h1>
      <div class="quiz-title" id="quizTitleJoin"></div>
      <p class="lead">Придумайте никнейм, под которым вас увидит организатор.</p>
      <div class="field">
        <input type="text" id="nickInput" maxlength="20" placeholder="Например, Мах123" autocomplete="off" />
      </div>
      <button class="btn-primary" id="joinBtn">Войти</button>
      <div class="error" id="joinError"></div>
    </section>

    <!-- Ожидание старта -->
    <section class="screen" id="lobbyScreen" hidden>
      <h1>Вы в игре!</h1>
      <div class="quiz-title" id="quizTitleLobby"></div>
      <p class="lead">Ждём, когда организатор начнёт тест.</p>
      <div class="waiting-dot" aria-hidden="true"></div>
    </section>

    <!-- Обратный отсчёт -->
    <section class="screen" id="countdownScreen" hidden>
      <div class="count-num" id="countNum">5</div>
    </section>

    <!-- Вопрос -->
    <section class="screen" id="questionScreen" hidden>
      <div class="q-progress" id="qProgress"></div>
      <div class="timer-track"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-label" id="timerLabel"></div>
      <div class="q-text" id="qText"></div>
      <div id="qAnswers"></div>
      <div class="q-status" id="qStatus"></div>
    </section>

    <!-- Конец -->
    <section class="screen" id="doneScreen" hidden>
      <h1>Тест завершён!</h1>
      <p class="lead" id="doneText">Спасибо за участие.</p>
    </section>

    <!-- Ошибка -->
    <section class="screen" id="errorScreen" hidden>
      <h1>Не получилось</h1>
      <p class="lead" id="errorText"></p>
      <a class="btn-primary" href="index.html" style="text-decoration:none;display:inline-block">На главную</a>
    </section>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
    authDomain: "sokrat-7c938.firebaseapp.com",
    projectId: "sokrat-7c938",
    storageBucket: "sokrat-7c938.firebasestorage.app",
    messagingSenderId: "19858604945",
    appId: "1:19858604945:web:8ec6dc1a81dba35c481030",
    measurementId: "G-B3SDDN1T50"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const code = new URLSearchParams(location.search).get('code');
  const playerKey = (round) => 'izi_player_' + code + '_' + round;
  const DEFAULT_TIME = 20;
  const LETTERS = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];

  let quiz = null;
  let playerId = null;
  let currentRound = null;
  let playerName = '';
  let started = false;
  let unsubGame = null;
  let timerId = null;
  let qIndex = 0;
  let answered = false;
  let gameOver = false;

  function show(id) {
    ['joinScreen', 'lobbyScreen', 'countdownScreen', 'questionScreen', 'doneScreen', 'errorScreen']
      .forEach((s) => { $(s).hidden = s !== id; });
  }

  function fail(text) {
    $('errorText').textContent = text;
    show('errorScreen');
  }

  /* ---------- Старт: загрузка квиза и игры ---------- */
  async function init() {
    if (!code) {
      fail('Не указан код квиза.');
      return;
    }

    try {
      const quizSnap = await getDoc(doc(db, 'quizzes', code));
      if (!quizSnap.exists()) {
        fail('Квиз с таким кодом не найден.');
        return;
      }
      quiz = quizSnap.data();
      quiz.timeLimit = quiz.timeLimit || DEFAULT_TIME;
      quiz.questions = quiz.questions || [];
      $('quizTitleJoin').textContent = quiz.title;
      $('quizTitleLobby').textContent = quiz.title;

      const gameSnap = await getDoc(doc(db, 'games', code));
      if (!gameSnap.exists()) {
        fail('Организатор ещё не открыл экран ожидания. Попробуйте чуть позже.');
        return;
      }

      currentRound = gameSnap.data().round || 1;
      playerId = sessionStorage.getItem(playerKey(currentRound));

      if (playerId) {
        playerName = sessionStorage.getItem('izi_nickname') || 'Игрок';
        $('lobbyScreen').querySelector('.lead').textContent = `Вы в игре как «${playerName}». Ждём старт.`;
        watchGame();
        show('lobbyScreen');
      } else {
        $('nickInput').value = sessionStorage.getItem('izi_nickname') || '';
        show('joinScreen');
      }
    } catch (err) {
      console.error(err);
      fail('Не удалось загрузить квиз. Проверьте интернет и обновите страницу.');
    }
  }

  /* ---------- Вход в игру ---------- */
  $('joinBtn').addEventListener('click', async () => {
    const name = $('nickInput').value.trim();
    const error = $('joinError');
    if (name.length < 2) { error.textContent = 'Никнейм минимум 2 символа'; return; }
    if (name.length > 20) { error.textContent = 'Никнейм максимум 20 символов'; return; }

    const btn = $('joinBtn');
    btn.disabled = true;
    error.textContent = '';
    try {
      const ref = await addDoc(collection(db, 'games', code, 'rounds', String(currentRound), 'players'), {
        name,
        joinedAt: serverTimestamp()
      });
      playerId = ref.id;
      playerName = name;
      sessionStorage.setItem(playerKey(currentRound), playerId);
      sessionStorage.setItem('izi_nickname', name);
      $('lobbyScreen').querySelector('.lead').textContent = `Вы в игре как «${playerName}». Ждём старт.`;
      watchGame();
      show('lobbyScreen');
    } catch (err) {
      console.error(err);
      error.textContent = 'Не удалось войти в игру. Попробуйте ещё раз';
    } finally {
      btn.disabled = false;
    }
  });

  $('nickInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('joinBtn').click();
  });

  /* ---------- Слежение за статусом игры ---------- */
  function watchGame() {
    unsubGame = onSnapshot(doc(db, 'games', code), (snap) => {
      if (!snap.exists()) return;
      const g = snap.data();
      const round = g.round || 1;

      // Организатор запустил игру заново: сбрасываем экран и просим войти снова
      if (round !== currentRound) {
        currentRound = round;
        resetForNewRound();
      }

      if (g.status === 'finished') {
        if (!gameOver) finish('Организатор завершил тест. Спасибо за участие!');
        return;
      }
      if (g.status === 'running' && !started) {
        started = true;
        runCountdown();
      }
    });
  }

  function resetForNewRound() {
    clearInterval(timerId);
    started = false;
    gameOver = false;
    answered = false;
    playerId = sessionStorage.getItem(playerKey(currentRound));

    if (playerId) {
      $('lobbyScreen').querySelector('.lead').textContent = `Вы в игре как «${playerName}». Ждём старт.`;
      show('lobbyScreen');
    } else {
      $('nickInput').value = sessionStorage.getItem('izi_nickname') || '';
      $('joinError').textContent = '';
      show('joinScreen');
    }
  }

  /* ---------- Обратный отсчёт 5-4-3-2-1-Старт ---------- */
  function runCountdown() {
    show('countdownScreen');
    const el = $('countNum');
    const seq = ['5', '4', '3', '2', '1', 'Старт!'];
    let i = 0;

    const setNum = (text) => {
      el.textContent = text;
      el.classList.toggle('start', text === 'Старт!');
      el.classList.remove('pop');
      void el.offsetWidth; // перезапуск анимации
      el.classList.add('pop');
    };

    setNum(seq[0]);
    const t = setInterval(() => {
      i++;
      if (i >= seq.length) {
        clearInterval(t);
        setTimeout(() => startQuestions(), 800);
        return;
      }
      setNum(seq[i]);
    }, 1000);
  }

  /* ---------- Вопросы ---------- */
  function startQuestions() {
    if (quiz.questions.length === 0) {
      finish();
      return;
    }
    qIndex = 0;
    showQuestion();
  }

  function showQuestion() {
    if (gameOver) return;
    if (qIndex >= quiz.questions.length) {
      finish();
      return;
    }

    const q = quiz.questions[qIndex];
    answered = false;
    show('questionScreen');
    $('qProgress').textContent = `Вопрос ${qIndex + 1} из ${quiz.questions.length}`;
    $('qText').textContent = q.text;
    $('qStatus').textContent = '';

    const box = $('qAnswers');
    box.innerHTML = '';

    if (q.type === 'choice') {
      const grid = document.createElement('div');
      grid.className = 'answers';
      q.options.forEach((opt, j) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.dataset.idx = j;
        const letter = document.createElement('span');
        letter.className = 'opt-letter';
        letter.textContent = LETTERS[j] || String(j + 1);
        b.append(letter, document.createTextNode(opt));
        b.addEventListener('click', () => {
          b.classList.add('chosen');
          submitAnswer(j);
        });
        grid.appendChild(b);
      });
      box.appendChild(grid);
    } else {
      const row = document.createElement('div');
      row.className = 'open-row';
      row.innerHTML = `
        <input type="text" id="openInput" maxlength="120" placeholder="Ваш ответ" autocomplete="off" />
        <button class="btn-primary small" id="openSend">Ответить</button>`;
      box.appendChild(row);
      const input = $('openInput');
      const send = () => {
        const value = input.value.trim();
        if (!value) return;
        submitAnswer(value);
      };
      $('openSend').addEventListener('click', send);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
      setTimeout(() => input.focus(), 50);
    }

    // Время вопроса, если задано организатором, иначе — общее время квиза
    startTimer(q.timeLimit || quiz.timeLimit, () => {
      if (answered) return;
      lockAnswers('Время вышло');
      reveal(undefined, true);
      nextAfterDelay();
    });
  }

  function startTimer(seconds, onEnd) {
    clearInterval(timerId);
    const total = seconds * 1000;
    const endAt = Date.now() + total;
    const bar = $('timerBar');
    const label = $('timerLabel');

    const tick = () => {
      const left = Math.max(0, endAt - Date.now());
      bar.style.width = (left / total * 100) + '%';
      label.textContent = Math.ceil(left / 1000);
      if (left <= 0) {
        clearInterval(timerId);
        onEnd();
      }
    };
    tick();
    timerId = setInterval(tick, 100);
  }

  function isCorrect(q, value) {
    if (q.type === 'choice') return value === q.correct;
    const v = String(value).trim().toLowerCase();
    return q.answers.some((a) => a.trim().toLowerCase() === v);
  }

  function correctText(q) {
    return q.type === 'choice' ? q.options[q.correct] : q.answers[0];
  }

  // Показ правильного ответа — только если организатор включил эту настройку
  function reveal(value, timedOut) {
    if (!quiz.showAnswers) return;
    const q = quiz.questions[qIndex];

    if (q.type === 'choice') {
      document.querySelectorAll('#qAnswers .opt').forEach((b) => {
        const idx = +b.dataset.idx;
        if (idx === q.correct) b.classList.add('correct');
        else if (idx === value) b.classList.add('wrong');
      });
    }

    let msg;
    if (timedOut) msg = `Время вышло. Правильный ответ: ${correctText(q)}`;
    else if (isCorrect(q, value)) msg = 'Верно! ✓';
    else msg = `Неверно. Правильный ответ: ${correctText(q)}`;
    $('qStatus').textContent = msg;
  }

  function lockAnswers(text) {
    answered = true;
    clearInterval(timerId);
    document.querySelectorAll('#qAnswers button, #qAnswers input').forEach((el) => { el.disabled = true; });
    $('qStatus').textContent = text;
  }

  async function submitAnswer(value) {
    if (answered) return;
    lockAnswers('Ответ принят ✓');
    reveal(value, false);

    try {
      // Ответ сохраняется в свою подколлекцию игрока; документ = номер вопроса
      await setDoc(doc(db, 'games', code, 'rounds', String(currentRound), 'players', playerId, 'answers', String(qIndex)), {
        questionIndex: qIndex,
        answer: value,
        answeredAt: serverTimestamp()
      });
    } catch (err) {
      console.error(err);
      $('qStatus').textContent = 'Ответ не сохранился. Проверьте интернет';
    }
    nextAfterDelay();
  }

  function nextAfterDelay() {
    setTimeout(() => {
      qIndex++;
      showQuestion();
    }, quiz.showAnswers ? 3500 : 2000);
  }

  function finish(note) {
    gameOver = true;
    clearInterval(timerId);
    $('doneText').textContent = note || `Спасибо за участие, ${playerName || 'игрок'}!`;
    show('doneScreen');
  }

  window.addEventListener('beforeunload', () => {
    if (unsubGame) unsubGame();
    clearInterval(timerId);
  });

  init();
</script>
</body>
</html>
