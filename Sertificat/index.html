<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сертификаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2430; background: #f4f5f7; }
button, input, select, textarea { font: inherit; color: inherit; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 24px; background: #1f3a5f; color: #fff; }
.brand { font-weight: 700; font-size: 16px; margin-right: auto; }
.top label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.top input { padding: 6px 10px; border: 1px solid #3d5a80; border-radius: 6px; background: #2b4a73; color: #fff; width: 260px; }
.top input::placeholder { color: #9fb3cc; }
#status { font-size: 12px; opacity: .8; }
main { max-width: 1040px; margin: 20px auto; padding: 0 16px; }
.panel { background: #fff; border: 1px solid #e2e5eb; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.sel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #fff; border: 1px solid #e2e5eb; border-radius: 8px; padding: 10px 12px; }
.sel label { font-size: 12px; color: #6b7280; width: 58px; }
.sel select { padding: 6px 8px; border: 1px solid #cfd4dc; border-radius: 6px; min-width: 200px; background: #fff; }
.subj-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.subj-head h2 { margin: 0; font-size: 17px; }
.muted { color: #6b7280; font-size: 13px; }
.warn { color: #b45309; font-size: 13px; }
.btn { padding: 8px 14px; border: 1px solid #cfd4dc; border-radius: 6px; background: #fff; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover { background: #f1f3f6; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: #1f3a5f; border-color: #1f3a5f; color: #fff; }
.btn.primary:hover { background: #2a4d7c; }
.btn.ghost { border-color: transparent; background: transparent; color: #6b7280; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.danger { color: #b91c1c; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eef0f3; vertical-align: middle; }
th { font-size: 12px; color: #6b7280; font-weight: 600; }
td.r { text-align: right; white-space: nowrap; }
td input { padding: 6px 8px; border: 1px solid #cfd4dc; border-radius: 6px; width: 100%; }
td input.gr { width: 90px; }
.hint { font-size: 12px; color: #6b7280; margin-top: 3px; }
.x { border: none; background: none; color: #9ca3af; cursor: pointer; font-size: 14px; padding: 4px 6px; }
.x:hover { color: #b91c1c; }
.row-add { margin-top: 12px; }
details.paste { margin-top: 14px; }
details.paste summary { cursor: pointer; color: #1f3a5f; font-weight: 600; font-size: 13px; }
details.paste textarea { width: 100%; margin: 8px 0; padding: 8px; border: 1px solid #cfd4dc; border-radius: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid #eef0f3; }
#dlg { border: none; border-radius: 10px; padding: 0; width: min(460px, 92vw); box-shadow: 0 20px 50px rgba(0,0,0,.2); }
#dlg::backdrop { background: rgba(15,20,30,.4); }
.dlg { padding: 22px; display: grid; gap: 12px; }
.dlg h3 { margin: 0; font-size: 16px; }
.dlg label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.dlg input, .dlg textarea { padding: 8px 10px; border: 1px solid #cfd4dc; border-radius: 6px; }
.dlg .act { display: flex; justify-content: flex-end; gap: 8px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d2430; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: 1; }
/* Сертификат (рендер в PDF, вне экрана) */
#certStage { position: fixed; left: -10000px; top: 0; width: 1123px; height: 794px; }
.cert { position: relative; width: 1123px; height: 794px; overflow: hidden; text-align: center; background: #fffdf7; color: #1f2330; font-family: "Montserrat", sans-serif; }
.cert-frame { position: absolute; inset: 24px; border: 3px solid #b8913b; padding: 30px 70px; box-shadow: inset 0 0 0 7px #fffdf7, inset 0 0 0 9px #d9b768; }
.cert-inner { height: 100%; display: flex; flex-direction: column; justify-content: center; }
.cert-title { font-family: "Playfair Display", serif; font-size: 60px; font-weight: 700; letter-spacing: 6px; margin: 0; text-transform: uppercase; }
.cert-sub { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: #8a6d2b; margin-top: 4px; }
.cert-text { font-size: 17px; margin: 8px 0; color: #374151; }
.cert-name { font-family: "Playfair Display", serif; font-size: 48px; font-weight: 700; margin: 6px 0 4px; border-bottom: 2px solid #d9b768; display: inline-block; align-self: center; padding: 0 40px 6px; }
.cert-work { font-family: "Playfair Display", serif; font-style: italic; font-size: 26px; color: #3730a3; margin: 6px 0 2px; }
.cert-topic { font-size: 18px; color: #374151; margin: 0 0 10px; }
.cert-grade-label { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #8a6d2b; margin-top: 8px; }
.cert-grade { font-family: "Playfair Display", serif; font-size: 54px; font-weight: 700; color: #b8913b; line-height: 1.1; }
.cert-footer { display: flex; justify-content: space-between; align-items: flex-end; margin: 22px 40px 0; font-size: 14px; color: #374151; }
.sig { width: 240px; }
.sig-name { font-family: "Playfair Display", serif; font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.sig-line { border-top: 1px solid #1f2330; margin-bottom: 6px; }
.seal { width: 90px; height: 90px; border-radius: 50%; color: #fff; font-family: "Playfair Display", serif; font-weight: 700; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #f6e3a6, #d4a84b 70%, #b8913b); }
.cert-number { position: absolute; right: 60px; bottom: 40px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Сертификаты</div>
  <label>Преподаватель <input id="teacher" placeholder="Петрова Анна Сергеевна"></label>
  <span id="status">Подключение…</span>
</header>

<main>
  <div class="bar">
    <div class="sel">
      <label>Группа</label>
      <select id="gSel"></select>
      <button class="btn sm" id="gNew">+ Группа</button>
      <button class="btn sm ghost danger" id="gDel">Удалить</button>
    </div>
    <div class="sel">
      <label>Предмет</label>
      <select id="sSel"></select>
      <button class="btn sm" id="sNew">+ Предмет</button>
      <button class="btn sm ghost" id="sVar">Варианты</button>
      <button class="btn sm ghost danger" id="sDel">Удалить</button>
    </div>
  </div>

  <div class="panel">
    <div class="subj-head" id="subjHead"></div>
    <table id="tbl"></table>
    <div class="row-add"><button class="btn sm" id="stAdd">+ Студент в группу</button></div>
    <details class="paste">
      <summary>Вставить оценки списком</summary>
      <textarea id="paste" rows="4" placeholder="Иванов Иван Иванович 5/3&#10;Петрова Анна Сергеевна 4"></textarea>
      <button class="btn sm" id="pasteBtn">Применить</button>
    </details>
    <div class="actions">
      <button class="btn primary" id="save">Сохранить и создать сертификаты</button>
      <button class="btn" id="dlAll">Скачать PDF по предмету</button>
    </div>
  </div>
</main>

<dialog id="dlg"></dialog>
<div id="certStage"></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const newNum = () => uid().replace(/-/g, "").slice(0, 8).toUpperCase();
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
  const CERT_W = 1123, CERT_H = 794;

  if (!window.FB || !window.FB.configured) { $("#status").textContent = "Нет конфига Firebase"; return; }
  const { db } = window.FB;
  let user = null;
  let state = { teacher: "", groups: [] };
  let ui = { gid: null, sid: null };

  /* ---------- утилиты ---------- */
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 3000);
  }

  function ask(title, html, onOk) {
    const d = $("#dlg");
    d.innerHTML = `<form method="dialog" class="dlg"><h3>${esc(title)}</h3>${html}
      <div class="act"><button class="btn" value="cancel">Отмена</button><button class="btn primary" value="ok">Сохранить</button></div></form>`;
    const f = d.querySelector("form");
    d.onclose = () => { if (d.returnValue === "ok") onOk(new FormData(f)); };
    d.showModal();
    f.querySelector("input, textarea")?.focus();
  }

  function normalizeGrade(v) {
    const t = String(v ?? "").trim().replace(/\s+/g, "").replace(",", ".");
    if (!t) return "";
    return /^\d+(\.\d+)?(\/\d+(\.\d+)?)?$/.test(t) ? t : null;
  }

  function topicFor(s, raw) {
    const v = String(raw ?? "").trim();
    if (!v) return { topic: s.work, label: "" };
    if (/^\d+$/.test(v)) {
      const f = s.variants.find(x => x.num === +v);
      return f ? { topic: f.topic, label: `Вариант ${f.num}` } : null;
    }
    return { topic: v, label: "" };
  }

  const curGroup = () => state.groups.find(g => g.id === ui.gid);
  const curSubject = () => { const g = curGroup(); return g && g.subjects.find(s => s.id === ui.sid); };

  /* ---------- хранение ---------- */
  async function persist() {
    await db.collection("appState").doc(user.uid).set({
      ownerId: user.uid, teacher: state.teacher, groups: state.groups,
      updatedAt: window.FB.serverTimestamp()
    }, { merge: true });
  }

  async function save(msg) {
    try {
      await persist();
      render();
      if (msg) toast(msg);
    } catch (err) {
      toast("Ошибка сохранения: " + err.message);
    }
  }

  // Номер сертификата присваивается при первой оценке с корректным вариантом
  function assignCerts(g, s) {
    g.students.forEach(st => {
      const m = s.marks[st.id];
      if (!m) return;
      if (!m.grade) { delete m.num; return; }
      if (!m.num && topicFor(s, m.variant)) m.num = newNum();
    });
  }

  function countCerts(g, s) {
    return g.students.filter(st => {
      const m = s.marks[st.id];
      return m && m.grade && m.num && topicFor(s, m.variant);
    }).length;
  }

  /* ---------- вход ---------- */
  window.FB.onUser(async u => {
    user = u;
    $("#status").textContent = "Подключено ✓";
    try {
      const snap = await db.collection("appState").doc(user.uid).get();
      const d = snap.exists ? snap.data() : {};
      state = { teacher: d.teacher || "", groups: d.groups || [] };
    } catch (e) {
      toast(/permission/i.test(e.message) ? "Нет прав доступа к Firestore" : "Ошибка загрузки: " + e.message);
    }
    $("#teacher").value = state.teacher;
    render();
  }, err => {
    $("#status").textContent = "Ошибка входа";
    toast("Включите Anonymous в Authentication: " + err.message);
  });

  /* ---------- рендер ---------- */
  function render() {
    if (!user) return;
    if (!curGroup()) ui.gid = state.groups[0]?.id || null;
    const g = curGroup();
    if (!g || !g.subjects.some(s => s.id === ui.sid)) ui.sid = g?.subjects[0]?.id || null;
    const s = curSubject();

    $("#gSel").innerHTML = state.groups.map(x =>
      `<option value="${x.id}" ${x.id === ui.gid ? "selected" : ""}>${esc(x.name)}</option>`).join("") || `<option>Нет групп</option>`;
    $("#sSel").innerHTML = g ? (g.subjects.map(x =>
      `<option value="${x.id}" ${x.id === ui.sid ? "selected" : ""}>${esc(x.name)}</option>`).join("") || `<option>Нет предметов</option>`)
      : `<option>—</option>`;

    ["#gDel", "#sNew", "#stAdd"].forEach(id => $(id).disabled = !g);
    ["#sVar", "#sDel", "#save", "#dlAll", "#pasteBtn"].forEach(id => $(id).disabled = !s);

    if (!g) {
      $("#subjHead").innerHTML = `<span class="muted">Создайте группу кнопкой «+ Группа»</span>`;
      $("#tbl").innerHTML = "";
      return;
    }
    if (!s) {
      $("#subjHead").innerHTML = `<span class="muted">В группе «${esc(g.name)}» нет предметов. Добавьте предмет.</span>`;
      $("#tbl").innerHTML = "";
      return;
    }

    $("#subjHead").innerHTML = `
      <div><h2>${esc(s.name)}</h2><div class="muted">${esc(s.work || "Вид работы не указан")} · ${esc(g.name)} · сертификатов: ${countCerts(g, s)} из ${g.students.length}</div></div>
      <label class="muted">Дата работы <input type="date" id="sDate" value="${esc(s.date || "")}"></label>`;

    if (!g.students.length) {
      $("#tbl").innerHTML = `<tr><td class="muted">В группе нет студентов. Добавьте их кнопкой ниже.</td></tr>`;
      return;
    }
    const rows = g.students.map((st, i) => {
      const m = s.marks[st.id] || {};
      const t = topicFor(s, m.variant);
      let status = `<span class="muted">—</span>`;
      if (m.grade && !t) status = `<span class="warn">нет такого варианта</span>`;
      else if (m.grade && m.num) status = `<span class="muted">№ ${esc(m.num)}</span>`;
      return `<tr data-stid="${st.id}">
        <td>${i + 1}</td>
        <td>${esc(st.name)}</td>
        <td><input class="va" value="${esc(m.variant || "")}" placeholder="№ или тема">
            <div class="hint">${t ? esc((t.label ? t.label + " — " : "") + t.topic) : ""}</div></td>
        <td><input class="gr" value="${esc(m.grade || "")}" placeholder="5/3"></td>
        <td>${status}</td>
        <td class="r">${m.grade && m.num && t ? `<button class="btn sm" data-act="one" data-stid="${st.id}">PDF</button>` : ""}
            <button class="x" data-act="rm" data-stid="${st.id}" title="Удалить студента">✕</button></td>
      </tr>`;
    }).join("");
    $("#tbl").innerHTML = `<thead><tr><th>#</th><th>ФИО</th><th>Вариант / тема</th><th>Оценка</th><th>Сертификат</th><th></th></tr></thead><tbody>${rows}</tbody>`;
  }

  /* ---------- группы, предметы, студенты ---------- */
  $("#gSel").addEventListener("change", e => { ui.gid = e.target.value; ui.sid = null; render(); });
  $("#sSel").addEventListener("change", e => { ui.sid = e.target.value; render(); });

  $("#teacher").addEventListener("change", async e => {
    state.teacher = e.target.value.trim();
    await save(state.teacher ? "Преподаватель сохранён" : "Укажите преподавателя, без него PDF не скачается");
  });

  $("#gNew").addEventListener("click", () => ask("Новая группа", `
    <label>Название группы <input name="name" required placeholder="ИС-21"></label>
    <label>Студенты (каждый с новой строки)<textarea name="students" rows="6" placeholder="Иванов Иван Иванович"></textarea></label>`,
    fd => {
      const name = String(fd.get("name")).trim();
      if (!name) return toast("Введите название группы");
      const students = String(fd.get("students")).split("\n").map(x => x.trim()).filter(Boolean).map(n => ({ id: uid(), name: n }));
      const g = { id: uid(), name, students, subjects: [] };
      state.groups.push(g);
      ui = { gid: g.id, sid: null };
      save(`Группа «${name}» создана`);
    }));

  $("#gDel").addEventListener("click", () => {
    const g = curGroup();
    if (!g || !confirm(`Удалить группу «${g.name}» со всеми предметами и оценками?`)) return;
    state.groups = state.groups.filter(x => x !== g);
    ui = { gid: null, sid: null };
    save("Группа удалена");
  });

  $("#sNew").addEventListener("click", () => ask("Новый предмет", `
    <label>Предмет <input name="name" required placeholder="Информационные технологии"></label>
    <label>Вид работы <input name="work" placeholder="Лабораторная работа №1"></label>
    <label>Дата работы <input name="date" type="date" value="${todayISO()}"></label>
    <label>Варианты (каждая тема с новой строки, необязательно)<textarea name="variants" rows="4"></textarea></label>`,
    fd => {
      const name = String(fd.get("name")).trim();
      if (!name) return toast("Введите название предмета");
      const g = curGroup();
      const variants = String(fd.get("variants")).split("\n").map(x => x.trim()).filter(Boolean).map((topic, i) => ({ num: i + 1, topic }));
      const s = { id: uid(), name, work: String(fd.get("work")).trim(), date: fd.get("date") || todayISO(), variants, marks: {} };
      g.subjects.push(s);
      ui.sid = s.id;
      save(`Предмет «${name}» добавлен`);
    }));

  $("#sVar").addEventListener("click", () => {
    const s = curSubject();
    ask(`Варианты: ${s.name}`, `
      <label>Темы вариантов (каждая с новой строки, номер = порядок)
        <textarea name="v" rows="8">${esc(s.variants.map(v => v.topic).join("\n"))}</textarea></label>`,
      fd => {
        s.variants = String(fd.get("v")).split("\n").map(x => x.trim()).filter(Boolean).map((topic, i) => ({ num: i + 1, topic }));
        save("Варианты сохранены");
      });
  });

  $("#sDel").addEventListener("click", () => {
    const g = curGroup(), s = curSubject();
    if (!s || !confirm(`Удалить предмет «${s.name}» и его оценки?`)) return;
    g.subjects = g.subjects.filter(x => x !== s);
    ui.sid = null;
    save("Предмет удалён");
  });

  $("#stAdd").addEventListener("click", () => ask("Новый студент", `
    <label>ФИО <input name="name" required placeholder="Иванов Иван Иванович"></label>`,
    fd => {
      const name = String(fd.get("name")).trim();
      if (!name) return toast("Введите ФИО");
      curGroup().students.push({ id: uid(), name });
      save("Студент добавлен");
    }));

  $("#subjHead").addEventListener("change", e => {
    if (e.target.id !== "sDate") return;
    curSubject().date = e.target.value;
    save();
  });

  $("#tbl").addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const g = curGroup(), s = curSubject();
    if (b.dataset.act === "one") {
      const st = g.students.find(x => x.id === b.dataset.stid);
      return downloadPdf(certList(g, s, st.id), `Сертификат — ${st.name}.pdf`, b);
    }
    if (b.dataset.act === "rm") {
      const st = g.students.find(x => x.id === b.dataset.stid);
      if (!confirm(`Удалить студента «${st.name}» из группы?`)) return;
      g.students = g.students.filter(x => x !== st);
      save("Студент удалён");
    }
  });

  /* ---------- оценки ---------- */
  // Читает оценки и варианты из таблицы; возвращает либо строки, либо ошибку
  function readRows(g) {
    const rows = [];
    for (const tr of $("#tbl").querySelectorAll("tr[data-stid]")) {
      const grInp = tr.querySelector(".gr");
      const grade = normalizeGrade(grInp.value);
      if (grade === null) return { error: grInp.value };
      rows.push({ stid: tr.dataset.stid, grade, variant: tr.querySelector(".va").value.trim() });
    }
    return { rows };
  }

  $("#save").addEventListener("click", () => {
    const g = curGroup(), s = curSubject();
    const r = readRows(g);
    if (r.error !== undefined) return toast(`Неверная оценка: ${r.error}`);
    r.rows.forEach(x => {
      const m = s.marks[x.stid] || (s.marks[x.stid] = {});
      m.grade = x.grade;
      m.variant = x.variant;
    });
    assignCerts(g, s);
    const n = countCerts(g, s);
    save(`Сохранено. Сертификатов по предмету: ${n}` + (state.teacher ? "" : " (укажите преподавателя для PDF)"));
  });

  $("#tbl").addEventListener("keydown", e => {
    if (e.key !== "Enter" || !e.target.matches("input")) return;
    e.preventDefault();
    const inputs = [...$("#tbl").querySelectorAll("input")];
    const next = inputs[inputs.indexOf(e.target) + 1];
    if (next) next.focus(); else $("#save").click();
  });
  $("#tbl").addEventListener("focusin", e => { if (e.target.matches("input")) e.target.select(); });

  $("#pasteBtn").addEventListener("click", () => {
    const g = curGroup(), s = curSubject();
    let ok = 0;
    const miss = [];
    $("#paste").value.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
      let name, grade;
      if (line.includes("\t")) [name, grade] = line.split("\t");
      else if (line.includes(";")) [name, grade] = line.split(";");
      else {
        const i = line.lastIndexOf(" ");
        if (i < 0) { miss.push(line); return; }
        name = line.slice(0, i);
        grade = line.slice(i + 1);
      }
      const st = g.students.find(x => x.name.trim().toLowerCase() === (name || "").trim().toLowerCase());
      const v = normalizeGrade((grade || "").trim());
      if (!st || !v) { miss.push(line); return; }
      (s.marks[st.id] || (s.marks[st.id] = {})).grade = v;
      ok++;
    });
    assignCerts(g, s);
    $("#paste").value = "";
    save(`Вставлено оценок: ${ok}` + (miss.length ? `, не найдено: ${miss.length}` : ""));
  });

  /* ---------- PDF ---------- */
  // Сертификат собирается из текущих данных: группа, предмет, дата, преподаватель, оценка, номер
  function certList(g, s, onlyId) {
    return g.students
      .filter(st => !onlyId || st.id === onlyId)
      .map(st => {
        const m = s.marks[st.id];
        const t = m && m.grade && m.num ? topicFor(s, m.variant) : null;
        if (!t) return null;
        return {
          studentName: st.name, groupName: g.name, grade: m.grade,
          workTitle: s.work, subject: s.name, topic: t.topic, variantLabel: t.label,
          date: fmtDate(s.date) || fmtDate(todayISO()), teacher: state.teacher.trim(), number: m.num
        };
      })
      .filter(Boolean);
  }

  async function downloadPdf(list, fileName, btn) {
    if (!state.teacher.trim()) return toast("Укажите имя преподавателя вверху страницы");
    if (!list.length) return toast("Нет сертификатов для скачивания");
    const label = btn ? btn.textContent : null;
    if (btn) { btn.disabled = true; btn.textContent = "…"; }
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "landscape", unit: "px", format: [CERT_W, CERT_H], compress: true });
      for (let i = 0; i < list.length; i++) {
        const canvas = await renderCanvas(list[i]);
        if (i > 0) pdf.addPage([CERT_W, CERT_H], "landscape");
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, CERT_W, CERT_H, undefined, "FAST");
      }
      pdf.save(fileName);
    } catch (err) {
      toast("Ошибка PDF: " + err.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = label; }
    }
  }

  async function renderCanvas(d) {
    const stage = $("#certStage");
    stage.innerHTML = certificateHTML(d);
    try {
      await Promise.all([
        document.fonts.load('700 60px "Playfair Display"'),
        document.fonts.load('400 20px "Montserrat"'),
        document.fonts.load('700 20px "Montserrat"')
      ]);
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      return await window.html2canvas(stage.querySelector(".cert"), {
        scale: 2, backgroundColor: "#fffdf7", useCORS: true, logging: false,
        width: CERT_W, height: CERT_H, windowWidth: CERT_W, windowHeight: CERT_H,
        x: 0, y: 0, scrollX: 0, scrollY: 0
      });
    } finally {
      stage.innerHTML = "";
    }
  }

  $("#dlAll").addEventListener("click", () => {
    const g = curGroup(), s = curSubject();
    downloadPdf(certList(g, s), `Сертификаты — ${g.name} — ${s.name}.pdf`, $("#dlAll"));
  });

  function certificateHTML(d) {
    return `
    <div class="cert">
      <div class="cert-frame"><div class="cert-inner">
        <h1 class="cert-title">Сертификат</h1>
        <div class="cert-sub">о выполнении учебной работы</div>
        <p class="cert-text" style="margin-top:18px">Настоящим подтверждается, что</p>
        <div class="cert-name">${esc(d.studentName)}</div>
        <p class="cert-text">студент(ка) группы <b>${esc(d.groupName)}</b> успешно выполнил(а) работу</p>
        <div class="cert-work">«${esc(d.workTitle)}»</div>
        <p class="cert-topic">${d.variantLabel ? esc(d.variantLabel) + ": " : ""}${esc(d.topic)}</p>
        <p class="cert-text">по предмету <b>${esc(d.subject)}</b></p>
        <div class="cert-grade-label">Оценка</div>
        <div class="cert-grade">${esc(d.grade)}</div>
        <div class="cert-footer">
          <div class="sig"><div class="sig-name">${esc(d.teacher)}</div><div class="sig-line"></div>Преподаватель</div>
          <div class="seal"><span>CERT</span></div>
          <div class="sig"><div class="sig-line"></div>Дата: ${esc(d.date)}</div>
        </div>
        <div class="cert-number">№ ${esc(d.number)}</div>
      </div></div>
    </div>`;
  }
})();
</script>
</body>
</html>
