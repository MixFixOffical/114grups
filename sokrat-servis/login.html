<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fc">
  <title>Вход — СОКРАТ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --text: #172033;
      --muted: #778198;
      --border: #e3e9f3;
      --bg: #f4f7fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 10% 10%, #dbeafe 0, transparent 34%),
        radial-gradient(circle at 90% 90%, #e0e7ff 0, transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    button, input { font: inherit; }

    .container { width: 100%; max-width: 450px; }

    .brand { text-align: center; margin-bottom: 24px; }

    .logo {
      display: inline-flex;
      width: 58px;
      height: 58px;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      color: white;
      font-size: 25px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 9px 24px #2563eb35;
    }

    .brand h1 {
      margin: 14px 0 6px;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .card {
      padding: 29px;
      background: #fff;
      border: 1px solid #e8edf5;
      border-radius: 22px;
      box-shadow: 0 18px 55px #1e293b0b;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      margin-bottom: 26px;
      border-radius: 12px;
      background: #f1f5f9;
    }

    .tab {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #64748b;
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      color: var(--blue);
      background: white;
      box-shadow: 0 2px 7px #0f172a0d;
    }

    h2 {
      margin: 0 0 7px;
      font-size: 21px;
      letter-spacing: -.5px;
    }

    .description {
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .field { margin-bottom: 17px; }

    label.field-label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
    }

    .input-wrap { position: relative; }

    .field input {
      width: 100%;
      min-height: 47px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: white;
      color: var(--text);
      font-size: 13px;
    }

    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #2563eb15;
    }

    .field input::placeholder { color: #a0a9ba; }

    .password-input { padding-right: 72px !important; }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 3px 0 21px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #64748b;
    }

    .remember input, .terms input { accent-color: var(--blue); }

    .text-button {
      padding: 0;
      border: 0;
      background: none;
      color: var(--blue);
      font-size: 12px;
      cursor: pointer;
    }

    .submit {
      width: 100%;
      min-height: 49px;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      color: white;
      background: var(--blue);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .submit:hover { background: var(--blue-dark); }
    .submit:disabled { opacity: .65; cursor: wait; }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 13px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .message.info {
      display: block;
      color: #1d4ed8;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .hint {
      margin: -7px 0 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 5px 0 20px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.6;
    }

    .terms input { margin-top: 3px; }

    .footer {
      margin-top: 20px;
      color: #8a94a7;
      font-size: 11px;
      line-height: 1.8;
      text-align: center;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .card { padding: 23px 19px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="brand">
      <div class="logo">С</div>
      <h1>СОКРАТ</h1>
      <p>Сервис мониторинга выполнения задач<br>учебной части</p>
    </header>

    <section class="card">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">Вход</button>
        <button class="tab" id="registerTab" type="button">Регистрация</button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="loginForm">
        <h2>С возвращением!</h2>
        <p class="description">Войдите в свою учётную запись СОКРАТ.</p>

        <div class="field">
          <label class="field-label" for="loginEmail">Электронная почта</label>
          <input id="loginEmail" name="email" type="email"
            autocomplete="email" maxlength="254"
            placeholder="name@example.com" required>
        </div>

        <div class="field">
          <label class="field-label" for="loginPassword">Пароль</label>
          <div class="input-wrap">
            <input id="loginPassword" class="password-input"
              type="password" name="password"
              autocomplete="current-password"
              placeholder="Введите пароль" required>
            <button class="toggle" type="button" data-target="loginPassword">Показать</button>
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="rememberMe" checked>
            Запомнить вход
          </label>
          <button type="button" class="text-button" id="forgotPassword">
            Забыли пароль?
          </button>
        </div>

        <button class="submit" id="loginSubmit" type="submit">Войти в систему</button>
      </form>

      <form id="registerForm" class="hidden">
        <h2>Создание аккаунта</h2>
        <p class="description">Заполните данные для регистрации.</p>

        <div class="field">
          <label class="field-label" for="regFullName">ФИО</label>
          <input id="regFullName" name="full_name"
            autocomplete="name" minlength="2" maxlength="120"
            placeholder="Иванов Иван Иванович" required>
        </div>

        <div class="field">
          <label class="field-label" for="regEmail">Электронная почта</label>
          <input id="regEmail" name="email" type="email"
            autocomplete="email" maxlength="254"
            placeholder="name@example.com" required>
        </div>

        <div class="field">
          <label class="field-label" for="regPassword">Пароль</label>
          <div class="input-wrap">
            <input id="regPassword" class="password-input"
              name="password" type="password" minlength="6"
              autocomplete="new-password" placeholder="Не менее 6 символов" required>
            <button class="toggle" type="button" data-target="regPassword">Показать</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="regPasswordConfirm">Повторите пароль</label>
          <div class="input-wrap">
            <input id="regPasswordConfirm" class="password-input"
              name="password_confirm" type="password" minlength="6"
              autocomplete="new-password" placeholder="Введите пароль ещё раз" required>
            <button class="toggle" type="button" data-target="regPasswordConfirm">Показать</button>
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" id="acceptTerms" required>
          <span>Я согласен с условиями использования и обработкой данных для работы сервиса СОКРАТ.</span>
        </label>

        <button class="submit" id="registerSubmit" type="submit">Создать аккаунт</button>
      </form>
    </section>

    <footer class="footer">
      <strong>СОКРАТ</strong> · Система управления задачами<br>
      Защищённый доступ к рабочему пространству
    </footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
      authDomain: "sokrat-7c938.firebaseapp.com",
      projectId: "sokrat-7c938",
      storageBucket: "sokrat-7c938.firebasestorage.app",
      messagingSenderId: "19858604945",
      appId: "1:19858604945:web:8ec6dc1a81dba35c481030",
      measurementId: "G-B3SDDN1T50"
    };

    const DASHBOARD_URL = "adminhome.html";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $ = id => document.getElementById(id);
    const loginForm = $("loginForm");
    const registerForm = $("registerForm");
    const message = $("message");

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function showTab(tab) {
      clearMessage();
      const login = tab === "login";
      loginForm.classList.toggle("hidden", !login);
      registerForm.classList.toggle("hidden", login);
      $("loginTab").classList.toggle("active", login);
      $("registerTab").classList.toggle("active", !login);
    }

    $("loginTab").addEventListener("click", () => showTab("login"));
    $("registerTab").addEventListener("click", () => showTab("register"));

    document.querySelectorAll(".toggle").forEach(button => {
      button.addEventListener("click", () => {
        const input = $(button.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.textContent = show ? "Скрыть" : "Показать";
      });
    });

    function setLoading(button, loading, normalText) {
      button.disabled = loading;
      button.textContent = loading ? "Подождите..." : normalText;
    }

    // Перевод кодов ошибок Firebase на русский
    function translateAuthError(code) {
      const map = {
        "auth/invalid-email": "Некорректный адрес электронной почты.",
        "auth/user-disabled": "Учётная запись отключена.",
        "auth/user-not-found": "Пользователь с такой почтой не найден.",
        "auth/wrong-password": "Неверный пароль.",
        "auth/invalid-credential": "Неверный email или пароль.",
        "auth/invalid-login-credentials": "Неверный email или пароль.",
        "auth/email-already-in-use": "Этот адрес электронной почты уже зарегистрирован.",
        "auth/weak-password": "Слишком слабый пароль (минимум 6 символов).",
        "auth/too-many-requests": "Слишком много попыток. Попробуйте позже.",
        "auth/network-request-failed": "Ошибка сети. Проверьте подключение.",
        "auth/operation-not-allowed": "Вход по email/паролю отключён в консоли Firebase.",
        "auth/missing-password": "Введите пароль."
      };
      return map[code] || "Ошибка авторизации. Попробуйте ещё раз.";
    }

    // Если пользователь уже вошёл — сразу на дашборд
    onAuthStateChanged(auth, user => {
      if (user) {
        window.location.replace(DASHBOARD_URL);
      }
    });

    // РЕГИСТРАЦИЯ
    registerForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      const fullName = $("regFullName").value.trim();
      const email = $("regEmail").value.trim().toLowerCase();
      const password = $("regPassword").value;
      const confirm = $("regPasswordConfirm").value;

      if (fullName.length < 2) {
        showMessage("Введите ФИО.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("Пароль должен содержать не менее 6 символов.", "error");
        return;
      }

      if (password !== confirm) {
        showMessage("Пароли не совпадают.", "error");
        return;
      }

      if (!$("acceptTerms").checked) {
        showMessage("Для продолжения примите условия использования.", "error");
        return;
      }

      const button = $("registerSubmit");
      setLoading(button, true, "Создать аккаунт");

      try {
        const { user } = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(user, { displayName: fullName });

        registerForm.reset();
        showMessage("Аккаунт создан. Выполняется вход...", "success");
        window.location.replace(DASHBOARD_URL);
      } catch (error) {
        console.error("Registration error:", error);
        showMessage(translateAuthError(error.code), "error");
      } finally {
        setLoading(button, false, "Создать аккаунт");
      }
    });

    // ВХОД
    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      const email = $("loginEmail").value.trim().toLowerCase();
      const password = $("loginPassword").value;
      const remember = $("rememberMe").checked;
      const button = $("loginSubmit");

      setLoading(button, true, "Войти в систему");

      try {
        await setPersistence(
          auth,
          remember ? browserLocalPersistence : browserSessionPersistence
        );

        await signInWithEmailAndPassword(auth, email, password);
        showMessage("Вход выполнен. Открываем СОКРАТ...", "success");
        window.location.replace(DASHBOARD_URL);
      } catch (error) {
        console.error("Login error:", error);
        showMessage(translateAuthError(error.code), "error");
      } finally {
        setLoading(button, false, "Войти в систему");
      }
    });

    // ВОССТАНОВЛЕНИЕ ПАРОЛЯ
    $("forgotPassword").addEventListener("click", async () => {
      const email = window.prompt("Введите почту, указанную при регистрации:");
      if (!email || !email.trim()) return;

      clearMessage();

      try {
        await sendPasswordResetEmail(auth, email.trim().toLowerCase());
        showMessage(
          "Если адрес зарегистрирован, инструкция по восстановлению отправлена на почту.",
          "success"
        );
      } catch (error) {
        console.error("Password recovery error:", error);
        showMessage(translateAuthError(error.code), "error");
      }
    });
  </script>
</body>
</html>
