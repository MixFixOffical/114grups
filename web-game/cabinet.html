<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — Изи квиз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #6c2bd9; --purple-dark: #3b0f8c; --purple-soft: #ece6fb;
      --yellow: #ffd23f; --orange: #ff7a1a; --green: #5cc26b; --green-dark: #46a955;
      --text: #1f1640; --muted: #8a84a3; --line: #e6e2f2; --bg: #f5f3fb; --red: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: "Manrope", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px clamp(16px,4vw,48px); background: #fff; border-bottom: 1px solid var(--line); }
    .logo { display: flex; align-items: center; gap: 10px; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 18px; color: var(--purple-dark); text-decoration: none; }
    .logo-mark { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--yellow), var(--orange)); display: grid; place-items: center; color: var(--purple-dark); font-size: 19px; transform: rotate(-6deg); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .btn-cert { font-family: inherit; font-weight: 800; font-size: 14px; color: var(--purple); background: #fff; border: 2px solid var(--purple); border-radius: 999px; padding: 8px 18px; text-decoration: none; transition: background .2s ease; }
    .btn-cert:hover { background: var(--purple-soft); }
    .btn-logout { font-family: inherit; font-weight: 800; font-size: 14px; color: var(--purple-dark); background: var(--yellow); border: none; border-radius: 999px; padding: 10px 22px; cursor: pointer; box-shadow: 0 4px 0 #e0a800; }
    .btn-logout:active { transform: translateY(2px); box-shadow: 0 2px 0 #e0a800; }

    .page { max-width: 1100px; margin: 0 auto; padding: 24px clamp(16px,4vw,40px) 60px; }
    .search-panel { background: var(--purple); border-radius: 14px; padding: 16px; margin-bottom: 28px; }
    .search { position: relative; }
    .search input { width: 100%; font-family: inherit; font-size: 16px; color: var(--text); background: #fff; border: none; border-radius: 12px; padding: 14px 52px 14px 18px; outline: none; }
    .search input::placeholder { color: var(--muted); }
    .search input:focus { box-shadow: 0 0 0 3px var(--yellow); }
    .search svg { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--purple); }

    .section-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .section-head h1 { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(22px,3vw,28px); color: var(--purple-dark); }
    .btn-create { font-family: inherit; font-weight: 800; font-size: 15px; color: var(--purple-dark); background: linear-gradient(135deg, var(--yellow), var(--orange)); border: none; border-radius: 14px; padding: 13px 24px; cursor: pointer; box-shadow: 0 8px 22px rgba(255,122,26,.35); text-decoration: none; transition: transform .2s ease; }
    .btn-create:hover { transform: translateY(-2px); }

    .quiz-list { display: flex; flex-direction: column; }
    .quiz-row { display: grid; grid-template-columns: 110px 22px 90px 110px 1fr auto; align-items: center; gap: 14px; padding: 16px 0; }
    .quiz-row + .quiz-row { border-top: 1px solid var(--line); }
    .date-col { font-size: 13px; color: var(--muted); line-height: 1.35; }
    .date-col b { display: block; color: var(--text); font-weight: 700; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--purple); justify-self: center; box-shadow: 0 0 0 4px var(--purple-soft); }
    .time { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--text); }
    .time svg { width: 15px; height: 15px; color: var(--muted); }
    .code { display: inline-block; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: var(--text); background: #e9e7ef; border-radius: 999px; padding: 7px 14px; justify-self: start; }
    .title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { display: flex; align-items: center; gap: 10px; justify-self: end; }

    .btn-start { font-family: inherit; font-weight: 800; font-size: 14px; color: #fff; background: var(--green); border: none; border-radius: 12px; padding: 11px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background .2s ease; }
    .btn-start:hover { background: var(--green-dark); }
    .btn-start svg { width: 14px; height: 14px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; display: grid; place-items: center; cursor: pointer; background: var(--purple-soft); color: var(--purple); transition: transform .15s ease; }
    .icon-btn:hover { transform: scale(1.06); }
    .icon-btn.edit { background: var(--purple); color: #fff; }
    .icon-btn svg { width: 17px; height: 17px; }
    .menu-wrap { position: relative; }
    .menu-pop { position: absolute; right: 0; top: 46px; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px rgba(31,22,64,.18); padding: 6px; min-width: 210px; display: flex; flex-direction: column; }
    .menu-pop[hidden] { display: none; }
    .menu-pop button { font-family: inherit; font-weight: 700; font-size: 14px; color: var(--text); background: none; border: none; text-align: left; padding: 11px 14px; border-radius: 10px; cursor: pointer; }
    .menu-pop button:hover { background: var(--purple-soft); }
    .menu-pop button.danger { color: var(--red); }

    .state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; line-height: 1.5; }
    .state.error { color: var(--red); }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--purple-dark); color: #fff; font-weight: 700; padding: 14px 22px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .35s ease; z-index: 60; max-width: calc(100% - 40px); text-align: center; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 860px) {
      .quiz-row { grid-template-columns: 1fr; gap: 10px; padding: 18px 0; }
      .dot { display: none; }
      .date-col { display: flex; gap: 10px; align-items: baseline; }
      .date-col b { display: inline; }
      .actions { justify-self: start; flex-wrap: wrap; }
      .title { white-space: normal; }
    }
    @media (max-width: 520px) {
      .btn-create { width: 100%; text-align: center; }
      .btn-cert { padding: 7px 12px; font-size: 13px; }
      .btn-logout { padding: 9px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo"><span class="logo-mark">?</span>Изи квиз</a>
    <div class="topbar-actions">
      <a href="certificates.html" class="btn-cert">Сертификаты</a>
      <button class="btn-logout" id="logoutBtn">Выйти</button>
    </div>
  </header>

  <main class="page">
    <div class="search-panel">
      <div class="search">
        <input type="text" id="searchInput" placeholder="Введите поисковой запрос" aria-label="Поиск" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
    </div>

    <div class="section-head">
      <h1>Мои квизы</h1>
      <a href="ctqz.html" class="btn-create">+ Создать квиз</a>
    </div>

    <div class="quiz-list" id="quizList"><div class="state">Загружаем квизы…</div></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
    authDomain: "sokrat-7c938.firebaseapp.com",
    projectId: "sokrat-7c938",
    storageBucket: "sokrat-7c938.firebasestorage.app",
    messagingSenderId: "19858604945",
    appId: "1:19858604945:web:8ec6dc1a81dba35c481030",
    measurementId: "G-B3SDDN1T50"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const $ = (id) => document.getElementById(id);

  const MONTHS = ['Янв.', 'Фев.', 'Мар.', 'Апр.', 'Май', 'Июн.', 'Июл.', 'Авг.', 'Сен.', 'Окт.', 'Ноя.', 'Дек.'];
  const WEEKDAYS = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
  const pad = (n) => String(n).padStart(2, '0');
  const esc = (str) => String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function formatDate(d) {
    if (!d) return { weekday: '—', dateLabel: '—', time: '—' };
    return {
      weekday: WEEKDAYS[d.getDay()],
      dateLabel: `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`,
      time: `${pad(d.getHours())}:${pad(d.getMinutes())}`
    };
  }

  const CLOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
  const PEN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>';
  const DOTS_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';

  let user = null;
  let allQuizzes = [];

  let toastTimer;
  function showToast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  // Без входа в аккаунт в кабинет не пускаем
  onAuthStateChanged(auth, (u) => {
    if (!u) { window.location.replace('index.html'); return; }
    user = u;
    loadQuizzes();
  });

  // Квиз: документ quizzes/{код}, поле ownerUid — владелец
  async function loadQuizzes() {
    $('quizList').innerHTML = '<div class="state">Загружаем квизы…</div>';
    try {
      const snap = await getDocs(query(collection(db, 'quizzes'), where('ownerUid', '==', user.uid)));
      allQuizzes = snap.docs.map((d) => {
        const data = d.data();
        const createdAt = data.createdAt && typeof data.createdAt.toDate === 'function' ? data.createdAt.toDate() : null;
        return { code: d.id, title: data.title || 'Без названия', createdAt };
      });
      render($('searchInput').value);
    } catch (err) {
      console.error(err);
      $('quizList').innerHTML = '<div class="state error">Не удалось загрузить квизы. Проверьте интернет и обновите страницу.</div>';
    }
  }

  function render(filter = '') {
    const list = $('quizList');
    const q = filter.trim().toLowerCase();
    const items = allQuizzes
      .filter((quiz) => !q || quiz.title.toLowerCase().includes(q) || quiz.code.includes(q))
      .sort((a, b) => (b.createdAt?.getTime() || 0) - (a.createdAt?.getTime() || 0));

    if (items.length === 0) {
      list.innerHTML = `<div class="state">${q ? 'Ничего не найдено' : 'У вас пока нет квизов. Создайте первый!'}</div>`;
      return;
    }

    list.innerHTML = items.map((quiz) => {
      const d = formatDate(quiz.createdAt);
      const code = esc(quiz.code);
      return `
        <div class="quiz-row">
          <div class="date-col"><span>${d.weekday}</span><b>${d.dateLabel}</b></div>
          <span class="dot" aria-hidden="true"></span>
          <div class="time">${CLOCK_ICON}${d.time}</div>
          <span class="code">${code}</span>
          <div class="title">${esc(quiz.title)}</div>
          <div class="actions">
            <button class="btn-start" data-start="${code}">${PLAY_ICON}Запустить экран ожидания</button>
            <button class="icon-btn edit" data-edit="${code}" aria-label="Редактировать">${PEN_ICON}</button>
            <div class="menu-wrap">
              <button class="icon-btn" data-menu="${code}" aria-label="Меню">${DOTS_ICON}</button>
              <div class="menu-pop" hidden>
                <button data-run="${code}">▶ Запустить тест</button>
                <button class="danger" data-del="${code}">🗑 Удалить</button>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // Запуск: создаём игру (экран ожидания). Код квиза = код игры.
  async function openLobby(code, status) {
    try {
      const ref = doc(db, 'games', code);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, { quizId: code, hostUid: user.uid, status, round: 1, current: -1, order: [], createdAt: serverTimestamp() });
      } else if (snap.data().hostUid !== user.uid) {
        showToast('Эта игра принадлежит другому организатору');
        return;
      } else if (status === 'running' && snap.data().status !== 'running') {
        await updateDoc(ref, { status: 'running', startedAt: serverTimestamp() });
      }
      window.location.href = 'host.html?code=' + encodeURIComponent(code);
    } catch (err) {
      console.error(err);
      showToast('Не удалось открыть экран ожидания');
    }
  }

  // Удаляем квиз вместе с ключом, фото вопросов и документом игры.
  // Подколлекции игры (rounds, excluded, retakeRequests) браузер удалить не может, поэтому они остаются в базе.
  async function deleteQuiz(code) {
    if (!confirm('Удалить квиз ' + code + '? Это действие нельзя отменить.')) return;
    try {
      const snap = await getDoc(doc(db, 'quizzes', code));
      const imageIds = snap.exists()
        ? (snap.data().questions || []).map((q) => q.image?.id).filter(Boolean)
        : [];
      await Promise.all(imageIds.map((id) => deleteDoc(doc(db, 'quizImages', id)).catch(() => {})));
      await deleteDoc(doc(db, 'quizzes', code, 'private', 'key')).catch(() => {});
      await deleteDoc(doc(db, 'quizzes', code));
      await deleteDoc(doc(db, 'games', code)).catch(() => {});
      allQuizzes = allQuizzes.filter((q) => q.code !== code);
      render($('searchInput').value);
      showToast('Квиз удалён');
    } catch (err) {
      console.error(err);
      showToast('Не удалось удалить квиз');
    }
  }

  function closeMenus() {
    document.querySelectorAll('.menu-pop').forEach((m) => { m.hidden = true; });
  }

  $('searchInput').addEventListener('input', (e) => render(e.target.value));

  $('quizList').addEventListener('click', (e) => {
    const start = e.target.closest('[data-start]');
    const edit = e.target.closest('[data-edit]');
    const menu = e.target.closest('[data-menu]');
    const run = e.target.closest('[data-run]');
    const del = e.target.closest('[data-del]');

    if (start) {
      openLobby(start.dataset.start, 'waiting');
    } else if (edit) {
      window.location.href = 'ctqz.html?code=' + encodeURIComponent(edit.dataset.edit);
    } else if (menu) {
      const pop = menu.parentElement.querySelector('.menu-pop');
      const wasOpen = !pop.hidden;
      closeMenus();
      pop.hidden = wasOpen;
    } else if (run) {
      closeMenus();
      openLobby(run.dataset.run, 'running');
    } else if (del) {
      closeMenus();
      deleteQuiz(del.dataset.del);
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu-wrap')) closeMenus();
  });

  $('logoutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
