<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1100">
<meta name="theme-color" content="#2563eb">
<title>Настройки — Посещаемость</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-width:1100px;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;background:linear-gradient(135deg,#f8fbff,#f5f7ff 50%,#faf8ff)}
.page-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f8fafc;transition:opacity .45s,visibility .45s;font-size:14px;font-weight:700;color:#64748b;flex-direction:column;gap:14px}
.page-loader.hidden{opacity:0;visibility:hidden}
.page-loader .logo{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,#2563eb,#4f46e5);animation:fl 1.6s infinite ease-in-out}
@keyframes fl{50%{transform:translateY(-8px)}}

header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(24px);border-bottom:1px solid #e2e8f0;box-shadow:0 8px 30px rgba(15,23,42,.04)}
.top{display:flex;align-items:center;gap:16px;padding:14px 40px}
.back{width:42px;height:42px;border:none;border-radius:13px;background:#fff;color:#2563eb;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(15,23,42,.08);transition:.2s}
.back:hover{transform:translateX(-3px)}
.title h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
.title span{display:block;margin-top:2px;font-size:11.5px;color:#64748b;font-weight:600}
.spacer{flex:1}
.group-box{display:flex;align-items:center;gap:8px}
.group-box label{font-size:11px;font-weight:800;color:#475569}
select,input{font-family:inherit;font-size:12.5px;color:#0f172a;border:1px solid #dbe3ef;border-radius:11px;background:#fff;outline:none;transition:.2s}
select{height:40px;padding:0 12px;min-width:150px;font-weight:700}
input{width:100%;height:43px;padding:0 12px}
select:focus,input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(37,99,235,.08)}
.mini{height:40px;width:40px;border:none;border-radius:11px;background:#eff6ff;color:#2563eb;font-size:20px;font-weight:800;cursor:pointer}
.status{padding:7px 12px;border-radius:10px;font-size:11.5px;font-weight:800;background:#f1f5f9;color:#64748b}
.status.online{background:#dcfce7;color:#15803d}.status.error{background:#fee2e2;color:#dc2626}
.role{padding:7px 12px;border-radius:10px;font-size:11.5px;font-weight:800;background:#e0e7ff;color:#4338ca}

nav{display:flex;gap:8px;padding:0 40px 14px}
nav button{border:none;padding:11px 18px;border-radius:12px;background:transparent;color:#475569;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:.2s}
nav button:hover{background:#f1f5f9}
nav button.active{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.25)}

.container{max-width:1050px;margin:0 auto;padding:32px 30px 80px}
.card{border-radius:24px;background:rgba(255,255,255,.93);border:1px solid #e2e8f0;box-shadow:0 15px 40px rgba(15,23,42,.06);padding:28px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-7px)}}
.section{display:none}.section.show{display:block}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.heading h3{margin:0;font-size:17px;font-weight:800}.heading span{font-size:12px;color:#64748b}
.block{margin-bottom:14px;padding:18px;border-radius:18px;background:#f8fafc;border:1px solid #e2e8f0}
.block-title{font-size:14px;font-weight:800;margin-bottom:14px}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.controls{display:flex;align-items:center;gap:10px}
.cnt{width:34px;height:34px;border:none;border-radius:10px;background:#fff;color:#2563eb;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(15,23,42,.07)}
.cnt:hover{background:#eff6ff}
.num{min-width:26px;text-align:center;font-size:15px;font-weight:800}
.badge{padding:6px 10px;border-radius:9px;background:#e0e7ff;color:#4338ca;font-size:11px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:10px;background:#fff;border:1px solid #e2e8f0;color:#475569;font-size:11px;font-weight:700}
.row{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;margin-bottom:9px}
.row.bell{grid-template-columns:90px 1fr 1fr}
.tag{height:43px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(37,99,235,.08);color:#2563eb;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;font-weight:800;color:#475569}
.att{padding:14px;margin-bottom:10px;border-radius:14px;background:#fff;border:1px solid #e5e7eb}
.att-title{margin-bottom:10px;font-size:12px;font-weight:800;color:#334155}
.empty{padding:24px;text-align:center;color:#94a3b8;font-size:13px}
.save-area{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px}
.save{border:none;padding:13px 22px;border-radius:13px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 12px 25px rgba(37,99,235,.23);transition:.2s}
.save:hover{transform:translateY(-2px)}.save:disabled{opacity:.5;pointer-events:none}
#message{font-size:12px;font-weight:700;color:#16a34a}#message.err{color:#dc2626}
</style>
</head>
<body>

<div class="page-loader" id="loader"><div class="logo">⚙️</div><div id="loaderText">Загрузка...</div></div>

<header>
  <div class="top">
    <button class="back" id="backBtn">←</button>
    <div class="title"><h1>⚙️ Настройки</h1><span>Управление системой</span></div>
    <div class="spacer"></div>
    <span class="status" id="dbStatus" style="display:none">Проверка...</span>
    <span class="role" id="roleBadge"></span>
    <div class="group-box">
      <label for="groupSelect">Группа</label>
      <select id="groupSelect"></select>
      <button class="mini" id="addGroup" title="Добавить группу" style="display:none">+</button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>

<main class="container">

  <section class="card section" id="sec-lessons">
    <div class="heading"><h3>Количество пар</h3><span>Максимум 7 пар · <b class="gname"></b></span></div>
    <div id="scheduleBox"></div>
  </section>

  <section class="card section" id="sec-disc">
    <div class="heading"><h3>Дисциплины</h3><span>Для каждой пары · <b class="gname"></b></span></div>
    <div id="discBox"></div>
  </section>

  <section class="card section" id="sec-plan">
    <div class="heading"><h3>Учебный план</h3><span>Общий для всех групп</span></div>
    <div id="planBox"></div>
  </section>

  <section class="card section" id="sec-bells">
    <div class="heading"><h3>Время звонков</h3><span>Общее для всех групп</span></div>
    <div id="bellsBox"></div>
  </section>

  <div class="save-area">
    <div id="message"></div>
    <button class="save" id="saveBtn">💾 Сохранить настройки</button>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* ---------- конфиг (тот же, что на странице входа) ---------- */
const app = initializeApp({
  apiKey: "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",
  authDomain: "othets-1aa03.firebaseapp.com",
  projectId: "othets-1aa03",
  storageBucket: "othets-1aa03.firebasestorage.app",
  messagingSenderId: "528392191591",
  appId: "1:528392191591:web:1e97790e6f9f0a6e175ec2",
  measurementId: "G-F50WVZRXZJ"
});
const auth = getAuth(app), db = getFirestore(app);

const LOGIN_PAGE = "index.html";   // страница входа
const $ = id => document.getElementById(id);
const days = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];

/* ---------- состояние ---------- */
let isAdmin = false, group = "", dirty = false;
let schedule = {}, disciplines = {}, defaults = {};
let bells = {1:{start:"08:00",end:"08:45"},2:{start:"08:55",end:"09:40"},3:{start:"09:50",end:"10:35"},4:{start:"10:45",end:"11:30"},5:{start:"11:40",end:"12:25"},6:{start:"12:35",end:"13:20"},7:{start:"13:30",end:"14:15"}};
let user, profile;

const gid = g => g.replace(/[\/\s]+/g, "_");
const word = n => n === 1 ? "пара" : (n >= 2 && n <= 4 ? "пары" : "пар");
const parseGroups = d => (Array.isArray(d.groups) ? d.groups : String(d.group || "").split(/[,;]/)).map(s => s.trim()).filter(Boolean);
function msg(t, err) { $("message").textContent = t; $("message").className = err ? "err" : ""; }
function emptyState() { schedule = {}; disciplines = {}; days.forEach(d => { schedule[d] = d === "Суббота" ? 0 : 5; disciplines[d] = []; }); }

/* ---------- доступ ---------- */
async function init() {
  await auth.authStateReady();          // ждём восстановления сессии
  user = auth.currentUser;
  if (!user) return location.replace(LOGIN_PAGE);

  const snap = await getDoc(doc(db, "users", user.uid));
  profile = snap.exists() ? snap.data() : null;

  if (!profile || profile.reg !== 1) { await signOut(auth); return location.replace(LOGIN_PAGE); }

  if (profile.role !== "admin" && profile.role !== "curator") {
    $("loaderText").textContent = "Доступ запрещён: раздел только для кураторов и администраторов";
    return setTimeout(() => location.replace("home.html"), 1500);
  }

  isAdmin = profile.role === "admin";
  $("roleBadge").textContent = isAdmin ? "Администратор" : "Куратор";
  $("backBtn").onclick = () => location.href = isAdmin ? "adminhome.html" : "home.html";

  buildTabs();
  await buildGroups();
  if (isAdmin) { $("dbStatus").style.display = ""; checkDb(); loadGlobal(); }
  await loadGroup();
  $("loader").classList.add("hidden");
}

/* ---------- вкладки ---------- */
function buildTabs() {
  const tabs = [
    ["lessons", "🕐 Количество пар", false],
    ["disc", "📚 Дисциплины", false],
    ["plan", "📋 План и аттестации", true],
    ["bells", "🔔 Звонки", true]
  ].filter(t => !t[2] || isAdmin);

  $("tabs").innerHTML = tabs.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join("");
  $("tabs").onclick = e => { const b = e.target.closest("button"); if (b) openTab(b.dataset.t); };
  openTab("lessons");
}
function openTab(t) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.t === t));
  document.querySelectorAll(".section").forEach(s => s.classList.toggle("show", s.id === "sec-" + t));
}

/* ---------- группы ---------- */
async function buildGroups() {
  let list = [];
  if (isAdmin) {
    $("addGroup").style.display = "";
    try {
      const all = await getDocs(collection(db, "users"));
      const set = new Set();
      all.forEach(d => parseGroups(d.data()).forEach(g => set.add(g)));
      list = [...set];
    } catch (e) { console.error("Список групп:", e); }
    try {
      const gs = await getDocs(collection(db, "groupSettings"));
      gs.forEach(d => d.data().group && list.push(d.data().group));
    } catch (e) {}
  } else list = parseGroups(profile);

  list = [...new Set(list)].sort((a, b) => a.localeCompare(b, "ru", { numeric: true }));
  fillSelect(list);
}
function fillSelect(list, pick) {
  const s = $("groupSelect");
  s.innerHTML = list.length ? list.map(g => `<option>${g}</option>`).join("") : `<option value="">Нет групп</option>`;
  if (pick) s.value = pick;
  group = s.value;
  s.disabled = !isAdmin && list.length <= 1;
}
$("groupSelect").onchange = async e => {
  if (dirty && !confirm("Есть несохранённые изменения. Переключить группу?")) { e.target.value = group; return; }
  group = e.target.value; await loadGroup();
};
$("addGroup").onclick = async () => {
  const g = (prompt("Название группы, например 114") || "").trim();
  if (!g) return;
  const list = [...$("groupSelect").options].map(o => o.value).filter(Boolean);
  if (!list.includes(g)) list.push(g);
  fillSelect(list, g); await loadGroup();
};

/* ---------- загрузка ---------- */
async function loadGlobal() {
  try {
    const d = (await getDoc(doc(db, "settings", "main"))).data() || {};
    if (d.bells) bells = { ...bells, ...d.bells };
    [1, 2].forEach(n => [1, 2].forEach(m => {
      const a = d["semester" + n]?.["attestation" + m]; if (!a) return;
      $(`s${n}a${m}start`).value = a.start || ""; $(`s${n}a${m}end`).value = a.end || "";
    }));
    renderBells();
  } catch (e) { console.error(e); }
}
async function loadGroup() {
  document.querySelectorAll(".gname").forEach(e => e.textContent = group ? "группа " + group : "");
  emptyState(); dirty = false; msg("");
  if (group) {
    try {
      let d = await getDoc(doc(db, "groupSettings", gid(group)));
      if (!d.exists()) d = await getDoc(doc(db, "settings", "main"));   // значения по умолчанию
      const data = d.data() || {};
      if (data.schedule) schedule = { ...schedule, ...data.schedule };
      if (data.disciplines) disciplines = { ...disciplines, ...data.disciplines };
    } catch (e) { console.error(e); msg("Ошибка загрузки настроек", true); }
  }
  $("saveBtn").disabled = !group;
  renderSchedule();
}
async function checkDb() {
  try { await getDoc(doc(db, "system", "connection")); $("dbStatus").textContent = "БД подключена"; $("dbStatus").className = "status online"; }
  catch { $("dbStatus").textContent = "Ошибка БД"; $("dbStatus").className = "status error"; }
}

/* ---------- пары ---------- */
function renderSchedule() {
  const box = $("scheduleBox");
  if (!group) { box.innerHTML = `<div class="empty">Группа не выбрана или не назначена вам.</div>`; renderDisc(); return; }
  box.innerHTML = days.map(d => {
    const n = +schedule[d] || 0;
    return `<div class="block"><div class="day-header"><b>${d}</b>
      <div class="controls"><button class="cnt" data-d="${d}" data-a="-1">−</button><span class="num">${n}</span><button class="cnt" data-d="${d}" data-a="1">+</button></div>
      <span class="badge">${n} ${word(n)}</span></div>
      <div class="chips">${Array.from({length: n}, (_, i) => `<span class="chip">${i + 1} пара</span>`).join("")}</div></div>`;
  }).join("");
  renderDisc(); renderBells();
}
$("scheduleBox").onclick = e => {
  const b = e.target.closest(".cnt"); if (!b) return;
  const d = b.dataset.d, n = (+schedule[d] || 0) + +b.dataset.a;
  if (n > 7) return alert("Максимальное количество — 7 пар.");
  if (n < 0) return;
  schedule[d] = n; disciplines[d] = (disciplines[d] || []).slice(0, n);
  dirty = true; renderSchedule();
};

/* ---------- дисциплины ---------- */
function renderDisc() {
  const box = $("discBox"); box.innerHTML = "";
  if (!group) { box.innerHTML = `<div class="empty">Группа не выбрана.</div>`; return; }
  days.forEach(d => {
    const n = +schedule[d] || 0; if (!n) return;
    disciplines[d] = disciplines[d] || [];
    while (disciplines[d].length < n) disciplines[d].push("");
    const block = document.createElement("div"); block.className = "block";
    block.innerHTML = `<div class="block-title">${d}</div>`;
    for (let i = 0; i < n; i++) {
      const row = document.createElement("div"); row.className = "row";
      const inp = document.createElement("input"); inp.placeholder = "Введите дисциплину..."; inp.value = disciplines[d][i] || "";
      inp.oninput = () => { disciplines[d][i] = inp.value; dirty = true; };
      row.innerHTML = `<div class="tag">${i + 1} пара</div>`; row.appendChild(inp); block.appendChild(row);
    }
    box.appendChild(block);
  });
  if (!box.children.length) box.innerHTML = `<div class="empty">Сначала добавьте пары на вкладке «Количество пар».</div>`;
}

/* ---------- план (только админ) ---------- */
if (true) {
  $("planBox").innerHTML = [1, 2].map(n => `<div class="block"><div class="block-title">${n === 1 ? "📘 Первый" : "📗 Второй"} семестр</div>` +
    [1, 2].map(m => `<div class="att"><div class="att-title">Аттестация ${m}</div><div class="grid">
      <div class="field"><label>Дата начала</label><input type="date" id="s${n}a${m}start"></div>
      <div class="field"><label>Дата окончания</label><input type="date" id="s${n}a${m}end"></div></div></div>`).join("") + `</div>`).join("");
}
const sem = n => { const o = {}; [1, 2].forEach(m => o["attestation" + m] = { start: $(`s${n}a${m}start`).value, end: $(`s${n}a${m}end`).value }); return o; };

/* ---------- звонки (только админ) ---------- */
function renderBells() {
  if (!isAdmin) return;
  $("bellsBox").innerHTML = `<div class="block"><div class="block-title">Общее время звонков</div>` +
    [1, 2, 3, 4, 5, 6, 7].map(i => `<div class="row bell"><div class="tag">${i} пара</div>
      <input type="time" data-i="${i}" data-k="start" value="${bells[i]?.start || ""}">
      <input type="time" data-i="${i}" data-k="end" value="${bells[i]?.end || ""}"></div>`).join("") + `</div>`;
}
$("bellsBox").oninput = e => {
  const t = e.target; if (!isAdmin || !t.dataset.i) return;
  (bells[t.dataset.i] = bells[t.dataset.i] || {})[t.dataset.k] = t.value; dirty = true;
};

/* ---------- сохранение ---------- */
$("saveBtn").onclick = async () => {
  if (!group) return;
  msg("Сохранение...");
  try {
    await setDoc(doc(db, "groupSettings", gid(group)), {
      group, schedule, disciplines, updatedAt: new Date().toISOString(), updatedBy: user.uid
    });
    if (isAdmin) await setDoc(doc(db, "settings", "main"), {
      bells, semester1: sem(1), semester2: sem(2), updatedAt: new Date().toISOString()
    }, { merge: true });
    dirty = false; msg("✓ Настройки сохранены");
    setTimeout(() => msg(""), 3000);
  } catch (e) { console.error(e); msg("Ошибка сохранения: " + e.message, true); }
};

window.addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });
init().catch(e => { console.error(e); $("loaderText").textContent = "Ошибка: " + e.message; });
</script>
</body>
</html>
