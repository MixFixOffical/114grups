<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>Посещаемость</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; min-width: 1100px; }

        :root {
            --primary: #2454e8;
            --primary-dark: #17348f;
            --primary-light: #eef2ff;
            --teal: #0d9488;
            --teal-light: #ecfdf9;
            --violet: #7c3aed;
            --violet-light: #f4f0ff;
            --amber: #d97706;
            --amber-light: #fef8ec;
            --red: #dc2626;
            --red-light: #fef2f2;
            --slate: #64748b;
            --slate-light: #f1f5f9;

            --text: #0f1729;
            --text-secondary: #5b6478;
            --text-light: #9aa3b5;

            --border: rgba(220, 226, 238, 0.9);

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 1px rgba(15, 23, 42, .03);
            --shadow-md: 0 10px 24px -8px rgba(15, 23, 42, .10), 0 2px 6px rgba(15, 23, 42, .05);
            --shadow-lg: 0 26px 50px -16px rgba(15, 23, 42, .18), 0 8px 18px -10px rgba(15, 23, 42, .09);

            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background:
                radial-gradient(circle at 6% 0%, rgba(36, 84, 232, .06), transparent 40%),
                radial-gradient(circle at 96% 10%, rgba(124, 58, 237, .04), transparent 38%),
                linear-gradient(160deg, #f9fafc 0%, #f4f6fb 45%, #eef1f9 100%);
            background-attachment: fixed;
            color: var(--text);
            overflow-x: auto;
        }

        h1, h2, .title, .week-title, .student-name, .popup-title {
            font-family: "Plus Jakarta Sans", "Inter", sans-serif;
        }

        button { font-family: inherit; }

        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
        }

        svg.icon-inline { width: 1em; height: 1em; vertical-align: -0.14em; margin-right: 2px; }

        /* =====================================
           HEADER
        ===================================== */

        header {
            background: linear-gradient(120deg, #17348f 0%, #2454e8 60%, #3b5fea 100%);
            color: white;
            padding: 18px 28px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            width: 100%;
            min-width: 1100px;

            position: sticky;
            top: 0;
            z-index: 50;

            box-shadow: 0 12px 30px -12px rgba(36, 84, 232, .38);
        }

        .header-brand { display: flex; align-items: center; gap: 14px; }

        .header-logo {
            width: 42px; height: 42px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 13px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .2);
        }
        .header-logo svg { width: 22px; height: 22px; }

        .title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.3px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, .78);
        }

        .clock {
            text-align: right;
            flex-shrink: 0;
        }

        .time {
            font-size: 21px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .date {
            font-size: 13px;
            margin-top: 3px;
            color: rgba(255, 255, 255, .78);
        }


        /* =====================================
           CONTAINER
        ===================================== */

        .container {
            width: 1500px;
            min-width: 1500px;

            margin: 24px auto 40px;
            padding: 0 20px;
        }


        /* =====================================
           WEEK PANEL
        ===================================== */

        .week-panel {
            background: rgba(255, 255, 255, .92);
            border: 1px solid var(--border);
            border-radius: 22px;

            padding: 20px 22px;

            box-shadow: var(--shadow-sm);

            margin-bottom: 20px;

            min-width: 1100px;
        }

        .week-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.3px;

            margin-bottom: 16px;

            display: flex;
            align-items: center;
            gap: 9px;
        }
        .week-title svg { width: 20px; height: 20px; color: var(--primary); }

        .week-controls {
            display: flex;
            align-items: center;

            gap: 10px;

            flex-wrap: nowrap;

            min-width: 1100px;
        }

        .week-controls button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            border: 1px solid transparent;

            padding: 11px 18px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 14.5px;
            font-weight: 600;

            transition: transform .2s var(--ease), background .2s ease, box-shadow .2s ease;

            white-space: nowrap;

            flex-shrink: 0;
        }
        .week-controls button svg { width: 16px; height: 16px; }

        .week-controls button:hover { transform: translateY(-1px); }
        .week-controls button:active { transform: translateY(0) scale(.97); }

        .previous, .next {
            background: var(--slate-light);
            color: var(--text);
            border-color: var(--border);
        }
        .previous:hover, .next:hover { background: #e6eaf2; }

        .current {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 18px -6px rgba(36, 84, 232, .45);
        }
        .current:hover { background: var(--primary-dark); }

        .list-button {
            background: var(--violet-light);
            color: var(--violet);
        }
        .list-button:hover { background: #e9e0ff; }

        .back {
            margin-left: auto;
            background: var(--slate-light);
            color: var(--text-secondary);
        }
        .back:hover { background: #e6eaf2; color: var(--text); }


        /* =====================================
           WEEK LIST
        ===================================== */

        .week-list {
            display: none;

            margin-top: 15px;

            background: #f7f8fc;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 8px;

            max-height: 320px;

            overflow-y: auto;
        }

        .week-list.show {
            display: block;
            animation: rise .25s var(--ease) both;
        }

        .week-option {
            width: 100%;

            border: none;

            background: white;

            padding: 12px 15px;

            margin-bottom: 5px;

            border-radius: 11px;

            cursor: pointer;

            text-align: left;

            font-size: 14.5px;
            font-weight: 500;

            transition: background .15s ease, transform .15s ease;
        }

        .week-option:hover { background: var(--primary-light); }

        .week-option.selected {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .week-option.current-week {
            border-left: 4px solid var(--teal);
        }

        .week-range {
            margin-top: 14px;

            color: var(--text-secondary);

            font-size: 14.5px;
            font-weight: 500;
        }


        /* =====================================
           TABLE
        ===================================== */

        .table-container {
            background: white;

            border: 1px solid var(--border);
            border-radius: 22px;

            box-shadow: var(--shadow-sm);

            overflow-x: auto;
            overflow-y: visible;

            width: 100%;
        }

        table {
            border-collapse: collapse;

            width: 100%;

            min-width: 1000px;

            font-size: 14.5px;
        }

        th {
            background: linear-gradient(160deg, #2454e8, #1a3aa8);

            color: white;

            padding: 12px 10px;

            border: 1px solid rgba(255, 255, 255, .12);

            font-weight: 600;

            text-align: center;

            white-space: nowrap;
        }

        th.student-column {
            text-align: left;
            padding-left: 18px;

            min-width: 270px;

            width: 270px;

            position: sticky;

            left: 0;

            z-index: 10;
        }

        td {
            border: 1px solid #e7ebf2;

            text-align: center;

            padding: 7px;

            transition: background .15s ease;
        }

        td.student-cell {
            background: white;

            text-align: left;
            padding-left: 18px;

            position: sticky;

            left: 0;

            z-index: 5;

            min-width: 270px;

            width: 270px;

            box-shadow: 2px 0 6px -2px rgba(15, 23, 42, .06);
        }

        tbody tr:hover td.student-cell { background: #fafbff; }
        tbody tr:hover td:not(.student-cell):not(.present):not(.absent) { background: #fafbff; }

        .student-wrapper {
            display: flex;

            align-items: center;

            gap: 10px;

            white-space: nowrap;
        }

        .student-number {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: var(--primary-light);
            color: var(--primary);

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 13px;

            flex-shrink: 0;
        }

        .student-name {
            font-size: 14.5px;
            font-weight: 600;

            white-space: nowrap;
        }


        /* =====================================
           DAYS
        ===================================== */

        .day-header {
            min-width: 100px;
        }

        .day-name {
            font-weight: 700;
        }

        .day-date {
            font-size: 11.5px;

            margin-top: 3px;

            opacity: .85;
            font-weight: 400;
        }


        /* =====================================
           LESSON CELLS
        ===================================== */

        .lesson-cell {
            min-width: 55px;

            height: 45px;

            cursor: pointer;

            transition: transform .12s ease, box-shadow .12s ease;
        }

        .lesson-cell:hover {
            background: var(--primary-light);
            box-shadow: inset 0 0 0 1.5px rgba(36, 84, 232, .3);
        }

        .present {
            color: #0a7a3d;

            background: #eafbf1;

            font-size: 18px;

            font-weight: 700;
        }

        .absent {
            color: #c0272d;

            background: #fdedee;

            font-size: 17px;

            font-weight: 700;
        }

        .empty-mark {
            color: var(--text-light);
        }


        /* =====================================
           POPUP
        ===================================== */

        .info-popup {
            position: fixed;

            display: none;

            background: white;

            padding: 18px;

            border-radius: 16px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow-lg);

            width: 290px;

            z-index: 1000;

            animation: rise .2s var(--ease) both;
        }

        .popup-title {
            font-weight: 700;

            font-size: 16.5px;

            margin-bottom: 11px;
        }

        .popup-row {
            margin-bottom: 7px;

            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .popup-reason {
            background: var(--slate-light);

            padding: 10px 11px;

            border-radius: 11px;

            margin-top: 10px;

            font-size: 13.5px;
            line-height: 1.5;
        }
        .popup-reason strong { color: var(--text); }


        /* =====================================
           EMPTY
        ===================================== */

        .empty {
            text-align: center;

            padding: 55px;

            color: var(--text-secondary);

            font-size: 15.5px;
        }


        /* =====================================
           STATUS
        ===================================== */

        .status {
            position: fixed;

            right: 20px;
            bottom: 20px;

            background: #101a30;

            color: white;

            padding: 13px 19px;

            border-radius: 14px;

            font-size: 13.5px;
            font-weight: 600;

            box-shadow: var(--shadow-lg);

            display: none;

            z-index: 3000;
        }

        .status.show {
            display: block;
            animation: rise .25s var(--ease) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>


</head>


<body>

        <div class="header-logo">

    id="status"

<script type="module">


    // =========================================
    // FIREBASE
    // =========================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",

        authDomain:
            "othets-1aa03.firebaseapp.com",

        projectId:
            "othets-1aa03",

        storageBucket:
            "othets-1aa03.firebasestorage.app",

        messagingSenderId:
            "528392191591",

        appId:
            "1:528392191591:web:1e97790e6f9f0a6e175ec2",

        measurementId:
            "G-F50WVZRXZJ"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    // =========================================
    // VARIABLES
    // =========================================

    let students = [];

    let settings = {};

    let attendance = {};

    let weekStart;


    const days = [

        "Понедельник",
        "Вторник",
        "Среда",
        "Четверг",
        "Пятница",
        "Суббота"

    ];


    // =========================================
    // CLOCK
    // =========================================

    function updateClock() {

        const now =
            new Date();


        document.getElementById(
            "currentTime"
        ).textContent =
            now.toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );


        document.getElementById(
            "currentDate"
        ).textContent =
            now.toLocaleDateString(
                "ru-RU",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );

    }


    updateClock();

    setInterval(
        updateClock,
        1000
    );


    // =========================================
    // DATE FORMAT
    // =========================================

    function formatDate(date) {

        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            );


        return `${year}-${month}-${day}`;

    }


    // =========================================
    // NORMALIZE DATE
    // =========================================

    function normalizeDate(value) {

        if (!value) {
            return "";
        }


        if (
            typeof value === "object" &&
            typeof value.toDate === "function"
        ) {

            return formatDate(
                value.toDate()
            );

        }


        if (value instanceof Date) {

            return formatDate(value);

        }


        const string =
            String(value).trim();


        if (
            /^\d{4}-\d{2}-\d{2}$/.test(
                string
            )
        ) {

            return string;

        }


        const ruMatch =
            string.match(
                /^(\d{2})\.(\d{2})\.(\d{4})$/
            );


        if (ruMatch) {

            return `${ruMatch[3]}-${ruMatch[2]}-${ruMatch[1]}`;

        }


        return "";

    }


    // =========================================
    // DATE RU
    // =========================================

    function formatDateRu(
        dateString
    ) {

        const normalized =
            normalizeDate(
                dateString
            );


        if (!normalized) {
            return "—";
        }


        const date =
            new Date(
                normalized +
                "T00:00:00"
            );


        return date.toLocaleDateString(
            "ru-RU",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

    }


    // =========================================
    // MONDAY
    // =========================================

    function getMonday(date) {

        const result =
            new Date(date);


        result.setHours(
            0,
            0,
            0,
            0
        );


        let day =
            result.getDay();


        if (day === 0) {
            day = 7;
        }


        result.setDate(
            result.getDate() -
            day +
            1
        );


        return result;

    }


    // =========================================
    // LOAD SETTINGS
    // =========================================

    async function loadSettings() {

        try {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "settings",
                        "main"
                    )
                );


            if (
                snapshot.exists()
            ) {

                settings =
                    snapshot.data();

            }
            else {

                settings = {

                    schedule: {

                        "Понедельник": 5,
                        "Вторник": 5,
                        "Среда": 5,
                        "Четверг": 5,
                        "Пятница": 5,
                        "Суббота": 5

                    }

                };

            }

        }
        catch (error) {

            console.error(
                "Ошибка загрузки настроек:",
                error
            );


            settings = {

                schedule: {

                    "Понедельник": 5,
                    "Вторник": 5,
                    "Среда": 5,
                    "Четверг": 5,
                    "Пятница": 5,
                    "Суббота": 5

                }

            };


            showStatus(
                "Не удалось загрузить настройки"
            );

        }

    }


    // =========================================
    // LOAD STUDENTS
    // =========================================

    async function loadStudents() {

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "students"
                    )
                );


            students = [];


            snapshot.forEach(
                studentDoc => {

                    students.push({

                        id:
                            studentDoc.id,

                        ...studentDoc.data()

                    });

                }
            );


            students.sort(
                (a, b) =>

                    String(
                        a.name || ""
                    ).localeCompare(
                        String(
                            b.name || ""
                        ),
                        "ru"
                    )

            );

        }
        catch (error) {

            console.error(
                "Ошибка студентов:",
                error
            );


            showStatus(
                "Ошибка загрузки студентов"
            );

        }

    }


    // =========================================
    // GET STUDENT NAME
    // =========================================

    function getStudentName(
        studentId
    ) {

        const student =
            students.find(
                item =>
                    String(item.id) ===
                    String(studentId)
            );


        if (student) {

            return (
                student.name ||
                "Без имени"
            );

        }


        return "Неизвестный студент";

    }


    // =========================================
    // NORMALIZE STATUS
    // =========================================

    function normalizeStatus(
        status
    ) {

        if (
            status === null ||
            status === undefined
        ) {

            return "";

        }


        const value =
            String(status)
                .trim()
                .toLowerCase();


        if (
            value === "present" ||
            value === "присутствовал" ||
            value === "присутствует" ||
            value === "присутствие" ||
            value === "п" ||
            value === "✓"
        ) {

            return "present";

        }


        if (
            value === "absent" ||
            value === "отсутствовал" ||
            value === "отсутствует" ||
            value === "отсутствие" ||
            value === "н"
        ) {

            return "absent";

        }


        return "";

    }


    // =========================================
    // LOAD ATTENDANCE
    // =========================================

    async function loadAttendance() {

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "attendance"
                    )
                );


            attendance = {};


            snapshot.forEach(
                attendanceDoc => {

                    const data =
                        attendanceDoc.data();


                    if (
                        !data.date ||
                        !data.studentId
                    ) {

                        return;

                    }


                    const date =
                        normalizeDate(
                            data.date
                        );


                    if (!date) {

                        return;

                    }


                    const studentId =
                        String(
                            data.studentId
                        );


                    const studentName =
                        data.studentName ||
                        getStudentName(
                            studentId
                        );


                    const lessons =
                        data.lessons || {};


                    Object.entries(
                        lessons
                    ).forEach(
                        (
                            [
                                lessonNumber,
                                lessonData
                            ]
                        ) => {

                            if (
                                !lessonData
                            ) {

                                return;

                            }


                            const status =
                                normalizeStatus(
                                    lessonData.status
                                );


                            if (!status) {

                                return;

                            }


                            const reason =
                                lessonData.reason ||
                                lessonData.comment ||
                                lessonData.description ||
                                "";


                            const key =
                                `${date}_${studentId}_${lessonNumber}`;


                            attendance[key] = {

                                id:
                                    attendanceDoc.id,

                                documentId:
                                    attendanceDoc.id,

                                date:
                                    date,

                                studentId:
                                    studentId,

                                studentName:
                                    studentName,

                                lesson:
                                    String(
                                        lessonNumber
                                    ),

                                status:
                                    status,

                                reason:
                                    String(
                                        reason
                                    ),

                                semester:
                                    data.semester ||
                                    "",

                                attestation:
                                    data.attestation ||
                                    "",

                                updatedAt:
                                    data.updatedAt ||
                                    ""

                            };

                        }
                    );

                }
            );


            console.log(
                "Посещаемость:",
                attendance
            );

        }
        catch (error) {

            console.error(
                "Ошибка загрузки посещаемости:",
                error
            );


            showStatus(
                "Ошибка загрузки посещаемости"
            );

        }

    }


    // =========================================
    // GET LESSON COUNT
    // =========================================

    function getLessonCount(
        dayIndex
    ) {

        const schedule =
            settings.schedule || {};


        const day =
            days[dayIndex];


        const count =
            Number(
                schedule[day] || 0
            );


        return count;

    }


    // =========================================
    // GET WEEK DATES
    // =========================================

    function getWeekDates() {

        const result = [];


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const date =
                new Date(
                    weekStart
                );


            date.setDate(
                date.getDate() + i
            );


            result.push(
                date
            );

        }


        return result;

    }


    // =========================================
    // WEEK RANGE
    // =========================================

    function updateWeekRange() {

        const dates =
            getWeekDates();


        const first =
            formatDateRu(
                formatDate(
                    dates[0]
                )
            );


        const last =
            formatDateRu(
                formatDate(
                    dates[5]
                )
            );


        document.getElementById(
            "weekRange"
        ).textContent =
            `Период: ${first} — ${last}`;

    }


    // =========================================
    // RENDER TABLE
    // =========================================

    function renderTable() {

        const wrapper =
            document.getElementById(
                "tableWrapper"
            );


        if (
            students.length === 0
        ) {

            wrapper.innerHTML = `

                <div class="empty">

                    👨‍🎓 Студентов пока нет.

                    <br><br>

                    Добавьте студентов
                    в разделе «Студенты».

                </div>

            `;

            return;

        }


        const weekDates =
            getWeekDates();


        let html = `

            <table>

                <thead>

                    <tr>

                        <th
                            class="student-column"
                            rowspan="2"
                        >
                            Список обучающихся
                        </th>

        `;


        weekDates.forEach(
            (date, index) => {

                const count =
                    getLessonCount(
                        index
                    );


                html += `

                    <th
                        class="day-header"
                        colspan="${Math.max(
                            count,
                            1
                        )}"
                    >

                        <div class="day-name">
                            ${days[index]}
                        </div>

                        <div class="day-date">
                            ${formatDateRu(
                                formatDate(date)
                            )}
                        </div>

                    </th>

                `;

            }
        );


        html += `

                    </tr>

                    <tr>

        `;


        weekDates.forEach(
            (
                date,
                dayIndex
            ) => {

                const count =
                    getLessonCount(
                        dayIndex
                    );


                if (
                    count === 0
                ) {

                    html += `

                        <th>
                            —
                        </th>

                    `;

                    return;

                }


                for (
                    let lesson = 1;
                    lesson <= count;
                    lesson++
                ) {

                    html += `

                        <th>
                            ${lesson}
                        </th>

                    `;

                }

            }
        );


        html += `

                    </tr>

                </thead>

                <tbody>

        `;


        students.forEach(
            (
                student,
                studentIndex
            ) => {

                html += `

                    <tr>

                        <td class="student-cell">

                            <div class="student-wrapper">

                                <div class="student-number">
                                    ${studentIndex + 1}
                                </div>

                                <div class="student-name">
                                    ${escapeHtml(
                                        student.name ||
                                        "Без имени"
                                    )}
                                </div>

                            </div>

                        </td>

                `;


                weekDates.forEach(
                    (
                        date,
                        dayIndex
                    ) => {

                        const dateString =
                            formatDate(
                                date
                            );


                        const lessonCount =
                            getLessonCount(
                                dayIndex
                            );


                        if (
                            lessonCount === 0
                        ) {

                            html += `

                                <td
                                    class="lesson-cell empty-mark"
                                >
                                    —
                                </td>

                            `;

                            return;

                        }


                        for (
                            let lesson = 1;
                            lesson <= lessonCount;
                            lesson++
                        ) {

                            const key =
                                `${dateString}_${student.id}_${lesson}`;


                            const record =
                                attendance[key];


                            let mark =
                                "—";


                            let className =
                                "empty-mark";


                            if (
                                record &&
                                record.status ===
                                "present"
                            ) {

                                mark =
                                    "✓";

                                className =
                                    "present";

                            }


                            if (
                                record &&
                                record.status ===
                                "absent"
                            ) {

                                mark =
                                    "Н";

                                className =
                                    "absent";

                            }


                            html += `

                                <td
                                    class="
                                        lesson-cell
                                        ${className}
                                    "
                                    data-record-key="${escapeHtml(
                                        key
                                    )}"
                                >

                                    ${mark}

                                </td>

                            `;

                        }

                    }
                );


                html += `

                    </tr>

                `;

            }
        );


        html += `

                </tbody>

            </table>

        `;


        wrapper.innerHTML =
            html;


        wrapper
            .querySelectorAll(
                ".lesson-cell"
            )
            .forEach(
                cell => {

                    cell.addEventListener(
                        "click",
                        event => {

                            showRecordInfo(
                                event,
                                cell
                            );

                        }
                    );

                }
            );

    }


    // =========================================
    // SHOW RECORD
    // =========================================

    function showRecordInfo(
        event,
        cell
    ) {

        const key =
            cell.dataset.recordKey;


        const record =
            attendance[key];


        if (!record) {

            hidePopup();

            return;

        }


        const popup =
            document.getElementById(
                "infoPopup"
            );


        if (
            record.status ===
            "absent"
        ) {

            document.getElementById(
                "popupTitle"
            ).textContent =
                "⚠️ Отсутствие";

        }
        else {

            document.getElementById(
                "popupTitle"
            ).textContent =
                "✓ Присутствие";

        }


        document.getElementById(
            "popupStudent"
        ).textContent =
            "ФИО: " +
            record.studentName;


        document.getElementById(
            "popupDate"
        ).textContent =
            "Дата: " +
            formatDateRu(
                record.date
            );


        document.getElementById(
            "popupLesson"
        ).textContent =
            "Пара: " +
            record.lesson;


        document.getElementById(
            "popupReason"
        ).textContent =
            record.reason ||
            (
                record.status === "absent"
                    ? "Причина не указана"
                    : "Студент присутствовал"
            );


        popup.style.display =
            "block";


        const rect =
            cell.getBoundingClientRect();


        let left =
            rect.left;


        let top =
            rect.bottom + 5;


        if (
            left + 290 >
            window.innerWidth
        ) {

            left =
                window.innerWidth - 300;

        }


        if (
            top + 190 >
            window.innerHeight
        ) {

            top =
                rect.top - 195;

        }


        if (
            left < 5
        ) {

            left = 5;

        }


        if (
            top < 5
        ) {

            top = 5;

        }


        popup.style.left =
            left + "px";


        popup.style.top =
            top + "px";


        event.stopPropagation();

    }


    // =========================================
    // HIDE POPUP
    // =========================================

    function hidePopup() {

        document.getElementById(
            "infoPopup"
        ).style.display =
            "none";

    }


    document.addEventListener(
        "click",
        event => {

            const popup =
                document.getElementById(
                    "infoPopup"
                );


            if (
                !popup.contains(
                    event.target
                )
            ) {

                hidePopup();

            }

        }
    );


    // =========================================
    // PREVIOUS WEEK
    // =========================================

    window.previousWeek =
        function() {

            weekStart.setDate(
                weekStart.getDate() - 7
            );


            updateWeekRange();

            renderTable();

            renderWeekList();

        };


    // =========================================
    // NEXT WEEK
    // =========================================

    window.nextWeek =
        function() {

            weekStart.setDate(
                weekStart.getDate() + 7
            );


            updateWeekRange();

            renderTable();

            renderWeekList();

        };


    // =========================================
    // CURRENT WEEK
    // =========================================

    window.currentWeek =
        function() {

            weekStart =
                getMonday(
                    new Date()
                );


            updateWeekRange();

            renderTable();

            renderWeekList();

        };


    // =========================================
    // OPEN/CLOSE WEEK LIST
    // =========================================

    window.toggleWeekList =
        function() {

            const list =
                document.getElementById(
                    "weekList"
                );


            list.classList.toggle(
                "show"
            );


            if (
                list.classList.contains(
                    "show"
                )
            ) {

                renderWeekList();

            }

        };


    // =========================================
    // RENDER WEEK LIST
    // =========================================

    function renderWeekList() {

        const list =
            document.getElementById(
                "weekList"
            );


        list.innerHTML =
            "";


        const currentMonday =
            getMonday(
                new Date()
            );


        for (
            let i = -20;
            i <= 20;
            i++
        ) {

            const monday =
                new Date(
                    currentMonday
                );


            monday.setDate(
                monday.getDate() +
                i * 7
            );


            const saturday =
                new Date(
                    monday
                );


            saturday.setDate(
                saturday.getDate() +
                5
            );


            const mondayText =
                formatDateRu(
                    formatDate(
                        monday
                    )
                );


            const saturdayText =
                formatDateRu(
                    formatDate(
                        saturday
                    )
                );


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "week-option";


            if (
                formatDate(monday) ===
                formatDate(weekStart)
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                i === 0
            ) {

                button.classList.add(
                    "current-week"
                );

            }


            if (
                i === 0
            ) {

                button.textContent =
                    `⭐ Текущая неделя — ${mondayText} — ${saturdayText}`;

            }
            else {

                button.textContent =
                    `${mondayText} — ${saturdayText}`;

            }


            button.addEventListener(
                "click",
                () => {

                    selectWeek(
                        monday
                    );

                }
            );


            list.appendChild(
                button
            );

        }

    }


    // =========================================
    // SELECT WEEK
    // =========================================

    function selectWeek(
        date
    ) {

        weekStart =
            getMonday(
                date
            );


        updateWeekRange();

        renderTable();


        document
            .getElementById(
                "weekList"
            )
            .classList.remove(
                "show"
            );


        renderWeekList();

    }


    // =========================================
    // MAIN MENU
    // =========================================

    window.goBack =
        function() {

            window.location.href =
                "index.html";

        };


    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            String(
                text ?? ""
            );


        return div.innerHTML;

    }


    // =========================================
    // STATUS
    // =========================================

    function showStatus(
        message
    ) {

        const status =
            document.getElementById(
                "status"
            );


        status.textContent =
            message;


        status.classList.add(
            "show"
        );


        setTimeout(
            () => {

                status.classList.remove(
                    "show"
                );

            },
            2500
        );

    }


    // =========================================
    // START
    // =========================================

    async function start() {

        try {

            weekStart =
                getMonday(
                    new Date()
                );


            await loadSettings();

            await loadStudents();

            await loadAttendance();


            updateWeekRange();

            renderTable();

            renderWeekList();


            const today =
                formatDate(
                    new Date()
                );


            const info =
                getAttestationInfo(
                    today
                );


            if (info) {

                document.getElementById(
                    "semesterInfo"
                ).textContent =
                    `${info.semester} семестр • Аттестация №${info.attestation}`;

            }
            else {

                document.getElementById(
                    "semesterInfo"
                ).textContent =
                    "Семестр / аттестация не определены";

            }

        }
        catch (error) {

            console.error(
                "Ошибка запуска:",
                error
            );


            document.getElementById(
                "tableWrapper"
            ).innerHTML = `

                <div class="empty">

                    ❌ Ошибка загрузки данных.

                    <br><br>

                    Откройте консоль браузера
                    (F12 → Console)
                    для подробностей.

                </div>

            `;

        }

    }


    // =========================================
    // ATTESTATION
    // =========================================

    function getAttestationInfo(
        dateString
    ) {

        const date =
            new Date(
                dateString +
                "T00:00:00"
            );


        const periods = [

            {
                semester: 1,
                attestation: 1,

                period:
                    settings
                        .semester1
                        ?.attestation1

            },

            {
                semester: 1,
                attestation: 2,

                period:
                    settings
                        .semester1
                        ?.attestation2

            },

            {
                semester: 2,
                attestation: 1,

                period:
                    settings
                        .semester2
                        ?.attestation1

            },

            {
                semester: 2,
                attestation: 2,

                period:
                    settings
                        .semester2
                        ?.attestation2

            }

        ];


        for (
            const item of periods
        ) {

            if (
                !item.period?.start ||
                !item.period?.end
            ) {

                continue;

            }


            const start =
                new Date(
                    item.period.start +
                    "T00:00:00"
                );


            const end =
                new Date(
                    item.period.end +
                    "T23:59:59"
                );


            if (
                date >= start &&
                date <= end
            ) {

                return item;

            }

        }


        return null;

    }


    // =========================================
    // START APPLICATION
    // =========================================

    start();

</script>
