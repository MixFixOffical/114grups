<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cowboy Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      background: #5f4be8;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      height: 64px; background: #3b2aa8; display: flex;
      align-items: center; justify-content: space-between; padding: 0 32px; position: relative; z-index: 2;
    }
    .logo { font-size: 26px; font-weight: 800; position: relative; }
    .logo::before {
      content: ""; position: absolute; top: -12px; right: 2px; width: 12px; height: 6px;
      border-left: 3px solid #6ccf4a; border-bottom: 3px solid #6ccf4a; transform: rotate(-45deg);
    }
    .btn-pill {
      background: #66bb5c; border: none; color: #fff; font-family: inherit;
      font-weight: 700; font-size: 15px; padding: 12px 40px; border-radius: 30px; cursor: pointer; text-decoration: none;
    }
    .burger { width: 30px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: none; border: none; }
    .burger span { height: 3px; background: #fff; border-radius: 2px; }

    main {
      flex: 1; position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px 16px 60px; text-align: center;
    }
    .yellow {
      position: absolute; top: 0; left: 0; width: 524px; height: 340px;
      background: #ffc540; clip-path: polygon(0 0, 94.5% 0, 100% 50%, 0 100%); pointer-events: none;
    }
    .main-logo { position: relative; z-index: 1; font-size: 44px; font-weight: 800; margin-bottom: 40px; }
    h1 { position: relative; z-index: 1; font-size: 20px; font-weight: 700; margin-bottom: 26px; }

    .field {
      position: relative; z-index: 1; width: 220px; height: 48px; border: none;
      border-radius: 6px; background: #fff; font-family: inherit; font-size: 15px;
      font-weight: 500; color: #1d1f3a; text-align: center; outline: none; margin-bottom: 24px;
    }
    .field::placeholder { color: #9a9ad0; }
    .btn-green {
      position: relative; z-index: 1; width: 200px; height: 48px; border: none;
      border-radius: 24px; background: #66bb5c; color: #fff; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .message { position: relative; z-index: 1; min-height: 22px; margin-top: 16px; font-size: 14px; font-weight: 700; }
    .message.error { color: #ffc540; }
    .legal { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 14px; opacity: .9; }

    /* Боковое меню */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .menu {
      position: fixed; top: 0; right: 0; height: 100%; width: 360px; max-width: 100%;
      background: #3b2aa8; transform: translateX(100%); transition: transform .3s ease; z-index: 11; display: flex; flex-direction: column; padding: 20px 32px;
    }
    .menu.open { transform: none; }
    .menu-close { align-self: flex-end; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; margin-bottom: 20px; }
    .menu-list { list-style: none; display: flex; flex-direction: column; gap: 30px; }
    .menu-list button { color: #fff; font-family: inherit; font-weight: 700; font-size: 17px; background: none; border: none; cursor: pointer; display: flex; gap: 18px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Cowboy Quiz</div>
    <div class="header-right">
      <button class="btn-pill auth-btn" type="button">Войти</button>
      <button class="burger" id="burger" type="button"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <div class="yellow" aria-hidden="true"></div>
    <div class="main-logo">Cowboy Quiz</div>
    <h1 id="title">Введите код для участия в игре</h1>

    <!-- Форма кода -->
    <form id="codeForm" novalidate>
      <input class="field" id="codeInput" type="text" inputmode="numeric" maxlength="4" placeholder="квиз код">
      <br>
      <button class="btn-green" id="submitBtn" type="submit">Подключиться</button>
    </form>

    <!-- Форма ввода никнейма -->
    <form id="nameForm" novalidate hidden>
      <input class="field" id="nameInput" type="text" maxlength="20" placeholder="Твой никнейм">
      <br>
      <button class="btn-green" id="nameBtn" type="submit">Вступить в игру</button>
    </form>

    <p class="message" id="message" role="status"></p>
    <div class="legal">Политика конфиденциальности &nbsp;|&nbsp; Пользовательское соглашение</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, setDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
      authDomain: "sokrat-7c938.firebaseapp.com",
      projectId: "sokrat-7c938",
      storageBucket: "sokrat-7c938.firebasestorage.app",
      messagingStorageSenderId: "19858604945",
      appId: "1:19858604945:web:244b77bbe5afb849481030"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    let pendingCode = null;

    // Автоподстановка кода из QR-кода (например, index.html?code=0109)
    window.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlCode = urlParams.get("code");
      if (urlCode) {
        $("codeInput").value = urlCode;
        try {
          const snap = await getDoc(doc(db, "games", urlCode));
          if (snap.exists() && snap.data().status === "waiting") {
            pendingCode = urlCode;
            $("codeForm").hidden = true;
            $("nameForm").hidden = false;
            $("title").textContent = "Как тебя зовут?";
            $("nameInput").focus();
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        $("codeInput").focus();
      }
    });

    function showMessage(text, type) {
      $("message").textContent = text;
      $("message").className = "message " + (type || "");
    }

    // Шаг 1: Проверка введенного кода
    $("codeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = $("codeInput").value.replace(/\D/g, "");
      if (code.length < 4) return showMessage("Введи код игры", "error");

      try {
        const snap = await getDoc(doc(db, "games", code));
        if (!snap.exists()) return showMessage("Игра с таким кодом не найдена", "error");
        
        if (snap.data().status !== "waiting") return showMessage("Игра уже началась или завершена", "error");

        pendingCode = code;
        $("codeForm").hidden = true;
        $("nameForm").hidden = false;
        $("title").textContent = "Как тебя зовут?";
        $("nameInput").focus();
      } catch (err) {
        console.error(err);
        showMessage("Ошибка связи с базой", "error");
      }
    });

    // Шаг 2: Ввод никнейма и мгновенный переход на p.html
    $("nameForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("nameInput").value.trim();
      if (!name) return showMessage("Введи никнейм", "error");

      try {
        const playersRef = collection(db, "games", pendingCode, "players");
        const players = await getDocs(playersRef);
        const taken = players.docs.some(d => (d.data().name || "").toLowerCase() === name.toLowerCase());
        if (taken) return showMessage("Такой никнейм уже занят", "error");

        const pid = Math.random().toString(36).slice(2, 10);
        await setDoc(doc(playersRef, pid), {
          name,
          joinedAt: Date.now()
        });

        // Плавный переход на p.html с передачей кода и имени в URL
        location.href = `p.html?code=${pendingCode}&name=${encodeURIComponent(name)}`;
      } catch (err) {
        console.error(err);
        showMessage("Не удалось войти в игру", "error");
      }
    });
  </script>
</body>
</html>
