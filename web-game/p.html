<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cowboy Quiz — Участник</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg: #f3f4f8;
      --header-bg: #3b2aa8;
      --violet: #5f4be8;
      --violet-light: #ecebfb;
      --green: #66bb5c;
      --red: #e5484d;
      --ink: #1d1f3a;
      --muted: #6b6f8f;
      --line: #e4e6f0;
    }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 56px; background: var(--header-bg); display: flex;
      align-items: center; justify-content: space-between; padding: 0 20px; color: #fff;
    }
    .logo { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; }
    .btn-exit { background: transparent; border: 1px solid #fff; color: #fff; padding: 5px 16px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; }

    .top-banner { background: var(--violet); height: 180px; width: 100%; }

    main {
      flex: 1; max-width: 1050px; width: 100%; margin: -130px auto 40px;
      padding: 0 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px;
    }

    .left-col { display: flex; flex-direction: column; gap: 16px; }
    
    .waiting-card { background: #4634c0; border-radius: 16px; padding: 32px 20px; color: #fff; text-align: center; }
    .timer-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .notice-bar { background: var(--violet-light); color: var(--violet); font-size: 13px; font-weight: 600; padding: 12px; border-radius: 10px; text-align: center; }

    .quiz-info-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    .quiz-info-card h2 { font-size: 20px; font-weight: 800; }

    .right-col { display: flex; flex-direction: column; gap: 16px; }
    .status-card { background: #fff; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    .code-title { font-size: 12px; color: var(--muted); font-weight: 600; }
    .code-val { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin: 4px 0 16px; }
    .connected-count { font-size: 26px; font-weight: 800; color: var(--ink); margin-top: 4px; }

    /* Экран синхронного отсчета */
    .screen-countdown {
      position: fixed; inset: 0; background: var(--violet);
      display: grid; place-items: center; color: #fff; z-index: 300;
    }
    .countdown-box { text-align: center; }
    .circle-num {
      width: 160px; height: 160px; border-radius: 50%; margin: 0 auto;
      border: 8px solid rgba(255,255,255,0.2); border-top-color: var(--green);
      display: grid; place-items: center; font-size: 70px; font-weight: 800;
    }

    /* Игровой процесс */
    .quiz-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    .q-step { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .q-text { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn {
      background: #f8f9fc; border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
      font-weight: 700; font-size: 14px; cursor: pointer; text-align: left; width: 100%;
      transition: background 0.2s;
    }
    /* Блокировка и выбор */
    .opt-btn.selected { background: var(--violet) !important; color: #fff !important; border-color: var(--violet) !important; }
    .opt-btn.disabled { opacity: 0.7; cursor: not-allowed; }

    .opt-left { display: flex; align-items: center; gap: 12px; }
    .opt-letter { width: 28px; height: 28px; border-radius: 50%; background: #ecebfb; color: var(--violet); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
    .opt-btn.selected .opt-letter { background: rgba(255,255,255,0.2); color: #fff; }

    .toast-status {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 13px; color: #fff; z-index: 200;
    }
    .toast-status.purple { background: var(--violet); }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; margin-top: -90px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#">майКвиз</a>
    <button class="btn-exit" onclick="location.href='index.html'">Выйти</button>
  </header>

  <div class="top-banner"></div>

  <!-- ЭКРАН 1: ОЖИДАНИЕ СТАРТА -->
  <main id="waitingMain">
    <div class="left-col">
      <div class="waiting-card">
        <div class="timer-title">Ждём игроков, скоро начнем.</div>
      </div>
      <div class="notice-bar">Организатор использует бесплатную версию майКвиз</div>
      <div class="quiz-info-card">
        <h2 id="quizTitle">Тестовая викторина</h2>
      </div>
    </div>

    <div class="right-col">
      <div class="status-card">
        <div class="code-title">Код викторины:</div>
        <div class="code-val" id="codeDisplay">------</div>
        <div class="code-title">Подключилось игроков:</div>
        <div class="connected-count" id="playerCount">0</div>
      </div>
    </div>
  </main>

  <!-- ЭКРАН 2: СИНХРОННЫЙ ОТСЧЕТ -->
  <div class="screen-countdown" id="countdownScreen" hidden>
    <div class="countdown-box">
      <div class="circle-num" id="countdownVal">8</div>
      <div style="margin-top: 16px; font-weight: 700; font-size: 18px;">Старт игры...</div>
    </div>
  </div>

  <!-- ЭКРАН 3: ВОПРОСЫ ИГРЫ -->
  <main id="gameMain" hidden>
    <div class="quiz-card">
      <div class="notice-bar" style="margin-bottom: 16px;">Организатор использует бесплатную версию майКвиз</div>
      <div class="q-step">Вопрос 1 / 1</div>
      <div class="q-text" id="questionText">Загрузка вопроса...</div>

      <div class="options-list" id="optionsList">
        <button class="opt-btn" onclick="selectOption(this, 0)">
          <div class="opt-left"><div class="opt-letter">A</div> <span id="optA">Вариант 1</span></div>
        </button>
        <button class="opt-btn" onclick="selectOption(this, 1)">
          <div class="opt-left"><div class="opt-letter">B</div> <span id="optB">Вариант 2</span></div>
        </button>
        <button class="opt-btn" onclick="selectOption(this, 2)">
          <div class="opt-left"><div class="opt-letter">C</div> <span id="optC">Вариант 3</span></div>
        </button>
        <button class="opt-btn" onclick="selectOption(this, 3)">
          <div class="opt-left"><div class="opt-letter">D</div> <span id="optD">Вариант 4</span></div>
        </button>
      </div>
    </div>

    <div class="right-col">
      <div class="status-card">
        <div class="code-title" style="margin-bottom: 8px;">Время на ответ:</div>
        <div style="font-size: 28px; font-weight: 800; color: var(--violet);" id="gameTimer">15</div>
      </div>
    </div>
  </main>

  <div class="toast-status purple" id="statusToast" hidden>Ответ принят!</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
      authDomain: "sokrat-7c938.firebaseapp.com",
      projectId: "sokrat-7c938",
      storageBucket: "sokrat-7c938.firebasestorage.app",
      messagingSenderId: "19858604945",
      appId: "1:19858604945:web:244b77bbe5afb849481030"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const gameCode = urlParams.get('code');

    let quizData = null;
    let hasAnswered = false; // Флаг: ответил ли игрок

    if (!gameCode) {
      alert("Не указан код викторины!");
      location.href = "index.html";
    } else {
      document.getElementById("codeDisplay").textContent = gameCode;

      // Получаем информацию об игре и викторине заранее
      async function fetchQuizInfo() {
        try {
          const gameSnap = await getDoc(doc(db, "games", gameCode));
          if (gameSnap.exists()) {
            const quizId = gameSnap.data().quizId;
            const quizSnap = await getDoc(doc(db, "quizzes", quizId));
            if (quizSnap.exists()) {
              quizData = quizSnap.data();
              document.getElementById("quizTitle").textContent = quizData.title || "Тестовая викторина";
            }
          }
        } catch (e) {
          console.error(e);
        }
      }
      fetchQuizInfo();

      // Считаем игроков
      onSnapshot(collection(db, "games", gameCode, "players"), (snap) => {
        document.getElementById("playerCount").textContent = snap.size;
      });

      // Синхронный запуск отсчета
      onSnapshot(doc(db, "games", gameCode), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.status === "running" && data.startTime) {
            startSyncCountdown(data.startTime);
          }
        }
      });
    }

    let countdownStarted = false;
    function startSyncCountdown(startTime) {
      if (countdownStarted) return;
      countdownStarted = true;

      document.getElementById("waitingMain").hidden = true;
      const cdScreen = document.getElementById("countdownScreen");
      cdScreen.hidden = false;

      const valEl = document.getElementById("countdownVal");

      // Вычисляем точное оставшееся время отсчета (8 секунд) с учетом задержки сети
      const interval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const remaining = 8 - elapsed;

        if (remaining <= 0) {
          clearInterval(interval);
          cdScreen.hidden = true;
          loadQuestionContent(); // Загружаем вопросы викторины
          document.getElementById("gameMain").hidden = false;
        } else {
          valEl.textContent = remaining;
        }
      }, 200);
    }

    // Загрузка вопросов из базы
    function loadQuestionContent() {
      if (quizData && quizData.questions && quizData.questions.length > 0) {
        const q = quizData.questions[0]; // Первый вопрос
        document.getElementById("questionText").textContent = q.text || "Вопрос";
        if (q.options && q.options.length >= 4) {
          document.getElementById("optA").textContent = q.options[0];
          document.getElementById("optB").textContent = q.options[1];
          document.getElementById("optC").textContent = q.options[2];
          document.getElementById("optD").textContent = q.options[3];
        }
      }
    }

    // Выбор ответа с полной блокировкой повторного нажатия
    window.selectOption = function(btn, index) {
      if (hasAnswered) return; // Если уже ответил — ничего не делаем, нельзя сменить!
      hasAnswered = true;

      // Подсвечиваем выбранный вариант
      btn.classList.add("selected");

      // Блокируем ВСЕ кнопки вариантов ответа
      document.querySelectorAll(".opt-btn").forEach(b => {
        b.classList.add("disabled");
        b.style.pointerEvents = "none"; // Отключаем клики
      });

      const toast = document.getElementById("statusToast");
      toast.hidden = false;
      setTimeout(() => { toast.hidden = true; }, 2000);
    };
  </script>
</body>
</html>
