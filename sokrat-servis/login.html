<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СОКРАТ — Вход и регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 36px 40px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 13.5px;
            margin-bottom: 26px;
            line-height: 1.4;
        }

        .tabs {
            display: flex;
            background: #f3f4f6;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: #fff;
            color: #667eea;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .form {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .form.active { display: block; }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14.5px;
            transition: all 0.2s;
            background: #f9fafb;
            color: #1f2937;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .password-wrapper { position: relative; }

        .password-wrapper input { padding-right: 44px; }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
            color: #9ca3af;
            padding: 4px;
            line-height: 1;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 13.5px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #4b5563;
            cursor: pointer;
        }

        .remember input {
            width: auto;
            cursor: pointer;
            accent-color: #667eea;
        }

        .forgot {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 16px;
            display: none;
        }

        .message.show { display: block; }
        .message.error   { background: #fef2f2; color: #dc2626; }
        .message.success { background: #f0fdf4; color: #16a34a; }

        .hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .hint.invalid { color: #dc2626; }
        .hint.valid   { color: #16a34a; }

        /* Плитки выбора должности */
        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .role-option { position: relative; }

        .role-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .role-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 6px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            color: #4b5563;
            text-align: center;
            transition: all 0.2s;
            margin-bottom: 0;
            line-height: 1.2;
            min-height: 62px;
        }

        .role-option label:hover {
            border-color: #c7d2fe;
            background: #f5f7ff;
        }

        .role-option input:checked + label {
            border-color: #667eea;
            background: #eef2ff;
            color: #4338ca;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .role-icon {
            font-size: 18px;
            line-height: 1;
        }

        .note {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">С</div>
            <div class="logo-text">СОКРАТ</div>
        </div>
        <p class="subtitle">Сервис мониторинга выполнения задач учебной части</p>

        <div class="tabs">
            <button class="tab active" data-tab="login">Вход</button>
            <button class="tab" data-tab="register">Регистрация</button>
        </div>

        <div class="message" id="message"></div>

        <!-- ================= ВХОД ================= -->
        <form class="form active" id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Почта</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" data-target="loginPassword">👁</button>
                </div>
            </div>

            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Запомнить меня
                </label>
                <a href="#" class="forgot" id="forgotLink">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Войти</button>
        </form>

        <!-- ============== РЕГИСТРАЦИЯ ============== -->
        <form class="form" id="registerForm" novalidate>
            <div class="form-group">
                <label for="regName">ФИО</label>
                <input type="text" id="regName" placeholder="Иванов Иван Иванович" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="regLogin">Логин</label>
                <input type="text" id="regLogin" placeholder="ivanov" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="regEmail">Почта</label>
                <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label>Должность</label>
                <div class="roles">
                    <div class="role-option">
                        <input type="radio" id="roleTeacher" name="role" value="teacher" checked>
                        <label for="roleTeacher">
                            <span class="role-icon">👨‍🏫</span>
                            Преподаватель
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleMethodist" name="role" value="methodist">
                        <label for="roleMethodist">
                            <span class="role-icon">📋</span>
                            Методист
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleCmc" name="role" value="cmc_chair">
                        <label for="roleCmc">
                            <span class="role-icon">🗂️</span>
                            Председатель ЦМК
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleDeputy" name="role" value="deputy_ur">
                        <label for="roleDeputy">
                            <span class="role-icon">📝</span>
                            Зам. по УР
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleDirector" name="role" value="director">
                        <label for="roleDirector">
                            <span class="role-icon">🎓</span>
                            Директор
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleAdmin" name="role" value="admin">
                        <label for="roleAdmin">
                            <span class="role-icon">⚙️</span>
                            Администратор
                        </label>
                    </div>
                </div>
                <p class="note">Выберите свою должность — от неё зависит набор доступных задач</p>
            </div>

            <div class="form-group">
                <label for="regPassword">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Минимум 6 символов" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="regPassword">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label for="regPassword2">Повтор пароля</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword2" placeholder="Повторите пароль" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="regPassword2">👁</button>
                </div>
                <div class="hint" id="passwordHint"></div>
            </div>

            <button type="submit" class="btn-submit" id="registerBtn">Зарегистрироваться</button>
        </form>
    </div>

    <script type="module">
        import { auth, db, HOME_BY_ROLE } from './firebase-config.js';
        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            updateProfile,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import {
            doc, setDoc, getDoc, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ================== УТИЛИТЫ ==================
        const messageBox = document.getElementById('message');

        function showMessage(text, type = 'error') {
            messageBox.textContent = text;
            messageBox.className = `message show ${type}`;
            if (type === 'success') {
                setTimeout(() => messageBox.classList.remove('show'), 4000);
            }
        }

        function hideMessage() {
            messageBox.classList.remove('show');
        }

        function translateError(code) {
            const map = {
                'auth/email-already-in-use': 'Эта почта уже зарегистрирована',
                'auth/invalid-email': 'Некорректный адрес почты',
                'auth/weak-password': 'Слишком слабый пароль (минимум 6 символов)',
                'auth/user-not-found': 'Пользователь с такой почтой не найден',
                'auth/wrong-password': 'Неверный пароль',
                'auth/invalid-credential': 'Неверная почта или пароль',
                'auth/too-many-requests': 'Слишком много попыток. Попробуйте позже',
                'auth/network-request-failed': 'Проблема с сетью. Проверьте подключение'
            };
            return map[code] || 'Произошла ошибка. Попробуйте ещё раз';
        }

        // Роутинг по роли
        function goHome(role) {
            const page = HOME_BY_ROLE[role] || 'login.html';
            window.location.href = page;
        }

        // ================== ТАБЫ ==================
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                hideMessage();
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
            });
        });

        // ============ ПОКАЗ/СКРЫТИЕ ПАРОЛЯ ============
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? '🙈' : '👁';
            });
        });

        // ============ ВАЛИДАЦИЯ ПАРОЛЕЙ ============
        const regPassword = document.getElementById('regPassword');
        const regPassword2 = document.getElementById('regPassword2');
        const passwordHint = document.getElementById('passwordHint');

        function checkPasswords() {
            if (!regPassword2.value) {
                passwordHint.textContent = '';
                passwordHint.className = 'hint';
                return;
            }
            if (regPassword.value !== regPassword2.value) {
                passwordHint.textContent = 'Пароли не совпадают';
                passwordHint.className = 'hint invalid';
            } else if (regPassword.value.length < 6) {
                passwordHint.textContent = 'Минимум 6 символов';
                passwordHint.className = 'hint invalid';
            } else {
                passwordHint.textContent = 'Пароли совпадают ✓';
                passwordHint.className = 'hint valid';
            }
        }

        regPassword.addEventListener('input', checkPasswords);
        regPassword2.addEventListener('input', checkPasswords);

        // ================== ВХОД ==================
        const loginForm = document.getElementById('loginForm');
        const loginBtn  = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                return showMessage('Заполните все поля');
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);

                // Загружаем профиль → определяем роль → редирект
                const snap = await getDoc(doc(db, 'users', cred.user.uid));
                if (!snap.exists()) {
                    showMessage('Профиль пользователя не найден в базе');
                    return;
                }

                const role = snap.data().role;
                if (!role || !HOME_BY_ROLE[role]) {
                    showMessage('Неизвестная роль. Обратитесь к администратору');
                    return;
                }

                showMessage('Успешный вход! Перенаправление...', 'success');
                setTimeout(() => goHome(role), 500);
            } catch (err) {
                showMessage(translateError(err.code));
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });

        // ============ СБРОС ПАРОЛЯ ============
        document.getElementById('forgotLink').addEventListener('click', async (e) => {
            e.preventDefault();
            hideMessage();
            const email = document.getElementById('loginEmail').value.trim();

            if (!email) {
                return showMessage('Введите почту в поле выше, чтобы сбросить пароль');
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('Письмо для сброса пароля отправлено на ' + email, 'success');
            } catch (err) {
                showMessage(translateError(err.code));
            }
        });

        // ============== РЕГИСТРАЦИЯ ==============
        const registerForm = document.getElementById('registerForm');
        const registerBtn  = document.getElementById('registerBtn');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const name      = document.getElementById('regName').value.trim();
            const login     = document.getElementById('regLogin').value.trim();
            const email     = document.getElementById('regEmail').value.trim();
            const password  = regPassword.value;
            const password2 = regPassword2.value;
            const role      = document.querySelector('input[name="role"]:checked')?.value;

            // Валидация
            if (!name || !login || !email || !password || !password2 || !role) {
                return showMessage('Заполните все поля');
            }
            if (name.split(' ').filter(Boolean).length < 2) {
                return showMessage('Укажите ФИО полностью (минимум фамилия и имя)');
            }
            if (!/^[a-zA-Z0-9_.]{3,20}$/.test(login)) {
                return showMessage('Логин: 3–20 символов, только латиница, цифры, _ и .');
            }
            if (password.length < 6) {
                return showMessage('Пароль должен содержать минимум 6 символов');
            }
            if (password !== password2) {
                return showMessage('Пароли не совпадают');
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Создание аккаунта...';

            try {
                // 1. Создаём пользователя в Firebase Auth
                const cred = await createUserWithEmailAndPassword(auth, email, password);

                // 2. Имя в Auth-профиль
                await updateProfile(cred.user, { displayName: name });

                // 3. Проверка уникальности логина
                const loginRef = doc(db, 'logins', login.toLowerCase());
                const loginSnap = await getDoc(loginRef);
                if (loginSnap.exists()) {
                    showMessage('Такой логин уже занят. Выберите другой');
                    await cred.user.delete();
                    return;
                }

                // 4. Профиль в Firestore
                await setDoc(doc(db, 'users', cred.user.uid), {
                    uid: cred.user.uid,
                    name,
                    login: login.toLowerCase(),
                    email,
                    role,                  // teacher | methodist | cmc_chair | deputy_ur | director | admin
                    createdAt: serverTimestamp()
                });

                // 5. Резервируем логин
                await setDoc(loginRef, {
                    uid: cred.user.uid,
                    createdAt: serverTimestamp()
                });

                showMessage('Аккаунт создан! Перенаправление...', 'success');
                setTimeout(() => goHome(role), 800);
            } catch (err) {
                showMessage(translateError(err.code));
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Зарегистрироваться';
            }
        });
    </script>
</body>
</html>
