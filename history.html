<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#2454e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Посещаемость — журнал</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   АДАПТИВНЫЙ ЗУМ
========================================================= */
html { zoom: 1; }

@media (min-width: 1920px) { html { zoom: 1; } }
@media (min-width: 1600px) and (max-width: 1919px) { html { zoom: 0.92; } }
@media (min-width: 1440px) and (max-width: 1599px) { html { zoom: 0.85; } }
@media (min-width: 1280px) and (max-width: 1439px) { html { zoom: 0.78; } }
@media (min-width: 1024px) and (max-width: 1279px) { html { zoom: 0.70; } }
@media (min-width: 769px) and (max-width: 1023px) { html { zoom: 0.62; } }
@media (max-width: 768px) { html { zoom: 1 !important; } }

/* =========================================================
   TOKENS
========================================================= */
:root {
    --primary: #2454e8;
    --primary-dark: #17348f;
    --primary-light: #eef2ff;
    --primary-glow: rgba(36,84,232,.35);
    --teal: #0d9488;       --teal-light: #ecfdf9;
    --violet: #7c3aed;     --violet-light: #f4f0ff;
    --amber: #d97706;      --amber-light: #fef8ec;
    --red: #dc2626;        --red-light: #fef2f2;
    --green: #16a34a;      --green-light: #f0fdf4;
    --slate: #64748b;      --slate-light: #f1f5f9;

    --text: #0f1729;
    --text-2: #5b6478;
    --text-3: #9aa3b5;

    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: rgba(220,226,238,.9);
    --border-2: rgba(203,213,225,.9);

    --bg-1: #f9fafc;
    --bg-2: #f4f6fb;
    --bg-3: #eef1f9;

    --shadow-sm: 0 1px 2px rgba(15,23,42,.05), 0 1px 1px rgba(15,23,42,.03);
    --shadow-md: 0 10px 24px -8px rgba(15,23,42,.10), 0 2px 6px rgba(15,23,42,.05);
    --shadow-lg: 0 26px 50px -16px rgba(15,23,42,.18), 0 8px 18px -10px rgba(15,23,42,.09);

    --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px;
    --ease: cubic-bezier(.22,1,.36,1);
    --ease-bounce: cubic-bezier(.34,1.56,.64,1);

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html[data-theme="dark"] {
    --primary: #5b83ff;
    --primary-dark: #3b5fd6;
    --primary-light: rgba(91,131,255,.14);
    --teal: #2dd4bf;      --teal-light: rgba(45,212,191,.14);
    --violet: #a78bfa;    --violet-light: rgba(167,139,250,.14);
    --amber: #fbbf24;     --amber-light: rgba(251,191,36,.14);
    --red: #fb7185;       --red-light: rgba(251,113,133,.14);
    --green: #4ade80;     --green-light: rgba(74,222,128,.14);
    --slate: #94a3b8;     --slate-light: rgba(148,163,184,.14);

    --text: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;

    --surface: #1e293b;
    --surface-2: #172033;
    --border: rgba(71,85,105,.5);
    --border-2: rgba(71,85,105,.8);

    --bg-1: #0b1220;
    --bg-2: #0f172a;
    --bg-3: #111c33;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 10px 24px -8px rgba(0,0,0,.5);
    --shadow-lg: 0 26px 50px -16px rgba(0,0,0,.6);
}

/* =========================================================
   RESET
========================================================= */
*, *::before, *::after { box-sizing: border-box; }

html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 6% 0%, rgba(36,84,232,.06), transparent 40%),
        radial-gradient(circle at 96% 10%, rgba(124,58,237,.04), transparent 38%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .3s ease;
}

h1, h2, .title, .week-title, .student-name, .popup-title {
    font-family: "Plus Jakarta Sans", "Inter", sans-serif;
}

button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
input, select, textarea { font-family: inherit; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}

/* =========================================================
   AUTH GUARD
========================================================= */
#authGuardOverlay {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--bg-1);
}
#authGuardOverlay .auth-spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid var(--primary-light);
    border-top-color: var(--primary);
    animation: authSpin .8s linear infinite;
}
#authGuardOverlay .auth-guard-text {
    font-size: 14.5px; font-weight: 600; color: var(--text-2);
}
@keyframes authSpin { to { transform: rotate(360deg); } }

body.auth-pending > header,
body.auth-pending > .container { display: none !important; }

/* =========================================================
   HEADER
========================================================= */
header {
    background: linear-gradient(120deg, #17348f 0%, #2454e8 60%, #3b5fea 100%);
    color: #fff;
    padding: calc(var(--safe-top) + 14px) 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 12px 30px -12px rgba(36,84,232,.38);
}

.header-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

.header-logo {
    width: 42px; height: 42px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 13px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.2);
}
.header-logo svg { width: 22px; height: 22px; }

.title {
    font-size: 22px; font-weight: 700; letter-spacing: -.3px;
    display: flex; align-items: center; gap: 9px;
}
.subtitle {
    margin-top: 4px; font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,.78);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 480px;
}

.header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

.clock { text-align: right; }
.time { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.date { font-size: 13px; margin-top: 3px; color: rgba(255,255,255,.78); }

.theme-toggle {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    transition: transform .25s var(--ease-bounce), background .15s;
}
.theme-toggle:hover { background: rgba(255,255,255,.22); }
.theme-toggle:active { transform: scale(.9); }
.theme-toggle svg { width: 20px; height: 20px; }

/* =========================================================
   CONTAINER
========================================================= */
.container {
    max-width: 1500px;
    width: 100%;
    margin: 24px auto 40px;
    padding: 0 20px;
    padding-bottom: calc(40px + var(--safe-bottom));
}

@media (max-width: 1600px) {
    .container { max-width: 1300px; }
}

@media (max-width: 1280px) {
    .container { max-width: 1100px; }
}

/* =========================================================
   PANEL
========================================================= */
.panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
}

.panel-title {
    font-size: 19px; font-weight: 700; letter-spacing: -.3px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 9px;
}
.panel-title svg { width: 20px; height: 20px; color: var(--primary); }

/* =========================================================
   GROUP PANEL
========================================================= */
.group-panel {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px 20px;
    padding-bottom: 16px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
}
.group-field { display: flex; align-items: center; gap: 9px; }
.group-field-label {
    font-size: 12.5px; font-weight: 600; color: var(--text-2); white-space: nowrap;
}
.group-select {
    height: 40px; padding: 0 12px;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--slate-light); color: var(--text);
    font-size: 14px; font-weight: 600; cursor: pointer;
}
.group-select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
.group-static {
    height: 40px; display: inline-flex; align-items: center;
    padding: 0 14px; border-radius: 11px;
    background: var(--primary-light); color: var(--primary-dark);
    font-size: 14px; font-weight: 700;
}
.curator-name-input {
    height: 40px; width: 230px; padding: 0 12px;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-size: 13.5px; font-weight: 600;
}
.curator-name-input:disabled {
    background: var(--slate-light); color: var(--text-2); cursor: not-allowed;
}
.curator-name-input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
.empty-groups { color: var(--red); font-size: 13.5px; font-weight: 600; }

/* =========================================================
   MODE SWITCH
========================================================= */
.mode-switch {
    display: inline-flex; align-items: center;
    padding: 4px;
    background: var(--slate-light);
    border: 1px solid var(--border);
    border-radius: 12px;
    gap: 2px;
}
.mode-switch button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 9px;
    font-size: 13px; font-weight: 700;
    color: var(--text-2);
    transition: background .2s, color .2s, box-shadow .2s;
    white-space: nowrap;
    min-height: 36px;
}
.mode-switch button svg { width: 14px; height: 14px; }
.mode-switch button:hover { color: var(--text); }
.mode-switch button.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
}
.mode-switch button.active svg { color: var(--primary); }

/* =========================================================
   CONTROLS
========================================================= */
.controls {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 10px;
}

.controls button {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid transparent;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 14.5px; font-weight: 600;
    transition: transform .2s var(--ease), background .2s, box-shadow .2s;
    white-space: nowrap;
    min-height: 42px;
}
.controls button svg { width: 16px; height: 16px; }
.controls button:hover { transform: translateY(-1px); }
.controls button:active { transform: translateY(0) scale(.97); }

.btn-secondary { background: var(--slate-light); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--border); }

.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 18px -6px var(--primary-glow); }
.btn-primary:hover { background: var(--primary-dark); }

.btn-violet { background: var(--violet-light); color: var(--violet); }
.btn-violet:hover { filter: brightness(.95); }

.btn-teal { background: var(--teal-light); color: var(--teal); }
.btn-teal:hover { filter: brightness(.95); }

.btn-back { margin-left: auto; background: var(--slate-light); color: var(--text-2); }
.btn-back:hover { background: var(--border); color: var(--text); }

/* =========================================================
   WEEK LIST
========================================================= */
.week-list {
    display: none;
    margin-top: 15px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
    max-height: 320px;
    overflow-y: auto;
}
.week-list.show { display: block; animation: rise .25s var(--ease); }
.week-option {
    width: 100%; border: 0; background: var(--surface);
    padding: 12px 15px; margin-bottom: 5px;
    border-radius: 11px; cursor: pointer; text-align: left;
    font-size: 14.5px; font-weight: 500;
    color: var(--text);
    transition: background .15s, transform .15s;
}
.week-option:hover { background: var(--primary-light); }
.week-option.selected { background: var(--primary); color: #fff; font-weight: 600; }
.week-option.current-week { border-left: 4px solid var(--teal); }

.week-range {
    margin-top: 14px;
    color: var(--text-2);
    font-size: 14.5px; font-weight: 500;
}

/* =========================================================
   TABLE (DESKTOP)
========================================================= */
.table-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
    width: 100%;
    -webkit-overflow-scrolling: touch;
}

table.journal {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
    font-size: 14.5px;
    table-layout: fixed;
}

table.journal th {
    background: linear-gradient(160deg, #2454e8, #1a3aa8);
    color: #fff;
    padding: 10px 6px;
    border: 1px solid rgba(255,255,255,.12);
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
}

table.journal th.student-column {
    text-align: left;
    padding-left: 18px;
    position: sticky;
    left: 0;
    z-index: 10;
    background: linear-gradient(160deg, #2454e8, #1a3aa8);
}

table.journal td {
    border: 1px solid var(--border);
    text-align: center;
    padding: 6px;
    transition: background .15s;
    background: var(--surface);
    overflow: hidden;
    text-overflow: ellipsis;
}

table.journal td.student-cell {
    text-align: left;
    padding-left: 18px;
    position: sticky;
    left: 0;
    z-index: 5;
    box-shadow: 2px 0 6px -2px rgba(15,23,42,.06);
    background: var(--surface);
}

table.journal tbody tr:hover td.student-cell { background: var(--surface-2); }
table.journal tbody tr:hover td:not(.student-cell):not(.present):not(.absent) {
    background: var(--surface-2);
}

.student-wrapper { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.student-number {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary-light); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    flex-shrink: 0;
}
.student-name {
    font-size: 14.5px; font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.day-header { min-width: 60px; }
.day-name { font-weight: 700; }
.day-date { font-size: 11.5px; margin-top: 3px; opacity: .85; font-weight: 400; }

.lesson-cell {
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, background .12s;
    position: relative;
    font-weight: 700;
    font-size: 15px;
    height: 42px;
}
.lesson-cell:hover {
    background: var(--primary-light);
    box-shadow: inset 0 0 0 1.5px rgba(36,84,232,.3);
}
.lesson-cell.present { color: #0a7a3d; background: #eafbf1; font-size: 18px; }
.lesson-cell.absent { color: #c0272d; background: #fdedee; font-size: 14px; }
.lesson-cell.absent.uv  { color: var(--teal); background: var(--teal-light); }
.lesson-cell.absent.bolezn { color: var(--violet); background: var(--violet-light); }
.lesson-cell.empty-mark { color: var(--text-3); }

body.mode-edit .lesson-cell:hover {
    background: var(--primary-light);
    box-shadow: inset 0 0 0 2px var(--primary);
}
body.mode-edit .lesson-cell:hover::after {
    content: "✎";
    position: absolute;
    top: 2px; right: 3px;
    font-size: 10px;
    color: var(--primary);
    opacity: .7;
}

td.report-col { font-weight: 700; font-size: 14px; }
td.report-total { background: var(--slate-light); color: var(--text); }
td.report-uv { background: var(--teal-light); color: var(--teal); }
td.report-neuv { background: var(--red-light); color: var(--red); }
td.report-note-col {
    font-weight: 400; font-size: 12.5px; text-align: left;
    padding-left: 10px;
    color: var(--text-2);
    white-space: normal;
    word-break: break-word;
}
tr.total-row td {
    background: var(--primary-light);
    font-weight: 700;
}
tr.total-row td.student-cell { color: var(--primary-dark); }

/* =========================================================
   MOBILE CARDS
========================================================= */
.mobile-cards { display: none; }
.mobile-day-tabs {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 10px;
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.mobile-day-tabs::-webkit-scrollbar { display: none; }
.mobile-day-tab {
    flex-shrink: 0;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 13px; font-weight: 700;
    color: var(--text-2);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 76px;
    transition: all .2s var(--ease);
}
.mobile-day-tab .mdt-day { font-size: 11.5px; font-weight: 700; opacity: .8; }
.mobile-day-tab .mdt-date { font-size: 13px; font-weight: 800; }
.mobile-day-tab.active {
    background: var(--primary); color: #fff;
    border-color: var(--primary);
    box-shadow: 0 8px 18px -6px var(--primary-glow);
}
.mobile-day-tab.active .mdt-day { opacity: 1; }

.mobile-students { display: flex; flex-direction: column; gap: 10px; }

.mobile-student {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    animation: rise .35s var(--ease) backwards;
}
.mobile-student-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
}
.mobile-student-index {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: var(--primary-light); color: var(--primary);
    font-size: 12.5px; font-weight: 800;
}
.mobile-student-name {
    font-size: 14.5px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
}

.mobile-lessons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 6px;
}

.mobile-lesson {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    min-height: 56px;
    padding: 6px 4px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    cursor: pointer;
    transition: transform .12s var(--ease-bounce), background .15s, border-color .15s;
    position: relative;
}
.mobile-lesson:active { transform: scale(.94); }
.mobile-lesson-num {
    font-size: 10px; font-weight: 800;
    color: var(--text-3);
}
.mobile-lesson-mark {
    font-size: 16px; font-weight: 900;
    color: var(--text-3);
}
.mobile-lesson.present {
    background: var(--green-light);
    border-color: var(--green);
}
.mobile-lesson.present .mobile-lesson-mark,
.mobile-lesson.present .mobile-lesson-num { color: var(--green); }

.mobile-lesson.absent {
    background: var(--red-light);
    border-color: var(--red);
}
.mobile-lesson.absent .mobile-lesson-mark,
.mobile-lesson.absent .mobile-lesson-num { color: var(--red); }

.mobile-lesson.absent.uv { background: var(--teal-light); border-color: var(--teal); }
.mobile-lesson.absent.uv .mobile-lesson-mark,
.mobile-lesson.absent.uv .mobile-lesson-num { color: var(--teal); }

.mobile-lesson.absent.bolezn { background: var(--violet-light); border-color: var(--violet); }
.mobile-lesson.absent.bolezn .mobile-lesson-mark,
.mobile-lesson.absent.bolezn .mobile-lesson-num { color: var(--violet); }

/* =========================================================
   POPUP
========================================================= */
.info-popup {
    position: fixed;
    display: none;
    background: var(--surface);
    padding: 18px;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    width: 290px;
    z-index: 1000;
    animation: rise .2s var(--ease);
}
.popup-title { font-weight: 700; font-size: 16.5px; margin-bottom: 11px; }
.popup-row { margin-bottom: 7px; font-size: 13.5px; color: var(--text-2); }
.popup-reason {
    background: var(--slate-light);
    padding: 10px 11px; border-radius: 11px;
    margin-top: 10px;
    font-size: 13.5px; line-height: 1.5;
}
.popup-reason strong { color: var(--text); }

/* =========================================================
   EMPTY / LOADING
========================================================= */
.empty {
    text-align: center;
    padding: 55px 20px;
    color: var(--text-2);
    font-size: 15.5px;
}
.spinner {
    width: 36px; height: 36px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    animation: authSpin .8s linear infinite;
}

/* =========================================================
   STATUS / TOAST
========================================================= */
.status {
    position: fixed;
    right: 20px; bottom: calc(20px + var(--safe-bottom));
    background: #101a30;
    color: #fff;
    padding: 13px 19px;
    border-radius: 14px;
    font-size: 13.5px; font-weight: 600;
    box-shadow: var(--shadow-lg);
    display: none;
    z-index: 3000;
    max-width: calc(100vw - 40px);
}
.status.show { display: block; animation: rise .25s var(--ease); }
.status.success { background: var(--green); }
.status.error { background: var(--red); }

@keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   BOTTOM SHEET
========================================================= */
.sheet-overlay {
    position: fixed; inset: 0; z-index: 800;
    display: none; align-items: flex-end; justify-content: center;
    background: rgba(15,23,42,.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}
.sheet-overlay.active { display: flex; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
    width: 100%; max-width: 520px;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 8px 18px calc(18px + var(--safe-bottom));
    box-shadow: 0 -10px 40px rgba(15,23,42,.22);
    animation: sheetUp .35s var(--ease);
    max-height: 90vh; overflow-y: auto;
}
.sheet::before {
    content: ""; display: block;
    width: 40px; height: 4px;
    margin: 6px auto 14px;
    border-radius: 999px;
    background: var(--border-2);
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.sheet-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.sheet-subtitle { color: var(--text-2); font-size: 13px; margin-bottom: 14px; }

.mark-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
}
.mark-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    padding: 14px 6px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--surface-2);
    min-height: 76px;
    transition: transform .15s var(--ease-bounce), border-color .15s, background .15s;
}
.mark-btn:active { transform: scale(.94); }
.mark-btn .mb-icon { font-size: 20px; font-weight: 900; }
.mark-btn .mb-label { font-size: 10.5px; font-weight: 700; color: var(--text-2); }

.mark-btn[data-mark="present"] { color: var(--green); }
.mark-btn[data-mark="present"]:hover,
.mark-btn[data-mark="present"].active {
    border-color: var(--green);
    background: var(--green-light);
}
.mark-btn[data-mark="absent"] { color: var(--red); }
.mark-btn[data-mark="absent"]:hover,
.mark-btn[data-mark="absent"].active {
    border-color: var(--red);
    background: var(--red-light);
}
.mark-btn[data-mark="uv"] { color: var(--teal); }
.mark-btn[data-mark="uv"]:hover,
.mark-btn[data-mark="uv"].active {
    border-color: var(--teal);
    background: var(--teal-light);
}
.mark-btn[data-mark="bolezn"] { color: var(--violet); }
.mark-btn[data-mark="bolezn"]:hover,
.mark-btn[data-mark="bolezn"].active {
    border-color: var(--violet);
    background: var(--violet-light);
}

.reason-form { display: none; margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
.reason-form.show { display: block; animation: rise .25s var(--ease); }
.reason-label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }
.reason-input {
    width: 100%; min-height: 84px; resize: vertical;
    padding: 12px; border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    outline: none; font-size: 15px;
}
.reason-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

.sheet-actions { display: flex; gap: 8px; margin-top: 14px; }
.sheet-actions button {
    flex: 1; padding: 14px; min-height: 50px;
    border-radius: 14px;
    font-weight: 800; font-size: 14px;
}
.btn-save { background: var(--primary); color: #fff; }
.btn-save:active { background: var(--primary-dark); }
.btn-save:disabled { opacity: .6; cursor: not-allowed; }
.btn-cancel { background: var(--slate-light); color: var(--text-2); }

/* =========================================================

========================================================= */
.print-only { display: none; }

.print-header {
    text-align: center;

const Theme = (() => {
    const KEY = "theme";
    function getPreferred() {
        const saved = localStorage.getItem(KEY);
        if (saved === "light" || saved === "dark") return saved;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function apply(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0f172a" : "#2454e8");
    }
    function toggle() {
        const cur = document.documentElement.getAttribute("data-theme") || "light";
        const next = cur === "dark" ? "light" : "dark";
        localStorage.setItem(KEY, next);
        apply(next);
    }
    function init() {
        apply(getPreferred());
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
            if (!localStorage.getItem(KEY)) apply(e.matches ? "dark" : "light");
        });
    }
    return { init, toggle, apply };
})();

function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function normalizeDate(value) {
    if (!value) return "";
    if (typeof value === "object" && typeof value.toDate === "function") return formatDate(value.toDate());
    if (value instanceof Date) return formatDate(value);
    const s = String(value).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    return "";
}

function isCleanDateId(id) {
    return /^\d{4}-\d{2}-\d{2}$/.test(String(id || ""));
}

function formatDateRu(s) {
    const n = normalizeDate(s);
    if (!n) return "—";
    const d = new Date(n + "T00:00:00");
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function formatShortDate(date, withYear) {
    const dd = String(date.getDate()).padStart(2, "0");
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    if (!withYear) return `${dd}.${mm}`;
    const yy = String(date.getFullYear()).slice(-2);
    return `${dd}.${mm}.${yy}`;
}

function getMonday(date) {
    const r = new Date(date);
    r.setHours(0, 0, 0, 0);
    let day = r.getDay();
    if (day === 0) day = 7;
    r.setDate(r.getDate() - day + 1);
    return r;
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = String(text ?? "");
    return div.innerHTML;
}

function vibrate(ms) {
    if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
    }
}

function toShortFio(fullName) {
    const parts = String(fullName || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "";
    const surname = parts[0].charAt(0).toUpperCase() + parts[0].slice(1).toLowerCase();
    const initials = parts.slice(1, 3).map(w => w.charAt(0).toUpperCase());
    return initials.length ? `${surname} ${initials.join(".")}` : surname;
}

function getCurrentGroup() {
    return userGroups.find(g => g.id === currentGroupId) || null;
}

function groupsFromSnapshot(s) {
    return s.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function loadUserAndGroups() {
    currentUid = auth.currentUser ? auth.currentUser.uid : null;
    if (!currentUid) {
        userRole = null; userGroups = []; currentGroupId = null; return;
    }

    const userSnap = await getDoc(doc(db, "users", currentUid));
    const userData = userSnap.exists() ? userSnap.data() : {};
    userRole = userData.role || "starosta";

    let groupsMap = new Map();

    if (userRole === "admin") {
        const snap = await getDocs(collection(db, "groups"));
        groupsFromSnapshot(snap).filter(g => g.active !== false).forEach(g => groupsMap.set(g.id, g));
    } else if (userRole === "curator") {
        const snap = await getDocs(query(collection(db, "groups"), where("curatorId", "==", currentUid)));
        groupsFromSnapshot(snap).filter(g => g.active !== false).forEach(g => groupsMap.set(g.id, g));
    } else {
        const [sA, sB] = await Promise.all([
            getDocs(query(collection(db, "groups"), where("starostaId", "==", currentUid))),
            getDocs(query(collection(db, "groups"), where("leaderId", "==", currentUid)))
        ]);
        [...groupsFromSnapshot(sA), ...groupsFromSnapshot(sB)]
            .filter(g => g.active !== false)
            .forEach(g => groupsMap.set(g.id, g));
    }

    userGroups = Array.from(groupsMap.values())
        .sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ru"));

    const remembered = sessionStorage.getItem("selectedGroupId");
    if (remembered && userGroups.some(g => g.id === remembered)) currentGroupId = remembered;
    else currentGroupId = userGroups.length > 0 ? userGroups[0].id : null;
}

function renderGroupSwitcher() {
    const slot = document.getElementById("groupSwitcherSlot");
    const curatorInput = document.getElementById("curatorPrintName");

    if (!userGroups.length) {
        slot.innerHTML = '<span class="empty-groups">Нет доступных групп</span>';
        curatorInput.value = "";
        curatorInput.disabled = true;
        return;
    }

    const showDropdown = userRole === "admin" || userGroups.length > 1;
    if (showDropdown) {
        slot.innerHTML = '<select class="group-select" id="groupSelect" onchange="switchGroup(this.value)"></select>';
        const select = document.getElementById("groupSelect");
        select.innerHTML = userGroups
            .map(g => `<option value="${escapeHtml(g.id)}">${escapeHtml(g.name || g.id)}</option>`)
            .join("");
        select.value = currentGroupId;
    } else {
        const g = getCurrentGroup();
        slot.innerHTML = `<span class="group-static">${escapeHtml(g ? (g.name || g.id) : "—")}</span>`;
    }
    updateCuratorNameField();
}

function updateCuratorNameField() {
    const curatorInput = document.getElementById("curatorPrintName");
    const g = getCurrentGroup();
    const dbCuratorName = g ? toShortFio(g.curatorName || "") : "";

    if (userRole === "admin") {
        curatorInput.disabled = false;
        if (!curatorNameManuallyEdited) curatorInput.value = dbCuratorName;

async function loadSettings() {
    settings = { schedule: {}, disciplines: {}, bells: {}, semester1: {}, semester2: {} };
    if (!currentGroupId) return;
    try {
        const snap = await getDoc(doc(db, "groupSettings", currentGroupId));
        if (snap.exists()) {
            const d = snap.data() || {};
            settings = {
                schedule: d.schedule || {},
                disciplines: d.disciplines || {},

                semester1: d.semester1 || {},
                semester2: d.semester2 || {}
            };
        }
    } catch (e) { console.error(e); showStatus("Не удалось загрузить настройки", "error"); }
}

async function loadStudents() {
    students = [];
    if (!currentGroupId) return;
    const g = getCurrentGroup();
    const explicitIds = g && Array.isArray(g.studentIds) ? g.studentIds.map(String) : [];

    let byGroupId = [];
    try {
        const snap = await getDocs(query(collection(db, "students"), where("groupId", "==", currentGroupId)));
        byGroupId = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { console.warn(e); }

    let byExplicit = [];
    if (explicitIds.length > 0) {
        const full = await getDocs(collection(db, "students"));
        byExplicit = full.docs
            .filter(d => explicitIds.includes(String(d.id)))
            .map(d => ({ id: d.id, ...d.data() }));
    }

    const map = new Map();
    [...byGroupId, ...byExplicit].forEach(s => map.set(s.id, s));
    students = Array.from(map.values());
    students.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ru"));
}

function getStudentName(studentId) {
    const s = students.find(i => String(i.id) === String(studentId));
    return s ? (s.name || "Без имени") : "Неизвестный студент";
}

function normalizeStatus(status) {
    if (status === null || status === undefined) return "";
    const v = String(status).trim().toLowerCase();
    if (["present","присутствовал","присутствует","присутствие","п","✓"].includes(v)) return "present";
    if (["absent","отсутствовал","отсутствует","отсутствие","н"].includes(v)) return "absent";
    return "";
}

/* =========================================================
   LOAD ATTENDANCE — ИСПРАВЛЕНО
   ────────────────────────────────────────────────────────
   Ключевые исправления:
     1. Дата берётся из ID, если в data.date пусто.
     2. Документы с суффиксом (2026-09-22_xxx) отсеиваются.
     3. Фильтр по группе — по списку студентов, а не по
        groupId документа (он общий на дату и перезаписывается).
========================================================= */
async function loadAttendance() {
    attendance = {};
    if (!currentGroupId || students.length === 0) return;

    const studentIdsSet = new Set(students.map(s => String(s.id)));

    try {
        const snap = await getDocs(collection(db, "attendance"));

        function pushStudentDay(date, studentId, studentName, lessons, meta) {
            if (!date || !studentId) return;
            const sid = String(studentId);
            if (!studentIdsSet.has(sid)) return;

            Object.entries(lessons || {}).forEach(([lessonNum, ld]) => {
                if (!ld) return;
                const status = normalizeStatus(ld.status);
                if (!status) return;

                const reason = ld.reason || ld.comment || ld.description || "";
                const absentType = String(ld.absentType || "").trim().toLowerCase();
                const key = `${date}_${sid}_${lessonNum}`;

                attendance[key] = {
                    id: meta.docId || "",
                    documentId: meta.docId || "",
                    date, studentId: sid,
                    studentName: studentName || getStudentName(sid),
                    lesson: String(lessonNum),
                    status, absentType,
                    reason: String(reason),
                    semester: meta.semester || "",
                    attestation: meta.attestation || "",
                    updatedAt: meta.updatedAt || ""
                };
            });
        }

        snap.forEach(attDoc => {
            const data = attDoc.data();
            const docId = attDoc.id;

            // 1. Отсеиваем мусорные документы с суффиксом
            //    (2026-09-22_abc123 — не должно быть, но защищаемся)
            //    Оставляем либо чистые id, либо документы с явным date.
            const dateFromId = isCleanDateId(docId) ? docId : "";
            const dateFromField = normalizeDate(data.date);
            const date = dateFromField || dateFromId;

            // 2. Фильтр по группе НЕ по groupId документа: документ
            //    посещаемости один на дату и общий для всех групп,
            //    а groupId в нём перезаписывается последней сохранившей
            //    группой. Нужные студенты отбираются в pushStudentDay
            //    по studentIdsSet (студенты текущей группы).

            if (!date) return;

            // ─── структура { students: { sid: {lessons} } } ───
            if (data.students && typeof data.students === "object") {
                Object.values(data.students).forEach(rec => {
                    if (!rec || !rec.studentId) return;
                    pushStudentDay(date, rec.studentId, rec.studentName, rec.lessons, {
                        docId,
                        semester: data.semester,
                        attestation: data.attestation,
                        updatedAt: rec.updatedAt || data.updatedAt
                    });
                });
                return;
            }

            // ─── плоская структура { studentId, date, lessons } ───
            if (data.studentId && data.lessons) {
                pushStudentDay(date, data.studentId, data.studentName, data.lessons, {
                    docId,
                    semester: data.semester,
                    attestation: data.attestation,
                    updatedAt: data.updatedAt
                });
            }
        });

        console.log(`[attendance] загружено отметок: ${Object.keys(attendance).length}`);
    } catch (e) {
        console.error("Ошибка загрузки посещаемости:", e);
        showStatus("Ошибка загрузки посещаемости", "error");
    }
}

/* =========================================================
   SAVE
========================================================= */
async function saveLessonMark(date, studentId, lessonNum, markData) {
    const ref = doc(db, "attendance", date);
    const snap = await getDoc(ref);

    const current = snap.exists() ? (snap.data() || {}) : {};
    const studentsMap = { ...(current.students || {}) };

    const record = studentsMap[studentId] || {
        studentId,
        studentName: getStudentName(studentId),
        lessons: {}
    };
    const lessons = { ...(record.lessons || {}) };
    const key = String(lessonNum);

    if (markData === null) {
        delete lessons[key];
    } else {
        lessons[key] = {
            status: markData.status,
            absentType: markData.absentType || "",
            reason: markData.reason || ""
        };
    }

    record.lessons = lessons;
    record.updatedAt = new Date().toISOString();
    studentsMap[studentId] = record;

    const info = getAttestationInfo(date);
    const meta = {
        date,
        groupId: currentGroupId,
        semester: info ? `${info.semester} семестр` : "",
        attestation: info ? `Аттестация №${info.attestation}` : "",
        updatedAt: new Date().toISOString()
    };

    try {
        await updateDoc(ref, new FieldPath("students", studentId), record,
            "date", meta.date, "groupId", meta.groupId,
            "semester", meta.semester, "attestation", meta.attestation,
            "updatedAt", meta.updatedAt);
    } catch (e) {
        if (e && e.code === "not-found") {
            await setDoc(ref, { ...meta, students: { [studentId]: record } });
        } else {
            throw e;
        }
    }

    const attKey = `${date}_${studentId}_${lessonNum}`;
    if (markData === null) {
        delete attendance[attKey];
    } else {
        attendance[attKey] = {
            id: date, documentId: date,
            date, studentId, studentName: getStudentName(studentId),
            lesson: String(lessonNum),
            status: markData.status,
            absentType: markData.absentType || "",
            reason: markData.reason || "",
            semester: meta.semester, attestation: meta.attestation,
            updatedAt: meta.updatedAt
        };
    }
}

/* =========================================================
   WEEK / SCHEDULE
========================================================= */
function getLessonCount(dayIndex) {
    const schedule = settings.schedule || {};
    const day = days[dayIndex];
    const v = schedule[day];
    if (v === undefined || v === null) return 0;
    if (Array.isArray(v)) return v.length;
    if (typeof v === "object") {
        if (Array.isArray(v.lessons)) return v.lessons.length;
        if (typeof v.count !== "undefined") return Number(v.count) || 0;
    }
    return Number(v) || 0;
}

function getWeekDates() {
    const result = [];
    for (let i = 0; i < 6; i++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        result.push(d);
    }
    return result;
}

function updateWeekRange() {
    const dates = getWeekDates();
    const first = formatDateRu(formatDate(dates[0]));
    const last = formatDateRu(formatDate(dates[5]));
    document.getElementById("weekRange").textContent = `Период: ${first} — ${last}`;
}

function getAttestationInfo(dateString) {
    const date = new Date(dateString + "T00:00:00");
    const periods = [
        { semester: 1, attestation: 1, period: settings.semester1?.attestation1 },
        { semester: 1, attestation: 2, period: settings.semester1?.attestation2 },
        { semester: 2, attestation: 1, period: settings.semester2?.attestation1 },
        { semester: 2, attestation: 2, period: settings.semester2?.attestation2 }
    ];
    for (const item of periods) {
        if (!item.period?.start || !item.period?.end) continue;
        const start = new Date(item.period.start + "T00:00:00");
        const end = new Date(item.period.end + "T23:59:59");
        if (date >= start && date <= end) return item;
    }
    return null;
}

/* =========================================================
   MARK DISPLAY
========================================================= */
function getMarkDisplay(record) {
    if (!record) return { mark: "—", cls: "empty-mark" };
    if (record.status === "present") return { mark: "✓", cls: "present" };
    if (record.status === "absent") {
        const at = record.absentType || "";
        if (at === "uv") return { mark: "Н/У", cls: "absent uv" };
        if (at === "bolezn") return { mark: "Н/Б", cls: "absent bolezn" };
        return { mark: "Н", cls: "absent" };
    }
    return { mark: "—", cls: "empty-mark" };
}

/* =========================================================
   RENDER TABLE
========================================================= */
function renderTable() {
    const wrapper = document.getElementById("tableWrapper");

    if (students.length === 0) {
        wrapper.innerHTML = `<div class="empty">👨‍🎓 Студентов пока нет.<br><br>Добавьте студентов в разделе «Студенты» или проверьте, что группа выбрана правильно.</div>`;
        const ps = document.getElementById("printSheet");
        if (ps) ps.innerHTML = "";
        return;
    }

    const weekDates = getWeekDates();

    let colgroup = '<colgroup>';
    colgroup += '<col style="width:200px">';

    weekDates.forEach((date, i) => {
        const count = getLessonCount(i);
        if (count === 0) {
            colgroup += '<col style="width:60px">';
        } else {
            for (let l = 0; l < count; l++) {
                colgroup += '<col style="width:50px">';
            }
        }
    });

    colgroup += '<col style="width:70px">';
    colgroup += '<col style="width:70px">';
    colgroup += '<col style="width:70px">';
    colgroup += '<col style="width:180px">';
    colgroup += '</colgroup>';

    let html = `<table class="journal">${colgroup}<thead><tr>`;
    html += `<th class="student-column" rowspan="2">Список обучающихся</th>`;

    weekDates.forEach((date, i) => {
        const count = getLessonCount(i);
        html += `<th class="day-header" colspan="${Math.max(count, 1)}">
            <div class="day-name">${days[i]}</div>
            <div class="day-date">${formatDateRu(formatDate(date))}</div>
        </th>`;
    });

    html += `
        <th class="report-col" rowspan="2">Все Н, ч</th>
        <th class="report-col" rowspan="2">УВ Н, ч</th>
        <th class="report-col" rowspan="2">Неув Н, ч</th>
        <th class="report-note-col" rowspan="2">Примечание</th>
        </tr><tr>`;

    weekDates.forEach((date, i) => {
        const count = getLessonCount(i);
        if (count === 0) { html += `<th>—</th>`; return; }
        for (let l = 1; l <= count; l++) html += `<th>${l}</th>`;
    });

    html += `</tr></thead><tbody>`;

    let groupAll = 0, groupUv = 0, groupNeuv = 0;

    students.forEach((student, idx) => {
        let sAll = 0, sUv = 0, sNeuv = 0;
        const reasons = [];

        html += `<tr><td class="student-cell">
            <div class="student-wrapper">
                <div class="student-number">${idx + 1}</div>
                <div class="student-name">${escapeHtml(student.name || "Без имени")}</div>
            </div>
        </td>`;

        weekDates.forEach((date, dayIndex) => {
            const dateStr = formatDate(date);
            const count = getLessonCount(dayIndex);

            if (count === 0) {
                html += `<td class="lesson-cell empty-mark">—</td>`;
                return;
            }

            for (let l = 1; l <= count; l++) {
                const key = `${dateStr}_${student.id}_${l}`;
                const rec = attendance[key];
                const { mark, cls } = getMarkDisplay(rec);

                if (rec && rec.status === "absent") {
                    sAll += HOURS_PER_LESSON;
                    const rt = String(rec.reason || "").trim();
                    const at = rec.absentType || "";
                    const isExcused = at === "uv" || at === "bolezn" || (!at && Boolean(rt));
                    if (isExcused) {
                        sUv += HOURS_PER_LESSON;
                        if (rt && !reasons.includes(rt)) reasons.push(rt);
                    } else {
                        sNeuv += HOURS_PER_LESSON;
                    }
                }

                const isEditable = currentMode === "edit";
                const cellAttrs = isEditable
                    ? `data-student="${escapeHtml(student.id)}" data-date="${dateStr}" data-lesson="${l}"`
                    : `data-record-key="${escapeHtml(key)}"`;

                html += `<td class="lesson-cell ${cls}" ${cellAttrs}>${mark}</td>`;
            }
        });

        groupAll += sAll; groupUv += sUv; groupNeuv += sNeuv;

        html += `
            <td class="report-col report-total">${sAll}</td>
            <td class="report-col report-uv">${sUv}</td>
            <td class="report-col report-neuv">${sNeuv}</td>
            <td class="report-note-col ${reasons.length ? "" : "empty-mark"}">
                ${reasons.length ? escapeHtml(reasons.join("; ")) : "—"}
            </td>
        </tr>`;
    });

    html += `<tr class="total-row"><td class="student-cell"><strong>Итого по группе</strong></td>`;

    weekDates.forEach((date, i) => {
        const count = getLessonCount(i);
        const slots = Math.max(count, 1);
        for (let x = 0; x < slots; x++) html += `<td class="empty-mark">—</td>`;
    });

    html += `
        <td class="report-col report-total">${groupAll}</td>
        <td class="report-col report-uv">${groupUv}</td>
        <td class="report-col report-neuv">${groupNeuv}</td>
        <td class="report-note-col empty-mark">—</td>
    </tr></tbody></table>`;

    wrapper.innerHTML = html;

    wrapper.querySelectorAll(".lesson-cell").forEach(cell => {
        cell.addEventListener("click", e => {
            if (currentMode === "edit") {
                const sid = cell.dataset.student;
                const date = cell.dataset.date;
                const lesson = parseInt(cell.dataset.lesson, 10);
                if (sid && date && lesson) openMarkSheet(sid, date, lesson);
            } else {
                showRecordInfo(e, cell);
            }
        });
    });
}

    const lessonCount = getLessonCount(dayIndex);

    let listHtml = `<div class="mobile-students">`;

    if (lessonCount === 0) {
        listHtml += `<div class="empty">📚 В этот день нет занятий</div>`;
    } else {
        students.forEach((student, idx) => {
            listHtml += `<div class="mobile-student" style="animation-delay:${Math.min(idx * 0.02, 0.3)}s">
                <div class="mobile-student-head">
                    <div class="mobile-student-index">${idx + 1}</div>
                    <div class="mobile-student-name">${escapeHtml(student.name || "Без имени")}</div>
                </div>
                <div class="mobile-lessons">`;

            for (let l = 1; l <= lessonCount; l++) {
                const key = `${dateStr}_${student.id}_${l}`;
                const rec = attendance[key];
                const { mark, cls } = getMarkDisplay(rec);

                const extraClass = rec && rec.status === "absent"
                    ? (rec.absentType === "uv" ? "uv" : rec.absentType === "bolezn" ? "bolezn" : "")
                    : "";

                listHtml += `<button type="button" class="mobile-lesson ${cls} ${extraClass}"
                    data-student="${escapeHtml(student.id)}"
                    data-date="${dateStr}"
                    data-lesson="${l}">
                    <span class="mobile-lesson-num">${l} пара</span>
                    <span class="mobile-lesson-mark">${mark}</span>
                </button>`;
            }

            listHtml += `</div></div>`;
        });
    }
    listHtml += `</div>`;

    root.innerHTML = tabsHtml + listHtml;

    root.querySelectorAll(".mobile-day-tab").forEach(tab => {
        tab.addEventListener("click", () => {
            activeMobileDay = parseInt(tab.dataset.dayIndex, 10);
            renderMobile();
        });
    });

    root.querySelectorAll(".mobile-lesson").forEach(btn => {
        btn.addEventListener("click", () => {
            const sid = btn.dataset.student;
            const date = btn.dataset.date;
            const lesson = parseInt(btn.dataset.lesson, 10);

            if (currentMode === "edit") {
                openMarkSheet(sid, date, lesson);
            } else {
                const key = `${date}_${sid}_${lesson}`;
                const rec = attendance[key];
                if (!rec) return;
                showMobileRecordPopup(rec);
            }
        });
    });
}

/* =========================================================
   INFO POPUP (VIEW)
========================================================= */
function showRecordInfo(event, cell) {
    const key = cell.dataset.recordKey;
    const rec = attendance[key];
    if (!rec) { hidePopup(); return; }

    const popup = document.getElementById("infoPopup");
    document.getElementById("popupTitle").textContent =
        rec.status === "absent" ? "⚠️ Отсутствие" : "✓ Присутствие";
    document.getElementById("popupStudent").textContent = "ФИО: " + rec.studentName;
    document.getElementById("popupDate").textContent = "Дата: " + formatDateRu(rec.date);
    document.getElementById("popupLesson").textContent = "Пара: " + rec.lesson;
    document.getElementById("popupReason").textContent =
        rec.reason || (rec.status === "absent" ? "Причина не указана" : "Студент присутствовал");

    popup.style.display = "block";

    const rect = cell.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 5;

    if (left + 290 > window.innerWidth) left = window.innerWidth - 300;
    if (top + 190 > window.innerHeight) top = rect.top - 195;
    if (left < 5) left = 5;
    if (top < 5) top = 5;

    popup.style.left = left + "px";
    popup.style.top = top + "px";

    event.stopPropagation();
}

function showMobileRecordPopup(rec) {
    const text = rec.status === "absent"
        ? `Н: ${rec.reason || "причина не указана"}`
        : "✓ Присутствовал";
    showStatus(text);
}

function hidePopup() {
    document.getElementById("infoPopup").style.display = "none";
}

document.addEventListener("click", e => {
    const popup = document.getElementById("infoPopup");
    if (!popup.contains(e.target)) hidePopup();
});

/* =========================================================
   MARK SHEET (EDIT)
========================================================= */
let sheetState = {
    studentId: null,
    date: null,
    lesson: null,
    selectedMark: null
};

function openMarkSheet(studentId, date, lesson) {
    vibrate(15);
    sheetState = { studentId, date, lesson, selectedMark: null };

    const student = students.find(s => String(s.id) === String(studentId));
    const studentName = student ? (student.name || "Без имени") : "—";

    document.getElementById("sheetTitle").textContent = "Отметка посещаемости";
    document.getElementById("sheetSubtitle").textContent =
        `${studentName} • ${lesson} пара • ${formatDateRu(date)}`;

    const key = `${date}_${studentId}_${lesson}`;
    const rec = attendance[key];

    document.querySelectorAll(".mark-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("reasonForm").classList.remove("show");
    document.getElementById("reasonInput").value = "";

    if (rec) {
        if (rec.status === "present") {
            document.querySelector('[data-mark="present"]').classList.add("active");
        } else if (rec.status === "absent") {
            const at = rec.absentType || "neuv";
            const markEl = at === "uv"
                ? document.querySelector('[data-mark="uv"]')
                : at === "bolezn"
                    ? document.querySelector('[data-mark="bolezn"]')
                    : document.querySelector('[data-mark="absent"]');
            markEl.classList.add("active");
            document.getElementById("reasonInput").value = rec.reason || "";
            document.getElementById("reasonForm").classList.add("show");
        }
    }

    document.getElementById("markSheetOverlay").classList.add("active");
}

function closeMarkSheet() {
    document.getElementById("markSheetOverlay").classList.remove("active");
    sheetState = { studentId: null, date: null, lesson: null, selectedMark: null };
}
window.closeMarkSheet = closeMarkSheet;

document.querySelectorAll(".mark-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        const mark = btn.dataset.mark;
        sheetState.selectedMark = mark;

        document.querySelectorAll(".mark-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        if (mark === "present") {
            document.getElementById("reasonForm").classList.remove("show");
        } else {
            const form = document.getElementById("reasonForm");
            form.classList.add("show");
            const input = document.getElementById("reasonInput");
            if (mark === "uv") {
                if (!input.value.trim()) input.value = AUTO_REASONS.uv;
            } else if (mark === "bolezn") {
                if (!input.value.trim()) input.value = AUTO_REASONS.bolezn;
            } else if (mark === "absent") {
                if (input.value.trim() === AUTO_REASONS.uv || input.value.trim() === AUTO_REASONS.bolezn) {
                    input.value = "";
                }
            }
        }
    });
});

document.getElementById("saveMarkBtn").addEventListener("click", async () => {
    if (!sheetState.studentId || !sheetState.date || !sheetState.lesson) return;
    const mark = sheetState.selectedMark;
    if (!mark) {
        showStatus("Выберите отметку", "error");
        return;
    }

    vibrate(20);

    let markData;
    if (mark === "present") {
        markData = { status: "present", absentType: "", reason: "" };
    } else {
        const reasonInput = document.getElementById("reasonInput");
        let reason = reasonInput.value.trim();
        const absentType = mark === "uv" ? "uv" : mark === "bolezn" ? "bolezn" : "neuv";

        if (!reason && AUTO_REASONS[absentType]) reason = AUTO_REASONS[absentType];

        markData = { status: "absent", absentType, reason };
    }

    try {
        document.getElementById("saveMarkBtn").textContent = "⏳ Сохранение...";
        document.getElementById("saveMarkBtn").disabled = true;

        await saveLessonMark(sheetState.date, sheetState.studentId, sheetState.lesson, markData);

        showStatus("✓ Сохранено", "success");
        closeMarkSheet();

        renderTable();
        renderMobile();
    } catch (e) {
        console.error(e);
        showStatus("Ошибка сохранения", "error");
    } finally {
        document.getElementById("saveMarkBtn").textContent = "💾 Сохранить";
        document.getElementById("saveMarkBtn").disabled = false;
    }
});

document.getElementById("markSheetOverlay").addEventListener("click", e => {
    if (e.target.id === "markSheetOverlay") closeMarkSheet();
});

document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        closeMarkSheet();
        hidePopup();
    }
});

/* =========================================================
   WEEK NAV
========================================================= */
window.previousWeek = () => {
    weekStart.setDate(weekStart.getDate() - 7);
    updateWeekRange();
    renderTable();
    renderMobile();
    renderWeekList();
};

window.nextWeek = () => {
    weekStart.setDate(weekStart.getDate() + 7);
    updateWeekRange();
    renderTable();
    renderMobile();
    renderWeekList();
};

window.currentWeek = () => {
    weekStart = getMonday(new Date());
    updateWeekRange();
    renderTable();
    renderMobile();
    renderWeekList();
};

window.toggleWeekList = () => {
    const list = document.getElementById("weekList");
    list.classList.toggle("show");
    if (list.classList.contains("show")) renderWeekList();
};

function renderWeekList() {
    const list = document.getElementById("weekList");
    list.innerHTML = "";
    const currentMonday = getMonday(new Date());

    for (let i = -20; i <= 20; i++) {
        const monday = new Date(currentMonday);
        monday.setDate(monday.getDate() + i * 7);
        const saturday = new Date(monday);
        saturday.setDate(saturday.getDate() + 5);

        const mText = formatDateRu(formatDate(monday));
        const sText = formatDateRu(formatDate(saturday));

        const btn = document.createElement("button");
        btn.className = "week-option";
        if (formatDate(monday) === formatDate(weekStart)) btn.classList.add("selected");
        if (i === 0) btn.classList.add("current-week");

        btn.textContent = i === 0
            ? `⭐ Текущая неделя — ${mText} — ${sText}`
            : `${mText} — ${sText}`;

        btn.addEventListener("click", () => selectWeek(monday));
        list.appendChild(btn);
    }
}

function selectWeek(date) {
    weekStart = getMonday(date);
    updateWeekRange();
    renderTable();
    renderMobile();
    document.getElementById("weekList").classList.remove("show");
    renderWeekList();
}

/* =========================================================
   PRINT
========================================================= */
function buildPrintSheet(scaleFactor) {
    const sheet = document.getElementById("printSheet");
    if (!sheet) return;

    const group = getCurrentGroup();
    const printGroupNameEl = document.getElementById("printGroupName");
    if (printGroupNameEl) printGroupNameEl.textContent = group ? (group.name || group.id) : "—";

    const curatorInputEl = document.getElementById("curatorPrintName");
    const table = document.querySelector("#tableWrapper table.journal");

    if (!table || students.length === 0) { sheet.innerHTML = ""; return; }

    const weekDates = getWeekDates();
    const lessonCounts = weekDates.map((d, i) => getLessonCount(i));

    const rows = Array.from(table.querySelectorAll("tbody tr:not(.total-row)"));
    const s = scaleFactor || 1.0;

    const rowHeight = 7.5 * s;
    const headHeight = 7.0 * s;
    const signHeight = 14 * s;

    const fontBody = (11 * s).toFixed(2);
    const fontName = (11 * s).toFixed(2);
    const fontNum = (12 * s).toFixed(2);
    const fontSmall = (10 * s).toFixed(2);
    const fontNote = (9 * s).toFixed(2);
    const fontHead = (10 * s).toFixed(2);
    const fontLineH = (14.5 * s).toFixed(2);

    let cols =
        '<col style="width:10mm">' +
        '<col style="width:56mm">';

    lessonCounts.forEach(count => {
        if (count === 0) cols += '<col style="width:20mm">';
        else cols += "<col>".repeat(count);
    });

    cols +=
        '<col style="width:10.5mm">' +
        '<col style="width:6.8mm">' +
        '<col style="width:10mm">' +
        '<col style="width:24mm">';

    let head1 = '<th rowspan="2"></th><th rowspan="2">Ф.И.О.</th>';
    let head2 = "";

    weekDates.forEach((date, i) => {
        const count = lessonCounts[i];
        head1 += `<th colspan="${Math.max(count, 1)}">${days[i]}<br>${formatShortDate(date, false)}</th>`;
        if (count === 0) head2 += "<th>—</th>";
        else for (let l = 1; l <= count; l++) head2 += `<th>${l}</th>`;
    });

    head1 +=
        '<th class="sm">Всего</th>' +
        "<th>Ув</th>" +
        '<th class="sm">Неув</th>' +
        "<th>Примечания</th>";
    head2 += "<th></th><th></th><th></th><th></th>";

    let body = "";

    rows.forEach((row, idx) => {
        const nameEl = row.querySelector(".student-name");
        const name = nameEl ? nameEl.textContent.trim() : "";

        let cells = "";
        row.querySelectorAll(".lesson-cell").forEach(cell => {
            const mark = cell.classList.contains("present") ? ""
                : cell.classList.contains("absent")
                    ? (cell.textContent.trim() || "Н")
                    : "";
            cells += `<td class="c-l">${mark}</td>`;
        });

        const readCell = sel => {
            const c = row.querySelector(sel);
            return c ? c.textContent.trim() : "";
        };

        const noteCell = row.querySelector("td.report-note-col");
        const note = (noteCell && !noteCell.classList.contains("empty-mark"))
            ? noteCell.textContent.trim() : "";

        body +=
            `<tr style="height:${rowHeight}mm">` +
            `<td class="c-num" style="height:${rowHeight}mm">${idx + 1}.</td>` +
            `<td class="c-name">${escapeHtml(name)}</td>` +
            cells +
            `<td class="c-t">${escapeHtml(readCell("td.report-total"))}</td>` +
            `<td class="c-t">${escapeHtml(readCell("td.report-uv"))}</td>` +
            `<td class="c-t">${escapeHtml(readCell("td.report-neuv"))}</td>` +
            `<td class="c-note">${escapeHtml(note)}</td>` +
            `</tr>`;
    });

    const curatorName = (curatorInputEl && curatorInputEl.value.trim())
        ? curatorInputEl.value.trim()
        : "________________";

    const signatureRow = `
        <div class="pt-sign" style="height:${signHeight}mm">
            Классный руководитель&nbsp;&nbsp;&nbsp;&nbsp;______________&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="pf-name">${escapeHtml(curatorName)}</span>
        </div>
    `;

    const oldStyle = document.getElementById("ptDynamicStyle");
    if (oldStyle) oldStyle.remove();

    sheet.innerHTML =
        `<table class="pt">` +
            `<colgroup>${cols}</colgroup>` +
            `<thead>
                <tr style="height:${headHeight}mm">${head1}</tr>
                <tr style="height:${headHeight}mm">${head2}</tr>
            </thead>` +
            `<tbody>${body}</tbody>` +
        `</table>` +
        signatureRow;

    const styleTag = document.createElement("style");
    styleTag.id = "ptDynamicStyle";
    styleTag.textContent = `
        #printSheet table.pt { font-size: ${fontBody}pt; }
        #printSheet table.pt thead th { font-size: ${fontHead}pt; }
        #printSheet table.pt thead th.sm { font-size: ${fontSmall}pt; }
        #printSheet table.pt td.c-num { font-size: ${fontNum}pt; }
        #printSheet table.pt td.c-name { font-size: ${fontName}pt; line-height: ${fontLineH}pt; }
        #printSheet table.pt td.c-l { font-size: ${fontSmall}pt; }
        #printSheet table.pt td.c-t { font-size: ${fontSmall}pt; }
        #printSheet table.pt td.c-note { font-size: ${fontNote}pt; }
        #printSheet .pt-sign { font-size: ${fontBody}pt; }
    `;
    document.head.appendChild(styleTag);
}

function printReport() {
    const dates = getWeekDates();
    const rangeText = `с ${formatShortDate(dates[0], true)} - ${formatShortDate(dates[5], true)}гг`;
    document.getElementById("printHeaderRange").textContent = rangeText;

    const AVAILABLE_MM = 164;
    const HEAD_MM = 14;
    const SIGN_MM = 14;
    const ROW_MM = 7.5;

    const studentCount = students.length;
    const needed = HEAD_MM + SIGN_MM + studentCount * ROW_MM;
    let scale = 1.0;
    if (needed > AVAILABLE_MM) scale = AVAILABLE_MM / needed;
    if (scale < 0.55) scale = 0.55;

    buildPrintSheet(scale);
    setTimeout(() => window.print(), 150);
}
window.printReport = printReport;

/* =========================================================
   STATUS
========================================================= */
let statusTimer;
function showStatus(msg, type = "") {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = `status show ${type}`;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { el.className = "status"; }, 2500);
}

/* =========================================================
   START
========================================================= */
async function start() {
    try {
        weekStart = getMonday(new Date());
        await loadUserAndGroups();
        renderGroupSwitcher();

        if (!currentGroupId) {
            document.getElementById("tableWrapper").innerHTML = `<div class="empty">⚠️ Вам не назначена ни одна группа.<br><br>Обратитесь к администратору.</div>`;
            document.getElementById("mobileCards").innerHTML = `<div class="empty">⚠️ Вам не назначена ни одна группа.</div>`;
            return;
        }

        await loadSettings();
        await loadStudents();
        await loadAttendance();

        updateWeekRange();
        renderTable();
        renderMobile();
        renderWeekList();

        const today = formatDate(new Date());
        const info = getAttestationInfo(today);
        document.getElementById("semesterInfo").textContent = info
            ? `${info.semester} семестр • Аттестация №${info.attestation}`
            : "Семестр / аттестация не определены";

    } catch (e) {
        console.error("Ошибка запуска:", e);
        document.getElementById("tableWrapper").innerHTML = `<div class="empty">❌ Ошибка загрузки данных.<br>Откройте консоль (F12).</div>`;
    }
}

    if (!user) {
        window.location.href = "login.html";

    document.body.classList.remove("auth-pending");
