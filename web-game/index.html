<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e9">
  <title>Вход в игру</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #fff6e9;
      --bg2: #eef4ff;
      --ink: #1d1f3a;
      --muted: #6b6f8f;
      --violet: #7c5cff;
      --pink: #ff6fb1;
      --yellow: #ffc34d;
      --mint: #3ed6b0;
      --mint-deep: #1fa37f;
      --danger: #ff4d6d;
      --tile: #ffffff;
      --tile-line: #e3e6ff;
      --radius: 28px;
      --display: "Unbounded", "Nunito", system-ui, sans-serif;
      --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      font-family: var(--body);
      color: var(--ink);
      background:
        radial-gradient(1000px 520px at 0% -10%, rgba(124, 92, 255, 0.18), transparent 60%),
        radial-gradient(900px 520px at 110% 110%, rgba(255, 111, 177, 0.16), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Фон: сетка + плавающие фигуры ===== */
    .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .grid {
      position: absolute; inset: -50%;
      background-image:
        linear-gradient(rgba(124, 92, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 92, 255, 0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: perspective(500px) rotateX(58deg) translateY(-10%);
      transform-origin: center top;
      mask-image: linear-gradient(to top, #000 10%, transparent 70%);
      -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 70%);
      animation: scroll-grid 6s linear infinite;
    }
    @keyframes scroll-grid { to { background-position: 0 44px; } }

    .shape {
      position: absolute; border-radius: 40%; opacity: 0.4; filter: blur(2px);
      animation: float 12s ease-in-out infinite;
    }
    .s1 { width: 200px; height: 200px; background: var(--violet); top: -70px; left: -60px; }
    .s2 { width: 170px; height: 170px; background: var(--pink); bottom: -60px; right: -40px; animation-delay: -4s; }
    .s3 { width: 100px; height: 100px; background: var(--yellow); top: 28%; right: 6%; animation-delay: -8s; }
    .s4 { width: 76px; height: 76px; background: var(--mint); bottom: 18%; left: 8%; animation-delay: -2s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(20px, -30px) rotate(20deg); }
    }

    /* ===== Карточка ===== */
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 440px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 2px solid #fff;
      border-radius: var(--radius);
      padding: 28px 22px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(124, 92, 255, 0.18), 0 2px 0 rgba(124, 92, 255, 0.08);
      animation: pop 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
    [hidden] { display: none !important; }

    /* ===== Бейдж статуса ===== */
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 999px;
      background: #e9fbf5; border: 1px solid rgba(62, 214, 176, 0.5);
      color: var(--mint-deep); font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
    }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--mint);
      box-shadow: 0 0 0 4px rgba(62, 214, 176, 0.25);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: .35; } }

    /* ===== Логотип ===== */
    .logo {
      display: inline-grid; place-items: center;
      width: 96px; height: 96px; margin: 18px auto 6px;
      font-size: 52px; border-radius: 30px;
      background: linear-gradient(145deg, var(--yellow), var(--pink) 70%, var(--violet));
      box-shadow: 0 9px 0 #d9639a, 0 20px 36px rgba(255, 111, 177, 0.35);
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }

    /* ===== Шаги ===== */
    .steps { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
    .steps span {
      width: 36px; height: 8px; border-radius: 99px; background: var(--tile-line);
      transition: background .3s, box-shadow .3s;
    }
    .steps span.on { background: var(--violet); box-shadow: 0 0 10px rgba(124, 92, 255, 0.45); }

    h1 {
      font-family: var(--display); font-weight: 800;
      font-size: clamp(20px, 5.6vw, 26px); line-height: 1.2;
      margin-top: 16px; letter-spacing: -0.01em;
    }
    .sub { color: var(--muted); font-size: 16px; font-weight: 600; margin: 8px 0 22px; }

    /* ===== Ячейки кода ===== */
    .code-boxes { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; }
    .digit {
      width: clamp(50px, 15.5vw, 66px); height: clamp(62px, 17vw, 74px);
      border-radius: 20px;
      border: 3px solid var(--tile-line);
      background: var(--tile);
      box-shadow: 0 5px 0 var(--tile-line);
      text-align: center; font-family: var(--display); font-size: clamp(24px, 7vw, 30px); font-weight: 800;
      color: var(--ink); outline: none; caret-color: var(--violet);
      transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), border-color .2s, box-shadow .2s;
    }
    .digit:focus {
      border-color: var(--violet);
      box-shadow: 0 5px 0 rgba(124, 92, 255, 0.35), 0 8px 20px rgba(124, 92, 255, 0.25);
      transform: translateY(-4px) scale(1.04);
    }
    .digit.filled {
      border-color: var(--mint);
      box-shadow: 0 5px 0 #9fe6d3;
      background: #f3fffb;
    }
    .digit.bump { animation: bump .3s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes bump { 0% { transform: scale(.8); } 100% { transform: none; } }

    /* ===== Текстовое поле ===== */
    .txt {
      width: 100%; padding: 17px 18px; border-radius: 20px;
      border: 3px solid var(--tile-line); background: var(--tile);
      font-family: var(--display); font-size: 17px; font-weight: 600;
      color: var(--ink); outline: none; text-align: center; margin-bottom: 16px;
      box-shadow: 0 5px 0 var(--tile-line);
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .txt::placeholder { color: #a7abc9; font-family: var(--body); font-weight: 700; }
    .txt:focus {
      border-color: var(--pink);
      box-shadow: 0 5px 0 rgba(255, 111, 177, 0.35), 0 8px 20px rgba(255, 111, 177, 0.2);
      transform: translateY(-2px);
    }

    /* ===== Кнопки ===== */
    .btn-play {
      position: relative; width: 100%; padding: 18px 20px; border: 0; border-radius: 22px;
      font-family: var(--display); font-size: 17px; font-weight: 900; letter-spacing: .02em; color: #fff;
      background: linear-gradient(90deg, var(--violet), var(--pink));
      box-shadow: 0 7px 0 #c9488a, 0 16px 28px rgba(255, 111, 177, 0.35);
      cursor: pointer; overflow: hidden;
      transition: transform .12s, box-shadow .12s, filter .2s;
    }
    .btn-play::after {
      content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg); animation: sheen 3.2s ease-in-out infinite;
    }
    @keyframes sheen { 0%, 60% { left: -60%; } 100% { left: 130%; } }
    .btn-play:hover { filter: brightness(1.05); transform: translateY(-2px); box-shadow: 0 9px 0 #c9488a, 0 20px 34px rgba(255, 111, 177, 0.4); }
    .btn-play:active { transform: translateY(5px); box-shadow: 0 2px 0 #c9488a, 0 6px 12px rgba(255, 111, 177, 0.25); }
    .btn-play:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
    .btn-play:disabled { filter: grayscale(.3) brightness(1.05); cursor: wait; transform: none; opacity: .85; }
    .btn-play:disabled::after { display: none; }

    /* Основная кнопка на шаге 1 — мятная */
    #submitBtn {
      background: linear-gradient(90deg, var(--mint), var(--violet));
      box-shadow: 0 7px 0 #2aa98b, 0 16px 28px rgba(62, 214, 176, 0.35);
    }
    #submitBtn:hover { box-shadow: 0 9px 0 #2aa98b, 0 20px 34px rgba(62, 214, 176, 0.4); }
    #submitBtn:active { box-shadow: 0 2px 0 #2aa98b, 0 6px 12px rgba(62, 214, 176, 0.25); }

    .btn-play .spin {
      display: none; width: 18px; height: 18px; margin-right: 8px; vertical-align: -4px;
      border: 3px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; border-radius: 50%;
      animation: rot .7s linear infinite;
    }
    .btn-play.loading .spin { display: inline-block; }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ===== Сообщения ===== */
    .message {
      min-height: 26px; margin-top: 16px; font-size: 16px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .message.error { color: var(--danger); }
    .message.success { color: var(--mint-deep); }
    .message.error::before { content: "⚠"; }
    .message.success::before { content: "✦"; }

    .shake { animation: shake .45s; }
    @keyframes shake {
      0%, 100% { transform: none; } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
    }

    /* ===== Конфетти ===== */
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
    .confetti i {
      position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; opacity: 0;
      animation: fall 1.4s cubic-bezier(.2, .6, .4, 1) forwards;
    }
    @keyframes fall {
      0% { opacity: 1; transform: translate(0, 0) rotate(0); }
      100% { opacity: 0; transform: translate(var(--dx), 110vh) rotate(720deg); }
    }

    @media (max-width: 360px) {
      .code-boxes { gap: 6px; }
      .card { padding: 24px 14px 20px; }
      .logo { width: 84px; height: 84px; font-size: 46px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <span class="shape s1"></span><span class="shape s2"></span><span class="shape s3"></span><span class="shape s4"></span>
  </div>

  <main class="card" id="card">
    <span class="badge"><span class="dot"></span><span id="badgeText">Ожидание игры</span></span>

    <div class="logo" aria-hidden="true">🎮</div>

    <div class="steps" aria-hidden="true">
      <span id="step1" class="on"></span>
      <span id="step2"></span>
    </div>

    <h1 id="title">Введи код игры</h1>
    <p class="sub" id="subtitle">Попроси код у ведущего и вступай в игру!</p>

    <form id="codeForm" novalidate>
      <div class="code-boxes">
        <input class="digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Цифра 1">
        <input class="digit" type="tel" inputmode="numeric" maxlength="1" aria-label="Цифра 2">
        <input class="digit" type="tel" inputmode="numeric" maxlength="1" aria-label="Цифра 3">
        <input class="digit" type="tel" inputmode="numeric" maxlength="1" aria-label="Цифра 4">
      </div>
      <button type="submit" class="btn-play" id="submitBtn"><span class="spin"></span><span class="label">Войти в игру</span></button>
    </form>

    <form id="nameForm" novalidate hidden>
      <input class="txt" id="nameInput" type="text" maxlength="20" placeholder="Твой никнейм" autocomplete="nickname">
      <button type="submit" class="btn-play" id="nameBtn"><span class="spin"></span><span class="label">Вступить в игру</span></button>
    </form>

    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, setDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
      authDomain: "sokrat-7c938.firebaseapp.com",
      projectId: "sokrat-7c938",
      storageBucket: "sokrat-7c938.firebasestorage.app",
      messagingSenderId: "19858604945",
      appId: "1:19858604945:web:244b77bbe5afb849481030",
      measurementId: "G-K06CVPVD15"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CONFIG = { CODE_LENGTH: 4, ADMIN_CODE: "2702", ADMIN_PAGE: "adminhome.html", GAMES: "games" };

    const $ = (id) => document.getElementById(id);
    const card = $("card");
    const form = $("codeForm");
    const nameForm = $("nameForm");
    const boxes = [...document.querySelectorAll(".digit")];
    const message = $("message");
    const submitBtn = $("submitBtn");
    const nameInput = $("nameInput");
    const nameBtn = $("nameBtn");

    let pendingCode = null;

    // ===== Шаги и бейдж =====
    function setStep(n) {
      $("step1").classList.toggle("on", n >= 1);
      $("step2").classList.toggle("on", n >= 2);
      $("badgeText").textContent = n === 1 ? "Игра найдена" : "Почти в игре";
    }

    // ===== Ввод по ячейкам =====
    boxes.forEach((box, i) => {
      box.addEventListener("input", () => {
        box.value = box.value.replace(/\D/g, "").slice(-1);
        box.classList.toggle("filled", Boolean(box.value));
        if (box.value) {
          box.classList.remove("bump");
          void box.offsetWidth;
          box.classList.add("bump");
        }
        if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
        clearMessage();
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !box.value && i > 0) {
          boxes[i - 1].value = "";
          boxes[i - 1].classList.remove("filled");
          boxes[i - 1].focus();
        }
      });
      box.addEventListener("focus", () => box.select());
      box.addEventListener("paste", (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, CONFIG.CODE_LENGTH);
        digits.split("").forEach((d, j) => {
          if (boxes[i + j]) { boxes[i + j].value = d; boxes[i + j].classList.add("filled"); }
        });
        boxes[Math.min(i + digits.length, boxes.length - 1)].focus();
      });
    });

    const getCode = () => boxes.map((b) => b.value).join("");

    function resetBoxes() {
      boxes.forEach((b) => { b.value = ""; b.classList.remove("filled"); });
      boxes[0].focus();
    }

    // ===== Сообщения =====
    function showMessage(text, type) { message.textContent = text; message.className = "message " + type; }
    function clearMessage() { message.textContent = ""; message.className = "message"; }
    function showError(text) {
      showMessage(text, "error");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
    }
    function celebrate() {
      const layer = document.createElement("div");
      layer.className = "confetti";
      const colors = ["#7c5cff", "#ffc34d", "#ff6fb1", "#3ed6b0", "#ff8a5b"];
      for (let k = 0; k < 40; k++) {
        const piece = document.createElement("i");
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[k % colors.length];
        piece.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
        piece.style.animationDelay = (Math.random() * 0.3) + "s";
        layer.appendChild(piece);
      }
      document.body.appendChild(layer);
      setTimeout(() => layer.remove(), 2000);
    }
    function setLoading(btn, isLoading, text) {
      btn.disabled = isLoading;
      btn.classList.toggle("loading", isLoading);
      btn.querySelector(".label").textContent = isLoading ? "Проверяем…" : text;
    }

    // ===== Шаг 1: код игры =====
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      const code = getCode();

      if (code.length < CONFIG.CODE_LENGTH) return showError("Введи все цифры кода");
      if (code === CONFIG.ADMIN_CODE) { location.href = CONFIG.ADMIN_PAGE; return; }

      setLoading(submitBtn, true, "Войти в игру");
      try {
        const snap = await getDoc(doc(db, CONFIG.GAMES, code));
        if (!snap.exists()) return showError("Игра с таким кодом не найдена");

        const status = snap.data().status;
        if (status === "finished" || status === "cancelled") return showError("Игра уже завершена");
        if (status === "running") return showError("Игра уже идёт");

        pendingCode = code;
        form.hidden = true;
        nameForm.hidden = false;
        setStep(2);
        $("title").textContent = "Как тебя зовут?";
        $("subtitle").textContent = "Придумай никнейм для игры";
        clearMessage();
        nameInput.focus();
      } catch (err) {
        console.error(err);
        showError("Нет связи с базой, попробуй ещё раз");
      } finally {
        setLoading(submitBtn, false, "Войти в игру");
      }
    });

    // ===== Шаг 2: никнейм и вход =====
    nameForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      const name = nameInput.value.trim().replace(/\s+/g, " ");
      if (!name) return showError("Введи никнейм");

      setLoading(nameBtn, true, "Вступить в игру");
      try {
        // Проверка уникальности никнейма без учёта регистра
        const players = await getDocs(collection(db, CONFIG.GAMES, pendingCode, "players"));
        const taken = players.docs.some((d) => (d.data().name || "").toLowerCase() === name.toLowerCase());
        if (taken) return showError("Такой никнейм уже занят");

        const pid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        await setDoc(doc(db, CONFIG.GAMES, pendingCode, "players", pid), {
          name,
          joinedAt: Date.now(),
        });

        sessionStorage.setItem("player", JSON.stringify({ code: pendingCode, pid, name }));
        showMessage("Ты в игре! Поехали!", "success");
        celebrate();
        setTimeout(() => { location.href = "game.html"; }, 1100);
      } catch (err) {
        console.error(err);
        showError("Не удалось войти, попробуй ещё раз");
        setLoading(nameBtn, false, "Вступить в игру");
      }
    });

    boxes[0].focus();
  </script>
</body>
</html>
