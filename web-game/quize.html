<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Игра — Изи квиз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #6c2bd9;
      --purple-dark: #3b0f8c;
      --yellow: #ffd23f;
      --orange: #ff7a1a;
      --green: #5cc26b;
      --white: #ffffff;
      --text-light: rgba(255, 255, 255, 0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--white);
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 50%, #9b3fe8 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-shapes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .shape { position: absolute; border-radius: 50%; opacity: 0.5; filter: blur(2px); animation: float 14s ease-in-out infinite; }
    .shape.s1 { width: 340px; height: 340px; background: radial-gradient(circle at 30% 30%, var(--orange), #ff4d6d); top: -80px; left: -60px; }
    .shape.s2 { width: 240px; height: 240px; background: radial-gradient(circle at 30% 30%, var(--yellow), var(--orange)); top: 30%; right: -70px; animation-delay: -4s; }
    .shape.s3 { width: 180px; height: 180px; background: radial-gradient(circle at 30% 30%, #c084fc, var(--purple)); bottom: 5%; left: 15%; animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.06); }
      66% { transform: translate(-30px, 25px) scale(0.95); }
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(1.8); } 40% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.7); }
      50% { box-shadow: 0 0 0 14px rgba(255, 210, 63, 0); }
    }

    .demo-bar {
      position: sticky; top: 0; z-index: 20;
      background: var(--yellow); color: var(--purple-dark); font-weight: 800;
      padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap;
    }
    .demo-end {
      font-family: inherit; font-weight: 800; font-size: 14px; color: var(--white);
      background: #e0473a; border: none; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    }

    header { position: relative; z-index: 10; display: flex; align-items: center; padding: 20px clamp(20px, 5vw, 60px); }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 22px;
      color: var(--white); text-decoration: none;
    }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: grid; place-items: center; color: var(--purple-dark); font-size: 22px; transform: rotate(-6deg);
    }

    main { position: relative; z-index: 5; max-width: 680px; margin: 0 auto; padding: 10px 20px 60px; }

    .screen {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 24px; padding: 32px; text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .screen h1 { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; margin-bottom: 8px; }
    .lead { color: var(--text-light); font-size: 16px; line-height: 1.5; margin-bottom: 22px; }
    .quiz-title { color: var(--yellow); font-weight: 800; font-size: 18px; margin-bottom: 6px; }
    #joinNote { color: var(--yellow); font-weight: 700; margin-bottom: 16px; }

    input {
      font-family: inherit; font-size: 18px; color: var(--purple-dark);
      background: var(--white); border: 3px solid transparent; border-radius: 14px;
      padding: 14px 16px; outline: none; width: 100%; transition: border-color 0.2s ease;
    }
    input:focus { border-color: var(--yellow); }
    input::placeholder { color: #9a8bc4; }

    .field { margin-bottom: 14px; text-align: left; }

    .btn-primary {
      font-family: inherit; font-weight: 800; font-size: 17px; color: var(--purple-dark);
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      border: none; border-radius: 16px; padding: 16px 30px; cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 122, 26, 0.45); transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .btn-primary.small { padding: 14px 20px; font-size: 16px; }
    .btn-ghost-p {
      font-family: inherit; font-weight: 800; font-size: 16px; color: var(--white);
      background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px; padding: 14px 24px; cursor: pointer; margin-top: 10px;
      transition: background 0.2s ease;
    }
    .btn-ghost-p:hover:not(:disabled) { background: rgba(255, 255, 255, 0.22); }
    .btn-ghost-p:disabled { opacity: 0.6; cursor: wait; }

    .error { color: #ffe0a3; font-weight: 700; font-size: 15px; min-height: 20px; margin-top: 12px; line-height: 1.45; }

    .waiting-dot {
      width: 22px; height: 22px; border-radius: 50%; background: var(--yellow);
      margin: 18px auto 0; animation: pulse 1.8s ease-in-out infinite;
    }

    .count-num {
      font-family: "Unbounded", sans-serif; font-weight: 900;
      font-size: clamp(90px, 22vw, 160px); line-height: 1; color: var(--yellow);
      text-shadow: 0 8px 30px rgba(255, 122, 26, 0.5); min-height: 1.1em;
    }
    .count-num.pop { animation: pop 0.9s ease both; }
    .count-num.start { font-size: clamp(56px, 14vw, 96px); color: var(--white); }

    .q-progress { font-weight: 800; font-size: 14px; color: var(--text-light); margin-bottom: 14px; }
    .timer-track { height: 12px; background: rgba(255, 255, 255, 0.2); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
    .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); border-radius: 999px; }
    .timer-label { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 28px; margin-bottom: 18px; }

    .q-text {
      background: var(--white); color: var(--purple-dark);
      border-radius: 20px; padding: 24px 20px; margin-bottom: 20px;
      font-weight: 800; font-size: clamp(19px, 3vw, 24px); line-height: 1.35;
      box-shadow: 0 12px 30px rgba(20, 0, 60, 0.25);
    }

    .q-img {
      display: block; max-width: 100%; max-height: 300px; object-fit: contain;
      margin: 0 auto 16px; border-radius: 16px; background: #fff;
    }
    .q-img[hidden] { display: none !important; }
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt {
      font-family: inherit; font-weight: 700; font-size: 16px; text-align: left;
      color: var(--purple-dark); background: var(--white);
      border: 3px solid transparent; border-radius: 16px; padding: 16px;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 6px 18px rgba(20, 0, 60, 0.2);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--yellow); }
    .opt:disabled { cursor: default; opacity: 0.7; }
    .opt.chosen { border-color: var(--purple); opacity: 1; }
    .opt.correct { border-color: var(--green); background: #e9f8ee; opacity: 1; }
    .opt.wrong { border-color: #e0473a; background: #ffe9e6; opacity: 1; }
    .opt-letter {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: grid; place-items: center; font-weight: 900; color: var(--purple-dark);
    }

    .open-row { display: flex; gap: 10px; }
    .open-row input:disabled { opacity: 0.6; }
    .open-row .btn-primary { white-space: nowrap; }

    .q-status { margin-top: 18px; font-weight: 800; font-size: 17px; color: var(--yellow); min-height: 24px; }
    .rating-line { margin-top: 14px; font-weight: 700; font-size: 15px; color: var(--text-light); }
    .rating-badge {
      display: inline-block; background: var(--yellow); color: var(--purple-dark);
      font-weight: 800; font-size: 15px; padding: 8px 16px; border-radius: 999px; margin-bottom: 14px;
    }
    .rating-badge:empty { display: none; }
    .next-wrap { margin-top: 16px; }

    .done-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .done-actions .btn-primary, .done-actions .btn-ghost-p { margin-top: 0; }
    .retake-msg { margin-top: 10px; color: #ffe0a3; font-weight: 700; font-size: 15px; min-height: 20px; line-height: 1.45; }

    .lb { text-align: left; margin-top: 14px; }
    .lb-row {
      display: flex; gap: 10px; align-items: center;
      background: rgba(255, 255, 255, 0.14); border-radius: 12px;
      padding: 10px 14px; margin-bottom: 8px;
    }
    .lb-rank { font-family: "Unbounded", sans-serif; font-weight: 900; width: 28px; }
    .lb-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-weight: 900; color: var(--yellow); }

    @media (max-width: 560px) {
      .screen { padding: 22px; }
      .answers { grid-template-columns: 1fr; }
      .btn-primary, .btn-ghost-p { width: 100%; }
      .open-row { flex-direction: column; }
      .logo { font-size: 17px; }
      .logo-mark { width: 34px; height: 34px; font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg-shapes" aria-hidden="true">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
  </div>

  <div class="demo-bar" id="demoBar" hidden>
    <span>Демо-режим: так видит тест участник. Ответы никуда не сохраняются.</span>
    <button class="demo-end" id="demoEnd">Завершить демо тест</button>
  </div>

  <header>
    <a href="index.html" class="logo"><span class="logo-mark">?</span>Изи квиз</a>
  </header>

  <main>
    <section class="screen" id="joinScreen" hidden>
      <h1>Войти в игру</h1>
      <div class="quiz-title" id="quizTitleJoin"></div>
      <p class="lead" id="joinNote" hidden></p>
      <p class="lead">Придумайте никнейм, под которым вас увидит организатор.</p>
      <div class="field"><input type="text" id="nickInput" maxlength="20" placeholder="Например, Мах123" autocomplete="off" /></div>
      <button class="btn-primary" id="joinBtn">Войти</button>
      <div><button class="btn-ghost-p" id="joinRetake" hidden>Запросить перездачу</button></div>
      <div class="error" id="joinError"></div>
    </section>

    <section class="screen" id="lobbyScreen" hidden>
      <h1>Вы в игре!</h1>
      <div class="quiz-title" id="quizTitleLobby"></div>
      <p class="lead" id="lobbyText">Ждём, когда организатор начнёт тест.</p>
      <div class="waiting-dot" aria-hidden="true"></div>
    </section>

    <section class="screen" id="countdownScreen" hidden>
      <div class="count-num" id="countNum">5</div>
    </section>

    <section class="screen" id="questionScreen" hidden>
      <div class="q-progress" id="qProgress"></div>
      <div class="rating-badge" id="ratingLine"></div>
      <div class="timer-track"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-label" id="timerLabel"></div>
      <img class="q-img" id="qImg" alt="" hidden />
      <div class="q-text" id="qText"></div>
      <div id="qAnswers"></div>
      <div class="q-status" id="qStatus"></div>
      <div class="next-wrap" id="nextWrap"></div>
    </section>

    <section class="screen" id="doneScreen" hidden>
      <h1>Тест завершён!</h1>
      <p class="lead" id="doneText">Спасибо за участие.</p>
      <div class="rating-badge" id="doneGrade"></div>
      <p class="rating-line" id="doneRating"></p>
      <div class="done-actions">
        <button class="btn-primary small" id="doneCert" hidden>Скачать сертификат</button>
        <button class="btn-ghost-p" id="doneRetake" hidden>Запросить перездачу</button>
      </div>
      <p class="retake-msg" id="retakeMsg"></p>
      <div id="doneBoard" class="lb"></div>
    </section>

    <section class="screen" id="errorScreen" hidden>
      <h1>Не получилось</h1>
      <p class="lead" id="errorText"></p>
      <a class="btn-primary" href="index.html" style="text-decoration:none;display:inline-block">На главную</a>
    </section>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, collection, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { makeCertNumber, downloadCertificate, gradeFor, maxScoreOf } from "./cert.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
    authDomain: "sokrat-7c938.firebaseapp.com",
    projectId: "sokrat-7c938",
    storageBucket: "sokrat-7c938.firebasestorage.app",
    messagingSenderId: "19858604945",
    appId: "1:19858604945:web:8ec6dc1a81dba35c481030",
    measurementId: "G-B3SDDN1T50"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const DEMO = params.get('demo') === '1';
  const playerKey = (r) => `izi_player_${code}_${r}`;
  const LETTERS = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];

  let quiz = null;
  let order = [];
  let round = 1;
  let playerId = null;
  let playerName = '';
  let attempt = 1;
  let exitCount = 0;       // выходов со страницы подряд (сбрасывается, когда участник снова ответил)
  let ended = false;       // попытка завершена из-за двух выходов подряд
  let blockedAttempt = 0;
  let blockedGrade = null;
  let myGrade = null;
  // Перездача доступна только при оценках 2 и 1 (без СКР — всегда)
  const retakeAllowed = (g) => g == null || Number(g) <= 2;
  let certPromise = null;  // сертификат выдаётся один раз на попытку
  let certData = null;
  let gameStatus = 'waiting';
  let latestPos = -1;
  let questionStartedMs = 0;
  let started = false;
  let countdownDone = false;
  let gameOver = false;
  let unsubGame = null;
  let unsubRetake = null;
  let timerId = null;
  let shownPos = -1;
  let curPos = -1;
  let curQ = null;
  let answered = false;
  let demoScore = 0;

  function show(id) {
    ['joinScreen', 'lobbyScreen', 'countdownScreen', 'questionScreen', 'doneScreen', 'errorScreen']
      .forEach((s) => { $(s).hidden = s !== id; });
  }

  const fmt = (ts) => ts.toDate().toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function fail(text) {
    $('errorText').textContent = text;
    show('errorScreen');
  }

  function shuffle(a) {
    const r = [...a];
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function makeOrder(q) {
    const idx = q.questions.map((_, i) => i);
    return q.shuffleQuestions ? shuffle(idx) : idx;
  }

  // Ключ человека: один никнейм = один участник в пределах запуска квиза
  const personKey = (name) => 'n_' + name.trim().toLowerCase().replace(/[\/\s]+/g, '_');
  const playerRef = () => doc(db, 'games', code, 'rounds', String(round), 'players', playerId);
  const todayStr = () => new Date().toLocaleDateString('ru-RU');

  function setLobbyText() {
    $('lobbyText').textContent = `Вы в игре как «${playerName}». Ждём старт.`;
  }

  // Данные сертификата -> то, что рисует cert.js
  function toDraw(c) {
    return {
      name: c.nickname, quiz: c.quizTitle, attempt: c.attempt, score: c.score, maxScore: c.maxScore,
      grade: c.grade ?? null, place: c.place, total: c.total, date: c.date, certNo: c.certNo, quizCode: c.quizCode
    };
  }

  /* ---------- Старт ---------- */
  async function init() {
    if (!code) return fail('Не указан код квиза.');

    try {
      const qs = await getDoc(doc(db, 'quizzes', code));
      if (!qs.exists()) return fail('Квиз с таким кодом не найден.');
      quiz = { questions: [], ...qs.data() };
      quiz.timeLimit = quiz.timeLimit || 20;
      $('quizTitleJoin').textContent = quiz.title;
      $('quizTitleLobby').textContent = quiz.title;

      // Расписание: вход открыт только в заданное время (демо не ограничиваем)
      if (!DEMO) {
        const now = Date.now();
        if (quiz.startsAt && now < quiz.startsAt.toMillis()) return fail(`Квиз откроется ${fmt(quiz.startsAt)}.`);
        if (quiz.endsAt && now > quiz.endsAt.toMillis()) return fail('Срок проведения этого квиза уже истёк.');
      }

      if (DEMO) {
        $('demoBar').hidden = false;
        $('demoEnd').addEventListener('click', () => {
          clearInterval(timerId);
          window.location.href = 'cabinet.html';
        });
        order = makeOrder(quiz);
        startCountdown(() => demoRun(0));
        return;
      }

      const gs = await getDoc(doc(db, 'games', code));
      if (!gs.exists()) return fail('Организатор ещё не открыл экран ожидания. Попробуйте чуть позже.');

      round = gs.data().round || 1;
      playerName = sessionStorage.getItem('izi_nickname') || '';
      playerId = sessionStorage.getItem(playerKey(round));

      // Восстанавливаем состояние участника после перезагрузки страницы
      if (playerId) {
        const ps = await getDoc(playerRef());
        if (ps.exists()) {
          const p = ps.data();
          attempt = p.attempt || 1;
          exitCount = p.exits || 0;
          ended = !!p.ended;
        } else {
          playerId = null;
        }
      }

      watchGame();
      if (playerName) watchRetake(playerName);

      if (playerId && ended) {
        finish();
      } else if (playerId) {
        setLobbyText();
        show('lobbyScreen');
      } else {
        $('nickInput').value = playerName;
        show('joinScreen');
      }
    } catch (err) {
      console.error(err);
      fail('Не удалось загрузить квиз. Проверьте интернет и обновите страницу.');
    }
  }

  /* ---------- Вход ---------- */
  $('joinBtn').addEventListener('click', async () => {
    const name = $('nickInput').value.trim();
    const error = $('joinError');
    if (name.length < 2) { error.textContent = 'Никнейм минимум 2 символа'; return; }
    if (name.length > 20) { error.textContent = 'Никнейм максимум 20 символов'; return; }

    const btn = $('joinBtn');
    btn.disabled = true;
    error.textContent = '';
    $('joinRetake').hidden = true;
    $('joinNote').hidden = true;

    try {
      const key = personKey(name);
      const base = collection(db, 'games', code, 'rounds', String(round), 'players');
      const same = (await getDocs(query(base, where('key', '==', key)))).docs.map((d) => d.data());
      const maxAttempt = same.reduce((m, p) => Math.max(m, p.attempt || 1), 0);
      const anyEnded = same.some((p) => p.ended);
      const last = same.reduce((a, p) => ((p.attempt || 1) > (a ? a.attempt || 1 : 0) ? p : a), null);

      // Второй выход подряд — перездачи нет совсем. Иначе — только с разрешения организатора
      let approved = false;
      const reqRef = doc(db, 'games', code, 'retakeRequests', key);
      if (same.length && !anyEnded) {
        const rs = await getDoc(reqRef);
        const r = rs.exists() ? rs.data() : null;
        approved = !!r && r.status === 'approved' && r.round === round && r.allowedAttempt === maxAttempt + 1;
      }

      if (same.length && !approved && (quiz.gradeMode || anyEnded)) {
        blockedAttempt = maxAttempt;
        blockedGrade = last?.grade ?? null;
        const canAsk = !anyEnded && retakeAllowed(blockedGrade);
        error.textContent = anyEnded
          ? 'Этот никнейм уже проходил тест и был завершён из-за двух выходов со страницы. Повторно пройти его нельзя.'
          : !canAsk
            ? 'Повторно пройти тест можно только при оценках 2 или 1.'
            : 'Этот никнейм уже проходил тест. Повторно пройти можно только с разрешения организатора.';
        $('joinRetake').hidden = !canAsk;
        return;
      }

      const newAttempt = same.length ? maxAttempt + 1 : 1;
      const ref = await addDoc(base, { name, key, attempt: newAttempt, ended: false, exits: 0, joinedAt: serverTimestamp() });
      if (approved) await updateDoc(reqRef, { status: 'used' });
      beginAttempt(ref.id, name, newAttempt);
    } catch (err) {
      console.error(err);
      error.textContent = 'Не удалось войти в игру. Попробуйте ещё раз';
    } finally {
      btn.disabled = false;
    }
  });

  $('nickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });

  $('joinRetake').addEventListener('click', async () => {
    const name = $('nickInput').value.trim();
    if (name.length < 2) { $('joinError').textContent = 'Введите никнейм, под которым вы проходили тест'; return; }
    try {
      await requestRetake(name, blockedAttempt, blockedGrade);
      $('joinRetake').hidden = true;
      $('joinError').textContent = 'Запрос отправлен. Когда организатор разрешит, нажмите «Войти» ещё раз.';
      watchRetake(name);
    } catch (err) {
      console.error(err);
      $('joinError').textContent = 'Не удалось отправить запрос. Попробуйте ещё раз';
    }
  });

  function beginAttempt(id, name, att) {
    playerId = id;
    playerName = name;
    attempt = att;
    exitCount = 0;
    ended = false;
    gameOver = false;
    answered = false;
    shownPos = -1;
    certData = null;
    certPromise = null;
    sessionStorage.setItem(playerKey(round), id);
    sessionStorage.setItem('izi_nickname', name);
    watchRetake(name);
    setLobbyText();
    show('lobbyScreen');
    if (gameStatus === 'finished') { finish(); return; }
    if (started) applyLatest();
    else maybeStartGame();
  }

  /* ---------- Состояние игры от организатора ---------- */
  function watchGame() {
    if (unsubGame) return;
    unsubGame = onSnapshot(doc(db, 'games', code), (snap) => {
      if (!snap.exists()) return;
      const g = snap.data();
      const r = g.round || 1;

      if (r !== round) {
        round = r;
        resetForNewRound();
      }

      gameStatus = g.status;
      if (g.status === 'finished') {
        finish('Организатор завершил тест.');
        return;
      }
      if (g.status === 'running') {
        order = g.order || order;
        latestPos = g.current ?? -1;
        // Время вопроса считаем от момента, когда организатор его показал
        questionStartedMs = g.questionStartedAt?.toMillis?.() ?? Date.now();
        if (started) applyLatest();
        else maybeStartGame();
      }
    });
  }

  function maybeStartGame() {
    if (gameStatus !== 'running' || !playerId || ended || gameOver || started) return;
    started = true;
    startCountdown(() => { countdownDone = true; applyLatest(); });
  }

  function applyLatest() {
    if (!countdownDone || gameOver || ended || latestPos < 0) return;
    if (quiz.endsAt && Date.now() > quiz.endsAt.toMillis()) {
      finish('Срок проведения квиза истёк.');
      return;
    }
    if (latestPos >= order.length) {
      finish('Вопросы закончились. Ждём итоги от организатора.');
      return;
    }
    if (latestPos !== shownPos) showQuestionAt(latestPos, questionStartedMs);
  }

  function resetForNewRound() {
    clearInterval(timerId);
    started = false;
    countdownDone = false;
    gameOver = false;
    answered = false;
    shownPos = -1;
    latestPos = -1;
    ended = false;
    exitCount = 0;
    attempt = 1;
    certData = null;
    certPromise = null;
    playerId = sessionStorage.getItem(playerKey(round));
    if (playerId) {
      setLobbyText();
      show('lobbyScreen');
    } else {
      $('nickInput').value = playerName;
      $('joinError').textContent = '';
      $('joinRetake').hidden = true;
      $('joinNote').hidden = true;
      show('joinScreen');
    }
  }

  /* ---------- Обратный отсчёт ---------- */
  function startCountdown(cb) {
    show('countdownScreen');
    const el = $('countNum');
    const seq = ['5', '4', '3', '2', '1', 'Старт!'];
    let i = 0;

    const set = (text) => {
      el.textContent = text;
      el.classList.toggle('start', text === 'Старт!');
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    };

    set(seq[0]);
    const t = setInterval(() => {
      i++;
      if (i >= seq.length) {
        clearInterval(t);
        setTimeout(cb, 800);
        return;
      }
      set(seq[i]);
    }, 1000);
  }

  /* ---------- Вопросы ---------- */
  function showQuestionAt(pos, startedMs) {
    shownPos = pos;
    curPos = pos;
    curQ = quiz.questions[order[pos]];
    answered = false;

    show('questionScreen');
    $('qProgress').textContent = `Вопрос ${pos + 1} из ${order.length} · баллов: ${curQ.points ?? 1}`;
    $('qText').textContent = curQ.text;
    const img = $('qImg');
    img.removeAttribute('src');
    img.hidden = true;
    if (curQ.image && curQ.image.id) {
      const imgPos = pos;
      loadImageData(curQ.image.id).then((src) => {
        if (src && shownPos === imgPos) {
          img.src = src;
          img.hidden = false;
        }
      });
    }
    $('qStatus').textContent = '';
    $('nextWrap').innerHTML = '';

    const box = $('qAnswers');
    box.innerHTML = '';

    if (curQ.type === 'choice') {
      const grid = document.createElement('div');
      grid.className = 'answers';
      curQ.options.forEach((opt, j) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.dataset.idx = j;
        const letter = document.createElement('span');
        letter.className = 'opt-letter';
        letter.textContent = LETTERS[j] || String(j + 1);
        b.append(letter, document.createTextNode(opt));
        b.addEventListener('click', () => {
          b.classList.add('chosen');
          submitAnswer(j);
        });
        grid.appendChild(b);
      });
      box.appendChild(grid);
    } else {
      const row = document.createElement('div');
      row.className = 'open-row';
      row.innerHTML = `
        <input type="text" id="openInput" maxlength="120" placeholder="Ваш ответ" autocomplete="off" />
        <button class="btn-primary small" id="openSend">Ответить</button>`;
      box.appendChild(row);
      const input = $('openInput');
      const send = () => {
        const value = input.value.trim();
        if (value) submitAnswer(value);
      };
      $('openSend').addEventListener('click', send);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
      setTimeout(() => input.focus(), 50);
    }

    // Время идёт от старта вопроса у организатора, даже если участник ушёл со страницы
    const limit = curQ.timeLimit || quiz.timeLimit;
    startTimer(limit, (startedMs || Date.now()) + limit * 1000, () => endQuestion('Время вышло', undefined, true));
    refreshRating();
  }

  function startTimer(seconds, endAt, onEnd) {
    clearInterval(timerId);
    const total = seconds * 1000;
    const bar = $('timerBar');
    const label = $('timerLabel');

    const tick = () => {
      const left = Math.max(0, endAt - Date.now());
      bar.style.width = (left / total * 100) + '%';
      label.textContent = Math.ceil(left / 1000);
      if (left <= 0) {
        clearInterval(timerId);
        onEnd();
      }
    };
    tick();
    timerId = setInterval(tick, 100);
  }

  function isCorrect(q, value) {
    if (q.type === 'choice') return value === q.correct;
    const v = String(value).trim().toLowerCase();
    return q.answers.some((a) => a.trim().toLowerCase() === v);
  }

  function correctText(q) {
    return q.type === 'choice' ? q.options[q.correct] : q.answers[0];
  }

  function lockAnswers(text) {
    answered = true;
    clearInterval(timerId);
    document.querySelectorAll('#qAnswers button, #qAnswers input').forEach((el) => { el.disabled = true; });
    $('qStatus').textContent = text;
  }

  // Показ правильного ответа — только если организатор включил эту настройку
  function reveal(value, timedOut) {
    if (!quiz.showAnswers) return;

    if (curQ.type === 'choice') {
      document.querySelectorAll('#qAnswers .opt').forEach((b) => {
        const idx = +b.dataset.idx;
        if (idx === curQ.correct) b.classList.add('correct');
        else if (idx === value) b.classList.add('wrong');
      });
    }

    let msg;
    if (timedOut) msg = `Время вышло. Правильный ответ: ${correctText(curQ)}`;
    else if (isCorrect(curQ, value)) msg = 'Верно! ✓';
    else msg = `Неверно. Правильный ответ: ${correctText(curQ)}`;
    $('qStatus').textContent = msg;
  }

  function endQuestion(statusText, value, timedOut) {
    if (answered) return;
    lockAnswers(statusText);
    reveal(value, timedOut);
    onQuestionEnded();
  }

  // В демо-режиме переход к следующему вопросу делает сам «участник» (локально)
  function onQuestionEnded() {
    if (!DEMO) return;
    if (quiz.manualMode) {
      $('nextWrap').innerHTML = '<button class="btn-primary small" id="demoNext">Следующий вопрос</button>';
      $('demoNext').addEventListener('click', () => demoRun(curPos + 1));
    } else {
      setTimeout(() => demoRun(curPos + 1), quiz.showAnswers ? 3500 : 2000);
    }
  }

  async function submitAnswer(value) {
    if (answered || ended || gameOver) return;
    const ok = isCorrect(curQ, value);
    const pts = ok ? (curQ.points ?? 1) : 0;
    endQuestion('Ответ принят ✓', value, false);

    if (DEMO) {
      demoScore += pts;
      refreshRating();
      return;
    }

    try {
      await setDoc(doc(db, 'games', code, 'rounds', String(round), 'answers', `${curPos}_${playerId}`), {
        q: curPos,
        player: playerId,
        answer: value,
        correct: ok,
        points: pts,
        answeredAt: serverTimestamp()
      });
      // Участник снова в игре: счётчик выходов подряд сбрасываем
      if (exitCount > 0) {
        exitCount = 0;
        updateDoc(playerRef(), { exits: 0 }).catch((e) => console.error(e));
      }
    } catch (err) {
      console.error(err);
      $('qStatus').textContent = 'Ответ не сохранился. Проверьте интернет';
    }
    refreshRating();
  }

  /* ---------- Выход со страницы ---------- */
  // Время не останавливается: вопрос идёт дальше. Второй выход подряд завершает тест для участника
  document.addEventListener('visibilitychange', () => {
    if (DEMO || !playerId || ended) return;
    if (document.visibilityState === 'hidden') {
      if (!countdownDone || gameOver) return;
      exitCount += 1;
      if (exitCount >= 2) {
        endAttempt();
        return;
      }
      updateDoc(playerRef(), { exits: exitCount }).catch((e) => console.error(e));
    } else if (exitCount === 1 && !answered && !gameOver && shownPos >= 0) {
      $('qStatus').textContent = 'Вы покинули страницу. Ещё один выход подряд — и тест для вас завершится.';
    }
  });

  async function endAttempt() {
    ended = true;
    clearInterval(timerId);
    try {
      await updateDoc(playerRef(), { ended: true, exits: exitCount, endedAt: serverTimestamp() });
    } catch (err) {
      console.error(err);
    }
    finish();
  }

  /* ---------- Рейтинг ---------- */
  async function loadScores() {
    const base = ['games', code, 'rounds', String(round)];
    const [answersSnap, playersSnap] = await Promise.all([
      getDocs(collection(db, ...base, 'answers')),
      getDocs(collection(db, ...base, 'players'))
    ]);
    const scores = {};
    answersSnap.forEach((d) => {
      const a = d.data();
      scores[a.player] = (scores[a.player] || 0) + (a.points || 0);
    });
    return playersSnap.docs
      .map((d) => ({ id: d.id, name: d.data().name, score: scores[d.id] || 0, ended: !!d.data().ended }))
      .sort((a, b) => b.score - a.score);
  }

  async function refreshRating() {
    if (DEMO) {
      $('ratingLine').textContent = `Ваши баллы: ${demoScore}`;
      return;
    }
    if (!playerId) return;
    try {
      const list = await loadScores();
      const i = list.findIndex((p) => p.id === playerId);
      $('ratingLine').textContent = i >= 0
        ? `Ваши баллы: ${list[i].score} · место ${i + 1} из ${list.length}`
        : '';
    } catch (err) {
      console.error(err);
    }
  }

  function renderBoard(el, list) {
    el.innerHTML = list.length
      ? list.map((p, i) => `
          <div class="lb-row">
            <span class="lb-rank">${i + 1}</span>
            <span class="lb-name">${esc(p.name)}${p.id === playerId ? ' (вы)' : ''}${p.ended ? ' · вышел' : ''}</span>
            <span class="lb-score">${p.score}</span>
          </div>`).join('')
      : '';
  }

  /* ---------- Фото вопросов (из коллекции quizImages) ---------- */
  const imageCache = {};
  async function loadImageData(id) {
    if (imageCache[id]) return imageCache[id];
    const snap = await getDoc(doc(db, 'quizImages', id));
    const data = snap.exists() ? snap.data().data : null;
    if (data) imageCache[id] = data;
    return data;
  }

  /* ---------- Сертификат ---------- */
  // Номер уникальный: если такой уже есть, берём другой
  async function saveCertificate(fields) {
    for (let i = 0; i < 5; i++) {
      const certNo = makeCertNumber();
      const ref = doc(db, 'certificates', certNo);
      const snap = await getDoc(ref);
      if (snap.exists()) continue;
      await setDoc(ref, { ...fields, certNo, createdAt: serverTimestamp() });
      return certNo;
    }
    throw new Error('Не удалось создать номер сертификата. Попробуйте позже');
  }

  // Сертификат выдаётся один раз на попытку; при перезагрузке берём уже выданный
  function issueCertificate(score, place, total) {
    if (!certPromise) {
      certPromise = (async () => {
        const ps = await getDoc(playerRef());
        if (ps.exists() && ps.data().certNo) {
          const cs = await getDoc(doc(db, 'certificates', ps.data().certNo));
          if (cs.exists()) return toDraw(cs.data());
        }
        const fields = {
          quizCode: code,
          quizTitle: quiz.title,
          ownerUid: quiz.ownerUid || null,
          nickname: playerName,
          personKey: personKey(playerName),
          attempt,
          score,
          maxScore: maxScoreOf(quiz),
          grade: quiz.gradeMode ? gradeFor(score, quiz.grades) : null,
          gradeMode: !!quiz.gradeMode,
          place,
          total,
          date: todayStr()
        };
        const certNo = await saveCertificate(fields);
        await updateDoc(playerRef(), { certNo, grade: fields.grade });
        return toDraw({ ...fields, certNo });
      })();
      certPromise.catch(() => { certPromise = null; });
    }
    return certPromise;
  }

  $('doneCert').addEventListener('click', async () => {
    if (!certData) return;
    try {
      await downloadCertificate(certData);
    } catch (err) {
      console.error(err);
      $('retakeMsg').textContent = err.message || 'Не удалось скачать сертификат';
    }
  });

  /* ---------- Перездача ---------- */
  function requestRetake(name, att, grade) {
    return setDoc(doc(db, 'games', code, 'retakeRequests', personKey(name)), {
      name: name.trim(),
      key: personKey(name),
      attempt: att,
      grade: grade ?? null,
      round,
      status: 'pending',
      requestedAt: serverTimestamp()
    });
  }

  // Следим за решением организатора по своему запросу
  function watchRetake(name) {
    if (DEMO || !name) return;
    if (unsubRetake) unsubRetake();
    unsubRetake = onSnapshot(doc(db, 'games', code, 'retakeRequests', personKey(name)), (snap) => {
      if (!snap.exists()) return;
      const r = snap.data();
      if (r.status === 'approved' && r.round === round && (ended || !playerId)) {
        showApprovedJoin(name);
      }
    }, (err) => console.error(err));
  }

  function showApprovedJoin(name) {
    $('nickInput').value = name;
    $('joinError').textContent = '';
    $('joinRetake').hidden = true;
    $('joinNote').textContent = 'Организатор разрешил перездачу. Нажмите «Войти», чтобы начать заново.';
    $('joinNote').hidden = false;
    show('joinScreen');
  }

  $('doneRetake').addEventListener('click', async () => {
    const btn = $('doneRetake');
    btn.disabled = true;
    try {
      await requestRetake(playerName, attempt, myGrade);
      btn.hidden = true;
      $('retakeMsg').textContent = 'Запрос отправлен. Ждём решения организатора.';
      watchRetake(playerName);
    } catch (err) {
      console.error(err);
      $('retakeMsg').textContent = 'Не удалось отправить запрос. Попробуйте ещё раз';
    } finally {
      btn.disabled = false;
    }
  });

  /* ---------- Экран завершения ---------- */
  async function finish(note) {
    if (DEMO) {
      gameOver = true;
      clearInterval(timerId);
      $('doneText').textContent = note || 'Спасибо за участие!';
      $('doneGrade').textContent = quiz.gradeMode ? `Оценка в демо: ${gradeFor(demoScore, quiz.grades)}` : '';
      $('doneRating').textContent = `Ваш рейтинг: ${demoScore} баллов`;
      $('doneBoard').innerHTML = '';
      $('doneCert').hidden = true;
      $('doneRetake').hidden = true;
      $('retakeMsg').textContent = '';
      show('doneScreen');
      return;
    }

    gameOver = true;
    clearInterval(timerId);
    $('doneText').textContent = ended
      ? 'Вы дважды подряд покинули страницу, поэтому тест для вас завершён. Сертификат не выдаётся.'
      : (note || 'Спасибо за участие!');
    $('doneGrade').textContent = '';
    $('doneRating').textContent = '';
    $('doneCert').hidden = true;
    $('doneRetake').hidden = true;   // покажем после расчёта оценки
    $('retakeMsg').textContent = '';
    show('doneScreen');

    try {
      const list = await loadScores();
      renderBoard($('doneBoard'), list);
      const i = list.findIndex((p) => p.id === playerId);
      if (i < 0) return;
      const me = list[i];
      myGrade = quiz.gradeMode ? gradeFor(me.score, quiz.grades) : null;
      $('doneRetake').hidden = ended || !playerId || !retakeAllowed(myGrade);
      $('doneRating').textContent = `Ваш итог: ${me.score} баллов · место ${i + 1} из ${list.length}`;
      if (quiz.gradeMode && !ended) $('doneGrade').textContent = `Ваша оценка: ${gradeFor(me.score, quiz.grades)}`;
      if (!ended) {
        certData = await issueCertificate(me.score, i + 1, list.length);
        $('doneCert').hidden = false;
      }
    } catch (err) {
      console.error(err);
      $('retakeMsg').textContent = 'Не удалось выдать сертификат. Обновите страницу.';
    }
  }

  /* ---------- Демо-режим ---------- */
  function demoRun(pos) {
    if (gameOver) return;
    if (pos >= order.length) {
      finish(`Демо-тест завершён. Ваш результат: ${demoScore} баллов`);
      return;
    }
    showQuestionAt(pos);
  }

  window.addEventListener('beforeunload', () => {
    if (unsubGame) unsubGame();
    if (unsubRetake) unsubRetake();
    clearInterval(timerId);
  });

  init();
</script>
</body>
</html>
