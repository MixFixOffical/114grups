<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>СОКРАТ — Диагностика доступа</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:22px;background:#f5f7fb;color:#172033;font-size:14px}
h1{font-size:18px;margin:0 0 14px}
.card{background:#fff;border:1px solid #e8ecf3;border-radius:12px;padding:14px 16px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5}
.ok{color:#16865b;font-weight:700}.bad{color:#df4355;font-weight:700}
</style></head>
<body>
<h1>Диагностика доступа к Firestore</h1>
<div class="card" id="who">Ожидание входа…</div>
<div class="card" id="profile">—</div>
<div class="card" id="tests">—</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
  authDomain: "sokrat-7c938.firebaseapp.com",
  projectId: "sokrat-7c938",
  storageBucket: "sokrat-7c938.firebasestorage.app",
  messagingSenderId: "19858604945",
  appId: "1:19858604945:web:8ec6dc1a81dba35c481030"
});
const auth = getAuth(app);
const db = getFirestore(app);
const show = (id, text) => { document.getElementById(id).innerHTML = text; };
const line = (ok, label, detail = "") => `<span class="${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"}</span> ${label}${detail ? "\n    " + detail : ""}`;
const errText = e => `${e.code || ""} ${e.message || e}`;

onAuthStateChanged(auth, async user => {
  if (!user) { show("who", "Вы не вошли в систему. Сначала войдите на login.html, потом откройте эту страницу в той же вкладке."); return; }
  show("who", `Вошли как: ${user.email || "(без email)"}\nUID: ${user.uid}`);

  let role = null, profileOk = false;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      profileOk = true;
      const d = snap.data();
      role = d.role;
      show("profile", `Документ users/${user.uid} НАЙДЕН\n` + JSON.stringify(d, (k, v) => (v && v.toDate ? v.toDate().toISOString() : v), 2) +
        `\n\n` + line(["admin","director","deputy_ur","cmc_chair","methodist","teacher"].includes(role), `поле role = "${role}"`));
    } else {
      show("profile", `Документа users/${user.uid} НЕТ.\n` + line(false, "Без него правила не знают роль и закрывают доступ ко всему."));
    }
  } catch (e) {
    show("profile", `Чтение users/${user.uid}: ` + line(false, "ошибка", errText(e)));
  }

  const tests = [
    ["tasks — все (как на странице директора)", () => getDocs(query(collection(db, "tasks"), limit(1)))],
    ["tasks — где department (как у пред. ЦМК)", () => getDocs(query(collection(db, "tasks"), where("department", "==", "__тест__"), limit(1)))],
    ["tasks — где assignee (как у методиста/преподавателя)", () => getDocs(query(collection(db, "tasks"), where("assignee", "==", "__тест__"), limit(1)))],
    ["departments", () => getDocs(query(collection(db, "departments"), limit(1)))],
    ["logs", () => getDocs(query(collection(db, "logs"), limit(1)))],
  ];
  const out = [];
  for (const [label, fn] of tests) {
    try { const r = await fn(); out.push(line(true, label, `доступ есть, документов в ответе: ${r.size}`)); }
    catch (e) { out.push(line(false, label, errText(e))); }
  }
  show("tests", "Проверка запросов:\n\n" + out.join("\n"));
});
</script>
</body></html>
