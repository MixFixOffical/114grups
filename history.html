<script type="module">


    // =========================================
    // FIREBASE
    // =========================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",

        authDomain:
            "othets-1aa03.firebaseapp.com",

        projectId:
            "othets-1aa03",

        storageBucket:
            "othets-1aa03.firebasestorage.app",

        messagingSenderId:
            "528392191591",

        appId:
            "1:528392191591:web:1e97790e6f9f0a6e175ec2",

        measurementId:
            "G-F50WVZRXZJ"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    // =========================================
    // VARIABLES
    // =========================================

    let students = [];

    let settings = {};

    /*
        ВАЖНО:

        attendance теперь имеет вид:

        attendance[
            "2026-09-03_STUDENT_ID_1"
        ] = {
            date: "2026-09-03",
            studentId: "...",
            studentName: "...",
            lesson: "1",
            status: "absent",
            reason: "..."
        }

        То есть каждый урок из lessons
        превращается в отдельную запись.
    */

    let attendance = {};

    let weekStart;


    const days = [

        "Понедельник",
        "Вторник",
        "Среда",
        "Четверг",
        "Пятница",
        "Суббота"

    ];


    // =========================================
    // CLOCK
    // =========================================

    function updateClock() {

        const now =
            new Date();


        document.getElementById(
            "currentTime"
        ).textContent =
            now.toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );


        document.getElementById(
            "currentDate"
        ).textContent =
            now.toLocaleDateString(
                "ru-RU",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );

    }


    updateClock();

    setInterval(
        updateClock,
        1000
    );


    // =========================================
    // DATE FORMAT
    // =========================================

    function formatDate(date) {

        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            );


        return `${year}-${month}-${day}`;

    }


    // =========================================
    // NORMALIZE DATE
    // =========================================

    function normalizeDate(value) {

        if (!value) {
            return "";
        }


        /*
            Firestore Timestamp
        */

        if (
            typeof value === "object" &&
            typeof value.toDate === "function"
        ) {

            return formatDate(
                value.toDate()
            );

        }


        /*
            JS Date
        */

        if (value instanceof Date) {

            return formatDate(value);

        }


        const string =
            String(value).trim();


        /*
            YYYY-MM-DD
        */

        if (
            /^\d{4}-\d{2}-\d{2}$/.test(
                string
            )
        ) {

            return string;

        }


        /*
            DD.MM.YYYY
        */

        const ruMatch =
            string.match(
                /^(\d{2})\.(\d{2})\.(\d{4})$/
            );


        if (ruMatch) {

            return `${ruMatch[3]}-${ruMatch[2]}-${ruMatch[1]}`;

        }


        return "";

    }


    // =========================================
    // DATE RU
    // =========================================

    function formatDateRu(
        dateString
    ) {

        const normalized =
            normalizeDate(
                dateString
            );


        if (!normalized) {
            return "—";
        }


        const date =
            new Date(
                normalized +
                "T00:00:00"
            );


        return date.toLocaleDateString(
            "ru-RU",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

    }


    // =========================================
    // MONDAY
    // =========================================

    function getMonday(date) {

        const result =
            new Date(date);


        result.setHours(
            0,
            0,
            0,
            0
        );


        let day =
            result.getDay();


        if (day === 0) {
            day = 7;
        }


        result.setDate(
            result.getDate() -
            day +
            1
        );


        return result;

    }


    // =========================================
    // LOAD SETTINGS
    // =========================================

    async function loadSettings() {

        try {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "settings",
                        "main"
                    )
                );


            if (
                snapshot.exists()
            ) {

                settings =
                    snapshot.data();

            }
            else {

                settings = {

                    schedule: {

                        "Понедельник": 5,
                        "Вторник": 5,
                        "Среда": 5,
                        "Четверг": 5,
                        "Пятница": 5,
                        "Суббота": 5

                    }

                };

            }

        }
        catch (error) {

            console.error(
                "Ошибка загрузки настроек:",
                error
            );


            settings = {

                schedule: {

                    "Понедельник": 5,
                    "Вторник": 5,
                    "Среда": 5,
                    "Четверг": 5,
                    "Пятница": 5,
                    "Суббота": 5

                }

            };


            showStatus(
                "Не удалось загрузить настройки"
            );

        }

    }


    // =========================================
    // LOAD STUDENTS
    // =========================================

    async function loadStudents() {

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "students"
                    )
                );


            students = [];


            snapshot.forEach(
                studentDoc => {

                    students.push({

                        id:
                            studentDoc.id,

                        ...studentDoc.data()

                    });

                }
            );


            students.sort(
                (a, b) =>

                    String(
                        a.name || ""
                    ).localeCompare(
                        String(
                            b.name || ""
                        ),
                        "ru"
                    )

            );

        }
        catch (error) {

            console.error(
                "Ошибка студентов:",
                error
            );


            showStatus(
                "Ошибка загрузки студентов"
            );

        }

    }


    // =========================================
    // GET STUDENT NAME
    // =========================================

    function getStudentName(
        studentId
    ) {

        const student =
            students.find(
                item =>
                    String(item.id) ===
                    String(studentId)
            );


        if (student) {

            return (
                student.name ||
                "Без имени"
            );

        }


        return "Неизвестный студент";

    }


    // =========================================
    // NORMALIZE STATUS
    // =========================================

    function normalizeStatus(
        status
    ) {

        if (status === null ||
            status === undefined) {

            return "";

        }


        const value =
            String(status)
                .trim()
                .toLowerCase();


        if (
            value === "present" ||
            value === "присутствовал" ||
            value === "присутствует" ||
            value === "присутствие" ||
            value === "п" ||
            value === "✓"
        ) {

            return "present";

        }


        if (
            value === "absent" ||
            value === "отсутствовал" ||
            value === "отсутствует" ||
            value === "отсутствие" ||
            value === "н"
        ) {

            return "absent";

        }


        return "";

    }


    // =========================================
    // LOAD ATTENDANCE
    // =========================================

    async function loadAttendance() {

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "attendance"
                    )
                );


            attendance = {};


            /*
                ТВОЯ СТРУКТУРА FIREBASE:

                {
                    date: "2026-09-03",

                    studentId: "...",

                    studentName: "...",

                    lessons: {

                        "1": {
                            reason: "...",
                            status: "absent"
                        },

                        "2": {
                            reason: "...",
                            status: "absent"
                        },

                        "3": {
                            reason: "...",
                            status: "absent"
                        }

                    }
                }
            */


            snapshot.forEach(
                attendanceDoc => {

                    const data =
                        attendanceDoc.data();


                    if (
                        !data.date ||
                        !data.studentId
                    ) {

                        return;

                    }


                    const date =
                        normalizeDate(
                            data.date
                        );


                    if (!date) {

                        return;

                    }


                    const studentId =
                        String(
                            data.studentId
                        );


                    const studentName =

                        data.studentName ||

                        getStudentName(
                            studentId
                        );


                    /*
                        Получаем lessons

                        lessons:
                        {
                            "1": {...},
                            "2": {...},
                            "3": {...}
                        }
                    */

                    const lessons =
                        data.lessons || {};


                    Object.entries(
                        lessons
                    ).forEach(
                        (
                            [
                                lessonNumber,
                                lessonData
                            ]
                        ) => {

                            if (
                                !lessonData
                            ) {

                                return;

                            }


                            const status =
                                normalizeStatus(
                                    lessonData.status
                                );


                            /*
                                Если статус неизвестный,
                                такую запись не добавляем.
                            */

                            if (!status) {

                                return;

                            }


                            const reason =

                                lessonData.reason ||

                                lessonData.comment ||

                                lessonData.description ||

                                "";


                            /*
                                ГЛАВНОЕ ИСПРАВЛЕНИЕ

                                Создаём ключ:

                                дата_студент_номерПары
                            */

                            const key =

                                `${date}_${studentId}_${lessonNumber}`;


                            attendance[key] = {

                                id:
                                    attendanceDoc.id,

                                documentId:
                                    attendanceDoc.id,

                                date:
                                    date,

                                studentId:
                                    studentId,

                                studentName:
                                    studentName,

                                lesson:
                                    String(
                                        lessonNumber
                                    ),

                                status:
                                    status,

                                reason:
                                    String(
                                        reason
                                    ),

                                semester:
                                    data.semester ||
                                    "",

                                attestation:
                                    data.attestation ||
                                    "",

                                updatedAt:
                                    data.updatedAt ||
                                    ""

                            };

                        }
                    );

                }
            );


            console.log(
                "Посещаемость:",
                attendance
            );

        }
        catch (error) {

            console.error(
                "Ошибка загрузки посещаемости:",
                error
            );


            showStatus(
                "Ошибка загрузки посещаемости"
            );

        }

    }


    // =========================================
    // GET LESSON COUNT
    // =========================================

    function getLessonCount(
        dayIndex
    ) {

        const schedule =
            settings.schedule || {};


        const day =
            days[dayIndex];


        const count =
            Number(
                schedule[day] || 0
            );


        return count;

    }


    // =========================================
    // GET WEEK DATES
    // =========================================

    function getWeekDates() {

        const result = [];


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const date =
                new Date(
                    weekStart
                );


            date.setDate(
                date.getDate() + i
            );


            result.push(
                date
            );

        }


        return result;

    }


    // =========================================
    // WEEK RANGE
    // =========================================

    function updateWeekRange() {

        const dates =
            getWeekDates();


        const first =
            formatDateRu(
                formatDate(
                    dates[0]
                )
            );


        const last =
            formatDateRu(
                formatDate(
                    dates[5]
                )
            );


        document.getElementById(
            "weekRange"
        ).textContent =

            `Период: ${first} — ${last}`;

    }


    // =========================================
    // RENDER TABLE
    // =========================================

    function renderTable() {

        const wrapper =
            document.getElementById(
                "tableWrapper"
            );


        if (
            students.length === 0
        ) {

            wrapper.innerHTML = `

                <div class="empty">

                    👨‍🎓 Студентов пока нет.

                    <br><br>

                    Добавьте студентов
                    в разделе «Студенты».

                </div>

            `;

            return;

        }


        const weekDates =
            getWeekDates();


        let html = `

            <table>

                <thead>

                    <tr>

                        <th
                            class="student-column"
                            rowspan="2"
                        >
                            Список обучающихся
                        </th>

        `;


        // =====================================
        // ДНИ
        // =====================================

        weekDates.forEach(
            (date, index) => {

                const count =
                    getLessonCount(
                        index
                    );


                html += `

                    <th
                        class="day-header"
                        colspan="${Math.max(
                            count,
                            1
                        )}"
                    >

                        <div class="day-name">

                            ${days[index]}

                        </div>

                        <div class="day-date">

                            ${formatDateRu(
                                formatDate(date)
                            )}

                        </div>

                    </th>

                `;

            }
        );


        html += `

                    </tr>

                    <tr>

        `;


        // =====================================
        // НОМЕРА ПАР
        // =====================================

        weekDates.forEach(
            (date, dayIndex) => {

                const count =
                    getLessonCount(
                        dayIndex
                    );


                if (
                    count === 0
                ) {

                    html += `

                        <th>
                            —
                        </th>

                    `;

                    return;

                }


                for (
                    let lesson = 1;
                    lesson <= count;
                    lesson++
                ) {

                    html += `

                        <th>
                            ${lesson}
                        </th>

                    `;

                }

            }
        );


        html += `

                    </tr>

                </thead>

                <tbody>

        `;


        // =====================================
        // СТУДЕНТЫ
        // =====================================

        students.forEach(
            (
                student,
                studentIndex
            ) => {

                html += `

                    <tr>

                        <td class="student-cell">

                            <div
                                class="student-wrapper"
                            >

                                <div
                                    class="student-number"
                                >
                                    ${studentIndex + 1}
                                </div>

                                <div
                                    class="student-name"
                                >
                                    ${escapeHtml(
                                        student.name ||
                                        "Без имени"
                                    )}
                                </div>

                            </div>

                        </td>

                `;


                // =================================
                // ДНИ
                // =================================

                weekDates.forEach(
                    (
                        date,
                        dayIndex
                    ) => {

                        const dateString =
                            formatDate(
                                date
                            );


                        const lessonCount =
                            getLessonCount(
                                dayIndex
                            );


                        if (
                            lessonCount === 0
                        ) {

                            html += `

                                <td
                                    class="lesson-cell empty-mark"
                                >
                                    —
                                </td>

                            `;

                            return;

                        }


                        // =================================
                        // ПАРЫ
                        // =================================

                        for (
                            let lesson = 1;
                            lesson <= lessonCount;
                            lesson++
                        ) {

                            /*
                                ТОЧНО ТАКОЙ ЖЕ КЛЮЧ,
                                КАК СОЗДАЁТСЯ В LOAD ATTENDANCE
                            */

                            const key =

                                `${dateString}_${student.id}_${lesson}`;


                            const record =
                                attendance[key];


                            let mark =
                                "—";


                            let className =
                                "empty-mark";


                            if (
                                record &&
                                record.status ===
                                "present"
                            ) {

                                mark =
                                    "✓";


                                className =
                                    "present";

                            }


                            if (
                                record &&
                                record.status ===
                                "absent"
                            ) {

                                mark =
                                    "Н";


                                className =
                                    "absent";

                            }


                            html += `

                                <td
                                    class="
                                        lesson-cell
                                        ${className}
                                    "
                                    data-record-key="${escapeHtml(
                                        key
                                    )}"
                                >

                                    ${mark}

                                </td>

                            `;

                        }

                    }
                );


                html += `

                    </tr>

                `;

            }
        );


        html += `

                </tbody>

            </table>

        `;


        wrapper.innerHTML =
            html;


        // =====================================
        // CLICK CELLS
        // =====================================

        wrapper
            .querySelectorAll(
                ".lesson-cell"
            )
            .forEach(
                cell => {

                    cell.addEventListener(
                        "click",
                        event => {

                            showRecordInfo(
                                event,
                                cell
                            );

                        }
                    );

                }
            );

    }


    // =========================================
    // SHOW RECORD
    // =========================================

    function showRecordInfo(
        event,
        cell
    ) {

        const key =
            cell.dataset.recordKey;


        const record =
            attendance[key];


        /*
            Если посещаемость ещё не записана,
            popup не показываем.
        */

        if (!record) {

            hidePopup();

            return;

        }


        const popup =
            document.getElementById(
                "infoPopup"
            );


        if (
            record.status ===
            "absent"
        ) {

            document.getElementById(
                "popupTitle"
            ).textContent =
                "⚠️ Отсутствие";

        }
        else {

            document.getElementById(
                "popupTitle"
            ).textContent =
                "✓ Присутствие";

        }


        document.getElementById(
            "popupStudent"
        ).textContent =

            "ФИО: " +
            record.studentName;


        document.getElementById(
            "popupDate"
        ).textContent =

            "Дата: " +
            formatDateRu(
                record.date
            );


        document.getElementById(
            "popupLesson"
        ).textContent =

            "Пара: " +
            record.lesson;


        document.getElementById(
            "popupReason"
        ).textContent =

            record.reason ||

            (
                record.status === "absent"

                    ? "Причина не указана"

                    : "Студент присутствовал"
            );


        popup.style.display =
            "block";


        const rect =
            cell.getBoundingClientRect();


        let left =
            rect.left;


        let top =
            rect.bottom + 5;


        if (
            left + 290 >
            window.innerWidth
        ) {

            left =
                window.innerWidth - 300;

        }


        if (
            top + 190 >
            window.innerHeight
        ) {

            top =
                rect.top - 195;

        }


        if (
            left < 5
        ) {

            left = 5;

        }


        if (
            top < 5
        ) {

            top = 5;

        }


        popup.style.left =
            left + "px";


        popup.style.top =
            top + "px";


        event.stopPropagation();

    }


    // =========================================
    // HIDE POPUP
    // =========================================

    function hidePopup() {

        document.getElementById(
            "infoPopup"
        ).style.display =
            "none";

    }


    document.addEventListener(
        "click",
        event => {

            const popup =
                document.getElementById(
                    "infoPopup"
                );


            if (
                !popup.contains(
                    event.target
                )
            ) {

                hidePopup();

            }

        }
    );


    // =========================================
    // PREVIOUS WEEK
    // =========================================

    window.previousWeek =
        function() {

            weekStart.setDate(
                weekStart.getDate() - 7
            );


            updateWeekRange();

            renderTable();

            renderWeekList();

        };


    // =========================================
    // NEXT WEEK
    // =========================================

    window.nextWeek =
        function() {

            weekStart.setDate(
                weekStart.getDate() + 7
            );


            updateWeekRange();

            renderTable();

            renderWeekList();

        };


    // =========================================
    // CURRENT WEEK
    // =========================================

    window.currentWeek =
        function() {

            weekStart =
                getMonday(
                    new Date()
                );


            updateWeekRange();

            renderTable();

            renderWeekList();

        };


    // =========================================
    // OPEN/CLOSE WEEK LIST
    // =========================================

    window.toggleWeekList =
        function() {

            const list =
                document.getElementById(
                    "weekList"
                );


            list.classList.toggle(
                "show"
            );


            if (
                list.classList.contains(
                    "show"
                )
            ) {

                renderWeekList();

            }

        };


    // =========================================
    // RENDER WEEK LIST
    // =========================================

    function renderWeekList() {

        const list =
            document.getElementById(
                "weekList"
            );


        list.innerHTML =
            "";


        const currentMonday =
            getMonday(
                new Date()
            );


        for (
            let i = -20;
            i <= 20;
            i++
        ) {

            const monday =
                new Date(
                    currentMonday
                );


            monday.setDate(
                monday.getDate() +
                i * 7
            );


            const saturday =
                new Date(
                    monday
                );


            saturday.setDate(
                saturday.getDate() +
                5
            );


            const mondayText =
                formatDateRu(
                    formatDate(
                        monday
                    )
                );


            const saturdayText =
                formatDateRu(
                    formatDate(
                        saturday
                    )
                );


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "week-option";


            if (
                formatDate(monday) ===
                formatDate(weekStart)
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                i === 0
            ) {

                button.classList.add(
                    "current-week"
                );

            }


            if (
                i === 0
            ) {

                button.textContent =

                    `⭐ Текущая неделя — ${mondayText} — ${saturdayText}`;

            }
            else {

                button.textContent =

                    `${mondayText} — ${saturdayText}`;

            }


            button.addEventListener(
                "click",
                () => {

                    selectWeek(
                        monday
                    );

                }
            );


            list.appendChild(
                button
            );

        }

    }


    // =========================================
    // SELECT WEEK
    // =========================================

    function selectWeek(
        date
    ) {

        weekStart =
            getMonday(
                date
            );


        updateWeekRange();

        renderTable();


        document
            .getElementById(
                "weekList"
            )
            .classList.remove(
                "show"
            );


        renderWeekList();

    }


    // =========================================
    // MAIN MENU
    // =========================================

    window.goBack =
        function() {

            window.location.href =
                "index.html";

        };


    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            String(
                text ?? ""
            );


        return div.innerHTML;

    }


    // =========================================
    // STATUS
    // =========================================

    function showStatus(
        message
    ) {

        const status =
            document.getElementById(
                "status"
            );


        status.textContent =
            message;


        status.classList.add(
            "show"
        );


        setTimeout(
            () => {

                status.classList.remove(
                    "show"
                );

            },
            2500
        );

    }


    // =========================================
    // START
    // =========================================

    async function start() {

        try {

            weekStart =
                getMonday(
                    new Date()
                );


            /*
                СНАЧАЛА студенты,
                потом attendance.

                Это важно, потому что если
                в attendance нет studentName,
                мы сможем найти его
                по studentId.
            */

            await loadSettings();

            await loadStudents();

            await loadAttendance();


            updateWeekRange();

            renderTable();

            renderWeekList();


            // =================================
            // ATTESTATION
            // =================================

            const today =
                formatDate(
                    new Date()
                );


            const info =
                getAttestationInfo(
                    today
                );


            if (info) {

                document.getElementById(
                    "semesterInfo"
                ).textContent =

                    `${info.semester} семестр • Аттестация №${info.attestation}`;

            }
            else {

                /*
                    Если аттестация не определена,
                    всё равно показываем понятный текст.
                */

                document.getElementById(
                    "semesterInfo"
                ).textContent =

                    "Семестр / аттестация не определены";

            }

        }
        catch (error) {

            console.error(
                "Ошибка запуска:",
                error
            );


            document.getElementById(
                "tableWrapper"
            ).innerHTML = `

                <div class="empty">

                    ❌ Ошибка загрузки данных.

                    <br><br>

                    Откройте консоль браузера
                    (F12 → Console)
                    для подробностей.

                </div>

            `;

        }

    }


    // =========================================
    // ATTESTATION
    // =========================================

    function getAttestationInfo(
        dateString
    ) {

        const date =
            new Date(
                dateString +
                "T00:00:00"
            );


        const periods = [

            {
                semester: 1,
                attestation: 1,

                period:
                    settings
                        .semester1
                        ?.attestation1

            },

            {
                semester: 1,
                attestation: 2,

                period:
                    settings
                        .semester1
                        ?.attestation2

            },

            {
                semester: 2,
                attestation: 1,

                period:
                    settings
                        .semester2
                        ?.attestation1

            },

            {
                semester: 2,
                attestation: 2,

                period:
                    settings
                        .semester2
                        ?.attestation2

            }

        ];


        for (
            const item of periods
        ) {

            if (
                !item.period?.start ||
                !item.period?.end
            ) {

                continue;

            }


            const start =
                new Date(
                    item.period.start +
                    "T00:00:00"
                );


            const end =
                new Date(
                    item.period.end +
                    "T23:59:59"
                );


            if (
                date >= start &&
                date <= end
            ) {

                return item;

            }

        }


        return null;

    }


    // =========================================
    // START APPLICATION
    // =========================================

    start();

</script>
