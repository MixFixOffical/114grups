<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1100">
<meta name="theme-color" content="#1e3a8a">
<meta name="description" content="Панель разрешений — заявки на регистрацию">
<title>Посещаемость — Разрешения</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #2454e8;
    --primary-dark: #17348f;
    --primary-light: #eef2ff;

    --teal: #0d9488;
    --teal-light: #ecfdf9;

    --violet: #7c3aed;
    --violet-light: #f4f0ff;

    --amber: #d97706;
    --amber-light: #fef8ec;

    --red: #dc2626;
    --red-light: #fef2f2;

    --green: #16a34a;
    --green-light: #f0fdf4;

    --text: #0f1729;
    --text-secondary: #5b6478;
    --text-light: #9aa3b5;

    --surface: rgba(255, 255, 255, 0.9);
    --border: rgba(220, 226, 238, 0.85);

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 1px rgba(15, 23, 42, .03);
    --shadow-md: 0 10px 24px -8px rgba(15, 23, 42, .10), 0 2px 6px rgba(15, 23, 42, .05);
    --shadow-lg: 0 26px 50px -16px rgba(15, 23, 42, .16), 0 8px 18px -10px rgba(15, 23, 42, .08);

    --radius-lg: 28px;
    --radius-md: 20px;
    --radius-sm: 13px;

    --ease: cubic-bezier(.22, 1, .36, 1);
}

html { scroll-behavior: smooth; min-width: 1100px; }

body {
    min-width: 1100px;
    min-height: 100vh;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 8% 0%, rgba(36, 84, 232, .07), transparent 42%),
        radial-gradient(circle at 96% 12%, rgba(124, 58, 237, .05), transparent 40%),
        linear-gradient(160deg, #f9fafc 0%, #f4f6fb 45%, #eef1f9 100%);
    background-attachment: fixed;
    overflow-x: auto;
}

h1, h2, .brand-title, .section-title, .button-title {
    font-family: "Plus Jakarta Sans", "Inter", sans-serif;
}

button { font-family: inherit; }

:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 3px;
    border-radius: 8px;
}

.grid-texture {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: radial-gradient(rgba(36, 84, 232, .10) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, #000 0%, transparent 70%);
    mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, #000 0%, transparent 70%);
}

@keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}
.page-head, .stats-grid, .panel { animation: rise .55s var(--ease) both; }
.stats-grid { animation-delay: .08s; }
.panel { animation-delay: .16s; }

/* =========================================================
   HEADER
========================================================= */
header {
    position: sticky; top: 0; z-index: 100;
    width: 100%; min-width: 1100px; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 42px;
    background: rgba(255, 255, 255, .86);
    backdrop-filter: blur(22px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 20px rgba(15, 23, 42, .04);
}

.header-left { display: flex; align-items: center; gap: 15px; }

.logo {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 15px; color: #fff;
    background: linear-gradient(135deg, #2454e8, #1a3aa8);
    box-shadow: 0 8px 20px rgba(36, 84, 232, .28);
    cursor: pointer;
    transition: transform .3s var(--ease);
}
.logo svg { width: 24px; height: 24px; }
.logo:hover { transform: rotate(-6deg) scale(1.07); }

.brand { display: flex; flex-direction: column; }
.brand-title { font-size: 18.5px; font-weight: 700; letter-spacing: -.3px; }
.brand-subtitle { margin-top: 1px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }

/* =========================================================
   NAV
========================================================= */
.main-nav {
    display: flex; align-items: center; gap: 6px;
    padding: 5px; margin-left: 26px;
    border-radius: 999px;
    background: #f2f4f9;
    border: 1px solid #e4e9f2;
}
.nav-link {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 17px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; text-decoration: none;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
}
.nav-link svg { width: 17px; height: 17px; }
.nav-link:hover { color: var(--violet); background: var(--violet-light); }
.nav-link.nav-users:hover { color: var(--teal); background: var(--teal-light); }
.nav-link.active {
    color: #fff; background: linear-gradient(135deg, #7c3aed, #6d28d9);
    box-shadow: 0 6px 16px rgba(124, 58, 237, .3);
}

/* =========================================================
   USER MENU
========================================================= */
.user-menu { position: relative; }

.user-menu-button {
    display: flex; align-items: center; gap: 11px;
    padding: 7px 14px 7px 7px;
    border: 1px solid var(--border); border-radius: 999px;
    background: #fff; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: box-shadow .25s ease, border-color .25s ease, transform .25s var(--ease);
}
.user-menu-button:hover { border-color: rgba(36, 84, 232, .3); box-shadow: var(--shadow-md); }
.user-menu-button:active { transform: scale(.97); }

.user-avatar {
    width: 34px; height: 34px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: #fff;
    font-size: 13px; font-weight: 700;
    background: linear-gradient(135deg, #2454e8, #1a3aa8);
}

.user-chevron {
    width: 16px; height: 16px; color: var(--text-light);
    transition: transform .3s var(--ease);
}
.user-menu.open .user-chevron { transform: rotate(180deg); }

.user-dropdown {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 200;
    width: 230px; padding: 8px;
    border-radius: 18px;
    background: #fff; border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    opacity: 0; visibility: hidden;
    transform: translateY(-8px) scale(.97);
    transform-origin: top right;
    transition: opacity .25s ease, transform .3s var(--ease), visibility .25s ease;
}
.user-menu.open .user-dropdown {
    opacity: 1; visibility: visible;
    transform: translateY(0) scale(1);
}

.dropdown-header {
    padding: 11px 13px 12px; margin-bottom: 6px;
    border-bottom: 1px solid #eef1f6;
}
.dropdown-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dropdown-role { margin-top: 3px; font-size: 11.5px; font-weight: 600; color: var(--violet); }

.dropdown-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 11px 13px; border: none; border-radius: 12px;
    background: transparent; cursor: pointer; text-align: left;
    font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text);
    transition: background .2s ease, color .2s ease;
}
.dropdown-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-light); transition: color .2s ease; }
.dropdown-item:hover { background: var(--primary-light); color: var(--primary); }
.dropdown-item:hover svg { color: var(--primary); }
.dropdown-item.danger:hover { background: var(--red-light); color: var(--red); }
.dropdown-item.danger:hover svg { color: var(--red); }

/* =========================================================
   CONTAINER / PAGE HEAD
========================================================= */
.container { width: 1100px; min-width: 1100px; margin: 0 auto; padding: 36px 0 52px; }

.page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 22px;
}
.page-title { font-size: 28px; font-weight: 800; letter-spacing: -.7px; }
.page-title .emoji { margin-right: 6px; }
.page-subtitle { margin-top: 7px; color: var(--text-secondary); font-size: 14px; }

.back-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--border); background: #fff;
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: color .25s ease, border-color .25s ease, transform .25s var(--ease);
}
.back-link svg { width: 16px; height: 16px; }
.back-link:hover { color: var(--primary); border-color: rgba(36, 84, 232, .3); transform: translateX(-3px); }

/* =========================================================
   STATS
========================================================= */
.stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 20px;
}
.stat-card {
    display: flex; align-items: center; gap: 15px;
    padding: 19px 22px;
    border-radius: var(--radius-md);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}
.stat-icon {
    width: 46px; height: 46px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
}
.stat-icon svg { width: 21px; height: 21px; }
.stat-icon.amber { background: var(--amber-light); color: var(--amber); }
.stat-icon.green { background: var(--green-light); color: var(--green); }
.stat-icon.red   { background: var(--red-light);   color: var(--red); }

.stat-label { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }
.stat-value { margin-top: 3px; font-size: 26px; font-weight: 800; font-family: "Plus Jakarta Sans", sans-serif; font-variant-numeric: tabular-nums; }

/* =========================================================
   PANEL: FILTERS + SEARCH
========================================================= */
.panel {
    border-radius: var(--radius-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    overflow: hidden;
}

.panel-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 22px;
    border-bottom: 1px solid #eef1f6;
}

.filter-tabs {
    display: flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px;
    background: #f2f4f9; border: 1px solid #e4e9f2;
}
.filter-tab {
    padding: 8px 16px; border: none; border-radius: 999px;
    background: transparent; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
}
.filter-tab:hover { color: var(--text); }
.filter-tab.active {
    color: var(--primary); background: #fff;
    box-shadow: 0 3px 10px rgba(15, 23, 42, .07);
}

.search-wrap { position: relative; }
.search-input {
    width: 250px; height: 40px;
    padding: 0 38px 0 14px;
    border: 1px solid var(--border); border-radius: 999px;
    background: #fff; outline: none;
    font-family: inherit; font-size: 13px; color: var(--text);
    transition: border-color .25s ease, box-shadow .25s ease;
}
.search-input::placeholder { color: var(--text-light); }
.search-input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, .09);
}
.search-icon {
    position: absolute; right: 13px; top: 50%;
    width: 17px; height: 17px;
    transform: translateY(-50%);
    color: var(--text-light); pointer-events: none;
}

/* =========================================================
   REQUESTS LIST
========================================================= */
.requests-list { padding: 10px; }

.request-row {
    display: flex; align-items: center; gap: 16px;
    padding: 15px 16px; margin-bottom: 4px;
    border-radius: var(--radius-sm);
    transition: background .2s ease;
}
.request-row:last-child { margin-bottom: 0; }
.request-row:hover { background: #f7f9fd; }

.request-avatar {
    width: 46px; height: 46px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px; color: #fff;
    font-size: 14px; font-weight: 700;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
}

.request-info { flex: 1; min-width: 0; }
.request-name {
    font-size: 14.5px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.request-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 4px; font-size: 12.5px; color: var(--text-secondary);
}
.request-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #c9d2e0; }
.request-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.status-badge {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
}
.status-badge .badge-dot { width: 7px; height: 7px; border-radius: 50%; }
.status-pending { color: var(--amber); background: var(--amber-light); border: 1px solid rgba(217, 119, 6, .18); }
.status-pending .badge-dot { background: var(--amber); animation: pulse 2s infinite; }
.status-approved { color: var(--green); background: var(--green-light); border: 1px solid rgba(22, 163, 74, .16); }
.status-approved .badge-dot { background: var(--green); }
.status-denied { color: var(--red); background: var(--red-light); border: 1px solid rgba(220, 38, 38, .15); }
.status-denied .badge-dot { background: var(--red); }

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: .7; }
}

.request-actions { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }

.btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border: none; border-radius: 11px;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    cursor: pointer;
    transition: transform .2s var(--ease), box-shadow .25s ease, opacity .2s ease;
}
.btn svg { width: 15px; height: 15px; }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.btn-approve { color: #fff; background: linear-gradient(135deg, #16a34a, #15803d); box-shadow: 0 6px 14px rgba(22, 163, 74, .25); }
.btn-approve:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(22, 163, 74, .32); }
.btn-deny { color: var(--red); background: var(--red-light); border: 1px solid rgba(220, 38, 38, .2); }
.btn-deny:hover { background: #fee2e2; }
.btn-remove { color: var(--text-secondary); background: #f2f4f9; border: 1px solid #e4e9f2; }
.btn-remove:hover { color: var(--red); background: var(--red-light); border-color: rgba(220, 38, 38, .2); }

/* =========================================================
   EMPTY STATE
========================================================= */
.empty-state {
    padding: 64px 20px; text-align: center;
}
.empty-icon {
    width: 74px; height: 74px; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 24px; font-size: 34px;
    background: var(--violet-light);
}
.empty-title { font-size: 17px; font-weight: 700; font-family: "Plus Jakarta Sans", sans-serif; }
.empty-subtitle { margin-top: 7px; font-size: 13.5px; color: var(--text-secondary); }

/* =========================================================
   LOADER
========================================================= */
.page-loader {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: #f8fafc;
    transition: opacity .45s ease, visibility .45s ease;
}
.page-loader.hidden { opacity: 0; visibility: hidden; }
body.auth-pending main, body.auth-pending header { visibility: hidden; }
.loader-content { text-align: center; }
.loader-logo {
    width: 72px; height: 72px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; border-radius: 22px;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    box-shadow: 0 18px 36px rgba(124, 58, 237, .28);
    animation: loaderFloat 1.6s infinite ease-in-out;
}
.loader-logo svg { width: 32px; height: 32px; }
.loader-text { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }
@keyframes loaderFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
}

/* =========================================================
   TOAST
========================================================= */
.toast {
    position: fixed; left: 50%; bottom: 30px; z-index: 1000;
    transform: translate(-50%, 120px);
    padding: 14px 22px; border-radius: 15px;
    background: #101a30; color: #fff;
    font-size: 13.5px; font-weight: 600;
    box-shadow: 0 18px 44px rgba(15, 23, 42, .28);
    opacity: 0; pointer-events: none;
    transition: transform .35s var(--ease), opacity .35s ease;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* =========================================================
   CONFIRM DIALOG
========================================================= */
.dialog-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, .45);
    backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
}
.dialog-overlay.show { opacity: 1; visibility: visible; }

.dialog {
    width: 400px; padding: 28px;
    border-radius: 24px;
    background: #fff;
    box-shadow: var(--shadow-lg);
    transform: scale(.92) translateY(12px);
    transition: transform .35s var(--ease);
}
.dialog-overlay.show .dialog { transform: scale(1) translateY(0); }

.dialog-title { font-size: 18px; font-weight: 800; font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -.3px; }
.dialog-text { margin-top: 10px; font-size: 13.5px; line-height: 1.6; color: var(--text-secondary); }
.dialog-text b { color: var(--text); }

.dialog-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 24px;
}
.btn-cancel {
    padding: 10px 18px; border-radius: 11px;
    border: 1px solid var(--border); background: #fff;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
}
.btn-cancel:hover { background: #f2f4f9; color: var(--text); }
.btn-confirm {
    padding: 10px 18px; border: none; border-radius: 11px;
    font-family: inherit; font-size: 13px; font-weight: 700; color: #fff;
    cursor: pointer;
    transition: transform .2s var(--ease), box-shadow .25s ease;
}
.btn-confirm:hover { transform: translateY(-1px); }
.btn-confirm.confirm-deny   { background: linear-gradient(135deg, #dc2626, #b91c1c); box-shadow: 0 6px 14px rgba(220, 38, 38, .25); }
.btn-confirm.confirm-remove { background: linear-gradient(135deg, #dc2626, #b91c1c); box-shadow: 0 6px 14px rgba(220, 38, 38, .25); }

</style>

            </a>

                Пользователи

    <div class="header-right">

                <span class="user-avatar" id="userAvatar">?</span>
                <span id="userFio">Загрузка...</span>
                <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="user-dropdown">
                <div class="dropdown-header">
                    <div class="dropdown-name" id="dropdownName">Пользователь</div>
                    <div class="dropdown-role">🛡️ Администратор</div>
                </div>
                <button class="dropdown-item" onclick="goMyButtons()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
                    Мои кнопки
                </button>
                <button class="dropdown-item" onclick="goSecurity()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 5.8v5.4c0 4.4 3 8.4 7 9.8 4-1.4 7-5.4 7-9.8V5.8L12 3Z"/><path d="m9.3 12 1.9 1.9 3.5-3.8"/></svg>
                    Безопасность
                </button>
                <button class="dropdown-item danger" onclick="logout()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="m11 8-4 4 4 4"/><path d="M7 12h10"/></svg>
                    Выход
                </button>
            </div>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="container">

    <!-- PAGE HEAD -->
    <div class="page-head">
        <div>
            <div class="page-title"><span class="emoji">🔐</span>Разрешения на регистрацию</div>
            <div class="page-subtitle">Одобряйте или отклоняйте заявки новых пользователей</div>
        </div>
        <a class="back-link" onclick="goHome()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
            На главную
        </a>
    </div>

    <!-- STATS -->
    <section class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon amber">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            </div>
            <div>
                <div class="stat-label">На рассмотрении</div>
                <div class="stat-value" id="statPending">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
            </div>
            <div>
                <div class="stat-label">Одобрено</div>
                <div class="stat-value" id="statApproved">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon red">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </div>
            <div>
                <div class="stat-label">Отклонено</div>
                <div class="stat-value" id="statDenied">0</div>
            </div>
        </div>
    </section>

    <!-- PANEL -->
    <section class="panel">
        <div class="panel-toolbar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="pending" onclick="setFilter('pending', this)">На рассмотрении</button>
                <button class="filter-tab" data-filter="all" onclick="setFilter('all', this)">Все</button>
                <button class="filter-tab" data-filter="approved" onclick="setFilter('approved', this)">Одобренные</button>
                <button class="filter-tab" data-filter="denied" onclick="setFilter('denied', this)">Отклонённые</button>
            </div>
            <div class="search-wrap">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по имени или почте..." oninput="renderRequests()">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            </div>
        </div>

        <div class="requests-list" id="requestsList">
            <!-- Заполняется из Firestore -->
        </div>
    </section>

</main>

<!-- CONFIRM DIALOG -->
<div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog">
        <div class="dialog-title" id="dialogTitle">Подтверждение</div>
        <div class="dialog-text" id="dialogText"></div>
        <div class="dialog-actions">
            <button class="btn-cancel" onclick="closeDialog()">Отмена</button>
            <button class="btn-confirm confirm-deny" id="dialogConfirm">Подтвердить</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FIREBASE CONFIG + LOGIC -->
<script>
const firebaseConfig = {
    apiKey: "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",
    authDomain: "othets-1aa03.firebaseapp.com",
    projectId: "othets-1aa03",
    storageBucket: "othets-1aa03.firebasestorage.app",
    messagingSenderId: "528392191591",
    appId: "1:528392191591:web:1e97790e6f9f0a6e175ec2",
    measurementId: "G-F50WVZRXZJ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== НАВИГАЦИЯ ===== */
function goHome()        { window.location.href = "adminhome.html"; }
function goPermissions() { /* уже здесь */ }
function goUsers()       { window.location.href = "users.html"; }
function goMyButtons()   { window.location.href = "mybuttons.html"; }
function goSecurity()    { window.location.href = "security.html"; }

function logout() {
    firebase.auth().signOut()
        .then(function() { window.location.href = "index.html"; })
        .catch(function() { showToast("Не удалось выйти. Попробуйте снова."); });
}

/* ===== МЕНЮ ПОЛЬЗОВАТЕЛЯ ===== */
function toggleUserMenu() {
    document.getElementById("userMenu").classList.toggle("open");
}
document.addEventListener("click", function(event) {
    const menu = document.getElementById("userMenu");
    if (menu && !menu.contains(event.target)) menu.classList.remove("open");
});
document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        document.getElementById("userMenu").classList.remove("open");
        closeDialog();
    }
});

/* ===== TOAST ===== */
let toastTimer;
function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

/* ===== ДАННЫЕ ===== */
let allRequests = [];   // все документы users
let currentFilter = "pending";

/*
 * reg: 0 — на рассмотрении
 * reg: 1 — одобрено
 * reg: 2 — отклонено
 * поле отсутствует (старые пользователи) — считаем одобренным
 */
function getRegStatus(data) {
    if (typeof data.reg === "number") return data.reg;
    return 1;
}

/* ===== ПОДПИСКА НА FIRESTORE (real-time) ===== */
function subscribeRequests() {
    db.collection("users").orderBy("createdAt", "desc").onSnapshot(function(snapshot) {
        allRequests = [];
        snapshot.forEach(function(doc) {
            allRequests.push({ id: doc.id, data: doc.data() });
        });
        renderRequests();
        updateStats();
    }, function(error) {
        console.error(error);
        showToast("Ошибка загрузки заявок");
    });
}

/* ===== СТАТИСТИКА ===== */
function updateStats() {
    let pending = 0, approved = 0, denied = 0;
    allRequests.forEach(function(item) {
        const s = getRegStatus(item.data);
        if (s === 0) pending++;
        else if (s === 1) approved++;
        else if (s === 2) denied++;
    });
    document.getElementById("statPending").textContent  = pending;
    document.getElementById("statApproved").textContent = approved;
    document.getElementById("statDenied").textContent   = denied;
}

/* ===== ФИЛЬТР ===== */
function setFilter(filter, button) {
    currentFilter = filter;
    document.querySelectorAll(".filter-tab").forEach(function(t) { t.classList.remove("active"); });
    button.classList.add("active");
    renderRequests();
}

/* ===== РЕНДЕР ===== */
function renderRequests() {
    const list = document.getElementById("requestsList");
    const query = document.getElementById("searchInput").value.trim().toLowerCase();

    let items = allRequests.filter(function(item) {
        const s = getRegStatus(item.data);
        if (currentFilter === "pending" && s !== 0) return false;
        if (currentFilter === "approved" && s !== 1) return false;
        if (currentFilter === "denied" && s !== 2) return false;
        return true;
    });

    if (query) {
        items = items.filter(function(item) {
            const name  = (item.data.name  || "").toLowerCase();
            const email = (item.data.email || "").toLowerCase();
            return name.includes(query) || email.includes(query);
        });
    }

    if (items.length === 0) {
        const texts = {
            pending:  ["⏳", "Нет заявок на рассмотрении", "Новые запросы на регистрацию появятся здесь"],
            all:      ["📭", "Список пуст", "Пользователей пока нет"],
            approved: ["✅", "Нет одобренных пользователей", "Одобренные заявки будут отображаться здесь"],
            denied:   ["🚫", "Нет отклонённых заявок", "Отклонённые заявки будут отображаться здесь"]
        };
        const t = texts[currentFilter];
        list.innerHTML =
            '<div class="empty-state">' +
                '<div class="empty-icon">' + t[0] + '</div>' +
                '<div class="empty-title">' + t[1] + '</div>' +
                '<div class="empty-subtitle">' + t[2] + '</div>' +
            '</div>';
        return;
    }

    let html = "";
    items.forEach(function(item) {
        const d = item.data;
        const s = getRegStatus(d);

        const name  = d.name  || "Без имени";
        const email = d.email || "—";
        const group = d.group ? "Группа " + d.group : "Группа не указана";

        const parts = name.trim().split(/\s+/);
        let initials = "?";
        if (parts.length >= 2) initials = (parts[0][0] + parts[1][0]).toUpperCase();
        else if (parts.length === 1 && parts[0]) initials = parts[0][0].toUpperCase();

        const badges = {
            0: '<span class="status-badge status-pending"><span class="badge-dot"></span>На рассмотрении</span>',
            1: '<span class="status-badge status-approved"><span class="badge-dot"></span>Одобрено</span>',
            2: '<span class="status-badge status-denied"><span class="badge-dot"></span>Отклонено</span>'
        };

        let actions = "";
        if (s === 0) {
            actions =
                '<button class="btn btn-approve" onclick="approveRequest(\'' + item.id + '\', \'' + escapeJs(name) + '\')">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>' +
                    'Одобрить' +
                '</button>' +
                '<button class="btn btn-deny" onclick="askDeny(\'' + item.id + '\', \'' + escapeJs(name) + '\')">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' +
                    'Отклонить' +
                '</button>';
        } else if (s === 2) {
            actions =
                '<button class="btn btn-remove" onclick="askRemove(\'' + item.id + '\', \'' + escapeJs(name) + '\')">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="m6.5 7 .8 12a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8l.8-12"/></svg>' +
                    'Удалить' +
                '</button>';
        }

        html +=
            '<div class="request-row">' +
                '<div class="request-avatar">' + initials + '</div>' +
                '<div class="request-info">' +
                    '<div class="request-name">' + escapeHtml(name) + '</div>' +
                    '<div class="request-meta">' +
                        '<span>' + escapeHtml(email) + '</span>' +
                        '<span class="dot"></span>' +
                        '<span>' + escapeHtml(group) + '</span>' +
                    '</div>' +
                '</div>' +
                badges[s] +
                '<div class="request-actions">' + actions + '</div>' +
            '</div>';
    });

    list.innerHTML = html;
}

/* ===== ДЕЙСТВИЯ ===== */
function approveRequest(id, name) {
    db.collection("users").doc(id).update({ reg: 1 })
        .then(function() {
            showToast("✅ " + name + " — регистрация одобрена");
        })
        .catch(function() {
            showToast("Ошибка при одобрении");
        });
}

function askDeny(id, name) {
    openDialog(
        "Отклонить заявку?",
        "Пользователь <b>" + escapeHtml(name) + "</b> не сможет войти в систему. При следующей попытке входа его аккаунт и все данные будут <b>автоматически удалены</b>.",
        "Отклонить",
        function() {
            db.collection("users").doc(id).update({ reg: 2 })
                .then(function() {
                    showToast("🚫 Заявка отклонена");
                })
                .catch(function() {
                    showToast("Ошибка при отклонении");
                });
        }
    );
}

function askRemove(id, name) {
    openDialog(
        "Удалить данные?",
        "Документ пользователя <b>" + escapeHtml(name) + "</b> будет удалён из базы безвозвратно. Аккаунт в Firebase Auth удалится при его следующей попытке входа.",
        "Удалить",
        function() {
            db.collection("users").doc(id).delete()
                .then(function() {
                    showToast("🗑 Данные удалены");
                })
                .catch(function() {
                    showToast("Ошибка при удалении");
                });
        }
    );
}

/* ===== DIALOG ===== */
let dialogCallback = null;

function openDialog(title, text, confirmText, onConfirm) {
    document.getElementById("dialogTitle").textContent = title;
    document.getElementById("dialogText").innerHTML = text;
    document.getElementById("dialogConfirm").textContent = confirmText;
    dialogCallback = onConfirm;
    document.getElementById("dialogOverlay").classList.add("show");
}

function closeDialog() {
    document.getElementById("dialogOverlay").classList.remove("show");
    dialogCallback = null;
}

document.getElementById("dialogConfirm").addEventListener("click", function() {
    if (dialogCallback) dialogCallback();
    closeDialog();
});

document.getElementById("dialogOverlay").addEventListener("click", function(event) {
    if (event.target === this) closeDialog();
});

/* ===== УТИЛИТЫ ===== */
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function escapeJs(str) {
    return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

/* ===== АВТОРИЗАЦИЯ ===== */
firebase.auth().onAuthStateChanged(function(user) {
    if (!user) {
        window.location.href = "index.html";
        return;
    }

    db.collection("users").doc(user.uid).get()
        .then(function(doc) {
            const data = doc.exists ? doc.data() : {};
            const fio = data.name || "Пользователь";

            /* Доступ только для администраторов */
            if (data.role !== "admin") {
                window.location.href = "home.html";
                return;
            }

            document.getElementById("userFio").textContent = fio;
            document.getElementById("dropdownName").textContent = fio;

            const parts = fio.trim().split(/\s+/);
            let initials = "?";
            if (parts.length >= 2) initials = (parts[0][0] + parts[1][0]).toUpperCase();
            else if (parts.length === 1 && parts[0]) initials = parts[0][0].toUpperCase();
            document.getElementById("userAvatar").textContent = initials;
        })
        .catch(function() {
            document.getElementById("userFio").textContent = "Пользователь";
        })
        .finally(function() {
            document.body.classList.remove("auth-pending");
            document.getElementById("pageLoader").classList.add("hidden");
        });

    /* Подписка на заявки */
    subscribeRequests();
});
</script>

</body>
</html>
