<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <!-- Только десктопная версия -->
    <meta name="viewport" content="width=1100">

    <title>KURATOR — Авторизация</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-width: 1100px;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #111827;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(37, 99, 235, .10),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(59, 130, 246, .08),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #f8fafc 0%,
                    #eef4ff 50%,
                    #f8fafc 100%
                );
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .45;
            animation: floatOrb 14s ease-in-out infinite;
        }

        .orb.one {
            width: 280px;
            height: 280px;

            top: -90px;
            left: 80px;

            background: rgba(59, 130, 246, .20);
        }

        .orb.two {
            width: 330px;
            height: 330px;

            right: 40px;
            bottom: -120px;

            background: rgba(96, 165, 250, .18);

            animation-delay: -5s;
        }

        .orb.three {
            width: 190px;
            height: 190px;

            left: 45%;
            top: 10%;

            background: rgba(147, 197, 253, .13);

            animation-delay: -9s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }

            50% {
                transform: translate3d(20px, -25px, 0) scale(1.06);
            }

            100% {
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        /* =========================================
           CENTER
        ========================================= */

        .page {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        /* =========================================
           CARD
        ========================================= */

        .auth-card {
            position: relative;

            width: 405px;

            min-height: 410px;

            padding: 30px;

            overflow: hidden;

            border-radius: 27px;

            background:
                rgba(255, 255, 255, .86);

            border: 1px solid rgba(255, 255, 255, .95);

            box-shadow:
                0 25px 70px rgba(15, 23, 42, .10),
                0 5px 20px rgba(37, 99, 235, .06);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            transition:
                height .72s cubic-bezier(.22, 1, .36, 1),
                box-shadow .4s ease,
                transform .4s ease;

            will-change: height;
        }

        .auth-card:hover {
            box-shadow:
                0 30px 80px rgba(15, 23, 42, .13),
                0 7px 25px rgba(37, 99, 235, .08);
        }

        /* декоративный свет */
        .card-glow {
            position: absolute;

            width: 220px;
            height: 220px;

            top: -130px;
            right: -100px;

            border-radius: 50%;

            background: rgba(59, 130, 246, .13);

            filter: blur(35px);

            pointer-events: none;
        }

        /* =========================================
           LOGO
        ========================================= */

        .logo {
            position: relative;

            width: 52px;
            height: 52px;

            margin: 0 auto 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            color: white;

            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.8px;

            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #2563eb
                );

            box-shadow:
                0 10px 25px rgba(37, 99, 235, .27);

            transition:
                transform .55s cubic-bezier(.22, 1, .36, 1),
                box-shadow .4s ease;
        }

        .logo::after {
            content: "";

            position: absolute;
            inset: 1px;

            border-radius: 15px;

            border: 1px solid rgba(255, 255, 255, .28);
        }

        .auth-card:hover .logo {
            transform: translateY(-2px) scale(1.025);

            box-shadow:
                0 14px 30px rgba(37, 99, 235, .32);
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            text-align: center;

            margin-bottom: 22px;
        }

        .title {
            font-size: 25px;
            line-height: 1.1;

            font-weight: 750;
            letter-spacing: -.7px;

            color: #111827;
        }

        .subtitle {
            margin-top: 7px;

            color: #64748b;

            font-size: 13px;
            line-height: 1.45;
        }

        /* =========================================
           TABS
        ========================================= */

        .tabs {
            position: relative;

            display: grid;
            grid-template-columns: 1fr 1fr;

            height: 43px;

            margin-bottom: 20px;

            padding: 3px;

            border-radius: 13px;

            background: #f1f5f9;
        }

        .tab-indicator {
            position: absolute;

            top: 3px;
            left: 3px;

            width: calc(50% - 3px);
            height: calc(100% - 6px);

            border-radius: 10px;

            background: #ffffff;

            box-shadow:
                0 3px 10px rgba(15, 23, 42, .07);

            transition:
                transform .62s cubic-bezier(.22, 1, .36, 1);
        }

        .auth-card[data-mode="register"]
        .tab-indicator {
            transform: translateX(100%);
        }

        .tab {
            position: relative;
            z-index: 2;

            border: none;
            outline: none;

            background: transparent;

            color: #64748b;

            font-size: 13px;
            font-weight: 650;

            cursor: pointer;

            transition:
                color .4s ease,
                transform .3s ease;
        }

        .tab:hover {
            color: #2563eb;
        }

        .tab:active {
            transform: scale(.97);
        }

        .auth-card[data-mode="login"] .tab.login,
        .auth-card[data-mode="register"] .tab.register {
            color: #2563eb;
        }

        /* =========================================
           FORM VIEWPORT
        ========================================= */

        .forms-viewport {
            position: relative;

            overflow: hidden;

            width: 100%;

            transition:
                height .72s cubic-bezier(.22, 1, .36, 1);
        }

        .form-panel {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            opacity: 0;

            transform:
                translateX(45px)
                translateY(5px)
                scale(.985);

            filter: blur(6px);

            pointer-events: none;

            transition:
                opacity .52s cubic-bezier(.22, 1, .36, 1),
                transform .68s cubic-bezier(.22, 1, .36, 1),
                filter .52s ease;
        }

        .form-panel.login-panel {
            transform:
                translateX(-45px)
                translateY(5px)
                scale(.985);
        }

        .auth-card[data-mode="login"]
        .login-panel {
            opacity: 1;

            transform:
                translateX(0)
                translateY(0)
                scale(1);

            filter: blur(0);

            pointer-events: auto;
        }

        .auth-card[data-mode="register"]
        .register-panel {
            opacity: 1;

            transform:
                translateX(0)
                translateY(0)
                scale(1);

            filter: blur(0);

            pointer-events: auto;
        }

        /* =========================================
           INPUT
        ========================================= */

        .field {
            position: relative;

            margin-bottom: 13px;

            opacity: 0;
            transform: translateY(10px);

            transition:
                opacity .48s ease,
                transform .58s cubic-bezier(.22, 1, .36, 1);
        }

        .login-panel .field:nth-child(1) {
            transition-delay: .05s;
        }

        .login-panel .field:nth-child(2) {
            transition-delay: .11s;
        }

        .login-panel .login-options {
            transition-delay: .17s;
        }

        .login-panel .submit-btn {
            transition-delay: .23s;
        }

        .register-panel .field:nth-child(1) {
            transition-delay: .04s;
        }

        .register-panel .field:nth-child(2) {
            transition-delay: .09s;
        }

        .register-panel .field:nth-child(3) {
            transition-delay: .14s;
        }

        .register-panel .field:nth-child(4) {
            transition-delay: .19s;
        }

        .register-panel .field:nth-child(5) {
            transition-delay: .24s;
        }

        .register-panel .submit-btn {
            transition-delay: .29s;
        }

        .auth-card[data-mode="login"]
        .login-panel .field,

        .auth-card[data-mode="login"]
        .login-panel .login-options,

        .auth-card[data-mode="login"]
        .login-panel .submit-btn,

        .auth-card[data-mode="register"]
        .register-panel .field,

        .auth-card[data-mode="register"]
        .register-panel .submit-btn {
            opacity: 1;

            transform: translateY(0);
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 47px;

            padding: 0 43px 0 14px;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            outline: none;

            background: rgba(248, 250, 252, .86);

            color: #0f172a;

            font-family: inherit;
            font-size: 13.5px;

            transition:
                border-color .3s ease,
                background .3s ease,
                box-shadow .3s ease,
                transform .3s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:hover {
            border-color: #cbd5e1;
        }

        input:focus {
            border-color: #60a5fa;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(59, 130, 246, .09);
        }

        input:focus {
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;

            right: 14px;
            top: 50%;

            width: 18px;
            height: 18px;

            transform: translateY(-50%);

            color: #94a3b8;

            pointer-events: none;

            transition: color .3s ease;
        }

        .input-wrap:focus-within .input-icon {
            color: #3b82f6;
        }

        /* =========================================
           PASSWORD BUTTON
        ========================================= */

        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            width: 30px;
            height: 30px;

            transform: translateY(-50%);

            border: none;
            outline: none;

            border-radius: 8px;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background .25s ease,
                color .25s ease;
        }

        .password-toggle:hover {
            color: #2563eb;
            background: #eff6ff;
        }

        /* =========================================
           OPTIONS
        ========================================= */

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin: 3px 1px 17px;

            opacity: 0;
            transform: translateY(10px);

            transition:
                opacity .48s ease,
                transform .58s cubic-bezier(.22, 1, .36, 1);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #64748b;

            font-size: 12px;

            cursor: pointer;
        }

        .remember input {
            width: 14px;
            height: 14px;

            padding: 0;

            accent-color: #2563eb;

            box-shadow: none;

            transform: none;
        }

        .forgot {
            border: none;
            background: transparent;

            color: #2563eb;

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            transition: color .25s ease;
        }

        .forgot:hover {
            color: #1d4ed8;
        }

        /* =========================================
           BUTTON
        ========================================= */

        .submit-btn {
            position: relative;

            width: 100%;
            height: 47px;

            border: none;
            border-radius: 12px;

            color: white;

            font-family: inherit;

            font-size: 13.5px;
            font-weight: 700;

            cursor: pointer;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            box-shadow:
                0 9px 22px rgba(37, 99, 235, .20);

            opacity: 0;
            transform: translateY(10px);

            transition:
                opacity .48s ease,
                transform .58s cubic-bezier(.22, 1, .36, 1),
                box-shadow .3s ease;
        }

        .submit-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.24),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left .7s ease;
        }

        .submit-btn:hover {
            box-shadow:
                0 12px 28px rgba(37, 99, 235, .27);

            transform: translateY(-1px);
        }

        .submit-btn:hover::before {
            left: 130%;
        }

        .submit-btn:active {
            transform: translateY(1px) scale(.99);
        }

        .submit-btn.loading {
            pointer-events: none;
            opacity: .75;
        }

        /* =========================================
           STRENGTH
        ========================================= */

        .strength {
            margin-top: -4px;
            margin-bottom: 12px;

            opacity: 0;

            max-height: 0;

            overflow: hidden;

            transform: translateY(-5px);

            transition:
                opacity .35s ease,
                max-height .45s cubic-bezier(.22, 1, .36, 1),
                transform .45s ease;
        }

        .auth-card[data-mode="register"]
        .strength {
            opacity: 1;
            max-height: 30px;
            transform: translateY(0);
        }

        .strength-track {
            width: 100%;
            height: 4px;

            overflow: hidden;

            border-radius: 10px;

            background: #e2e8f0;
        }

        .strength-bar {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: #cbd5e1;

            transition:
                width .35s ease,
                background .35s ease;
        }

        .strength-text {
            margin-top: 5px;

            font-size: 10px;

            color: #94a3b8;
        }

        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            min-height: 0;

            margin-top: 12px;

            padding: 0;

            border-radius: 10px;

            font-size: 11.5px;
            line-height: 1.4;

            overflow: hidden;

            opacity: 0;

            max-height: 0;

            transition:
                opacity .35s ease,
                max-height .35s ease,
                padding .35s ease;
        }

        .message.show {
            opacity: 1;
            max-height: 100px;
            padding: 9px 11px;
        }

        .message.error {
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .message.success {
            color: #047857;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            margin-top: 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 10.5px;

            opacity: 0;

            transform: translateY(5px);

            animation:
                footerIn .8s .45s forwards
                cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes footerIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer strong {
            color: #64748b;
            font-weight: 650;
        }

        /* =========================================
           LOADER
        ========================================= */

        .page-loader {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f8fafc;

            transition:
                opacity .65s ease,
                visibility .65s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;
        }

        .loader-logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            color: white;

            font-size: 17px;
            font-weight: 800;

            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #2563eb
                );

            animation:
                loaderPulse 1.3s ease-in-out infinite;
        }

        .loader-text {
            color: #64748b;

            font-size: 12px;
        }

        @keyframes loaderPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(.94);
                opacity: .72;
            }
        }

        /* =========================================
           SVG
        ========================================= */

        svg {
            width: 100%;
            height: 100%;
        }
    </style>
<base target="_blank">
</head>

<body>

<!-- =========================================
     LOADER
========================================= -->

<div class="page-loader" id="pageLoader">

    <div class="loader-content">

        <div class="loader-logo">
            K
        </div>

        <div class="loader-text">
            Загрузка системы…
        </div>

    </div>

</div>


<!-- =========================================
     BACKGROUND
========================================= -->

<div class="background">

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

</div>


<!-- =========================================
     PAGE
========================================= -->

<main class="page">

    <section
        class="auth-card"
        id="authCard"
        data-mode="login"
    >

        <div class="card-glow"></div>


        <!-- LOGO -->

        <div class="logo">
            K
        </div>


        <!-- HEADER -->

        <div class="header">

            <h1 class="title" id="pageTitle">
                С возвращением
            </h1>

            <p class="subtitle" id="pageSubtitle">
                Войдите в систему KURATOR
            </p>

        </div>


        <!-- TABS -->

        <div class="tabs">

            <div class="tab-indicator"></div>

            <button
                class="tab login active"
                id="loginTab"
                type="button"
            >
                Вход
            </button>

            <button
                class="tab register"
                id="registerTab"
                type="button"
            >
                Регистрация
            </button>

        </div>


        <!-- FORMS VIEWPORT -->

        <div
            class="forms-viewport"
            id="formsViewport"
        >


            <!-- =================================
                 LOGIN
            ================================== -->

            <div
                class="form-panel login-panel"
                id="loginPanel"
            >

                <form id="loginForm">

                    <!-- EMAIL -->

                    <div class="field">

                        <div class="input-wrap">

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="Электронная почта"
                                autocomplete="email"
                                required
                            >

                            <div class="input-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <rect
                                        x="3"
                                        y="5"
                                        width="18"
                                        height="14"
                                        rx="3"
                                    />

                                    <path
                                        d="m4 7 8 6 8-6"
                                    />
                                </svg>

                            </div>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="field">

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Пароль"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="loginPassword"
                                aria-label="Показать пароль"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                    />
                                </svg>
                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="login-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Запомнить меня
                            </span>

                        </label>


                        <button
                            type="button"
                            class="forgot"
                            id="forgotPassword"
                        >
                            Забыли пароль?
                        </button>

                    </div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="submit-btn"
                        id="loginButton"
                    >
                        Войти в систему
                    </button>

                </form>

            </div>


            <!-- =================================
                 REGISTER
            ================================== -->

            <div
                class="form-panel register-panel"
                id="registerPanel"
            >

                <form id="registerForm">

                    <!-- NAME -->

                    <div class="field">

                        <div class="input-wrap">

                            <input
                                type="text"
                                id="registerName"
                                placeholder="Ваше ФИО"
                                autocomplete="name"
                                required
                            >

                            <div class="input-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <circle
                                        cx="12"
                                        cy="8"
                                        r="3.2"
                                    />

                                    <path
                                        d="M5 20c.8-3.4 3.2-5 7-5s6.2 1.6 7 5"
                                    />
                                </svg>

                            </div>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="field">

                        <div class="input-wrap">

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="Электронная почта"
                                autocomplete="email"
                                required
                            >

                            <div class="input-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <rect
                                        x="3"
                                        y="5"
                                        width="18"
                                        height="14"
                                        rx="3"
                                    />

                                    <path
                                        d="m4 7 8 6 8-6"
                                    />
                                </svg>

                            </div>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="field">

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Пароль"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="registerPassword"

                                <svg

                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"

                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    />

                    <!-- GROUP -->

                    <div class="field">

                                    <circle
                                        cx="8"
                                        cy="6"
                                        r="1"

                                    <circle
                                        cx="8"

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"

            Система управления
            <strong>KURATOR</strong>

        </div>

    </section>

</main>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        signOut,
        setPersistence,
        browserLocalPersistence,
        browserSessionPersistence,
        onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        deleteDoc,
        serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",

        authDomain:
            "othets-1aa03.firebaseapp.com",

        projectId:
            "othets-1aa03",

        storageBucket:
            "othets-1aa03.firebasestorage.app",

        messagingSenderId:
            "528392191591",

        appId:
            "1:528392191591:web:1e97790e6f9f0a6e175ec2",

        measurementId:
            "G-F50WVZRXZJ"
    };


    /* =========================================
       INITIALIZE
    ========================================= */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    /* =========================================
       ELEMENTS
    ========================================= */

    const authCard =
        document.getElementById("authCard");

    const formsViewport =
        document.getElementById("formsViewport");

    const loginPanel =
        document.getElementById("loginPanel");

    const registerPanel =
        document.getElementById("registerPanel");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const pageTitle =
        document.getElementById("pageTitle");

    const pageSubtitle =
        document.getElementById("pageSubtitle");

    const message =
        document.getElementById("message");

    const pageLoader =
        document.getElementById("pageLoader");


    /* =========================================
       ROLE
    ========================================= */

    /*
     * Определяет домашнюю страницу
     * по роли пользователя.
     * role === "admin"  -> adminhome.html
     * иначе             -> home.html
     */

    async function resolveHomePage(user) {

        try {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            const role =
                snapshot.exists()
                    ? snapshot.data().role
                    : null;


            return role === "admin"
                ? "adminhome.html"
                : "home.html";


        } catch (error) {

            console.error(
                "Ошибка чтения роли:",
                error
            );


            /*
             * При ошибке чтения роли
             * отправляем на обычную домашнюю
             * страницу.
             */

            return "home.html";

        }

    }


    /* =========================================
       REGISTRATION STATUS
    ========================================= */

    /*
     * reg: 0  — запрос отправлен,
     *           ожидает одобрения администратора
     *
     * reg: 1  — регистрация одобрена,
     *           вход разрешён
     *
     * reg: 2  — в регистрации отказано,
     *           данные пользователя удаляются
     */

    /*
     * Флаг защищает от гонки:
     * onAuthStateChanged срабатывает сразу
     * после signIn, до завершения нашей
     * проверки reg. Пока проверка идёт —
     * автоматический редирект запрещён.
     */

    let authCheckInProgress = false;


    /* =========================================
       HANDLE AUTHENTICATED USER
    ========================================= */

    /*
     * Проверяет статус регистрации
     * и роль, затем либо пускает
     * пользователя в систему,
     * либо блокирует вход.
     */

    async function handleAuthUser(user) {

        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const resetLoginButton = () => {

            loginButton.classList.remove(
                "loading"
            );

            loginButton.textContent =
                "Войти в систему";

        };


        try {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (!snapshot.exists()) {

                showMessage(
                    "Профиль пользователя не найден. Обратитесь к администратору."
                );

                await signOut(auth);

                resetLoginButton();

                return;
            }


            const data =
                snapshot.data();

            const reg =
                data.reg;


            /*
             * Запрос ещё на рассмотрении.
             */

            if (reg === 0) {

                showMessage(
                    "Ваш запрос на регистрацию отправлен. Дождитесь, пока администратор разрешит вам зарегистрироваться."
                );

                await signOut(auth);

                resetLoginButton();

                return;
            }


            /*
             * В регистрации отказано.
             * Удаляем все данные:
             * документ в Firestore
             * и аккаунт в Firebase Auth.
             *
             * user.delete() разрешён,
             * так как вход только что
             * выполнен (свежая сессия).
             */

            if (reg === 2) {

                showMessage(
                    "Вам отказано в регистрации. Данные аккаунта удалены."
                );

                await deleteDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );

                await user.delete();

                resetLoginButton();

                return;
            }


            /*
             * reg === 1 — регистрация одобрена.
             * Определяем роль и входим.
             */

            showMessage(
                "Вход выполнен. Открываем систему…",
                "success"
            );


            const homePage =
                await resolveHomePage(user);


            setTimeout(() => {

                window.location.href =
                    homePage;

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "Ошибка при проверке аккаунта. Попробуйте снова."
            );

            await signOut(auth);

            resetLoginButton();

        }

    }


    /* =========================================
       MODE
    ========================================= */

    let currentMode = "login";

    let switching = false;


    /* =========================================
       GET PANEL HEIGHT
    ========================================= */

    function getPanelHeight(panel) {

        return panel.scrollHeight;

    }


    /* =========================================
       SET VIEWPORT HEIGHT
    ========================================= */

    function setViewportHeight(height) {

        formsViewport.style.height =
            `${height}px`;

    }


    /* =========================================
       INITIAL HEIGHT
    ========================================= */

    function initializeHeight() {

        const panel =
            currentMode === "login"
                ? loginPanel
                : registerPanel;

        setViewportHeight(
            getPanelHeight(panel)
        );

    }


    /* =========================================
       SWITCH MODE
    ========================================= */

    async function switchMode(mode) {

        if (mode === currentMode || switching) {
            return;
        }

        switching = true;

        clearMessage();


        const currentPanel =
            currentMode === "login"
                ? loginPanel
                : registerPanel;

        const nextPanel =
            mode === "login"
                ? loginPanel
                : registerPanel;


        /*
         * 1. Фиксируем текущую высоту
         */

        const startHeight =
            currentPanel.scrollHeight;

        setViewportHeight(startHeight);


        /*
         * 2. Меняем состояние
         */

        currentMode = mode;

        authCard.dataset.mode = mode;


        /*
         * 3. Заголовок тоже меняется плавно
         */

        pageTitle.style.opacity = "0";
        pageTitle.style.transform =
            "translateY(-5px)";

        pageSubtitle.style.opacity = "0";
        pageSubtitle.style.transform =
            "translateY(-5px)";


        setTimeout(() => {

            if (mode === "login") {

                pageTitle.textContent =
                    "С возвращением";

                pageSubtitle.textContent =
                    "Войдите в систему KURATOR";

            } else {

                pageTitle.textContent =
                    "Создание аккаунта";

                pageSubtitle.textContent =
                    "Зарегистрируйтесь в системе KURATOR";

            }

            pageTitle.style.opacity = "1";
            pageTitle.style.transform =
                "translateY(0)";

            pageSubtitle.style.opacity = "1";
            pageSubtitle.style.transform =
                "translateY(0)";

        }, 150);


        /*
         * 4. На следующем кадре измеряем
         * новую панель
         */

        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                const endHeight =
                    getPanelHeight(nextPanel);

                setViewportHeight(endHeight);

            });

        });


        /*
         * 5. После анимации
         */

        setTimeout(() => {

            switching = false;

        }, 750);

    }


    /* =========================================
       TABS
    ========================================= */

    loginTab.addEventListener(
        "click",
        () => switchMode("login")
    );

    registerTab.addEventListener(
        "click",
        () => switchMode("register")
    );


    /* =========================================
       PASSWORD VISIBILITY
    ========================================= */

    document
        .querySelectorAll(".password-toggle")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const targetId =
                        button.dataset.target;

                    const input =
                        document.getElementById(targetId);

                    if (
                        input.type ===
                        "password"
                    ) {

                        input.type = "text";

                    } else {

                        input.type = "password";

                    }

                }
            );

        });


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className =
            `message show ${type}`;

    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "message";

    }


    /* =========================================
       FIREBASE ERROR
    ========================================= */

    function firebaseError(error) {

        switch (error.code) {

            case "auth/invalid-email":
                return "Введите корректную электронную почту.";

            case "auth/user-not-found":
                return "Пользователь с такой почтой не найден.";

            case "auth/wrong-password":
            case "auth/invalid-credential":
                return "Неверная почта или пароль.";

            case "auth/email-already-in-use":
                return "Аккаунт с такой почтой уже существует.";

            case "auth/weak-password":
                return "Пароль слишком простой.";

            case "auth/network-request-failed":
                return "Ошибка сети. Проверьте подключение к интернету.";

            case "auth/too-many-requests":
                return "Слишком много попыток. Попробуйте позже.";

            default:
                return error.message ||
                    "Произошла неизвестная ошибка.";
        }

    }


    /* =========================================
       LOGIN
    ========================================= */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;

                const remember =
                    document
                        .getElementById("rememberMe")
                        .checked;

                const button =
                    document
                        .getElementById("loginButton");


                if (!email || !password) {

                    showMessage(
                        "Заполните все поля."
                    );

                    return;
                }


                button.classList.add("loading");

                button.textContent =
                    "Выполняется вход…";


                /*
                 * Блокируем автоматический
                 * редирект из onAuthStateChanged
                 * на время своей проверки.
                 */

                authCheckInProgress = true;


                try {

                    await setPersistence(
                        auth,
                        remember
                            ? browserLocalPersistence
                            : browserSessionPersistence
                    );


                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    /*
                     * Проверка reg и роли.
                     * Внутри сам редирект
                     * либо блокировка.
                     */

                    await handleAuthUser(
                        auth.currentUser
                    );


                } catch (error) {

                    console.error(error);

                    showMessage(
                        firebaseError(error)
                    );


                    button.classList.remove(
                        "loading"
                    );

                    button.textContent =
                        "Войти в систему";


                    await signOut(auth);

                } finally {

                    authCheckInProgress = false;

                }

            }
        );


    /* =========================================
       REGISTER
    ========================================= */

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();


                const name =
                    document
                        .getElementById("registerName")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("registerEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("registerPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("registerConfirmPassword")
                        .value;

                const group =
                    document
                        .getElementById("registerGroup")
                        .value
                        .trim();

                const button =
                    document
                        .getElementById("registerButton");


                /* Проверки */

                if (
                    !name ||
                    !email ||
                    !password ||
                    !confirmPassword ||
                    !group
                ) {

                    showMessage(
                        "Заполните все поля."
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Пароль должен содержать минимум 6 символов."
                    );

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Пароли не совпадают."
                    );

                    return;
                }


                button.classList.add("loading");

                button.textContent =
                    "Создание аккаунта…";


                try {

                    /*
                     * Создаём пользователя Firebase
                     */

                    const result =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        result.user;


                    /*
                     * Создаём профиль
                     * users/{uid}
                     */

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {

                            uid:
                                user.uid,

                            name:
                                name,

                            email:
                                email,

                            group:
                                group,

                            role:
                                "student",

                            reg:
                                0,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    /*
                     * Аккаунт создан, но вход
                     * разрешён только после
                     * одобрения администратором.
                     *
                     * Закрываем автоматическую
                     * сессию Firebase Auth.
                     */

                    authCheckInProgress = true;

                    showMessage(
                        "Запрос на регистрацию отправлен. Дождитесь, пока администратор разрешит вам зарегистрироваться.",
                        "success"
                    );


                    await signOut(auth);


                    document
                        .getElementById(
                            "registerForm"
                        )
                        .reset();


                    strengthBar.style.width =
                        "0%";

                    strengthText.textContent =
                        "Введите пароль";

                    strengthBar.style.background =
                        "#cbd5e1";


                    button.classList.remove(
                        "loading"
                    );

                    button.textContent =
                        "Создать аккаунт";


                    setTimeout(() => {

                        authCheckInProgress =
                            false;

                    }, 500);


                } catch (error) {

                    console.error(error);

                    showMessage(
                        firebaseError(error)
                    );


                    button.classList.remove(
                        "loading"
                    );

                    button.textContent =
                        "Создать аккаунт";

                }

            }
        );


    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            async () => {

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                if (!email) {

                    showMessage(
                        "Сначала введите свою электронную почту."
                    );

                    document
                        .getElementById("loginEmail")
                        .focus();

                    return;
                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showMessage(
                        "Письмо для восстановления пароля отправлено.",
                        "success"
                    );


                } catch (error) {

                    console.error(error);

                    showMessage(
                        firebaseError(error)
                    );

                }

            }
        );


    /* =========================================
       PASSWORD STRENGTH
    ========================================= */

    const registerPassword =
        document.getElementById(
            "registerPassword"
        );

    const strengthBar =
        document.getElementById(
            "strengthBar"
        );

    const strengthText =
        document.getElementById(
            "strengthText"
        );


    registerPassword.addEventListener(
        "input",
        () => {

            const password =
                registerPassword.value;


            let score = 0;


            if (password.length >= 6) {
                score++;
            }

            if (password.length >= 10) {
                score++;
            }

            if (/[A-Z]/.test(password)) {
                score++;
            }

            if (/[0-9]/.test(password)) {
                score++;
            }

            if (/[^A-Za-z0-9]/.test(password)) {
                score++;
            }


            const percentage =
                Math.min(
                    score * 20,
                    100
                );


            strengthBar.style.width =
                `${percentage}%`;


            if (!password) {

                strengthText.textContent =
                    "Введите пароль";

                strengthBar.style.background =
                    "#cbd5e1";

                return;
            }


            if (score <= 1) {

                strengthText.textContent =
                    "Слабый пароль";

                strengthBar.style.background =
                    "#ef4444";

            } else if (score <= 3) {

                strengthText.textContent =
                    "Средний пароль";

                strengthBar.style.background =
                    "#f59e0b";

            } else {

                strengthText.textContent =
                    "Надёжный пароль";

                strengthBar.style.background =
                    "#22c55e";

            }

        }
    );


    /* =========================================
       AUTH STATE
    ========================================= */

    onAuthStateChanged(
        auth,
        user => {

            /*
             * Если пользователь уже вошёл,
             * можно открыть систему.
             */

            if (user) {

                /*
                 * Если сейчас идёт собственная
                 * проверка (вход/регистрация) —
                 * автоматический редирект
                 * пропускаем.
                 */

                if (authCheckInProgress) {
                    return;
                }


                /*
                 * Пользователь уже авторизован
                 * (вернулся на страницу логина).
                 * Проверяем reg и роль,
                 * затем открываем нужную
                 * домашнюю страницу.
                 */

                authCheckInProgress = true;

                handleAuthUser(user)
                    .finally(() => {

                        authCheckInProgress =
                            false;

                    });

            }

        }
    );


    /* =========================================
       HEADER TRANSITIONS
    ========================================= */

    pageTitle.style.transition =
        "opacity .32s ease, transform .45s cubic-bezier(.22,1,.36,1)";

    pageSubtitle.style.transition =
        "opacity .32s ease, transform .45s cubic-bezier(.22,1,.36,1)";


    /* =========================================
       INITIALIZE
    ========================================= */

    window.addEventListener(
        "load",
        () => {

            requestAnimationFrame(() => {

                initializeHeight();

                setTimeout(() => {

                    pageLoader.classList.add(
                        "hidden"
                    );

                }, 450);

            });

        }
    );


    /*
     * На случай изменения размера окна.
     * Сам интерфейс остаётся desktop-only.
     */

    window.addEventListener(
        "resize",
        () => {

            const panel =
                currentMode === "login"
                    ? loginPanel
                    : registerPanel;

            setViewportHeight(
                panel.scrollHeight
            );

        }
    );
