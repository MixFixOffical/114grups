<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#1e293b">
<title>Замены</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --accent: #1d4ed8;
    --accent-dark: #1e3a8a;
    --accent-soft: #eff6ff;
    --accent-line: #bfdbfe;
    --green: #047857; --green-soft: #ecfdf5;
    --red: #b91c1c;   --red-soft: #fef2f2;
    --amber: #b45309; --amber-soft: #fffbeb;
    --cyan: #0e7490;  --cyan-soft: #ecfeff;
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #94a3b8;
    --surface: #ffffff;
    --surface-2: #f5f7fa;
    --border: #e2e8f0;
    --border-2: #cbd5e1;
    --bg: #eef2f7;
    --r-sm: 8px; --r-md: 10px; --r-lg: 14px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,.07);
    --shadow-lg: 0 12px 32px -12px rgba(15,23,42,.25);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html[data-theme="dark"] {
    --accent: #60a5fa;
    --accent-soft: rgba(29,78,216,.15);
    --accent-line: #1e40af;
    --green: #4ade80; --green-soft: rgba(4,120,87,.15);
    --red: #f87171;   --red-soft: rgba(185,28,28,.15);
    --amber: #fbbf24; --amber-soft: rgba(180,83,9,.15);
    --cyan: #22d3ee;  --cyan-soft: rgba(14,116,144,.2);
    --text: #e2e8f0;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --surface: #1e293b;
    --surface-2: #172033;
    --border: #334155;
    --border-2: #475569;
    --bg: #0f172a;
}

body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}
button, input, select, textarea { font-family: inherit; font-size: 15px; }
button { cursor: pointer; border: 0; background: transparent; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- HEADER ---------- */
header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(var(--safe-top) + 12px) 20px 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
}
.header-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.header-logo {
    width: 40px; height: 40px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-md); background: var(--accent-dark); color: #fff; font-size: 18px;
}
.title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
.subtitle { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.back-btn {
    padding: 9px 14px; border-radius: var(--r-sm);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-2); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.back-btn:hover { background: var(--border); color: var(--text); }

/* ---------- LAYOUT ---------- */
.container { max-width: 1000px; margin: 20px auto 40px; padding: 0 16px calc(40px + var(--safe-bottom)); }

.panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
}
.panel-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 180px; flex: 1; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field-static {
    padding: 10px 12px; border-radius: var(--r-sm);
    background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px;
    border: 1px solid var(--accent-line);
}
select, input[type="date"], input[type="text"], textarea {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--surface-2); color: var(--text); outline: none;
}
select:focus, input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }

.date-nav { display: flex; gap: 6px; }
.date-nav button {
    flex: 1; padding: 10px 8px; border-radius: var(--r-sm);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-2); font-size: 13px; font-weight: 600;
}
.date-nav button.primary { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.date-nav button:hover { background: var(--border); }

.day-info { margin-top: 12px; font-size: 13px; color: var(--text-2); }
.day-info b { color: var(--text); }

/* ---------- LESSON LIST ---------- */
.lessons { display: flex; flex-direction: column; gap: 10px; }
.lesson {
    display: flex; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--shadow-sm);
}
.lesson.replaced { border-left: 4px solid var(--cyan); }
.lesson-num {
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--border);
    font-size: 16px; font-weight: 700; color: var(--accent);
}
.lesson-num small { font-size: 9px; font-weight: 600; color: var(--text-3); margin-top: -2px; }
.lesson-body { flex: 1; min-width: 0; }
.lesson-time { font-size: 11.5px; color: var(--text-3); margin-bottom: 4px; }
.lesson-text { font-size: 14.5px; line-height: 1.45; word-break: break-word; }
.lesson-orig { color: var(--text); font-weight: 600; }
.lesson-repl { margin-top: 4px; font-size: 13.5px; color: var(--cyan); font-weight: 600; }
.lesson-repl .sub { color: var(--text-2); font-weight: 500; }
.lesson-empty { color: var(--text-3); font-size: 13px; font-style: italic; }

.lesson-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.act-btn {
    padding: 8px 12px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap;
}
.act-btn:hover { background: var(--border); color: var(--text); }
.act-btn.primary { background: var(--cyan-soft); color: var(--cyan); border-color: var(--accent-line); }
.act-btn.primary:hover { filter: brightness(.97); }

.empty {
    text-align: center; padding: 40px 20px; color: var(--text-2);
    background: var(--surface); border: 1px dashed var(--border-2); border-radius: var(--r-md);
}
.empty-icon { font-size: 36px; margin-bottom: 10px; }

/* ---------- MODAL ---------- */
.overlay {
    position: fixed; inset: 0; z-index: 500;
    display: none; align-items: center; justify-content: center; padding: 18px;
    background: rgba(15,23,42,.5);
}
.overlay.active { display: flex; }
.modal {
    width: 100%; max-width: 460px;
    background: var(--surface); border-radius: var(--r-lg);
    padding: 20px; box-shadow: var(--shadow-lg);
    max-height: 90vh; overflow-y: auto;
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }
.modal .field { margin-bottom: 12px; min-width: 0; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions button {
    flex: 1; padding: 12px; border-radius: var(--r-md); font-weight: 600; font-size: 14px; min-height: 46px;
}
.btn-save { background: var(--accent-dark); color: #fff; }
.btn-save:hover { background: var(--accent); }
.btn-save:disabled { opacity: .6; }
.btn-del { background: var(--red-soft); color: var(--red); border: 1px solid rgba(185,28,28,.25); }
.btn-cancel { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.hint { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }

/* ---------- TOAST ---------- */
.toast {
    position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom)); z-index: 1000;
    transform: translate(-50%, 120px); opacity: 0;
    padding: 12px 18px; border-radius: var(--r-md);
    background: var(--text); color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-lg); transition: transform .25s ease, opacity .25s ease;
    max-width: calc(100vw - 32px); text-align: center; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* ---------- MOBILE ---------- */
@media (max-width: 640px) {
    header { padding: calc(var(--safe-top) + 10px) 14px 10px; }
    .title { font-size: 16px; }
    .container { padding: 0 12px; margin-top: 12px; }
    .panel { padding: 14px; }
    .field { min-width: 100%; }
    .lesson { padding: 12px; gap: 10px; flex-wrap: wrap; }
    .lesson-actions { flex-direction: row; width: 100%; }
    .lesson-actions button { flex: 1; }
}
</style>
</head>
<body>

<header>
    <div class="header-brand">
        <div class="header-logo">🔁</div>
        <div>
            <div class="title">Замены</div>
            <div class="subtitle" id="subtitle">Загрузка...</div>
        </div>
    </div>
    <button class="back-btn" onclick="goBack()">← Главное меню</button>
</header>

<main class="container">

    <section class="panel">
        <div class="panel-row">
            <div class="field" id="groupField">
                <label for="groupSelect">Группа</label>
                <select id="groupSelect"><option value="">Загрузка...</option></select>
            </div>
            <div class="field">
                <label for="datePicker">Дата</label>
                <input type="date" id="datePicker">
            </div>
        </div>
        <div class="panel-row" style="margin-top:12px">
            <div class="field">
                <div class="date-nav">
                    <button type="button" onclick="shiftDate(-1)">←</button>
                    <button type="button" class="primary" onclick="goToday()">Сегодня</button>
                    <button type="button" onclick="shiftDate(1)">→</button>
                </div>
            </div>
        </div>
        <div class="day-info" id="dayInfo">—</div>
    </section>

    <section id="lessonsWrap" class="lessons"></section>

</main>

<!-- MODAL: замена -->
<div class="overlay" id="replOverlay">
    <div class="modal">
        <div class="modal-title" id="modalTitle">Замена пары</div>
        <div class="modal-sub" id="modalSub">—</div>

        <div class="field">
            <label for="replDiscipline">Заменено на (дисциплина)</label>
            <input type="text" id="replDiscipline" list="disciplineList" placeholder="Например: Физика" autocomplete="off">
            <datalist id="disciplineList"></datalist>
        </div>

        <div class="field">
            <label for="replTeacher">Заменён (преподаватель)</label>
            <input type="text" id="replTeacher" placeholder="ФИО преподавателя, которого заменили" autocomplete="off">
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" type="button" onclick="closeModal()">Отмена</button>
            <button class="btn-del" type="button" id="delBtn" onclick="deleteReplacement()">Удалить</button>
            <button class="btn-save" type="button" id="saveBtn" onclick="saveReplacement()">Сохранить</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
    getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc,
    query, where, deleteField
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",
    authDomain: "othets-1aa03.firebaseapp.com",
    projectId: "othets-1aa03",
    storageBucket: "othets-1aa03.firebasestorage.app",
    messagingSenderId: "528392191591",
    appId: "1:528392191591:web:1e97790e6f9f0a6e175ec2",
    measurementId: "G-F50WVZRXZJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const DAY_NAMES = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];

let userRole = null;
let userGroups = [];
let groupId = "";
let date = "";
let settings = {};
let replacements = {};   // { "1": {discipline, teacher}, ... }
let editingLesson = null;
let homePage = "home.html";

const $ = id => document.getElementById(id);

/* ---------- helpers ---------- */
function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseDate(s) {
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y, m-1, d);
}
function formatRu(s) {
    const [y,m,d] = s.split("-");
    return `${d}.${m}.${y}`;
}
function escapeHtml(v) {
    return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
}
function showToast(msg, type = "") {
    const t = $("toast");
    t.textContent = msg;
    t.className = `toast show ${type}`;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.className = "toast", 2500);
}

/* ---------- настройки группы ---------- */
function getLessonCount(dayIndex) {
    if (dayIndex < 1 || dayIndex > 6) return 0;
    const v = settings?.schedule?.[DAYS[dayIndex-1]];
    if (v == null) return 0;
    if (Array.isArray(v)) return v.length;
    if (typeof v === "object") {
        if (Array.isArray(v.lessons)) return v.lessons.length;
        if (v.count != null) return Number(v.count) || 0;
    }
    return Number(v) || 0;
}

/* Исходная дисциплина из настроек. Если не настроена — пустая строка */
function getOriginalDiscipline(dayIndex, lesson) {
    if (dayIndex < 1 || dayIndex > 6) return "";
    const disc = settings?.disciplines?.[DAYS[dayIndex-1]];
    let item = null;
    if (Array.isArray(disc)) item = disc[lesson-1];
    else if (disc && typeof disc === "object") item = disc[String(lesson)] ?? disc[lesson];
    if (!item) return "";
    if (typeof item === "string") return item.trim();
    if (typeof item === "object") {
        const v = item.discipline || item.subject || item.name || item.title || item.lessonName;
        return v ? String(v).trim() : "";
    }
    return "";
}

function getLessonTime(dayIndex, lesson) {
    const bells = settings?.bells;
    let b = null;
    if (bells) b = Array.isArray(bells) ? bells[lesson-1] : (bells[String(lesson)] ?? bells[lesson]);
    if (!b || typeof b !== "object") return "";
    const s = b.start || b.startTime || "";
    const e = b.end || b.endTime || "";
    return s && e ? `${s} — ${e}` : (s || "");
}

/* Все дисциплины группы — для подсказок в поле ввода */
function collectDisciplines() {
    const set = new Set();
    Object.keys(settings?.disciplines || {}).forEach(day => {
        const d = settings.disciplines[day];
        const items = Array.isArray(d) ? d : Object.values(d || {});
        items.forEach(it => {
            const v = typeof it === "string" ? it : (it?.discipline || it?.subject || it?.name || "");
            if (v) set.add(String(v).trim());
        });
    });
    return [...set].sort((a,b) => a.localeCompare(b, "ru"));
}

/* ---------- загрузка ---------- */
function groupsFromSnap(s) {
    return s.docs.map(d => ({ id: d.id, ...d.data() })).filter(g => g.active !== false);
}

async function loadUserAndGroups(uid) {
    const us = await getDoc(doc(db, "users", uid));
    const ud = us.exists() ? us.data() : {};
    userRole = ud.role || "starosta";
    homePage = userRole === "admin" ? "adminhome.html" : userRole === "curator" ? "khome.html" : "home.html";

    const map = new Map();
    if (userRole === "admin") {
        groupsFromSnap(await getDocs(collection(db, "groups"))).forEach(g => map.set(g.id, g));
    } else if (userRole === "curator") {
        groupsFromSnap(await getDocs(query(collection(db, "groups"), where("curatorId","==",uid))))
            .forEach(g => map.set(g.id, g));
    } else {
        const [a, b] = await Promise.all([
            getDocs(query(collection(db, "groups"), where("starostaId","==",uid))),
            getDocs(query(collection(db, "groups"), where("leaderId","==",uid)))
        ]);
        [...groupsFromSnap(a), ...groupsFromSnap(b)].forEach(g => map.set(g.id, g));
    }
    userGroups = [...map.values()].sort((a,b) => String(a.name||"").localeCompare(String(b.name||""), "ru"));
}

function renderGroupSelect() {
    const sel = $("groupSelect");
    if (!userGroups.length) {
        sel.innerHTML = `<option value="">Нет доступных групп</option>`;
        sel.disabled = true;
        return;
    }
    sel.innerHTML = userGroups.map(g =>
        `<option value="${escapeHtml(g.id)}">${escapeHtml(g.name || g.id)}</option>`).join("");

    const remembered = sessionStorage.getItem("replGroupId");
    groupId = userGroups.some(g => g.id === remembered) ? remembered : userGroups[0].id;
    sel.value = groupId;

    // Если у пользователя одна группа — не даём менять
    if (userGroups.length === 1 && userRole !== "admin") {
        sel.disabled = true;
        $("groupField").querySelector("label").textContent = "Группа (закреплена)";
    }
}

async function loadSettings() {
    settings = {};
    if (!groupId) return;
    try {
        const s = await getDoc(doc(db, "groupSettings", groupId));
        settings = s.exists() ? (s.data() || {}) : {};
    } catch (e) { console.error(e); showToast("Не удалось загрузить настройки", "error"); }
}

async function loadReplacements() {
    replacements = {};
    if (!groupId || !date) return;
    try {
        const s = await getDoc(doc(db, "replacements", `${date}_${groupId}`));
        if (s.exists()) replacements = (s.data() || {}).lessons || {};
    } catch (e) { console.error(e); showToast("Не удалось загрузить замены", "error"); }
}

/* ---------- рендер ---------- */
function renderDayInfo() {
    const d = parseDate(date);
    const dayIdx = d.getDay();
    const count = getLessonCount(dayIdx);
    const g = userGroups.find(x => x.id === groupId);
    const replCount = Object.keys(replacements).length;
    $("dayInfo").innerHTML =
        `<b>${DAY_NAMES[dayIdx]}</b>, ${formatRu(date)} · ` +
        `${count} ${plural(count,"пара","пары","пар")} · ` +
        `замен: <b>${replCount}</b>` +
        (g ? ` · группа <b>${escapeHtml(g.name || g.id)}</b>` : "");
    $("subtitle").textContent = g ? `${g.name || g.id} • ${formatRu(date)}` : formatRu(date);
}

function lessonHtml(dayIdx, l, count) {
    const orig = getOriginalDiscipline(dayIdx, l);
    const rep = replacements[String(l)];
    const time = getLessonTime(dayIdx, l);

    let text = "";
    if (orig) text += `<div class="lesson-orig">${escapeHtml(orig)}</div>`;
    if (rep && rep.discipline) {
        const teacher = rep.teacher
            ? `, <span class="sub">заменён: ${escapeHtml(rep.teacher)}</span>`
            : "";
        text += `<div class="lesson-repl">(Заменено: ${escapeHtml(rep.discipline)}${teacher})</div>`;
    }
    if (!text) text = `<div class="lesson-empty">Дисциплина не настроена</div>`;

    // Если дисциплина не настроена, ничего не выводим для исходной части
    return `
        <div class="lesson ${rep && rep.discipline ? "replaced" : ""}">
            <div class="lesson-num">${l}<small>пара</small></div>
            <div class="lesson-body">
                ${time ? `<div class="lesson-time">${escapeHtml(time)}</div>` : ""}
                <div class="lesson-text">${text}</div>
            </div>
            <div class="lesson-actions">
                <button class="act-btn primary" onclick="openModal(${l})">
                    ${rep && rep.discipline ? "✎ Изменить" : "+ Заменить"}
                </button>
            </div>
        </div>`;
}

function render() {
    renderDayInfo();
    const wrap = $("lessonsWrap");
    if (!date) { wrap.innerHTML = ""; return; }

    if (!groupId) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">🔒</div>Группа не выбрана.</div>`;
        return;
    }
    const dayIdx = parseDate(date).getDay();
    if (dayIdx === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">🌴</div>В воскресенье занятий нет.</div>`;
        return;
    }
    const count = getLessonCount(dayIdx);
    if (!count) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">📚</div>Для этого дня расписание не настроено.</div>`;
        return;
    }
    let html = "";
    for (let l = 1; l <= count; l++) html += lessonHtml(dayIdx, l, count);
    wrap.innerHTML = html;
}

/* ---------- модалка ---------- */
function openModal(lesson) {
    editingLesson = lesson;
    const dayIdx = parseDate(date).getDay();
    const orig = getOriginalDiscipline(dayIdx, lesson);
    const rep = replacements[String(lesson)] || {};

    $("modalTitle").textContent = `${lesson} пара`;
    $("modalSub").textContent = `${DAY_NAMES[dayIdx]}, ${formatRu(date)}` + (orig ? ` • ${orig}` : "");

    $("disciplineList").innerHTML = collectDisciplines().map(d => `<option value="${escapeHtml(d)}">`).join("");
    $("replDiscipline").value = rep.discipline || "";
    $("replTeacher").value = rep.teacher || "";

    $("delBtn").style.display = rep.discipline ? "block" : "none";
    $("replOverlay").classList.add("active");
    setTimeout(() => $("replDiscipline").focus(), 80);
}
window.openModal = openModal;

function closeModal() {
    $("replOverlay").classList.remove("active");
    editingLesson = null;
}
window.closeModal = closeModal;

async function saveReplacement() {
    if (!editingLesson || !groupId || !date) return;
    const discipline = $("replDiscipline").value.trim();
    const teacher = $("replTeacher").value.trim();
    if (!discipline) { showToast("Укажите дисциплину", "error"); return; }

    const btn = $("saveBtn");
    btn.disabled = true;
    try {
        const ref = doc(db, "replacements", `${date}_${groupId}`);
        await setDoc(ref, {
            date, groupId,
            lessons: { [String(editingLesson)]: { discipline, teacher, updatedAt: new Date().toISOString() } },
            updatedAt: new Date().toISOString()
        }, { merge: true });

        replacements[String(editingLesson)] = { discipline, teacher };
        closeModal();
        render();
        showToast("✓ Замена сохранена", "success");
    } catch (e) {
        console.error(e);
        showToast("Ошибка сохранения", "error");
    } finally {
        btn.disabled = false;
    }
}
window.saveReplacement = saveReplacement;

async function deleteReplacement() {
    if (!editingLesson || !groupId || !date) return;
    if (!confirm("Удалить замену для этой пары?")) return;
    try {
        const ref = doc(db, "replacements", `${date}_${groupId}`);
        await updateDoc(ref, { [`lessons.${editingLesson}`]: deleteField() });
        delete replacements[String(editingLesson)];
        closeModal();
        render();
        showToast("Замена удалена");
    } catch (e) {
        console.error(e);
        showToast("Ошибка удаления", "error");
    }
}
window.deleteReplacement = deleteReplacement;

/* ---------- навигация ---------- */
async function changeDate(newDate) {
    date = newDate;
    $("datePicker").value = date;
    await loadReplacements();
    render();
}
function shiftDate(delta) {
    const d = parseDate(date || formatDate(new Date()));
    d.setDate(d.getDate() + delta);
    changeDate(formatDate(d));
}
function goToday() { changeDate(formatDate(new Date())); }
window.shiftDate = shiftDate;
window.goToday = goToday;

$("datePicker").addEventListener("change", e => { if (e.target.value) changeDate(e.target.value); });

$("groupSelect").addEventListener("change", async e => {
    groupId = e.target.value;
    sessionStorage.setItem("replGroupId", groupId);
    await loadSettings();
    await loadReplacements();
    render();
});

$("replOverlay").addEventListener("click", e => { if (e.target.id === "replOverlay") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function goBack() { window.location.replace(homePage); }
window.goBack = goBack;

/* ---------- старт ---------- */
onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "login.html"; return; }
    try {
        await loadUserAndGroups(user.uid);
        renderGroupSelect();
        date = formatDate(new Date());
        $("datePicker").value = date;
        await loadSettings();
        await loadReplacements();
        render();
    } catch (e) {
        console.error(e);
        showToast("Ошибка загрузки данных", "error");
        $("lessonsWrap").innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>Не удалось загрузить данные.</div>`;
    }
});
</script>
</body>
</html>
