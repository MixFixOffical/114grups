<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Игра</title>
  <style>
    :root {
      --bg1: #fff6e9; --bg2: #eef4ff; --ink: #1d1f3a; --muted: #6b6f8f;
      --primary: #7c5cff; --primary2: #ff6fb1; --accent: #ffc34d; --mint: #3ed6b0;
      --danger: #ff4d6d; --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100vh; min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    [hidden] { display: none !important; }
    .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .shape { position: absolute; border-radius: 40%; opacity: 0.4; filter: blur(2px); animation: float 12s ease-in-out infinite; }
    .s1 { width: 200px; height: 200px; background: var(--primary); top: -60px; left: -60px; }
    .s2 { width: 160px; height: 160px; background: var(--primary2); bottom: -40px; right: -40px; animation-delay: -4s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(20px, -30px) rotate(20deg); } }

    .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 20px; font-weight: 900; }
    .badge {
      background: #fff; border: 2px solid #e3e6ff; border-radius: 999px; padding: 6px 14px;
      font-weight: 800; font-size: 14px;
    }
    .panel {
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 2px solid #fff; border-radius: var(--radius); padding: 24px; text-align: center;
      box-shadow: 0 20px 60px rgba(124, 92, 255, 0.18);
      animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
    .label { color: var(--muted); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
    .big-emoji { font-size: 56px; display: inline-block; animation: bounce 1.6s ease-in-out infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h2 { font-size: 24px; font-weight: 900; margin: 8px 0; }

    /* Вопрос */
    .progress { font-weight: 800; color: var(--muted); margin-bottom: 8px; }
    .timer-track { height: 12px; background: #e9ebff; border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
    .timer-bar {
      height: 100%; width: 100%; border-radius: 999px; transform-origin: left center;
      background: linear-gradient(90deg, var(--mint), var(--accent), var(--danger));
      transition: transform 0.2s linear;
    }
    .time-left { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
    .q-text { font-size: 20px; font-weight: 800; line-height: 1.35; margin-bottom: 18px; }
    .options { display: grid; gap: 12px; }
    .opt {
      width: 100%; padding: 16px; border-radius: 18px; border: 3px solid #e3e6ff; background: #fff;
      font-size: 17px; font-weight: 700; color: var(--ink); text-align: left; cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      font-family: inherit;
    }
    .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--primary); }
    .opt:active:not(:disabled) { transform: scale(0.98); }
    .opt:disabled { cursor: default; }
    .opt.correct { border-color: #1fa37f; background: #e6fff6; }
    .opt.wrong { border-color: var(--danger); background: #ffecf0; }
    .feedback { min-height: 26px; margin-top: 14px; font-weight: 800; font-size: 17px; }
    .feedback.ok { color: #1fa37f; }
    .feedback.bad { color: var(--danger); }

    /* Итоги */
    .board { list-style: none; display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 16px; }
    .board li {
      background: #fff; border: 2px solid #f0f2ff; border-radius: 16px; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700;
    }
    .board li.me { border-color: var(--primary); background: #f6f3ff; }
    .board .pts { color: var(--primary); }
    .empty { color: var(--muted); font-weight: 700; }
    .players { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
    .chip { background: #fff; border: 2px solid #e3e6ff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; }
    .chip.me { border-color: var(--primary); }
    .conn { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>

  <div class="bg-shapes" aria-hidden="true"><span class="shape s1"></span><span class="shape s2"></span></div>

  <div class="wrap">
    <header class="topbar">
      <div class="title">🎮 Код: <span id="gameCode">----</span></div>
      <div class="badge" id="myName">Игрок</div>
    </header>

    <!-- Ожидание -->
    <section class="panel" id="waitingPanel" hidden>
      <div class="big-emoji" aria-hidden="true">⏳</div>
      <h2>Ждём старта</h2>
      <p class="label">Ведущий скоро запустит игру</p>
      <p class="label" style="margin-top: 14px">👥 Игроков: <span id="playerCount">0</span></p>
      <div class="players" id="playersList"></div>
    </section>

    <!-- Вопрос -->
    <section class="panel" id="questionPanel" hidden>
      <div class="progress" id="qProgress"></div>
      <div class="timer-track"><div class="timer-bar" id="timerBar"></div></div>
      <div class="time-left" id="timeLeft">0</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    </section>

    <!-- Итоги -->
    <section class="panel" id="finishPanel" hidden>
      <div class="big-emoji" aria-hidden="true">🏆</div>
      <h2 id="finishTitle">Игра завершена</h2>
      <p class="label" id="myResult"></p>
      <ol class="board" id="board"></ol>
    </section>

    <div class="conn" id="conn"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHuLu3Ud4YFzWXlwkCUtrgOPvFINFTJPw",
      authDomain: "sokrat-7c938.firebaseapp.com",
      projectId: "sokrat-7c938",
      storageBucket: "sokrat-7c938.firebasestorage.app",
      messagingSenderId: "19858604945",
      appId: "1:19858604945:web:244b77bbe5afb849481030",
      measurementId: "G-K06CVPVD15"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const GAMES = "games";

    const $ = (id) => document.getElementById(id);
    const session = JSON.parse(sessionStorage.getItem("player") || "null");

    if (!session) {
      location.replace("index.html");
    } else {
      init(session);
    }

    function init({ code, pid, name }) {
      $("gameCode").textContent = code;
      $("myName").textContent = name;

      let game = null;
      let levels = [];
      let answers = [];
      let players = [];
      let renderedQ = -2;
      let tickId = null;

      const gameRef = doc(db, GAMES, code);

      onSnapshot(gameRef, (snap) => {
        if (!snap.exists()) { location.replace("index.html"); return; }
        game = snap.data();
        levels = game.levels || [];
        $("conn").textContent = "";
        render();
      }, (err) => { console.error(err); $("conn").textContent = "Соединение потеряно, переподключаемся…"; });

      onSnapshot(collection(db, GAMES, code, "answers"), (snap) => {
        answers = snap.docs.map((d) => d.data());
        render();
      }, (err) => console.error(err));

      onSnapshot(collection(db, GAMES, code, "players"), (snap) => {
        players = snap.docs.map((d) => ({ id: d.id, name: d.data().name || "Игрок" }));
        render();
      }, (err) => console.error(err));

      // ===== Отрисовка =====
      function show(el, on) { el.hidden = !on; }

      function render() {
        if (!game) return;
        const st = game.status;
        const inQuestion = st === "running" && game.currentQuestion >= 0 && levels[game.currentQuestion];

        $("playerCount").textContent = players.length;
        $("playersList").replaceChildren(...players.map((p) => {
          const c = document.createElement("span");
          c.className = "chip" + (p.id === pid ? " me" : "");
          c.textContent = p.name;
          return c;
        }));

        show($("waitingPanel"), !inQuestion && (st === "waiting" || st === "lobby" || st === "running"));
        show($("questionPanel"), Boolean(inQuestion));
        show($("finishPanel"), st === "finished" || st === "cancelled");

        if (inQuestion) {
          renderQuestion();
        } else {
          stopTick();
          renderedQ = -2;
        }

        if (st === "finished" || st === "cancelled") renderFinish(st);
      }

      function myAnswer(qi) {
        return answers.find((a) => a.pid === pid && a.qIndex === qi);
      }

      function remainingMs() {
        const q = levels[game.currentQuestion];
        return q.seconds * 1000 - (Date.now() - game.questionStartedAt);
      }

      function renderQuestion() {
        const qi = game.currentQuestion;
        const q = levels[qi];

        if (renderedQ !== qi) {
          renderedQ = qi;
          $("qProgress").textContent = `Вопрос ${qi + 1} из ${levels.length}`;
          $("qText").textContent = q.text;
          $("options").replaceChildren(...q.options.map((text, i) => {
            const b = document.createElement("button");
            b.className = "opt";
            b.type = "button";
            b.textContent = text;
            b.addEventListener("click", () => answer(i));
            return b;
          }));
        }

        startTick();
        updateQuestionUI();
      }

      function updateQuestionUI() {
        const qi = game.currentQuestion;
        const q = levels[qi];
        const mine = myAnswer(qi);
        const left = remainingMs();
        const timeUp = left <= 0;
        const finished = Boolean(mine) || timeUp;

        const left2 = Math.max(0, left);
        $("timeLeft").textContent = Math.ceil(left2 / 1000);
        $("timerBar").style.transform = `scaleX(${left2 / (q.seconds * 1000)})`;

        const buttons = [...$("options").children];
        buttons.forEach((b, i) => {
          b.disabled = finished;
          b.classList.toggle("correct", finished && i === q.correct);
          b.classList.toggle("wrong", Boolean(mine) && mine.option === i && i !== q.correct);
        });

        const fb = $("feedback");
        fb.className = "feedback";
        if (mine) {
          const ok = mine.option === q.correct;
          fb.classList.add(ok ? "ok" : "bad");
          fb.textContent = ok
            ? "Верно! ✅"
            : `Неверно ❌ Верный ответ: ${q.options[q.correct]}`;
        } else if (timeUp) {
          fb.classList.add("bad");
          fb.textContent = `Время вышло. Верный ответ: ${q.options[q.correct]}`;
        } else {
          fb.textContent = "Выбери ответ!";
        }
      }

      function startTick() {
        if (tickId) return;
        tickId = setInterval(() => {
          if (!game || game.status !== "running") return stopTick();
          updateQuestionUI();
        }, 200);
      }

      function stopTick() {
        clearInterval(tickId);
        tickId = null;
      }

      // ===== Ответ =====
      async function answer(optionIndex) {
        const qi = game.currentQuestion;
        if (myAnswer(qi) || remainingMs() <= 0) return;

        const elapsed = Date.now() - game.questionStartedAt;
        try {
          await setDoc(doc(db, GAMES, code, "answers", `${pid}_${qi}`), {
            pid,
            qIndex: qi,
            option: optionIndex,
            time: elapsed,
          });
        } catch (err) {
          console.error(err);
          $("feedback").className = "feedback bad";
          $("feedback").textContent = "Не удалось отправить ответ, попробуй ещё раз";
        }
      }

      // ===== Итоги =====
      function scoreOf(playerId) {
        let total = 0;
        let correct = 0;
        levels.forEach((q, i) => {
          const a = answers.find((x) => x.pid === playerId && x.qIndex === i);
          if (a && a.option === q.correct) {
            correct++;
            const speed = Math.max(0, 1 - a.time / (q.seconds * 1000));
            total += 100 + Math.round(50 * speed);
          }
        });
        return { total, correct };
      }

      function renderFinish(st) {
        $("finishTitle").textContent = st === "cancelled" ? "Игра отменена" : "Игра завершена";

        const rows = players
          .map((p) => ({ ...p, ...scoreOf(p.id) }))
          .sort((a, b) => b.total - a.total || b.correct - a.correct);

        const place = rows.findIndex((r) => r.id === pid) + 1;
        const mine = rows.find((r) => r.id === pid);
        $("myResult").textContent = mine
          ? `Твоё место: ${place} · очки: ${mine.total} · правильных: ${mine.correct} из ${levels.length}`
          : "";

        const board = $("board");
        if (rows.length === 0) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "Пока нет результатов";
          board.replaceChildren(li);
          return;
        }

        board.replaceChildren(...rows.map((r, i) => {
          const li = document.createElement("li");
          if (r.id === pid) li.classList.add("me");
          const left = document.createElement("span");
          left.textContent = `${i + 1}. ${r.name}`;
          const right = document.createElement("span");
          right.className = "pts";
          right.textContent = `${r.total} очк.`;
          li.append(left, right);
          return li;
        }));
      }
    }
  </script>
</body>
</html>
