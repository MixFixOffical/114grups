<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <!-- Только десктопная версия -->
    <meta name="viewport" content="width=1100">

    <title>KURATOR — Авторизация</title>

    <style>
        /* =========================================
           DESIGN TOKENS
        ========================================= */

        :root {
            --blue-50:  #eff6ff;
            --blue-100: #dbeafe;
            --blue-200: #bfdbfe;
            --blue-300: #93c5fd;
            --blue-400: #60a5fa;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --blue-800: #1e40af;

            --violet-400: #a78bfa;
            --violet-500: #8b5cf6;
            --cyan-400:   #22d3ee;

            --ink-900: #0b1220;
            --ink-800: #111827;
            --ink-700: #1f2937;
            --ink-600: #475569;
            --ink-500: #64748b;
            --ink-400: #94a3b8;
            --ink-300: #cbd5e1;
            --ink-200: #e2e8f0;
            --ink-100: #f1f5f9;
            --ink-50:  #f8fafc;

            --ok-500: #10b981;
            --ok-600: #047857;
            --ok-bg:  #ecfdf5;
            --ok-bd:  #a7f3d0;

            --err-500: #ef4444;
            --err-600: #b91c1c;
            --err-bg:  #fef2f2;
            --err-bd:  #fecaca;

            --warn-500: #f59e0b;

            --radius-sm: 10px;
            --radius-md: 13px;
            --radius-lg: 16px;
            --radius-xl: 22px;
            --radius-2xl: 30px;

            --shadow-card:
                0 1px 0 rgba(255,255,255,.95) inset,
                0 40px 100px -30px rgba(15,23,42,.22),
                0 20px 50px -20px rgba(37,99,235,.18),
                0 4px 12px -4px rgba(37,99,235,.10);

            --shadow-card-hover:
                0 1px 0 rgba(255,255,255,1) inset,
                0 50px 120px -30px rgba(15,23,42,.26),
                0 24px 60px -20px rgba(37,99,235,.24),
                0 6px 16px -4px rgba(37,99,235,.16);

            --shadow-btn:
                0 1px 0 rgba(255,255,255,.32) inset,
                0 12px 28px -8px rgba(37,99,235,.5),
                0 6px 14px -4px rgba(37,99,235,.35);

            --shadow-btn-hover:
                0 1px 0 rgba(255,255,255,.4) inset,
                0 18px 40px -8px rgba(37,99,235,.65),
                0 8px 20px -4px rgba(37,99,235,.45);

            --ease-out: cubic-bezier(.22, 1, .36, 1);
            --ease-in-out: cubic-bezier(.4, 0, .2, 1);
            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            min-width: 1100px;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Inter",
                "SF Pro Display",
                Roboto,
                Arial,
                sans-serif;

            color: var(--ink-800);

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "ss01", "cv11", "tnum";

            background:
                radial-gradient(
                    ellipse 900px 700px at 12% 15%,
                    rgba(59, 130, 246, .16),
                    transparent 55%
                ),
                radial-gradient(
                    ellipse 1000px 800px at 88% 85%,
                    rgba(96, 165, 250, .14),
                    transparent 55%
                ),
                radial-gradient(
                    ellipse 700px 600px at 50% 50%,
                    rgba(167, 139, 250, .08),
                    transparent 60%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eaf1ff 45%,
                    #f8fbff 100%
                );
        }

        /* Тонкая сетка */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(15, 23, 42, .028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, .028) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(
                ellipse at center,
                black 25%,
                transparent 75%
            );
            -webkit-mask-image: radial-gradient(
                ellipse at center,
                black 25%,
                transparent 75%
            );
        }

        /* =========================================
           BACKGROUND ORBS + PARTICLES
        ========================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .6;
            animation: floatOrb 18s ease-in-out infinite;
            will-change: transform;
        }

        .orb.one {
            width: 360px;
            height: 360px;
            top: -120px;
            left: 40px;
            background: radial-gradient(
                circle at 30% 30%,
                rgba(59, 130, 246, .40),
                rgba(59, 130, 246, 0) 70%
            );
        }

        .orb.two {
            width: 420px;
            height: 420px;
            right: 0px;
            bottom: -160px;
            background: radial-gradient(
                circle at 60% 40%,
                rgba(139, 92, 246, .28),
                rgba(139, 92, 246, 0) 70%
            );
            animation-delay: -6s;
        }

        .orb.three {
            width: 260px;
            height: 260px;
            left: 46%;
            top: 6%;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(34, 211, 238, .22),
                rgba(34, 211, 238, 0) 70%
            );
            animation-delay: -12s;
        }

        @keyframes floatOrb {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            50%  { transform: translate3d(28px, -32px, 0) scale(1.08); }
            100% { transform: translate3d(0, 0, 0) scale(1); }
        }

        /* Плавающие частицы */
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(59, 130, 246, .5);
            box-shadow: 0 0 12px rgba(59, 130, 246, .6);
            animation: floatParticle 14s linear infinite;
            opacity: 0;
        }

        .particles span:nth-child(1) { left: 12%; top: 80%; animation-delay: 0s;   }
        .particles span:nth-child(2) { left: 22%; top: 90%; animation-delay: 2s;   }
        .particles span:nth-child(3) { left: 36%; top: 85%; animation-delay: 4s;   }
        .particles span:nth-child(4) { left: 58%; top: 92%; animation-delay: 6s;   }
        .particles span:nth-child(5) { left: 72%; top: 88%; animation-delay: 8s;   }
        .particles span:nth-child(6) { left: 84%; top: 82%; animation-delay: 10s;  }
        .particles span:nth-child(7) { left: 92%; top: 90%; animation-delay: 12s;  }
        .particles span:nth-child(8) { left: 46%; top: 95%; animation-delay: 5s;   }

        @keyframes floatParticle {
            0%   { transform: translateY(0) scale(.6); opacity: 0; }
            15%  { opacity: .8; }
            50%  { transform: translateY(-380px) scale(1.1); opacity: .55; }
            85%  { opacity: .3; }
            100% { transform: translateY(-760px) scale(.5); opacity: 0; }
        }

        /* =========================================
           PAGE
        ========================================= */

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        /* =========================================
           CARD
        ========================================= */

        .auth-card {
            position: relative;
            width: 430px;
            min-height: 440px;
            padding: 36px 34px 26px;
            overflow: hidden;

            border-radius: var(--radius-2xl);

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.98) 0%,
                    rgba(255,255,255,.90) 100%
                );

            border: 1px solid rgba(255, 255, 255, 1);

            box-shadow: var(--shadow-card);

            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);

            transition:
                height .72s var(--ease-out),
                box-shadow .5s ease,
                transform .5s var(--ease-out);

            will-change: height, transform;
        }

        /* Внешний градиентный бордер-аура */
        .auth-card::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(59, 130, 246, .35),
                rgba(167, 139, 250, .22),
                rgba(34, 211, 238, .28),
                rgba(59, 130, 246, .35)
            );
            background-size: 300% 300%;
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            opacity: 0;
            transition: opacity .6s ease;
            animation: auraShift 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        .auth-card:hover::after {
            opacity: 1;
        }

        @keyframes auraShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .auth-card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
        }

        /* Верхняя световая кромка */
        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,1),
                transparent
            );
            opacity: .95;
            pointer-events: none;
            z-index: 3;
        }

        .card-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            top: -170px;
            right: -140px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(59, 130, 246, .28),
                rgba(59, 130, 246, 0) 70%
            );
            filter: blur(30px);
            pointer-events: none;
            animation: glowPulse 5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: .8; transform: scale(1); }
            50%      { opacity: 1;  transform: scale(1.1); }
        }

        /* =========================================
           LOGO
        ========================================= */

        .logo {
            position: relative;
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 19px;

            color: #fff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.8px;

            background:
                linear-gradient(145deg, #60a5fa 0%, #3b82f6 45%, #2563eb 100%);

            box-shadow:
                0 1px 0 rgba(255,255,255,.5) inset,
                0 14px 32px -4px rgba(37, 99, 235, .45),
                0 6px 14px -4px rgba(37, 99, 235, .3);

            transition:
                transform .6s var(--ease-spring),
                box-shadow .45s ease;

            overflow: hidden;
        }

        .logo::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                120deg,
                transparent 30%,
                rgba(255,255,255,.55) 50%,
                transparent 70%
            );
            transform: translateX(-100%);
            animation: logoShimmer 4s ease-in-out infinite;
        }

        .logo::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, .35);
            pointer-events: none;
        }

        @keyframes logoShimmer {
            0%, 60% { transform: translateX(-100%); }
            80%     { transform: translateX(100%);  }
            100%    { transform: translateX(100%);  }
        }

        .auth-card:hover .logo {
            transform: translateY(-3px) scale(1.05) rotate(-2deg);
            box-shadow:
                0 1px 0 rgba(255,255,255,.55) inset,
                0 20px 42px -4px rgba(37, 99, 235, .55),
                0 8px 18px -4px rgba(37, 99, 235, .38);
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .title {
            font-size: 27px;
            line-height: 1.12;
            font-weight: 780;
            letter-spacing: -.9px;
            color: var(--ink-900);
            background: linear-gradient(
                135deg,
                var(--ink-900) 0%,
                var(--ink-700) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-top: 9px;
            color: var(--ink-500);
            font-size: 13px;
            line-height: 1.5;
            letter-spacing: .15px;
            font-weight: 480;
        }

        /* =========================================
           TABS
        ========================================= */

        .tabs {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 48px;
            margin-bottom: 24px;
            padding: 4px;
            border-radius: 15px;
            background:
                linear-gradient(180deg, #eef2f7 0%, #e6ecf4 100%);
            box-shadow:
                0 1px 0 rgba(255,255,255,.95) inset,
                0 1px 3px rgba(15,23,42,.06) inset;
        }

        .tab-indicator {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            border-radius: 11px;
            background:
                linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
            box-shadow:
                0 1px 0 rgba(255,255,255,.95) inset,
                0 3px 8px rgba(15,23,42,.08),
                0 8px 20px -8px rgba(37,99,235,.22);
            transition: transform .68s var(--ease-spring);
        }

        .auth-card[data-mode="register"] .tab-indicator {
            transform: translateX(100%);
        }

        .tab {
            position: relative;
            z-index: 2;
            border: none;
            outline: none;
            background: transparent;
            color: var(--ink-500);
            font-family: inherit;
            font-size: 13px;
            font-weight: 660;
            letter-spacing: .15px;
            cursor: pointer;
            transition:
                color .35s ease,
                transform .3s var(--ease-spring);
        }

        .tab:hover { color: var(--blue-600); }
        .tab:active { transform: scale(.96); }

        .auth-card[data-mode="login"] .tab.login,
        .auth-card[data-mode="register"] .tab.register {
            color: var(--blue-600);
        }

        /* =========================================
           FORM VIEWPORT
        ========================================= */

        .forms-viewport {
            position: relative;
            overflow: hidden;
            width: 100%;
            transition: height .72s var(--ease-out);
        }

        .form-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transform: translateX(45px) translateY(5px) scale(.985);
            filter: blur(6px);
            pointer-events: none;
            transition:
                opacity .55s var(--ease-out),
                transform .7s var(--ease-out),
                filter .55s ease;
        }

        .form-panel.login-panel {
            transform: translateX(-45px) translateY(5px) scale(.985);
        }

        .auth-card[data-mode="login"] .login-panel,
        .auth-card[data-mode="register"] .register-panel {
            opacity: 1;
            transform: translateX(0) translateY(0) scale(1);
            filter: blur(0);
            pointer-events: auto;
        }

        /* =========================================
           FIELD
        ========================================= */

        .field {
            position: relative;
            margin-bottom: 14px;
            opacity: 0;
            transform: translateY(10px);
            transition:
                opacity .5s ease,
                transform .6s var(--ease-out);
        }

        .login-panel .field:nth-child(1)      { transition-delay: .05s; }
        .login-panel .field:nth-child(2)      { transition-delay: .11s; }
        .login-panel .login-options           { transition-delay: .17s; }
        .login-panel .submit-btn              { transition-delay: .23s; }

        .register-panel .field:nth-child(1)   { transition-delay: .04s; }
        .register-panel .field:nth-child(2)   { transition-delay: .09s; }
        .register-panel .field:nth-child(3)   { transition-delay: .14s; }
        .register-panel .field:nth-child(4)   { transition-delay: .19s; }
        .register-panel .field:nth-child(5)   { transition-delay: .24s; }
        .register-panel .submit-btn           { transition-delay: .29s; }

        .auth-card[data-mode="login"] .login-panel .field,
        .auth-card[data-mode="login"] .login-panel .login-options,
        .auth-card[data-mode="login"] .login-panel .submit-btn,
        .auth-card[data-mode="register"] .register-panel .field,
        .auth-card[data-mode="register"] .register-panel .submit-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 46px 0 16px;

            border: 1px solid var(--ink-200);
            border-radius: var(--radius-md);

            outline: none;

            background: linear-gradient(
                180deg,
                #ffffff 0%,
                #fbfdff 100%
            );

            color: var(--ink-900);

            font-family: inherit;
            font-size: 13.5px;
            font-weight: 510;
            letter-spacing: .1px;

            box-shadow:
                0 1px 0 rgba(255,255,255,.95) inset,
                0 1px 2px rgba(15,23,42,.03);

            transition:
                border-color .25s ease,
                background .25s ease,
                box-shadow .35s ease,
                transform .3s var(--ease-out);
        }

        input::placeholder {
            color: var(--ink-400);
            font-weight: 460;
        }

        input:hover {
            border-color: var(--ink-300);
            background: #ffffff;
        }

        input:focus {
            border-color: var(--blue-400);
            background: #ffffff;
            box-shadow:
                0 1px 0 rgba(255,255,255,.95) inset,
                0 0 0 4px rgba(59, 130, 246, .13),
                0 8px 22px -10px rgba(37, 99, 235, .3);
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            width: 18px;
            height: 18px;
            transform: translateY(-50%);
            color: var(--ink-400);
            pointer-events: none;
            transition:
                color .3s ease,
                transform .4s var(--ease-spring);
        }

        .input-wrap:focus-within .input-icon {
            color: var(--blue-500);
            transform: translateY(-50%) scale(1.1);
        }

        /* =========================================
           PASSWORD TOGGLE
        ========================================= */

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translateY(-50%);

            border: none;
            outline: none;
            border-radius: 10px;

            background: transparent;
            color: var(--ink-400);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background .25s ease,
                color .25s ease,
                transform .25s var(--ease-spring);
        }

        .password-toggle:hover {
            color: var(--blue-600);
            background: var(--blue-50);
            transform: translateY(-50%) scale(1.05);
        }

        .password-toggle:active {
            transform: translateY(-50%) scale(.92);
        }

        /* =========================================
           OPTIONS
        ========================================= */

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin: 4px 2px 20px;

            opacity: 0;
            transform: translateY(10px);

            transition:
                opacity .5s ease,
                transform .6s var(--ease-out);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--ink-600);
            font-size: 12.5px;
            font-weight: 510;
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            width: 16px;
            height: 16px;
            padding: 0;
            accent-color: var(--blue-600);
            box-shadow: none;
            transform: none;
            cursor: pointer;
            border-radius: 4px;
            transition: transform .2s var(--ease-spring);
        }

        .remember input:active {
            transform: scale(.9);
        }

        .remember:hover {
            color: var(--ink-800);
        }

        .forgot {
            border: none;
            background: transparent;
            color: var(--blue-600);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 660;
            letter-spacing: .1px;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 7px;
            transition:
                color .25s ease,
                background .25s ease,
                transform .2s var(--ease-spring);
        }

        .forgot:hover {
            color: var(--blue-700);
            background: var(--blue-50);
        }

        .forgot:active {
            transform: scale(.95);
        }

        /* =========================================
           SUBMIT BUTTON
        ========================================= */

        .submit-btn {
            position: relative;
            width: 100%;
            height: 52px;

            border: none;
            border-radius: var(--radius-md);

            color: #fff;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 720;
            letter-spacing: .3px;

            cursor: pointer;
            overflow: hidden;

            background:
                linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);

            background-size: 200% 200%;
            background-position: 0% 50%;

            box-shadow: var(--shadow-btn);

            opacity: 0;
            transform: translateY(10px);

            transition:
                opacity .5s ease,
                transform .6s var(--ease-out),
                box-shadow .35s ease,
                background-position .8s ease,
                filter .3s ease;
        }

        .submit-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.32),
                transparent
            );
            transform: skewX(-20deg);
            transition: left .8s ease;
        }

        .submit-btn:hover {
            box-shadow: var(--shadow-btn-hover);
            transform: translateY(-2px);
            background-position: 100% 50%;
        }

        .submit-btn:hover::before { left: 130%; }

        .submit-btn:active {
            transform: translateY(0) scale(.995);
            filter: brightness(.97);
        }

        .submit-btn:focus-visible {
            outline: 2px solid var(--blue-400);
            outline-offset: 3px;
        }

        .submit-btn.loading {
            pointer-events: none;
            opacity: .82;
        }

        .submit-btn.loading::after {
            content: "";
            position: absolute;
            right: 20px;
            top: 50%;
            width: 15px;
            height: 15px;
            margin-top: -7.5px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.45);
            border-top-color: #fff;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =========================================
           STRENGTH
        ========================================= */

        .strength {
            margin-top: -4px;
            margin-bottom: 16px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transform: translateY(-5px);
            transition:
                opacity .4s ease,
                max-height .5s var(--ease-out),
                transform .5s ease;
        }

        .auth-card[data-mode="register"] .strength {
            opacity: 1;
            max-height: 44px;
            transform: translateY(0);
        }

        .strength-track {
            width: 100%;
            height: 6px;
            overflow: hidden;
            border-radius: 10px;
            background: var(--ink-100);
            box-shadow: 0 1px 2px rgba(15,23,42,.05) inset;
            position: relative;
        }

        .strength-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: var(--ink-300);
            transition:
                width .45s var(--ease-out),
                background .4s ease;
            box-shadow: 0 1px 0 rgba(255,255,255,.4) inset;
        }

        .strength-text {
            margin-top: 7px;
            font-size: 11.5px;
            font-weight: 520;
            letter-spacing: .15px;
            color: var(--ink-500);
            transition: color .3s ease;
        }

        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            position: relative;
            min-height: 0;
            margin-top: 16px;
            padding: 0 16px;
            border-radius: var(--radius-md);
            font-size: 12.5px;

            font-weight: 510;
            letter-spacing: .1px;
            overflow: hidden;
            opacity: 0;
            max-height: 0;

                opacity .4s ease,
                max-height .4s var(--ease-out),
                padding .4s ease,
                margin .4s ease,
                transform .4s var(--ease-out);
            transform: translateY(-4px);
        }

        .message.show {
            opacity: 1;
            max-height: 140px;
            padding: 12px 16px 12px 42px;
            transform: translateY(0);
        }

        .message.show::before {
            content: "";
            position: absolute;
            left: 14px;
            top: 50%;
            width: 18px;
            height: 18px;
            transform: translateY(-50%);
            border-radius: 50%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 11px 11px;
        }

        .message.error {
            color: var(--err-600);

        }

        .message.success {

            background: var(--ok-bg);
            border: 1px solid var(--ok-bd);
            box-shadow: 0 1px 0 rgba(255,255,255,.7) inset;
        }

        .message.success.show::before {
            background-color: var(--ok-500);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='m5 12 5 5L20 7'/></svg>");
        }

        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            margin-top: 24px;
            padding-top: 20px;
            text-align: center;
            color: var(--ink-400);
            font-size: 11px;
            letter-spacing: .4px;

        }

        .footer::before {
            content: "";

            right: 22%;

                transparent,

        .footer strong {
            color: var(--ink-600);

            letter-spacing: .6px;
        }

        /* =========================================
           LOADER
        ========================================= */

        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;

        .loader-ring::before,

<script type="module">

    import {

    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCKMeyABL01rsQ-FcLAn81QO5TvSdxSFjU",

        authDomain:
            "othets-1aa03.firebaseapp.com",

        projectId:
            "othets-1aa03",

        storageBucket:
            "othets-1aa03.firebasestorage.app",

        messagingSenderId:
            "528392191591",

        appId:
            "1:528392191591:web:1e97790e6f9f0a6e175ec2",

        measurementId:
            "G-F50WVZRXZJ"
    };


    /* =========================================
       INITIALIZE
    ========================================= */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    /* =========================================
       ELEMENTS
    ========================================= */

    const authCard =
        document.getElementById("authCard");

    const formsViewport =
        document.getElementById("formsViewport");

    const loginPanel =
        document.getElementById("loginPanel");

    const registerPanel =
        document.getElementById("registerPanel");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const pageTitle =
        document.getElementById("pageTitle");

    const pageSubtitle =
        document.getElementById("pageSubtitle");

    const message =
        document.getElementById("message");

    const pageLoader =
        document.getElementById("pageLoader");


    /* =========================================
       ROLE
    ========================================= */

    async function resolveHomePage(user) {

        try {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            const role =
                snapshot.exists()
                    ? snapshot.data().role
                    : null;


            return role === "admin"
                ? "adminhome.html"
                : "home.html";


        } catch (error) {

            console.error(
                "Ошибка чтения роли:",
                error
            );

            return "home.html";

        }

    }


    /* =========================================
       REGISTRATION STATUS
    ========================================= */

    let authCheckInProgress = false;


    /* =========================================
       HANDLE AUTHENTICATED USER
    ========================================= */

    async function handleAuthUser(user) {

        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const resetLoginButton = () => {

            loginButton.classList.remove(
                "loading"
            );

            loginButton.textContent =
                "Войти в систему";

        };


        try {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (!snapshot.exists()) {

                showMessage(
                    "Профиль пользователя не найден. Обратитесь к администратору."
                );

                await signOut(auth);

                resetLoginButton();

                return;
            }


            const data =
                snapshot.data();

            const reg =
                data.reg;


            if (reg === 0) {

                showMessage(
                    "Ваш запрос на регистрацию отправлен. Дождитесь, пока администратор разрешит вам зарегистрироваться."
                );

                await signOut(auth);

                resetLoginButton();

                return;
            }


            if (reg === 2) {

                showMessage(
                    "Вам отказано в регистрации. Данные аккаунта удалены."
                );

                await deleteDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );

                await user.delete();

                resetLoginButton();

                return;
            }


            showMessage(
                "Вход выполнен. Открываем систему…",
                "success"
            );


            const homePage =
                await resolveHomePage(user);


            setTimeout(() => {

                window.location.href =
                    homePage;

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "Ошибка при проверке аккаунта. Попробуйте снова."
            );

            await signOut(auth);

            resetLoginButton();

        }

    }


    /* =========================================
       MODE
    ========================================= */

    let currentMode = "login";

    let switching = false;


    /* =========================================
       GET PANEL HEIGHT
    ========================================= */

    function getPanelHeight(panel) {

        return panel.scrollHeight;

    }


    /* =========================================
       SET VIEWPORT HEIGHT
    ========================================= */

    function setViewportHeight(height) {

        formsViewport.style.height =
            `${height}px`;

    }


    /* =========================================
       INITIAL HEIGHT
    ========================================= */

    function initializeHeight() {

        const panel =
            currentMode === "login"
                ? loginPanel
                : registerPanel;

        setViewportHeight(
            getPanelHeight(panel)
        );

    }


    /* =========================================
       SWITCH MODE
    ========================================= */

    async function switchMode(mode) {

        if (mode === currentMode || switching) {
            return;
        }

        switching = true;

        clearMessage();


        const currentPanel =
            currentMode === "login"
                ? loginPanel
                : registerPanel;

        const nextPanel =
            mode === "login"
                ? loginPanel
                : registerPanel;


        const startHeight =
            currentPanel.scrollHeight;

        setViewportHeight(startHeight);


        currentMode = mode;

        authCard.dataset.mode = mode;


        pageTitle.style.opacity = "0";
        pageTitle.style.transform =
            "translateY(-5px)";

        pageSubtitle.style.opacity = "0";
        pageSubtitle.style.transform =
            "translateY(-5px)";


        setTimeout(() => {

            if (mode === "login") {

                pageTitle.textContent =
                    "С возвращением";

                pageSubtitle.textContent =
                    "Войдите в систему KURATOR";

            } else {

                pageTitle.textContent =
                    "Создание аккаунта";

                pageSubtitle.textContent =
                    "Зарегистрируйтесь в системе KURATOR";

            }

            pageTitle.style.opacity = "1";
            pageTitle.style.transform =
                "translateY(0)";

            pageSubtitle.style.opacity = "1";
            pageSubtitle.style.transform =
                "translateY(0)";

        }, 150);


        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                const endHeight =
                    getPanelHeight(nextPanel);

                setViewportHeight(endHeight);

            });

        });


        setTimeout(() => {

            switching = false;

        }, 750);

    }


    /* =========================================
       TABS
    ========================================= */

    loginTab.addEventListener(
        "click",
        () => switchMode("login")
    );

    registerTab.addEventListener(
        "click",
        () => switchMode("register")
    );


    /* =========================================
       PASSWORD VISIBILITY
    ========================================= */

    document
        .querySelectorAll(".password-toggle")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const targetId =
                        button.dataset.target;

                    const input =
                        document.getElementById(targetId);

                    if (
                        input.type ===
                        "password"
                    ) {

                        input.type = "text";

                    } else {

                        input.type = "password";

                    }

                }
            );

        });


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className =
            `message show ${type}`;

    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "message";

    }


    /* =========================================
       FIREBASE ERROR
    ========================================= */

    function firebaseError(error) {

        switch (error.code) {

            case "auth/invalid-email":
                return "Введите корректную электронную почту.";

            case "auth/user-not-found":
                return "Пользователь с такой почтой не найден.";

            case "auth/wrong-password":
            case "auth/invalid-credential":
                return "Неверная почта или пароль.";

            case "auth/email-already-in-use":
                return "Аккаунт с такой почтой уже существует.";

            case "auth/weak-password":
                return "Пароль слишком простой.";

            case "auth/network-request-failed":
                return "Ошибка сети. Проверьте подключение к интернету.";

            case "auth/too-many-requests":
                return "Слишком много попыток. Попробуйте позже.";

            default:
                return error.message ||
                    "Произошла неизвестная ошибка.";
        }

    }


    /* =========================================
       LOGIN
    ========================================= */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;

                const remember =
                    document
                        .getElementById("rememberMe")
                        .checked;

                const button =
                    document
                        .getElementById("loginButton");


                if (!email || !password) {

                    showMessage(
                        "Заполните все поля."
                    );

                    return;
                }


                button.classList.add("loading");

                button.textContent =
                    "Выполняется вход…";


                authCheckInProgress = true;


                try {

                    await setPersistence(
                        auth,
                        remember
                            ? browserLocalPersistence
                            : browserSessionPersistence
                    );


                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    await handleAuthUser(
                        auth.currentUser
                    );


                } catch (error) {

                    console.error(error);

                    showMessage(
                        firebaseError(error)
                    );


                    button.classList.remove(
                        "loading"
                    );

                    button.textContent =
                        "Войти в систему";


                    await signOut(auth);

                } finally {

                    authCheckInProgress = false;

                }

            }
        );


    /* =========================================
       REGISTER
    ========================================= */

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();


                const name =
                    document
                        .getElementById("registerName")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("registerEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("registerPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("registerConfirmPassword")
                        .value;

                const group =
                    document
                        .getElementById("registerGroup")
                        .value
                        .trim();

                const button =
                    document
                        .getElementById("registerButton");


                if (
                    !name ||
                    !email ||
                    !password ||
                    !confirmPassword ||
                    !group
                ) {

                    showMessage(
                        "Заполните все поля."
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Пароль должен содержать минимум 6 символов."
                    );

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Пароли не совпадают."
                    );

                    return;
                }


                button.classList.add("loading");

                button.textContent =
                    "Создание аккаунта…";


                try {

                    const result =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        result.user;


                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {

                            uid:
                                user.uid,

                            name:
                                name,

                            email:
                                email,

                            group:
                                group,

                            role:
                                "student",

                            reg:
                                0,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    authCheckInProgress = true;

                    showMessage(
                        "Запрос на регистрацию отправлен. Дождитесь, пока администратор разрешит вам зарегистрироваться.",
                        "success"
                    );


                    await signOut(auth);


                    document
                        .getElementById(
                            "registerForm"
                        )
                        .reset();


                    strengthBar.style.width =
                        "0%";

                    strengthText.textContent =
                        "Введите пароль";

                    strengthBar.style.background =
                        "#cbd5e1";


                    button.classList.remove(
                        "loading"
                    );

                    button.textContent =
                        "Создать аккаунт";


                    setTimeout(() => {

                        authCheckInProgress =
                            false;

                    }, 500);


                } catch (error) {

                    console.error(error);

                    showMessage(
                        firebaseError(error)
                    );


                    button.classList.remove(
                        "loading"
                    );

                    button.textContent =
                        "Создать аккаунт";

                }

            }
        );


    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            async () => {

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                if (!email) {

                    showMessage(
                        "Сначала введите свою электронную почту."
                    );

                    document
                        .getElementById("loginEmail")
                        .focus();

                    return;
                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showMessage(
                        "Письмо для восстановления пароля отправлено.",
                        "success"
                    );


                } catch (error) {

                    console.error(error);

                    showMessage(
                        firebaseError(error)
                    );

                }

            }
        );


    /* =========================================
       PASSWORD STRENGTH
    ========================================= */

    const registerPassword =
        document.getElementById(
            "registerPassword"
        );

    const strengthBar =
        document.getElementById(
            "strengthBar"
        );

    const strengthText =
        document.getElementById(
            "strengthText"
        );


    registerPassword.addEventListener(
        "input",
        () => {

            const password =
                registerPassword.value;


            let score = 0;


            if (password.length >= 6) {
                score++;
            }

            if (password.length >= 10) {
                score++;
            }

            if (/[A-Z]/.test(password)) {
                score++;
            }

            if (/[0-9]/.test(password)) {
                score++;
            }

            if (/[^A-Za-z0-9]/.test(password)) {
                score++;
            }


            const percentage =
                Math.min(
                    score * 20,
                    100
                );


            strengthBar.style.width =
                `${percentage}%`;


            if (!password) {

                strengthText.textContent =
                    "Введите пароль";

                strengthBar.style.background =
                    "#cbd5e1";

                return;
            }


            if (score <= 1) {

                strengthText.textContent =
                    "Слабый пароль";

                strengthBar.style.background =
                    "linear-gradient(90deg, #ef4444, #f87171)";

            } else if (score <= 3) {

                strengthText.textContent =
                    "Средний пароль";

                strengthBar.style.background =
                    "linear-gradient(90deg, #f59e0b, #fbbf24)";

            } else {

                strengthText.textContent =
                    "Надёжный пароль";

                strengthBar.style.background =
                    "linear-gradient(90deg, #10b981, #22c55e)";

            }

        }
    );


    /* =========================================
       AUTH STATE
    ========================================= */

    onAuthStateChanged(
        auth,
        user => {

            if (user) {

                if (authCheckInProgress) {
                    return;
                }


                authCheckInProgress = true;

                handleAuthUser(user)
                    .finally(() => {

                        authCheckInProgress =
                            false;

                    });

            }

        }
    );


    /* =========================================
       HEADER TRANSITIONS
    ========================================= */

    pageTitle.style.transition =
        "opacity .32s ease, transform .45s cubic-bezier(.22,1,.36,1)";

    pageSubtitle.style.transition =
        "opacity .32s ease, transform .45s cubic-bezier(.22,1,.36,1)";


    /* =========================================
       INITIALIZE
    ========================================= */

    window.addEventListener(
        "load",
        () => {

            requestAnimationFrame(() => {

                initializeHeight();

                setTimeout(() => {

                    pageLoader.classList.add(
                        "hidden"
                    );

                }, 450);

            });

        }
    );


    window.addEventListener(
        "resize",
        () => {

            const panel =
                currentMode === "login"
                    ? loginPanel
                    : registerPanel;

            setViewportHeight(
                panel.scrollHeight
            );

        }
    );

</script>

</body>
</html>
